var CH=[{"id": "what", "t": "What are prepositions?", "c": "<p class=\"say\">A preposition links a noun, pronoun or -ing form to the rest of the sentence. It shows <b>where</b> something is, <b>when</b> it happens, <b>how</b> things are connected, or what a word is <b>paired</b> with. There are about a hundred common ones. They are short and unstressed, yet they cause more mistakes than almost anything else, because many of them cannot be worked out by logic.</p><div class=\"example\"><p>The book is <b>on</b> the table. We met <b>in</b> June. She is good <b>at</b> maths.</p><p class=\"note\">Place, time and a fixed pair, all done by prepositions.</p></div><h3>What comes after a preposition?</h3><div class=\"rule\"><p><b>Noun</b> <em>in the room, on Monday</em></p><p><b>Pronoun</b> <em>with me, for them</em> (object form: me, him, her, us, them)</p><p><b>-ing form</b> <em>interested in learning, without asking</em></p><p><b>Never a base verb</b> <del>interested in learn</del>, <del>good at to swim</del></p></div><h3>Three kinds of preposition use</h3><div class=\"tw\"><table><thead><tr><th>Kind</th><th>Idea</th><th>Examples</th></tr></thead><tbody><tr><td>Rule-based</td><td>You can learn a pattern</td><td>at 5 o’clock, on Monday, in June, in a room</td></tr><tr><td>Fixed pairs</td><td>You must memorise the whole chunk</td><td>depend on, interested in, different from, a reason for</td></tr><tr><td>Idioms and phrases</td><td>Whole expressions</td><td>in fact, on purpose, by mistake, at risk</td></tr></tbody></table></div><h3>Simple prepositions and complex prepositions</h3><ul><li><b>Simple:</b> in, on, at, by, for, from, to, with, of, about, under, over, through.</li><li><b>Complex (two or three words):</b> because of, in spite of, instead of, according to, in front of, out of, on behalf of, with regard to, as a result of, in addition to.</li></ul><h3>Preposition, adverb or conjunction?</h3><div class=\"example\"><p>She went <b>in</b> the room. (preposition + noun)<br>She went <b>in</b>. (adverb, no noun)</p><p class=\"note\">A preposition always has a noun, pronoun or -ing form after it.</p></div><div class=\"example\"><p>I’ll call you <b>after</b> the meeting. (preposition)<br>I’ll call you <b>after</b> the meeting ends. (conjunction + clause)</p><p class=\"note\">Before, after, since, until and as can work in both ways.</p></div><p class=\"note\">One more idea: in English, prepositions can end a question or a clause: <em>Who are you talking to? This is the book I was looking for.</em> It is natural and correct.</p>"}, {"id": "time", "t": "Prepositions of time", "c": "<h3>At, on, in: the main three</h3><div class=\"tw\"><table><thead><tr><th>Preposition</th><th>Use with</th><th>Examples</th></tr></thead><tbody><tr><td>at</td><td>clock times, mealtimes, short points in time, festivals</td><td>at 5 p.m., at noon, at midnight, at lunch, at the moment, at Christmas, at the weekend (British), at night</td></tr><tr><td>on</td><td>days, dates, particular days and parts of days</td><td>on Monday, on 5 May, on Friday evening, on my birthday, on New Year’s Day, on the weekend (American)</td></tr><tr><td>in</td><td>months, years, seasons, centuries, long periods, parts of the day</td><td>in June, in 2020, in summer, in the 21st century, in the morning, in the evening, in an hour</td></tr></tbody></table></div><p class=\"note\">Think of a funnel: <b>in</b> (big) → <b>on</b> (medium) → <b>at</b> (small, exact).</p><h3>Exceptions to remember</h3><ul><li><b>at night</b> but <b>in the morning, in the afternoon, in the evening</b>.</li><li><b>on Monday morning</b>, not in Monday morning.</li><li><b>at the weekend</b> (British) / <b>on the weekend</b> (American).</li><li><b>in the end</b> (finally) / <b>at the end of</b> (the final point of): <em>at the end of the month.</em></li><li>No preposition before <b>this, last, next, every, each, tomorrow, yesterday, today, all</b>: <em>I’ll see you next Monday.</em> not <del>on next Monday</del>.</li></ul><h3>Duration: for, since, during, throughout</h3><div class=\"tw\"><table><thead><tr><th>Preposition</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>for</td><td>how long (a period)</td><td>I have lived here for five years.</td></tr><tr><td>since</td><td>from a point in the past until now</td><td>I have lived here since 2020.</td></tr><tr><td>during</td><td>within a period or event</td><td>I fell asleep during the film.</td></tr><tr><td>throughout</td><td>from start to finish</td><td>It rained throughout the night.</td></tr><tr><td>over</td><td>during or across a period</td><td>Prices rose over the last decade.</td></tr><tr><td>within</td><td>before the end of a period</td><td>You will receive it within three days.</td></tr></tbody></table></div><h3>Limits: by, until, before, after, from…to</h3><div class=\"example\"><p>Finish it by Friday.<br>Work until Friday.</p><p class=\"note\">By means no later than. Until means up to that time and continuing.</p></div><div class=\"tw\"><table><thead><tr><th>Preposition</th><th>Example</th></tr></thead><tbody><tr><td>before / after</td><td>before lunch, after the lesson</td></tr><tr><td>from … to / until</td><td>from 9 to 5, from Monday until Friday</td></tr><tr><td>between … and</td><td>between 2010 and 2020</td></tr><tr><td>since</td><td>since 8 o’clock</td></tr><tr><td>ago (no preposition)</td><td>three days ago</td></tr><tr><td>in (future)</td><td>The train leaves in ten minutes.</td></tr><tr><td>by the time</td><td>By the time we arrived, it had started.</td></tr><tr><td>up to / as of</td><td>up to 2024, as of today</td></tr></tbody></table></div><h3>In time and on time; at the end and in the end</h3><div class=\"example\"><p>We arrived in time for the film.<br>We arrived on time.</p><p class=\"note\">In time = early enough. On time = exactly at the arranged time.</p></div><div class=\"example\"><p>At the end of the film, she cried.<br>In the end, she decided to leave.</p><p class=\"note\">At the end of = the last point. In the end = finally.</p></div><h3>Quick time checklist</h3><ul><li>Is it a clock time? Use <b>at</b>.</li><li>Is it a day or date? Use <b>on</b>.</li><li>Is it a month, year, season or part of the day? Use <b>in</b>.</li><li>Is it how long? Use <b>for</b>. Since when? Use <b>since</b>.</li></ul>"}, {"id": "place", "t": "Prepositions of place", "c": "<h3>At, on, in: the main three</h3><div class=\"tw\"><table><thead><tr><th>Preposition</th><th>Idea</th><th>Examples</th></tr></thead><tbody><tr><td>at</td><td>a point, a place for an activity</td><td>at the bus stop, at the door, at school, at work, at the airport, at the cinema, at 25 Baker Street</td></tr><tr><td>on</td><td>a surface or line</td><td>on the table, on the wall, on the floor, on the bus, on the second floor, on the river, on Baker Street</td></tr><tr><td>in</td><td>inside an enclosed or large area</td><td>in the room, in a box, in London, in Bangladesh, in the garden, in bed, in the newspaper</td></tr></tbody></table></div><h3>At vs in with buildings</h3><div class=\"example\"><p>I’m at the cinema.<br>I’m in the cinema.</p><p class=\"note\">At = the place and its activity. In = physically inside the building.</p></div><div class=\"example\"><p>She is <b>at</b> school. (as a student) / She is <b>in</b> the school. (inside the building)</p></div><h3>Vehicles</h3><div class=\"tw\"><table><thead><tr><th>Use on</th><th>Use in</th></tr></thead><tbody><tr><td>a bus, a train, a plane, a ship, a bicycle, a horse</td><td>a car, a taxi, a van, a lorry, a helicopter</td></tr></tbody></table></div><h3>Other prepositions of place</h3><div class=\"tw\"><table><thead><tr><th>Preposition</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>above / over</td><td>higher than</td><td>The picture is above the sofa. A plane flew over the city.</td></tr><tr><td>below / under / beneath</td><td>lower than</td><td>The cat is under the table.</td></tr><tr><td>between</td><td>in the middle of two things</td><td>The bank is between the shop and the school.</td></tr><tr><td>among</td><td>in the middle of many things</td><td>She was among the crowd.</td></tr><tr><td>next to / beside / by</td><td>very close</td><td>He sat next to her. A tree by the river.</td></tr><tr><td>near / close to</td><td>not far</td><td>I live near the station.</td></tr><tr><td>in front of / behind</td><td>front and back</td><td>The car is in front of the house.</td></tr><tr><td>opposite / across from</td><td>on the other side</td><td>The bank is opposite the post office.</td></tr><tr><td>inside / outside</td><td>within / not within</td><td>Wait outside the office.</td></tr><tr><td>against</td><td>touching a surface</td><td>He leaned against the wall.</td></tr><tr><td>around / round</td><td>on all sides</td><td>We sat around the table.</td></tr><tr><td>beyond</td><td>farther than</td><td>The village is beyond the hills.</td></tr></tbody></table></div><h3>Over vs above, under vs below</h3><div class=\"example\"><p>The bridge is over the river.<br>The temperature is above zero.</p><p class=\"note\">Over often means covering or crossing. Above means higher on a scale or level.</p></div><h3>Arrive at / in; live in / at; study at / in</h3><ul><li><b>arrive at</b> a small place or point: the airport, the station, the hotel.</li><li><b>arrive in</b> a city or country: Dhaka, Canada.</li><li><b>live in</b> a city, <b>at</b> an address with a number: <em>I live at 12 Park Road.</em></li><li><b>study at</b> a university, <b>in</b> a country or city.</li></ul>"}, {"id": "move", "t": "Prepositions of movement and direction", "c": "<div class=\"tw\"><table><thead><tr><th>Preposition</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>to</td><td>towards a destination</td><td>She walked to school. (Not: to home)</td></tr><tr><td>into</td><td>entering a place</td><td>He went into the room.</td></tr><tr><td>out of</td><td>leaving a place</td><td>She came out of the shop.</td></tr><tr><td>onto</td><td>moving on to a surface</td><td>The cat jumped onto the table.</td></tr><tr><td>off</td><td>away from a surface</td><td>He fell off his bike.</td></tr><tr><td>through</td><td>from one side to the other, inside</td><td>We drove through the tunnel.</td></tr><tr><td>across</td><td>from one side to the other, on the surface</td><td>She swam across the river.</td></tr><tr><td>along</td><td>following a line</td><td>We walked along the beach.</td></tr><tr><td>past</td><td>going by</td><td>The bus goes past my house.</td></tr><tr><td>towards</td><td>in the direction of</td><td>He ran towards the exit.</td></tr><tr><td>up / down</td><td>higher / lower on a slope</td><td>She climbed up the stairs.</td></tr><tr><td>over</td><td>across the top of</td><td>He jumped over the wall.</td></tr><tr><td>around / round</td><td>in a circle or on all sides</td><td>They walked around the lake.</td></tr><tr><td>from</td><td>the starting point</td><td>I flew from London.</td></tr></tbody></table></div><h3>To, towards and for</h3><div class=\"example\"><p>I am going to London.<br>I am heading towards London.</p><p class=\"note\">To names the destination. Towards names only the direction.</p></div><div class=\"example\"><p>The train for Dhaka leaves at six.<br>The train to Dhaka leaves at six.</p><p class=\"note\">Both are used for timetables and destinations.</p></div><h3>Home has no preposition</h3><div class=\"example\"><p>I went <b>home</b>. She is <b>at home</b>. <del>He went to home.</del></p><p class=\"note\">Home is an adverb after verbs of movement. At home is used for location.</p></div><h3>Go to, go on, go for</h3><ul><li><b>go to</b> school, work, bed, hospital, church, the cinema.</li><li><b>go on</b> holiday, a trip, a diet.</li><li><b>go for</b> a walk, a run, a swim.</li><li><b>go by</b> car, bus, train (transport).</li></ul>"}, {"id": "other", "t": "Other common meanings", "c": "<h3>By</h3><ul><li><b>Doer (passive):</b> The book was written by Orwell.</li><li><b>Transport:</b> by bus, by air, by car. <em>on foot</em> is the exception.</li><li><b>Deadline:</b> by Friday.</li><li><b>Amount of change:</b> Prices rose by 10%.</li><li><b>Close to:</b> by the window.</li><li><b>Method:</b> by email, by hand.</li></ul><h3>With and without</h3><ul><li><b>With</b> a tool: cut it with a knife.</li><li><b>With</b> accompanied: I went with my friend.</li><li><b>With</b> having: a man with a beard.</li><li><b>Without</b> lacking: without help.</li></ul><h3>For</h3><ul><li><b>Purpose:</b> a tool for cutting.</li><li><b>Duration:</b> for two hours.</li><li><b>Beneficiary:</b> a gift for you.</li><li><b>Reason:</b> famous for its food.</li><li><b>Support:</b> I’m for the plan.</li><li><b>Price:</b> bought it for $5.</li></ul><h3>Of</h3><ul><li><b>Belonging or part:</b> the roof of the house.</li><li><b>Quantity:</b> a cup of tea, a lot of money.</li><li><b>Content:</b> a book of stories.</li><li><b>Material:</b> a table of wood (made of).</li></ul><h3>From and to</h3><ul><li><b>Origin:</b> from Bangladesh.</li><li><b>Range:</b> from 9 to 5.</li><li><b>Distance:</b> two miles from here.</li></ul><h3>About, on, over</h3><ul><li><b>about:</b> general topics (a book about history).</li><li><b>on:</b> a specialised topic (a lecture on climate economics).</li></ul><h3>Contrast and cause</h3><div class=\"tw\"><table><thead><tr><th>Preposition</th><th>Use</th><th>Example</th></tr></thead><tbody><tr><td>despite / in spite of</td><td>contrast</td><td>Despite the rain, we went out.</td></tr><tr><td>because of / due to / owing to</td><td>cause</td><td>The flight was cancelled because of fog.</td></tr><tr><td>instead of</td><td>replacing</td><td>Tea instead of coffee.</td></tr><tr><td>apart from / except</td><td>excluding</td><td>Everyone came except Tom.</td></tr><tr><td>according to</td><td>source</td><td>According to the report…</td></tr><tr><td>as</td><td>role</td><td>She works as a nurse.</td></tr><tr><td>like</td><td>similar to</td><td>She looks like her mother.</td></tr><tr><td>as vs like</td><td>role vs comparison</td><td>As a teacher I know. Like a teacher, he explains.</td></tr></tbody></table></div><h3>After, before: preposition or conjunction</h3><div class=\"example\"><p>After the lesson, we left. (preposition)  After the lesson ended, we left. (conjunction)</p></div><p class=\"note\">A noun follows a preposition, a clause follows a conjunction. Despite and because of take a noun or -ing; although and because take a clause.</p>"}, {"id": "verbp", "t": "Verb + preposition", "c": "<p>Many verbs need a fixed preposition. The preposition does not follow a logical rule, so learn the verb and the preposition as one item.</p><div class=\"tw\"><table><thead><tr><th>With</th><th>Verbs</th></tr></thead><tbody><tr><td>on</td><td>depend on, rely on, focus on, insist on, concentrate on, agree on (a plan), comment on, congratulate (someone) on</td></tr><tr><td>in</td><td>believe in, succeed in, specialise in, result in, participate in, invest in, engage in</td></tr><tr><td>for</td><td>apply for, ask for, wait for, search for, look for, pay for, apologise for, blame (someone) for, account for</td></tr><tr><td>to</td><td>belong to, lead to, refer to, contribute to, respond to, object to, react to, listen to</td></tr><tr><td>from</td><td>suffer from, benefit from, result from, recover from, protect (someone) from, differ from</td></tr><tr><td>of</td><td>consist of, approve of, think of, dream of, die of, remind (someone) of, be made of</td></tr><tr><td>about</td><td>worry about, care about, complain about, talk about, think about, dream about, hear about</td></tr><tr><td>with</td><td>agree with (a person), deal with, cope with, comply with, cooperate with, provide (someone) with</td></tr><tr><td>at</td><td>look at, aim at, laugh at, arrive at, stare at, glance at</td></tr></tbody></table></div><h3>Same verb, different preposition, different meaning</h3><div class=\"tw\"><table><thead><tr><th>Verb</th><th>Meaning with each preposition</th></tr></thead><tbody><tr><td>look at</td><td>direct your eyes: look at the board</td></tr><tr><td>look for</td><td>search: look for my keys</td></tr><tr><td>look after</td><td>take care of: look after children</td></tr><tr><td>think of</td><td>have an idea: think of a name</td></tr><tr><td>think about</td><td>consider: think about the future</td></tr><tr><td>agree with</td><td>a person or opinion: agree with you</td></tr><tr><td>agree on</td><td>a decision: agree on a price</td></tr><tr><td>agree to</td><td>accept: agree to the terms</td></tr><tr><td>wait for</td><td>stay until: wait for a bus</td></tr><tr><td>wait on</td><td>serve: wait on tables</td></tr></tbody></table></div><h3>Verbs with two prepositions</h3><ul><li><em>blame someone <b>for</b> something. thank someone <b>for</b> something. congratulate someone <b>on</b> something. protect someone <b>from</b> something. compare A <b>with / to</b> B.</em></li></ul>"}, {"id": "adjp", "t": "Adjective + preposition", "c": "<div class=\"tw\"><table><thead><tr><th>With</th><th>Adjectives</th></tr></thead><tbody><tr><td>at</td><td>good at, bad at, excellent at, skilled at, surprised at/by, angry at (a thing)</td></tr><tr><td>in</td><td>interested in, involved in, rich in, successful in, experienced in</td></tr><tr><td>of</td><td>afraid of, aware of, capable of, fond of, proud of, tired of, full of, typical of, jealous of, scared of</td></tr><tr><td>for</td><td>responsible for, famous for, ready for, suitable for, known for, necessary for, sorry for, late for</td></tr><tr><td>to</td><td>similar to, close to, married to, kind to, polite to, essential to, used to, addicted to</td></tr><tr><td>from</td><td>different from, absent from, safe from, free from, far from</td></tr><tr><td>with</td><td>happy with, pleased with, angry with (a person), satisfied with, familiar with, bored with, crowded with</td></tr><tr><td>about</td><td>worried about, excited about, certain about, nervous about, serious about, upset about</td></tr><tr><td>on</td><td>keen on, dependent on, based on, intent on</td></tr></tbody></table></div><h3>Same adjective, different preposition</h3><div class=\"example\"><p>I’m angry with my brother.<br>I’m angry about the delay.</p><p class=\"note\">With a person, about a thing or situation.</p></div><div class=\"example\"><p>She’s good at maths.<br>She’s good with children.</p><p class=\"note\">At a skill, with people.</p></div><div class=\"example\"><p>He is married to Sara.<br>He is bored with the film.</p><p class=\"note\">To a person in marriage. With for boredom.</p></div><h3>Surprised at / by; interested in; different from</h3><div class=\"example\"><p>I was surprised <b>by</b> the result. She is interested <b>in</b> music. Their culture is different <b>from</b> ours.</p></div><p class=\"note\"><b>different from</b> is the safest choice in writing. <em>Different to</em> is common in British speech. <em>Different than</em> is mainly American and is avoided in IELTS.</p>"}, {"id": "nounp", "t": "Noun + preposition", "c": "<div class=\"tw\"><table><thead><tr><th>With</th><th>Nouns</th></tr></thead><tbody><tr><td>in</td><td>an increase in, a decrease in, a rise in, a fall in, a change in, a difference in, interest in, belief in, success in, participation in</td></tr><tr><td>of</td><td>a cause of, an example of, a lack of, a number of, a variety of, a range of, the majority of, a proportion of, the advantage of, the importance of</td></tr><tr><td>for</td><td>a reason for, a demand for, a need for, a cure for, respect for, a solution for / to, a recipe for, an excuse for, a reputation for, a substitute for</td></tr><tr><td>to</td><td>a solution to, access to, an answer to, a reaction to, damage to, a threat to, a key to, an introduction to, a visit to, a reply to</td></tr><tr><td>on</td><td>an effect on, an impact on, a book on, a tax on, a ban on, a comment on, pressure on, an attack on, an influence on</td></tr><tr><td>with</td><td>a problem with, a relationship with, a connection with, a conflict with, contact with, a similarity with</td></tr><tr><td>between</td><td>a difference between, a link between, a relationship between, a gap between, a connection between, competition between</td></tr></tbody></table></div><h3>Task 1 and Task 2 noun phrases</h3><div class=\"example\"><p><b>An increase in</b> tourism has put <b>pressure on</b> local services. <b>The lack of</b> access <b>to</b> education is <b>a threat to</b> development.</p></div><h3>Increase, rise, fall, drop: three patterns</h3><div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Example</th></tr></thead><tbody><tr><td>noun + in + thing</td><td>There was an increase in sales.</td></tr><tr><td>noun + of + amount</td><td>There was an increase of 10%.</td></tr><tr><td>verb + by + amount</td><td>Sales increased by 10%.</td></tr><tr><td>verb + to + final figure</td><td>Sales rose to 500,000.</td></tr><tr><td>verb + from … to …</td><td>Sales rose from 300,000 to 500,000.</td></tr><tr><td>verb + at + level (stays)</td><td>Sales remained at 500,000.</td></tr></tbody></table></div><h3>Prepositions for amounts and percentages</h3><ul><li><b>by</b> shows the amount of change: <em>rose by 5%.</em></li><li><b>to</b> shows the new level: <em>rose to 5%.</em></li><li><b>of</b> after a noun: <em>a rise of 5%.</em></li><li><b>at</b> shows a stable level: <em>stayed at 5%.</em></li><li><b>from … to</b> shows a range: <em>from 5% to 8%.</em></li><li><b>between … and</b> shows a time range: <em>between 2010 and 2020.</em></li></ul>"}, {"id": "none", "t": "Verbs that take no preposition", "c": "<p>Some verbs take their object directly. Adding a preposition is a very common error, especially for learners whose languages use one.</p><div class=\"tw\"><table><thead><tr><th>Verb</th><th>Correct</th><th>Common error</th></tr></thead><tbody><tr><td>discuss</td><td>We discussed the plan.</td><td><del>discussed about the plan</del></td></tr><tr><td>mention</td><td>She mentioned the problem.</td><td><del>mentioned about the problem</del></td></tr><tr><td>enter</td><td>He entered the room.</td><td><del>entered into the room</del></td></tr><tr><td>reach</td><td>We reached the station.</td><td><del>reached to the station</del></td></tr><tr><td>approach</td><td>She approached the desk.</td><td><del>approached to the desk</del></td></tr><tr><td>marry</td><td>She married a doctor.</td><td><del>married with a doctor</del></td></tr><tr><td>resemble</td><td>He resembles his father.</td><td><del>resembles to his father</del></td></tr><tr><td>attend</td><td>I attended the meeting.</td><td><del>attended to the meeting</del></td></tr><tr><td>answer</td><td>Please answer the question.</td><td><del>answer to the question</del> (as a verb)</td></tr><tr><td>emphasise</td><td>The report emphasises costs.</td><td><del>emphasises on costs</del></td></tr><tr><td>influence</td><td>Media influences opinion.</td><td><del>influences on opinion</del> (as a verb)</td></tr><tr><td>describe</td><td>Describe the picture.</td><td><del>describe about the picture</del></td></tr><tr><td>contact</td><td>Contact me tomorrow.</td><td><del>contact to me</del></td></tr><tr><td>Obey / follow / meet</td><td>She obeyed the rules.</td><td><del>obeyed to the rules</del></td></tr></tbody></table></div><h3>Watch out</h3><ul><li><b>explain to someone:</b> explain the rule to him (not explain him).</li><li><b>enter into</b> is used only in special phrases: enter into a contract.</li><li><b>listen to / look at / wait for</b> need their prepositions.</li><li><b>emphasise</b> has no on, but the noun <em>emphasis</em> does: <em>an emphasis on safety.</em></li></ul>"}, {"id": "phrases", "t": "Prepositional phrases and idioms", "c": "<p>Many prepositions are part of fixed phrases. Learn them as units.</p><div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Phrases</th></tr></thead><tbody><tr><td>in</td><td>in fact, in general, in particular, in advance, in common, in charge of, in danger, in favour of, in need of, in order to, in public, in time, in trouble, in love, in a hurry</td></tr><tr><td>on</td><td>on average, on behalf of, on purpose, on time, on holiday, on duty, on sale, on foot, on fire, on the other hand, on the whole, on top of, on the phone</td></tr><tr><td>at</td><td>at risk, at least, at most, at first, at last, at once, at all, at home, at work, at present, at a glance, at the moment, at the same time</td></tr><tr><td>by</td><td>by accident, by chance, by hand, by mistake, by heart, by law, by far, by the way, by then</td></tr><tr><td>out of</td><td>out of date, out of order, out of control, out of stock, out of work, out of breath, out of the question</td></tr><tr><td>under</td><td>under pressure, under control, under construction, under way, under age, under the impression</td></tr><tr><td>beyond / within</td><td>beyond doubt, beyond belief, within reach, within limits</td></tr><tr><td>for</td><td>for example, for instance, for sale, for good, for the time being, for a change</td></tr><tr><td>to</td><td>to my surprise, to some extent, in addition to, with regard to, with respect to</td></tr></tbody></table></div><h3>Useful linking phrases for writing</h3><ul><li><b>In addition to / Apart from</b> the cost, there is the time.</li><li><b>As a result of / Due to</b> rising prices, people spend less.</li><li><b>In terms of / With regard to</b> education, there are two options.</li><li><b>On the one hand … on the other hand …</b></li><li><b>In contrast to / Compared with</b> men, women live longer.</li><li><b>In my opinion / From my point of view</b></li></ul><p class=\"note\">Prepositions in phrases often have no rule. Learn each phrase in a sentence you wrote yourself.</p>"}, {"id": "ing", "t": "Prepositions before -ing", "c": "<p>After a preposition, use a noun or an -ing form. Never use the base verb or to + verb.</p><div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Example</th></tr></thead><tbody><tr><td>adjective + prep + -ing</td><td>good at swimming, interested in learning, afraid of flying</td></tr><tr><td>verb + prep + -ing</td><td>insist on going, succeed in passing, depend on working</td></tr><tr><td>noun + prep + -ing</td><td>a way of learning, the idea of travelling, a reason for leaving</td></tr><tr><td>prep + -ing alone</td><td>before leaving, after eating, without asking, instead of waiting, by using, besides working, in spite of being tired</td></tr></tbody></table></div><h3>To as a preposition</h3><p>Sometimes <em>to</em> is a preposition, and then -ing follows: <em>look forward to meeting, be used to working, in addition to studying, object to paying, committed to improving.</em></p><div class=\"example\"><p>I used to live in Dhaka.<br>I am used to living in Dhaka.</p><p class=\"note\">Used to + base verb is a past habit. Be used to + -ing means familiar with.</p></div><div class=\"example\"><p>I want to go.<br>I look forward to going.</p><p class=\"note\">Infinitive to vs preposition to.</p></div><h3>Test: can you put a noun there?</h3><p>If a noun can replace the -ing form, then to is a preposition: <em>look forward to the meeting</em> → <em>look forward to meeting</em>.</p><h3>By + -ing for method</h3><div class=\"example\"><p>You can improve your vocabulary <b>by reading</b> every day. He earns money <b>by teaching</b>.</p></div><h3>Before and after with -ing</h3><div class=\"example\"><p><b>Before leaving</b>, check the windows. <b>After finishing</b> the test, relax.</p><p class=\"note\">The subject of the -ing phrase must be the same as the main subject.</p></div>"}, {"id": "task1", "t": "Prepositions in IELTS Task 1 and Task 2", "c": "<h3>Describing changes (Task 1)</h3><div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Examples</th></tr></thead><tbody><tr><td>Rose / fell by</td><td>Sales rose by 20%. Prices fell by $5.</td></tr><tr><td>An increase of / in</td><td>There was an increase of 20% in sales.</td></tr><tr><td>From … to</td><td>The figure went from 10% to 30%.</td></tr><tr><td>At</td><td>It peaked at 40% in 2015. It stood at 20%.</td></tr><tr><td>Between … and</td><td>Between 2010 and 2020, sales rose.</td></tr><tr><td>In (year/month)</td><td>In 2015, sales hit a high.</td></tr><tr><td>Over the period</td><td>Over the period, prices rose steadily.</td></tr><tr><td>Compared with</td><td>Compared with Japan, China’s figure was higher.</td></tr><tr><td>The proportion of</td><td>The proportion of women was higher.</td></tr><tr><td>Account for</td><td>Cars account for 60% of all trips.</td></tr><tr><td>Stood at / remained at</td><td>It remained at 15%.</td></tr><tr><td>Reached a peak of</td><td>It reached a peak of 80%.</td></tr><tr><td>Doubled / tripled</td><td>The figure doubled from 10 to 20.</td></tr></tbody></table></div><h3>Describing maps and processes</h3><ul><li><b>To the north of / in the north of:</b> the park is to the north of the school.</li><li><b>Next to / opposite / beside / between:</b> the shop is opposite the bank.</li><li><b>Along / across / through:</b> a road runs along the river.</li><li><b>At the end of / at the top of:</b> at the end of the road.</li><li><b>Into / out of / through:</b> the water flows into the tank.</li><li><b>By means of / by using:</b> the glass is sorted by colour.</li></ul><h3>Giving reasons and effects (Task 2)</h3><ul><li><b>Because of / due to / owing to</b> traffic, journeys take longer.</li><li><b>As a result of</b> new laws, emissions fell.</li><li><b>Despite / in spite of</b> the cost, many families choose private schools.</li><li><b>In addition to / as well as</b> being expensive, it is slow.</li><li><b>According to</b> the survey, 70% agreed.</li><li><b>In terms of / in relation to</b> education, there is a clear gap.</li></ul><h3>A full Task 1 sentence</h3><div class=\"example\"><p><b>Between</b> 2000 <b>and</b> 2020, the number <b>of</b> students <b>in</b> the city rose <b>by</b> 25%, <b>from</b> 40,000 <b>to</b> 50,000, <b>despite</b> a fall <b>in</b> the birth rate.</p><p class=\"note\">Eight prepositions in one natural sentence.</p></div>"}, {"id": "mist", "t": "Mistakes people make", "c": "<div class=\"example\"><p><del>I will see you in Monday.</del> → <ins>I will see you on Monday.</ins></p><p class=\"note\">Days take on.</p></div><div class=\"example\"><p><del>He was born at 1999.</del> → <ins>He was born in 1999.</ins></p><p class=\"note\">Years take in.</p></div><div class=\"example\"><p><del>We have a meeting in 3 p.m.</del> → <ins>We have a meeting at 3 p.m.</ins></p><p class=\"note\">Clock times take at.</p></div><div class=\"example\"><p><del>He depends of his parents.</del> → <ins>He depends on his parents.</ins></p><p class=\"note\">Depend on.</p></div><div class=\"example\"><p><del>She is interested on art.</del> → <ins>She is interested in art.</ins></p><p class=\"note\">Interested in.</p></div><div class=\"example\"><p><del>I am agree with you.</del> → <ins>I agree with you.</ins></p><p class=\"note\">Agree is a verb, no be.</p></div><div class=\"example\"><p><del>It is different than mine.</del> → <ins>It is different from mine.</ins></p><p class=\"note\">Different from (or to in British speech).</p></div><div class=\"example\"><p><del>I’m good in maths.</del> → <ins>I’m good at maths.</ins></p><p class=\"note\">Good at.</p></div><div class=\"example\"><p><del>We discussed about the plan.</del> → <ins>We discussed the plan.</ins></p><p class=\"note\">Discuss takes no preposition.</p></div><div class=\"example\"><p><del>He is afraid from dogs.</del> → <ins>He is afraid of dogs.</ins></p><p class=\"note\">Afraid of.</p></div><div class=\"example\"><p><del>She married with a doctor.</del> → <ins>She married a doctor.</ins></p><p class=\"note\">Marry takes no preposition.</p></div><div class=\"example\"><p><del>I arrived to Dhaka.</del> → <ins>I arrived in Dhaka.</ins></p><p class=\"note\">Arrive in or at, not to.</p></div><div class=\"example\"><p><del>I went to home.</del> → <ins>I went home.</ins></p><p class=\"note\">Home takes no preposition after go.</p></div><div class=\"example\"><p><del>He is married with Sara.</del> → <ins>He is married to Sara.</ins></p><p class=\"note\">Married to.</p></div><div class=\"example\"><p><del>I look forward to meet you.</del> → <ins>I look forward to meeting you.</ins></p><p class=\"note\">To is a preposition, so use -ing.</p></div><div class=\"example\"><p><del>She is good at to cook.</del> → <ins>She is good at cooking.</ins></p><p class=\"note\">-ing after a preposition.</p></div><div class=\"example\"><p><del>There was an increase of sales.</del> → <ins>There was an increase in sales.</ins></p><p class=\"note\">An increase in + thing.</p></div><div class=\"example\"><p><del>The price increased with 5%.</del> → <ins>The price increased by 5%.</ins></p><p class=\"note\">By shows the amount of change.</p></div><div class=\"example\"><p><del>I’m living here since 2020.</del> → <ins>I have lived here since 2020.</ins></p><p class=\"note\">Since needs a perfect tense and a starting point.</p></div><div class=\"example\"><p><del>We travelled by the car.</del> → <ins>We travelled by car.</ins></p><p class=\"note\">No article after by in transport phrases.</p></div>"}, {"id": "pairs", "t": "Pairs and look-alikes", "c": "<div class=\"tw\"><table><thead><tr><th>Pair</th><th>Difference</th><th>Example</th></tr></thead><tbody><tr><td>in / on / at (time)</td><td>Large, medium, exact</td><td>in May, on Monday, at 5 p.m.</td></tr><tr><td>in / on / at (place)</td><td>Inside, surface, point</td><td>in the box, on the table, at the door</td></tr><tr><td>by / until</td><td>No later than vs up to that time</td><td>Finish by 5. Work until 5.</td></tr><tr><td>for / since</td><td>How long vs from when</td><td>for two years, since 2022</td></tr><tr><td>for / during</td><td>How long vs when</td><td>for two hours, during the film</td></tr><tr><td>in time / on time</td><td>Early enough vs exactly punctual</td><td>in time for dinner, on time for work</td></tr><tr><td>at the end / in the end</td><td>The last point vs finally</td><td>at the end of the road, in the end he left</td></tr><tr><td>between / among</td><td>Two vs many</td><td>between you and me, among friends</td></tr><tr><td>to / towards</td><td>Destination vs direction</td><td>went to London, walked towards the sea</td></tr><tr><td>in / into</td><td>Location vs movement inwards</td><td>He is in the room. He went into the room.</td></tr><tr><td>on / onto</td><td>Location vs movement to a surface</td><td>on the table, jumped onto the table</td></tr><tr><td>above / over</td><td>Higher than vs covering/crossing</td><td>above sea level, over the bridge</td></tr><tr><td>below / under</td><td>Lower than vs directly beneath</td><td>below zero, under the table</td></tr><tr><td>by / with</td><td>Doer or method vs tool</td><td>written by Orwell, cut with a knife</td></tr><tr><td>like / as</td><td>Similar to vs in the role of</td><td>like a doctor, as a doctor</td></tr><tr><td>besides / beside</td><td>In addition to vs next to</td><td>besides English, beside the window</td></tr><tr><td>except / except for</td><td>Excluding</td><td>Everyone except Tom</td></tr><tr><td>despite / although</td><td>Noun vs clause</td><td>despite the rain, although it rained</td></tr><tr><td>during / while</td><td>Noun vs clause</td><td>during the lesson, while he spoke</td></tr><tr><td>because of / because</td><td>Noun vs clause</td><td>because of rain, because it rained</td></tr><tr><td>affect / effect on</td><td>Verb vs noun + on</td><td>It affects health. It has an effect on health.</td></tr></tbody></table></div>"}, {"id": "dodont", "t": "Do, don’t and why", "c": "<div class=\"two\"><div><h3>Do</h3><ul><li>Learn each fixed pair as one chunk, with an example.</li><li>Use at, on, in by the time and place patterns.</li><li>Use -ing (not a base verb) after a preposition.</li><li>Check a dictionary or a collocation list when unsure.</li><li>Use by for change, to for the new level, from … to for range.</li><li>Read a sentence aloud: it often sounds wrong when a preposition is.</li></ul></div><div><h3>Don’t</h3><ul><li>Don’t translate prepositions from your language.</li><li>Don’t add a preposition to discuss, mention, enter or reach.</li><li>Don’t use to + base verb after a preposition.</li><li>Don’t say “on next Monday” or “in this morning”.</li><li>Don’t use different than in formal writing.</li><li>Don’t guess in Task 1: learn increase in, rise of, by, to.</li></ul></div></div><h3>Why we get it wrong</h3><h3>No logic</h3><p>Prepositions are mostly arbitrary, and every language chooses differently.</p><div class=\"tip\"><p>Try this: Learn words together with their preposition: depend on, not depend.</p></div><h3>Translation</h3><p>Your language’s preposition often differs from English.</p><div class=\"tip\"><p>Try this: Write every new word with its preposition and an example.</p></div><h3>Reading too fast</h3><p>Prepositions are small and unstressed, so you rarely notice them.</p><div class=\"tip\"><p>Try this: In one article, circle all prepositions after verbs, adjectives and nouns.</p></div><h3>Overgeneralising a rule</h3><p>Learners apply at, on, in rules to everything.</p><div class=\"tip\"><p>Try this: Remember exceptions: at night, in the morning, on the weekend.</p></div><h3>Small habits that help</h3><ul><li>Keep a pair list: verb + preposition, adjective + preposition, noun + preposition.</li><li>Read chart descriptions and copy their phrases.</li><li>Test yourself: cover the preposition and recall it.</li><li>Record two mistakes each day and the correct form.</li></ul>"}, {"id": "real", "t": "In IELTS and real life", "c": "<ul><li><b>Speaking:</b> “I’m interested in…”, “I’m good at…”, “It depends on…”, “I’m looking forward to…” are everyday phrases that score well.</li><li><b>Writing Task 1:</b> in, of, by, from, to, at, between and during carry almost every sentence.</li><li><b>Writing Task 2:</b> contribute to, lead to, result in, depend on, rely on, benefit from and in terms of.</li><li><b>Reading:</b> prepositions after nouns often introduce key details: an increase <b>in</b> …, a solution <b>to</b> …</li><li><b>Listening:</b> in vs on vs at often separates two dates or places: on the 5th, at 5.</li></ul><h3>Real-world use</h3><ul><li><b>Phone and email:</b> “at 5”, “on Friday” and “by Monday” are clear and quick.</li><li><b>Travel:</b> “at the airport”, “on the bus”, “in the taxi”, “by train”.</li><li><b>Work:</b> “in charge of”, “responsible for”, “in a meeting”, “on holiday”.</li><li><b>Directions:</b> “next to”, “opposite”, “turn left at the corner”.</li></ul><div class=\"tip\"><p><b>Real world:</b> prepositions are the first thing to slip when you speak fast. Slow down for dates, times and fixed pairs.</p></div>"}, {"id": "practice", "t": "Practice", "c": "<h3>Spot the mistake</h3><ol><li>I will meet you in Friday.<details><summary>Show answer</summary><ins>on Friday</ins></details></li><li>She is good in English.<details><summary>Show answer</summary><ins>good at English</ins></details></li><li>We discussed about the plan.<details><summary>Show answer</summary><ins>We discussed the plan.</ins></details></li><li>He is afraid from dogs.<details><summary>Show answer</summary><ins>afraid of dogs</ins></details></li><li>I arrived to Dhaka at noon.<details><summary>Show answer</summary><ins>arrived in Dhaka</ins></details></li><li>She is married with a doctor.<details><summary>Show answer</summary><ins>married to a doctor</ins></details></li><li>I look forward to meet you.<details><summary>Show answer</summary><ins>look forward to meeting you</ins></details></li><li>Prices rose with 10%.<details><summary>Show answer</summary><ins>rose by 10%</ins></details></li><li>I am interested for music.<details><summary>Show answer</summary><ins>interested in music</ins></details></li><li>The students are waiting to the bus.<details><summary>Show answer</summary><ins>waiting for the bus</ins></details></li></ol><h3>Say it another way</h3><ol><li>Say with into: “He went in the room.”<details><summary>Show answer</summary><ins>He went into the room.</ins></details></li><li>Combine: “sales / an increase / 10%”<details><summary>Show answer</summary><ins>There was an increase in sales of 10%.</ins></details></li><li>Use despite: “It rained. We played.”<details><summary>Show answer</summary><ins>Despite the rain, we played.</ins></details></li><li>Use because of: “The train was late. There was snow.”<details><summary>Show answer</summary><ins>The train was late because of snow.</ins></details></li><li>Say with by: “I improved my English. I read daily.”<details><summary>Show answer</summary><ins>I improved my English by reading daily.</ins></details></li><li>Use instead of: “I drank tea. I did not drink coffee.”<details><summary>Show answer</summary><ins>I drank tea instead of coffee.</ins></details></li></ol><h3>Choose in, on or at</h3><ol><li>I was born ___ 2000 ___ March.<details><summary>Show answer</summary><ins>in … in</ins></details></li><li>The class starts ___ 9 a.m. ___ Monday.<details><summary>Show answer</summary><ins>at … on</ins></details></li><li>She lives ___ Dhaka ___ 12 Park Road.<details><summary>Show answer</summary><ins>in … at</ins></details></li><li>We met ___ the station ___ the evening.<details><summary>Show answer</summary><ins>at … in</ins></details></li><li>He is ___ the bus ___ his way home.<details><summary>Show answer</summary><ins>on … on</ins></details></li><li>There is a picture ___ the wall ___ the kitchen.<details><summary>Show answer</summary><ins>on … in</ins></details></li></ol><h3>Fill the gaps</h3><p>I was born (1) ___ 2000 (2) ___ March. I get up (3) ___ 6 a.m. (4) ___ weekdays. She is interested (5) ___ music. We live (6) ___ Sylhet. He depends (7) ___ his parents. She is afraid (8) ___ spiders. The report was written (9) ___ two experts. Sales rose (10) ___ 10% (11) ___ 2020 (12) ___ 2022.</p><details><summary>Show answers</summary>1 in · 2 in · 3 at · 4 on · 5 in · 6 in · 7 on · 8 of · 9 by · 10 by · 11 between · 12 and (or: from … to)</details><h3>Speak and write</h3><ul><li>Describe your day using at, on and in correctly.</li><li>Write six sentences with: depend on, interested in, different from, responsible for, good at, increase in.</li><li>Describe a chart using by, to, from … to, between … and, at.</li><li>Describe the route from your home to school using along, past, across, into and opposite.</li><li>Write five sentences with by + -ing for methods, such as “You can learn vocabulary by reading.”</li></ul>"}, {"id": "quiz", "t": "Quiz", "quiz": 1}, {"id": "stick", "t": "Making it stick", "prog": 1}];
