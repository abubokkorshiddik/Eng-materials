<main>
<h1>Conditionals</h1>
<p class="m">Intermediate level · If-sentences link a condition to a result. The tense shows how real or unlikely the condition is.</p>
<div id="panes"></div>
</main>

<script>
(function(){"use strict";
var PFX="cd-",NEXT="passive-voice.html",NEXTL="Next lesson";

function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}function lw(k,v){try{localStorage.setItem(k,v)}catch(e){}}

var IC={list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h5v-6h4v6h5V9"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'};

/* ---------- content ---------- */
var CH=[{"id": "plain", "t": "In plain words", "c": "<p class=\"say\">A conditional sentence has two halves: the <b>if-part</b> (the condition) and the <b>main part</b> (the result). The surprise is that English changes tense to show how likely something is. Facts use present tenses. Real possibilities use present + will. Imaginary situations step back one tense: past + would. Impossible pasts step back again: past perfect + would have. Think of the tenses as <b>distance from reality</b>.</p><h3>How to build it</h3><div class=\"rule\"><p><b>Zero</b> If + present, present: <em>If you heat ice, it melts.</em></p><p><b>First</b> If + present, will + base: <em>If it rains, I will stay home.</em></p><p><b>Second</b> If + past, would + base: <em>If I had time, I would travel.</em></p><p><b>Third</b> If + past perfect, would have + participle: <em>If I had known, I would have called.</em></p><p><b>Mixed</b> If + past perfect, would + base: <em>If I had studied, I would be a doctor now.</em></p></div>"}, {"id": "use", "t": "When we use it", "c": "<h3>Zero: general truths</h3><div class=\"example\"><p>If you mix red and blue, you get purple.</p><p class=\"note\">Always true. You can replace if with when.</p></div><h3>First: a real future possibility</h3><div class=\"example\"><p>If prices rise, people will buy less.</p><p class=\"note\">Likely or possible. Good for predictions, warnings and solutions.</p></div><h3>Second: unlikely or imaginary now</h3><div class=\"example\"><p>If I were president, I would cut taxes.</p><p class=\"note\">Imaginary. Use were for every subject in formal English.</p></div><h3>Third: impossible past</h3><div class=\"example\"><p>If she had left earlier, she would have caught the train.</p><p class=\"note\">It did not happen. Used for regret and explanation.</p></div><h3>Mixed: past cause, present result</h3><div class=\"example\"><p>If I had saved more, I would be comfortable now.</p><p class=\"note\">A past condition with a present result.</p></div><h3>Easy to mix up</h3><div class=\"example\"><p>If I see him, I will tell him.<br>If I saw him, I would tell him.</p><p class=\"note\">Real possibility vs unlikely or imaginary.</p></div><div class=\"example\"><p>If I were you, I would apologise.<br>If I was you, I would apologise.</p><p class=\"note\">Were is the safer, formal choice.</p></div><div class=\"example\"><p>Unless you hurry, you will be late.<br>If you don’t hurry, you will be late.</p><p class=\"note\">Unless means if not.</p></div><div class=\"example\"><p>If I had known, I would have called.<br>Had I known, I would have called.</p><p class=\"note\">The second is a formal inverted form.</p></div><p class=\"note\">The two halves can swap places. When the if-part comes first, put a comma after it.</p>"}, {"id": "mist", "t": "Mistakes people make", "c": "<div class=\"example\"><p><del>If it will rain, I will stay home.</del> → <ins>If it rains, I will stay home.</ins></p><p class=\"note\">No will in the if-part.</p></div><div class=\"example\"><p><del>If I would have time, I would go.</del> → <ins>If I had time, I would go.</ins></p><p class=\"note\">No would in the if-part.</p></div><div class=\"example\"><p><del>If I had known, I will call you.</del> → <ins>If I had known, I would have called you.</ins></p><p class=\"note\">Match the two halves.</p></div><div class=\"example\"><p><del>If I was rich, I would help.</del> → <ins>If I were rich, I would help.</ins></p><p class=\"note\">Were is correct in formal English.</p></div><div class=\"example\"><p><del>Unless you don’t study, you will fail.</del> → <ins>Unless you study, you will fail.</ins></p><p class=\"note\">Unless is already negative.</p></div><div class=\"example\"><p><del>If he would study, he would pass.</del> → <ins>If he studied, he would pass.</ins></p><p class=\"note\">Would belongs in the result part.</p></div>"}, {"id": "deep", "t": "Going deeper", "c": "<h3>Core test: how real is it?</h3><p>Is it a general truth, a real possibility, an imaginary present or an impossible past? That tells you zero, first, second or third.</p><h3>Modals in the result</h3><p>Will, would, could, might, can, should: <em>If you study, you might pass. If I had time, I could help.</em></p><h3>Other ways to say if</h3><p>Unless, as long as, provided that, on condition that, otherwise: <em>You can go provided that you finish. Take a coat, otherwise you will be cold.</em></p><h3>Wish and if only</h3><p><em>I wish I had more time</em> (now). <em>I wish I had studied</em> (past). <em>If only I knew.</em> The tense steps back, just like second and third conditionals.</p><h3>Formal inversion</h3><p><em>Should you need help, call us. Were I you, I would wait. Had I known, I would have called.</em></p><h3>Conditionals in Task 2</h3><ul><li>First conditional for solutions: <em>If governments invest in public transport, congestion will fall.</em></li><li>Second for hypotheses: <em>If cars were banned, cities would be quieter.</em></li><li>Third for the past: <em>If more had been done earlier, the damage would have been smaller.</em></li></ul><h3>Shortcuts that work in exams</h3><ul><li><b>No will or would after if.</b> They belong in the result part.</li><li><b>Present → will. Past → would. Past perfect → would have.</b> The three main pairs.</li><li><b>Were for all subjects.</b> If I were, if he were.</li><li><b>Comma after an opening if-part.</b> If it rains, we stay.</li></ul><h3>Where exams try to catch you</h3><ul><li><b>“When” and “if”:</b> When means it will happen. If means it might.</li><li><b>“In case”:</b> Take an umbrella in case it rains is a precaution, not the same as if.</li><li><b>Mixed forms:</b> Look for words like now or today with a past perfect if-part.</li><li><b>“Unless … not”:</b> A double negative. Wrong.</li></ul>"}, {"id": "dodont", "t": "Do, don’t and why", "c": "<div class=\"two\"><div><h3>Do</h3><ul><li>Decide first how real the situation is.</li><li>Keep will and would out of the if-part.</li><li>Use were in second conditional.</li><li>Put a comma after an opening if-part.</li></ul></div><div><h3>Don’t</h3><ul><li>Don’t say if + will.</li><li>Don’t mix up the pairs.</li><li>Don’t use unless with a negative.</li><li>Don’t use would have in the if-part.</li></ul></div></div><h3>Why we get it wrong</h3><h3>Tense logic</h3><p>Learners expect past tense to mean past time. In conditionals it means unreal.</p><div class=\"tip\"><p>Try this: Think “distance from reality”, not “time”.</p></div><h3>Translation</h3><p>In many languages the future form is allowed after if.</p><div class=\"tip\"><p>Try this: Memorise “if + present” as a chunk.</p></div><h3>Too many forms</h3><p>Five types feels like a lot.</p><div class=\"tip\"><p>Try this: Master first and second conditional first, then add the others.</p></div><h3>Small habits that help</h3><ul><li>Write one real and one imaginary sentence about your week.</li><li>Use if once in each Speaking answer.</li><li>Redo wrongly answered sentences in your notebook.</li></ul>"}, {"id": "real", "t": "In IELTS and real life", "c": "<ul><li><b>Speaking:</b> talk about imaginary situations. “If I won the lottery, I would…”</li><li><b>Writing:</b> first conditional for solutions, second for hypotheses, third for the past.</li><li><b>Reading:</b> conditionals signal predictions and possibilities, not facts.</li><li><b>Listening:</b> listen for if, unless, would and would have.</li></ul><div class=\"tip\"><p><b>Real world:</b> advising, warning, negotiating and apologising all use conditionals.</p></div><p class=\"note\">Two accurate conditionals are worth more than six confused ones.</p>"}, {"id": "practice", "t": "Practice", "c": "<h3>Spot the mistake</h3><ol><li>If it will rain, we stay home.<details><summary>Show answer</summary><ins>If it rains, we will stay home.</ins> No will in the if-part.</details></li><li>If I would have money, I would travel.<details><summary>Show answer</summary><ins>If I had money, I would travel.</ins> No would in the if-part.</details></li><li>If I knew, I would have called.<details><summary>Show answer</summary><ins>If I had known, I would have called.</ins> Third conditional needs past perfect.</details></li><li>Unless you don’t hurry, you’ll be late.<details><summary>Show answer</summary><ins>Unless you hurry, you’ll be late.</ins> Unless is already negative.</details></li></ol><h3>Say it another way</h3><ol><li>Use second conditional: “I don’t have time. I can’t travel.”<details><summary>Show answer</summary><ins>If I had time, I could travel.</ins></details></li><li>Use third conditional: “I didn’t study. I failed.”<details><summary>Show answer</summary><ins>If I had studied, I would not have failed.</ins></details></li></ol><h3>Fill the gaps</h3><p>If you heat water, it (1) ___ (boil). If it rains, I (2) ___ (stay) at home. If I (3) ___ (be) rich, I would help. If she (4) ___ (study), she would have passed. (5) ___ you don’t leave now, you will be late (If / Unless).</p><details><summary>Show answers</summary>1 boils · 2 will stay · 3 were · 4 had studied · 5 If</details><h3>Speak and write</h3><ul><li>Talk for one minute: “If I could change one thing about my city, I would…”</li><li>Write one sentence of each type: zero, first, second, third.</li></ul>"}, {"id": "quiz", "t": "Quiz", "quiz": 1}, {"id": "stick", "t": "Making it stick", "prog": 1}];
