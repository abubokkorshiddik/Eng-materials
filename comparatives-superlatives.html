var CH=[{"id": "what", "t": "What are comparatives and superlatives?", "c": "<p class=\"say\">We compare to say how two things differ (<b>comparative</b>: taller, more expensive) and to pick the extreme in a group (<b>superlative</b>: the tallest, the most expensive). There is also an <b>equal</b> form (as tall as). Comparison is the heart of IELTS Writing Task 1, where you compare numbers, countries and years, and a very common tool in Speaking.</p><div class=\"tw\"><table><thead><tr><th>Adjective</th><th>Comparative (two things)</th><th>Superlative (three or more)</th></tr></thead><tbody><tr><td>tall</td><td>taller</td><td>the tallest</td></tr><tr><td>large</td><td>larger</td><td>the largest</td></tr><tr><td>big</td><td>bigger</td><td>the biggest</td></tr><tr><td>happy</td><td>happier</td><td>the happiest</td></tr><tr><td>expensive</td><td>more expensive</td><td>the most expensive</td></tr><tr><td>good</td><td>better</td><td>the best</td></tr><tr><td>bad</td><td>worse</td><td>the worst</td></tr></tbody></table></div><h3>Four ways to compare</h3><div class=\"rule\"><p><b>Different</b> comparative + than: <em>Dhaka is bigger than Sylhet.</em></p><p><b>Equal</b> as + adjective + as: <em>Cars were as popular as buses.</em></p><p><b>Not equal</b> not as + adjective + as: <em>Trains are not as fast as planes.</em></p><p><b>The extreme</b> the + superlative: <em>It is the largest city in the country.</em></p></div><h3>Which form do I need?</h3><ul><li>Comparing <b>two</b> things? Use the <b>comparative</b> + than.</li><li>Choosing one from <b>three or more</b>? Use <b>the + superlative</b>.</li><li>Saying two things are the <b>same</b>? Use <b>as … as</b>.</li><li>Showing change over time? Use <b>more and more</b>, <b>-er and -er</b>.</li></ul><p class=\"note\">Use <b>the</b> before a superlative, but not before a comparative.</p>"}, {"id": "forms", "t": "Forming comparatives and superlatives", "c": "<h3>Step 1: count the syllables</h3><div class=\"tw\"><table><thead><tr><th>Adjective length</th><th>Rule</th><th>Examples</th></tr></thead><tbody><tr><td>One syllable</td><td>add -er / -est</td><td>tall → taller → tallest; old → older → oldest</td></tr><tr><td>Two syllables ending in -y</td><td>change y to i, add -er / -est</td><td>happy → happier → happiest; easy → easier → easiest</td></tr><tr><td>Two syllables (other)</td><td>usually more / most</td><td>careful → more careful → most careful</td></tr><tr><td>Two syllables ending in -er, -ow, -le</td><td>-er / -est or more / most</td><td>clever → cleverer / more clever; narrow → narrower; simple → simpler</td></tr><tr><td>Three or more syllables</td><td>more / most</td><td>beautiful → more beautiful → most beautiful; expensive → more expensive</td></tr></tbody></table></div><h3>Spelling rules</h3><div class=\"tw\"><table><thead><tr><th>Rule</th><th>Example</th></tr></thead><tbody><tr><td>Add -r / -st after final e</td><td>large → larger → largest; nice → nicer → nicest</td></tr><tr><td>Double the final consonant after one vowel + one consonant</td><td>big → bigger → biggest; hot → hotter → hottest; thin → thinner → thinnest</td></tr><tr><td>Change y to i after a consonant</td><td>happy → happier → happiest; busy → busier → busiest</td></tr><tr><td>Do not change y after a vowel</td><td>gray → grayer; grey → greyer</td></tr><tr><td>Do not double w, x, y or a consonant after two vowels</td><td>slow → slower; new → newer; cheap → cheaper; clean → cleaner</td></tr></tbody></table></div><h3>Two-syllable adjectives that accept both forms</h3><p><em>clever, quiet, simple, narrow, gentle, common, polite, pleasant, handsome, stupid, tired.</em> Both are correct: <em>quieter / more quiet</em>. Use the -er form for short, everyday words and more for longer, formal ones.</p><h3>Adjectives that always take more / most</h3><p>Participles ending in -ed or -ing (<em>more tired, more boring, more surprised</em>) and adjectives ending in -ful, -less, -ous, -ive, -ing and -ed: <em>more careful, more useful, more famous, more active.</em></p><h3>Absolute adjectives</h3><p>Some adjectives describe something that cannot be more or less: <em>perfect, unique, dead, impossible, empty, full.</em> In careful writing, avoid “more perfect” or “very unique”. Use “almost perfect” or “nearly empty”.</p>"}, {"id": "irreg", "t": "Irregular forms", "c": "<div class=\"tw\"><table><thead><tr><th>Adjective / adverb</th><th>Comparative</th><th>Superlative</th><th>Example</th></tr></thead><tbody><tr><td>good</td><td>better</td><td>the best</td><td>This is the best book I have read.</td></tr><tr><td>bad</td><td>worse</td><td>the worst</td><td>The weather is worse today.</td></tr><tr><td>well (adverb)</td><td>better</td><td>the best</td><td>She sings better than me.</td></tr><tr><td>badly (adverb)</td><td>worse</td><td>the worst</td><td>He drives worse than his brother.</td></tr><tr><td>far</td><td>farther / further</td><td>the farthest / furthest</td><td>We walked further than I expected.</td></tr><tr><td>little</td><td>less</td><td>the least</td><td>I have less time than before.</td></tr><tr><td>much / many</td><td>more</td><td>the most</td><td>She has the most experience.</td></tr><tr><td>old</td><td>older / elder</td><td>the oldest / the eldest</td><td>my elder sister, the oldest building</td></tr><tr><td>late</td><td>later / latter</td><td>the latest / the last</td><td>the latest news, the last chapter</td></tr><tr><td>near</td><td>nearer</td><td>the nearest / the next</td><td>the nearest shop</td></tr></tbody></table></div><h3>Further and farther</h3><p><b>Farther</b> and <b>further</b> both mean “more distant”. <b>Further</b> also means “additional”: <em>For further information, see page 5. Further research is needed.</em> Use further in academic writing.</p><h3>Older and elder</h3><div class=\"example\"><p>My brother is older than me.<br>My elder brother lives abroad.</p><p class=\"note\">Elder and eldest are used only for family members, and only before a noun, never with than.</p></div><h3>Later, latter, latest, last</h3><ul><li><b>later:</b> after now (see you later).</li><li><b>latter:</b> the second of two things mentioned.</li><li><b>latest:</b> the most recent (the latest model).</li><li><b>last:</b> final (the last page).</li></ul><h3>Nearest and next</h3><div class=\"example\"><p>The <b>nearest</b> station is two miles away. The <b>next</b> station is Dhaka.</p><p class=\"note\">Nearest is about distance. Next is about order.</p></div>"}, {"id": "advs", "t": "Comparatives of adverbs", "c": "<p>Adverbs of manner follow the same idea. Short adverbs (fast, hard, late, early) add -er / -est. Adverbs ending in -ly use more / most.</p><div class=\"tw\"><table><thead><tr><th>Adverb</th><th>Comparative</th><th>Superlative</th><th>Example</th></tr></thead><tbody><tr><td>fast</td><td>faster</td><td>the fastest</td><td>He runs faster than me.</td></tr><tr><td>hard</td><td>harder</td><td>the hardest</td><td>She works the hardest.</td></tr><tr><td>early</td><td>earlier</td><td>the earliest</td><td>I arrived earlier than expected.</td></tr><tr><td>quickly</td><td>more quickly</td><td>the most quickly</td><td>Speak more quickly. (the most quickly is rare)</td></tr><tr><td>carefully</td><td>more carefully</td><td>the most carefully</td><td>Drive more carefully.</td></tr><tr><td>clearly</td><td>more clearly</td><td>the most clearly</td><td>Explain it more clearly.</td></tr><tr><td>well</td><td>better</td><td>the best</td><td>She plays the best.</td></tr><tr><td>badly</td><td>worse</td><td>the worst</td><td>He sings worse than me.</td></tr><tr><td>often</td><td>more often</td><td>the most often</td><td>I visit more often now.</td></tr></tbody></table></div><h3>Adverbs after comparatives</h3><div class=\"example\"><p>She speaks English <b>more fluently than</b> her brother. He works <b>harder than</b> everyone.</p><p class=\"note\">Comparative adverb + than.</p></div><p class=\"note\">Adjectives describe nouns (a faster car) and adverbs describe verbs (drives faster). Be careful with “faster”, “harder” and “later”, which are both an adjective and an adverb.</p>"}, {"id": "comp", "t": "The comparative pattern", "c": "<div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Example</th></tr></thead><tbody><tr><td>A + be + comparative + than + B</td><td>Dhaka is bigger than Sylhet.</td></tr><tr><td>A + verb + comparative adverb + than + B</td><td>She runs faster than me.</td></tr><tr><td>more / less + adjective + than</td><td>This test is more difficult than the last one.</td></tr><tr><td>more / fewer / less + noun + than</td><td>There are more cars than bicycles. We have less time than before.</td></tr></tbody></table></div><h3>Than + pronoun</h3><ul><li><b>Formal:</b> He is taller than I (am).</li><li><b>Informal:</b> He is taller than me. Both are accepted. In IELTS Writing, use the full clause: <em>He is taller than I am.</em></li></ul><h3>Than + clause</h3><div class=\"example\"><p>The test was easier <b>than I expected</b>. It costs more <b>than it should</b>.</p></div><h3>Less + adjective</h3><div class=\"example\"><p>This is <b>less expensive than</b> that. It is <b>less important than</b> the first point.</p><p class=\"note\">Less + adjective is the opposite of more. It sounds more formal than not as … as.</p></div><h3>Than after other words</h3><div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Example</th></tr></thead><tbody><tr><td>rather than</td><td>I prefer tea rather than coffee.</td></tr><tr><td>no sooner … than</td><td>No sooner had she left than it rained.</td></tr><tr><td>more … than ever</td><td>Prices are higher than ever.</td></tr><tr><td>more than + number</td><td>More than 50% agreed.</td></tr><tr><td>less than + number</td><td>Less than a third responded.</td></tr><tr><td>no more than</td><td>No more than ten people came.</td></tr></tbody></table></div><h3>Gradual change</h3><div class=\"example\"><p>Rents are getting <b>more and more</b> expensive. The days are getting <b>longer and longer</b>.</p><p class=\"note\">Repeat the comparative to show continuing change.</p></div><h3>The … the …</h3><div class=\"example\"><p><b>The more</b> you practise, <b>the better</b> you become. <b>The sooner</b> you start, <b>the easier</b> it will be.</p><p class=\"note\">A double comparative shows that two things change together.</p></div>"}, {"id": "equal", "t": "Equality and inequality: as … as", "c": "<div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Example</th></tr></thead><tbody><tr><td>as + adjective + as</td><td>Cars were as popular as buses.</td></tr><tr><td>not as / so + adjective + as</td><td>Trains are not as fast as planes.</td></tr><tr><td>as + adverb + as</td><td>She runs as fast as her brother.</td></tr><tr><td>as + much / many + noun + as</td><td>He has as many books as I do. She earns as much money as him.</td></tr><tr><td>twice / three times as … as</td><td>Prices were twice as high as in 2010.</td></tr><tr><td>half as … as</td><td>It costs half as much as the old model.</td></tr><tr><td>the same + noun + as</td><td>She has the same height as me. (the same … as)</td></tr><tr><td>almost / nearly / just as … as</td><td>It is just as important as the first reason.</td></tr></tbody></table></div><h3>Different from and similar to</h3><div class=\"tw\"><table><thead><tr><th>Expression</th><th>Example</th></tr></thead><tbody><tr><td>the same as</td><td>This is the same as that.</td></tr><tr><td>similar to</td><td>It is similar to my idea.</td></tr><tr><td>different from</td><td>It is different from mine.</td></tr><tr><td>like / unlike</td><td>Like his father, he is tall.</td></tr><tr><td>alike</td><td>The twins look alike.</td></tr></tbody></table></div><h3>As and than: two different words</h3><div class=\"example\"><p>She is as tall as me.<br>She is taller than me.</p><p class=\"note\">Equal uses as … as. Different uses than.</p></div><h3>Multiples</h3><div class=\"example\"><p>The figure for Japan was <b>twice as high as</b> that for China. China’s figure was <b>half as high as</b> Japan’s.</p><p class=\"note\">Use twice, three times, four times as … as. Use half and a third for fractions.</p></div><p class=\"note\"><b>Never</b> write “as … than”. Use as … as or … than.</p>"}, {"id": "sup", "t": "The superlative pattern", "c": "<div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Example</th></tr></thead><tbody><tr><td>the + superlative + noun</td><td>It is the largest city in the country.</td></tr><tr><td>the + superlative + in + place or group</td><td>She is the tallest in the class.</td></tr><tr><td>the + superlative + of + number or plural</td><td>He is the best of the three. It is the cheapest of all.</td></tr><tr><td>one of the + superlative + plural noun</td><td>It is one of the most popular sports.</td></tr><tr><td>the + superlative + I have ever + participle</td><td>It is the best film I have ever seen.</td></tr><tr><td>the second / third + superlative</td><td>It is the second largest city.</td></tr><tr><td>by far the + superlative</td><td>It is by far the biggest problem.</td></tr><tr><td>the least + adjective</td><td>This is the least expensive option.</td></tr></tbody></table></div><h3>In or of?</h3><ul><li><b>in</b> + a place, group or collective noun: the tallest <b>in</b> the class, the best <b>in</b> the world, the largest <b>in</b> Asia.</li><li><b>of</b> + plural noun, number or time: the best <b>of</b> the three, the hottest day <b>of</b> the year, the fastest <b>of</b> all.</li></ul><h3>Superlative with ever</h3><div class=\"example\"><p>It is the most beautiful place I <b>have ever visited</b>.</p><p class=\"note\">After a superlative, use the present perfect with ever.</p></div><h3>The is usually required</h3><p>Do not forget <b>the</b>: <del>She is best player.</del> → <em>She is the best player.</em> The can be dropped only after a possessive or in some adverb uses: <em>my best friend, She works hardest.</em></p><h3>Superlative only for three or more</h3><div class=\"example\"><p>Of the two options, this is better.<br>Of the three options, this is the best.</p><p class=\"note\">Use the comparative for two, the superlative for three or more.</p></div><h3>Do not mix</h3><div class=\"example\"><p><del>She is the most smartest.</del> → <ins>She is the smartest.</ins></p><p class=\"note\">Never most + -est.</p></div>"}, {"id": "nouns", "t": "Comparing nouns and quantities", "c": "<div class=\"tw\"><table><thead><tr><th>Counts</th><th>Pattern</th><th>Example</th></tr></thead><tbody><tr><td>Countable</td><td>more / fewer + noun + than</td><td>There are more students than teachers. There were fewer accidents.</td></tr><tr><td>Uncountable</td><td>more / less + noun + than</td><td>We have more water than before. I have less time.</td></tr><tr><td>Equal, countable</td><td>as many + noun + as</td><td>She has as many books as I do.</td></tr><tr><td>Equal, uncountable</td><td>as much + noun + as</td><td>He earns as much money as his brother.</td></tr><tr><td>Superlative, countable</td><td>the most / fewest + noun</td><td>She has the most friends. The fewest people came.</td></tr><tr><td>Superlative, uncountable</td><td>the most / least + noun</td><td>He has the least experience.</td></tr></tbody></table></div><h3>Fewer vs less</h3><div class=\"example\"><p>fewer people, fewer cars, fewer mistakes<br>less water, less time, less money</p><p class=\"note\">Fewer for countable nouns, less for uncountable nouns.</p></div><p class=\"note\">Some exceptions are accepted with fixed expressions: <em>less than 10 minutes, in less than a year.</em> With plurals as one unit of amount, less is used: <em>less than $50.</em></p><h3>Number of vs amount of</h3><ul><li><b>a large / small number of</b> + plural countable: a large number of students.</li><li><b>a large / small amount of</b> + uncountable: a small amount of water.</li></ul><h3>Percentages and proportions</h3><div class=\"example\"><p>A <b>larger proportion of</b> women than men voted. <b>More than half</b> of the students agreed. <b>A smaller percentage of</b> young people…</p></div>"}, {"id": "mod", "t": "Modifying comparisons", "c": "<p>Modifiers show how big the difference is. They go before the comparative: <em>much taller, slightly lower.</em></p><div class=\"tw\"><table><thead><tr><th>Strength</th><th>Modifiers</th><th>Example</th></tr></thead><tbody><tr><td>Big difference</td><td>much, far, a lot, considerably, significantly, substantially, a great deal</td><td>Prices were considerably higher in Tokyo.</td></tr><tr><td>Small difference</td><td>slightly, a little, a bit, marginally, somewhat, rather</td><td>The figure was slightly lower than last year.</td></tr><tr><td>Almost equal</td><td>almost, nearly, roughly, about, approximately, virtually</td><td>Spending was almost as high as in 2020.</td></tr><tr><td>Exactly equal</td><td>just, exactly, precisely</td><td>It is exactly as expensive.</td></tr><tr><td>Increasing</td><td>even, still, yet</td><td>This is even more difficult.</td></tr></tbody></table></div><h3>Modifiers with superlatives</h3><div class=\"example\"><p>It is <b>by far</b> the most expensive. It is <b>easily</b> the best. It is <b>almost</b> the largest. <b>Much</b> the best.</p><p class=\"note\">Use by far, easily, quite, almost and nearly with superlatives, not much or very.</p></div><h3>Not modifiers</h3><ul><li><del>very taller</del> → <ins>much taller</ins>.</li><li><del>very more expensive</del> → <ins>much more expensive</ins>.</li><li><del>so easier</del> → <ins>so easy</ins> or <ins>much easier</ins>.</li></ul><h3>Modifiers in as … as</h3><div class=\"example\"><p>It is <b>nearly</b> as large as Sylhet. It is <b>not nearly</b> as large as Dhaka. <b>Just</b> as important. <b>Half</b> as expensive.</p></div><h3>Describing differences with numbers</h3><div class=\"example\"><p>The figure was <b>10% higher than</b> last year. Sales were <b>twice as high as</b> in 2010. It rose by <b>half</b>. It was <b>three times</b> the size.</p></div>"}, {"id": "special", "t": "Special cases and traps", "c": "<h3>Double comparatives are wrong</h3><div class=\"tw\"><table><thead><tr><th>Wrong</th><th>Right</th></tr></thead><tbody><tr><td><del>more taller</del></td><td><ins>taller</ins></td></tr><tr><td><del>most tallest</del></td><td><ins>the tallest</ins></td></tr><tr><td><del>more better</del></td><td><ins>better</ins></td></tr><tr><td><del>more easier</del></td><td><ins>easier</ins></td></tr><tr><td><del>most easiest</del></td><td><ins>the easiest</ins></td></tr></tbody></table></div><h3>Comparatives and clauses</h3><div class=\"example\"><p><b>Compare like with like:</b> The population of Dhaka is larger than <b>that of</b> Sylhet. (not … than Sylhet)</p><p class=\"note\">Use that of / those of to avoid comparing a number with a place.</p></div><div class=\"example\"><p>The population of Dhaka is larger than Sylhet.<br>The population of Dhaka is larger than that of Sylhet.</p><p class=\"note\">The first compares a population with a city, which is a logical error.</p></div><h3>Same as or similar to?</h3><ul><li><b>the same as</b> = identical.</li><li><b>similar to</b> = almost the same.</li><li><b>different from</b> = not the same (avoid different than).</li></ul><h3>Prefer, would rather</h3><div class=\"example\"><p>I <b>prefer</b> tea <b>to</b> coffee. I <b>would rather</b> walk <b>than</b> drive.</p><p class=\"note\">Prefer uses to. Would rather uses than.</p></div><h3>Comparatives with the</h3><div class=\"example\"><p><b>The</b> younger of the two brothers. <b>The</b> taller student. <b>The</b> more interesting option.</p><p class=\"note\">Use the + comparative when you choose between two known things.</p></div><h3>Superlatives with possessives</h3><div class=\"example\"><p><b>my best friend</b>, <b>their latest album</b>, <b>her worst fear</b>.</p><p class=\"note\">No the after a possessive.</p></div><h3>Comparatives that are not really comparing</h3><p>Some comparatives mean something fixed: <em>the elderly, the higher education, a better understanding, a younger generation.</em> They are not compared with anything.</p><h3>Adjectives with no comparative</h3><p>Some adjectives are already extreme and cannot be compared: <em>perfect, dead, unique, equal, final, complete.</em></p>"}, {"id": "other", "t": "Other ways to compare", "c": "<p>Good writers use a range of structures, not only “more than”. These add variety and impress examiners.</p><div class=\"tw\"><table><thead><tr><th>Structure</th><th>Example</th></tr></thead><tbody><tr><td>compared with / compared to</td><td>Compared with Japan, China’s figure was higher.</td></tr><tr><td>in comparison with</td><td>In comparison with last year, sales fell.</td></tr><tr><td>whereas / while</td><td>Urban areas are crowded, whereas rural areas are quiet.</td></tr><tr><td>in contrast / by contrast</td><td>Men spent more. In contrast, women spent less.</td></tr><tr><td>on the other hand</td><td>Cars are fast. On the other hand, they are expensive.</td></tr><tr><td>unlike / like</td><td>Unlike China, Japan’s population fell.</td></tr><tr><td>similarly / likewise</td><td>Similarly, the figure for Italy rose.</td></tr><tr><td>the same / different</td><td>The two figures are the same. The patterns differ.</td></tr><tr><td>outnumber / exceed / surpass</td><td>Women outnumbered men. Spending exceeded income.</td></tr><tr><td>be higher / lower / greater / smaller than</td><td>The figure was greater than expected.</td></tr><tr><td>twice / double / half</td><td>Doubled in size, half the price.</td></tr><tr><td>a fraction / a third / a quarter of</td><td>A third of the budget was spent on food.</td></tr></tbody></table></div><h3>Choosing the right verb</h3><ul><li><b>exceed:</b> goes beyond a number (exceeded 50%).</li><li><b>outnumber:</b> more people or things than another group.</li><li><b>surpass:</b> goes beyond a previous level.</li><li><b>account for:</b> make up a part of the total (accounted for 40%).</li></ul><h3>Ranking language</h3><ul><li><b>ranked first / second / third</b>, <b>came top</b>, <b>was the leading</b></li><li><b>followed by</b>, <b>trailed behind</b>, <b>was in last place</b></li></ul><div class=\"example\"><p>Japan <b>ranked first</b>, <b>followed by</b> China and India. Italy was <b>in last place</b>.</p></div>"}, {"id": "task1", "t": "Comparison in IELTS Writing", "c": "<h3>Task 1: describing charts and tables</h3><div class=\"tw\"><table><thead><tr><th>Purpose</th><th>Language</th><th>Example</th></tr></thead><tbody><tr><td>Highest and lowest</td><td>the highest, the lowest, the most, the least, peaked at, was lowest</td><td>Japan had the highest figure, at 40%.</td></tr><tr><td>Compare two items</td><td>higher than, lower than, more than, less than, as … as</td><td>Sales were higher in Dhaka than in Sylhet.</td></tr><tr><td>Multiples</td><td>twice as, three times as, double, half</td><td>Spending was twice as high as in 2010.</td></tr><tr><td>Small difference</td><td>slightly, marginally, a little</td><td>Slightly lower than last year.</td></tr><tr><td>Big difference</td><td>considerably, significantly, far, much</td><td>Considerably higher in the capital.</td></tr><tr><td>Approximately equal</td><td>almost the same as, roughly equal to</td><td>Roughly equal to the previous year.</td></tr><tr><td>Ranking</td><td>ranked first, followed by, in last place</td><td>Japan ranked first, followed by Korea.</td></tr><tr><td>Contrast</td><td>whereas, while, in contrast, by contrast</td><td>Whereas the first rose, the second fell.</td></tr></tbody></table></div><h3>A model paragraph</h3><div class=\"example\"><p><b>Japan</b> had <b>the highest</b> percentage of elderly people at 28%, <b>followed by</b> Italy at 23%. <b>The figure for</b> Japan was <b>almost twice as high as</b> that for the UK (18%), <b>whereas</b> the figure for Canada (17%) was <b>slightly lower than</b> that of the UK.</p><p class=\"note\">Superlative, ranking, multiples, comparison of like with like (the figure for…) and contrast, all in two sentences.</p></div><h3>Task 2: weighing options</h3><ul><li><b>X is more effective than Y</b> because…</li><li><b>The most serious problem is</b>…</li><li><b>This is far less expensive than</b>…</li><li><b>The greater the number of cars, the worse the pollution.</b></li><li><b>Cities are becoming more and more crowded.</b></li></ul><h3>Speaking</h3><ul><li>Part 1: “I like my city, but my village is quieter.”</li><li>Part 2: “It was the most interesting trip I have ever taken.”</li><li>Part 3: “Life is much easier than it used to be.”</li></ul><h3>Common Task 1 slips</h3><div class=\"tw\"><table><thead><tr><th>Wrong</th><th>Right</th></tr></thead><tbody><tr><td><del>The population of Japan was higher than Italy.</del></td><td><ins>The population of Japan was higher than that of Italy.</ins></td></tr><tr><td><del>The most highest figure</del></td><td><ins>The highest figure</ins></td></tr><tr><td><del>It is more bigger</del></td><td><ins>It is bigger</ins></td></tr><tr><td><del>twice more than</del></td><td><ins>twice as high as</ins></td></tr><tr><td><del>three times higher than (unclear)</del></td><td><ins>three times as high as</ins></td></tr></tbody></table></div>"}, {"id": "mist", "t": "Mistakes people make", "c": "<div class=\"example\"><p><del>She is more taller than me.</del> → <ins>She is taller than me.</ins></p><p class=\"note\">Never more + -er.</p></div><div class=\"example\"><p><del>This is the most easiest test.</del> → <ins>This is the easiest test.</ins></p><p class=\"note\">Never most + -est.</p></div><div class=\"example\"><p><del>He is taller that me.</del> → <ins>He is taller than me.</ins></p><p class=\"note\">Than, not that.</p></div><div class=\"example\"><p><del>It is the better of all.</del> → <ins>It is the best of all.</ins></p><p class=\"note\">Superlative for three or more.</p></div><div class=\"example\"><p><del>There were less people.</del> → <ins>There were fewer people.</ins></p><p class=\"note\">Fewer with countable nouns.</p></div><div class=\"example\"><p><del>She is as tall than me.</del> → <ins>She is as tall as me.</ins></p><p class=\"note\">As … as.</p></div><div class=\"example\"><p><del>It is more cheap.</del> → <ins>It is cheaper.</ins></p><p class=\"note\">Cheap is short: -er.</p></div><div class=\"example\"><p><del>She is best player.</del> → <ins>She is the best player.</ins></p><p class=\"note\">A superlative needs the.</p></div><div class=\"example\"><p><del>He is the most tall in the class.</del> → <ins>He is the tallest in the class.</ins></p><p class=\"note\">Tall is short: -est.</p></div><div class=\"example\"><p><del>This is more better than that.</del> → <ins>This is better than that.</ins></p><p class=\"note\">Better is already comparative.</p></div><div class=\"example\"><p><del>Sales were more higher in 2010.</del> → <ins>Sales were higher in 2010.</ins></p><p class=\"note\">Never more + -er.</p></div><div class=\"example\"><p><del>She is the tallest of the class.</del> → <ins>She is the tallest in the class.</ins></p><p class=\"note\">In + a group or place.</p></div><div class=\"example\"><p><del>It is very bigger than mine.</del> → <ins>It is much bigger than mine.</ins></p><p class=\"note\">Use much, not very, before a comparative.</p></div><div class=\"example\"><p><del>China is bigger than Japan population.</del> → <ins>China’s population is bigger than Japan’s.</ins></p><p class=\"note\">Compare like with like.</p></div><div class=\"example\"><p><del>He is as smart than his brother.</del> → <ins>He is as smart as his brother.</ins></p><p class=\"note\">As … as.</p></div><div class=\"example\"><p><del>It is the best film I saw.</del> → <ins>It is the best film I have ever seen.</ins></p><p class=\"note\">Use the present perfect after a superlative.</p></div><div class=\"example\"><p><del>Of the two, this is the best.</del> → <ins>Of the two, this is the better one.</ins></p><p class=\"note\">Two things: comparative.</p></div>"}, {"id": "pairs", "t": "Pairs and look-alikes", "c": "<div class=\"tw\"><table><thead><tr><th>Pair</th><th>Difference</th><th>Example</th></tr></thead><tbody><tr><td>than / as</td><td>Different vs equal</td><td>taller than, as tall as</td></tr><tr><td>than / that</td><td>Comparison vs connector</td><td>taller than me, said that he left</td></tr><tr><td>fewer / less</td><td>Countable vs uncountable</td><td>fewer cars, less traffic</td></tr><tr><td>further / farther</td><td>Additional or distance vs distance</td><td>further information, farther away</td></tr><tr><td>older / elder</td><td>Age vs family order</td><td>older than me, my elder brother</td></tr><tr><td>later / latter</td><td>After vs the second of two</td><td>see you later, the latter option</td></tr><tr><td>latest / last</td><td>Newest vs final</td><td>the latest news, the last chapter</td></tr><tr><td>nearest / next</td><td>Distance vs order</td><td>the nearest shop, the next stop</td></tr><tr><td>good / well</td><td>Adjective vs adverb</td><td>a good player, plays well</td></tr><tr><td>better / best</td><td>Two vs three or more</td><td>better of two, best of all</td></tr><tr><td>most / mostly</td><td>Superlative vs adverb</td><td>the most people, mostly students</td></tr><tr><td>almost / nearly</td><td>Close to</td><td>almost as high as, nearly equal</td></tr><tr><td>same as / similar to</td><td>Identical vs close</td><td>the same as, similar to</td></tr><tr><td>different from / different than</td><td>Standard vs American informal</td><td>different from</td></tr><tr><td>prefer to / would rather than</td><td>Preference patterns</td><td>prefer tea to coffee, would rather walk than drive</td></tr></tbody></table></div>"}, {"id": "dodont", "t": "Do, don’t and why", "c": "<div class=\"two\"><div><h3>Do</h3><ul><li>Use -er/-est for short adjectives and more/most for long ones.</li><li>Add than after a comparative.</li><li>Use the before a superlative.</li><li>Use data words: twice as high as, slightly lower than.</li><li>Compare like with like: the population of A and that of B.</li><li>Use fewer for countable nouns and less for uncountable ones.</li></ul></div><div><h3>Don’t</h3><ul><li>Don’t write more + -er or most + -est.</li><li>Don’t use that instead of than.</li><li>Don’t say less with countable nouns.</li><li>Don’t use superlatives for two things.</li><li>Don’t use very before a comparative: say much.</li><li>Don’t forget ever with a superlative: the best I have ever seen.</li></ul></div></div><h3>Why we get it wrong</h3><h3>Double marking</h3><p>Learners feel that more adds emphasis, so they add it to -er forms.</p><div class=\"tip\"><p>Try this: Choose one way: -er or more, never both.</p></div><h3>Than and that</h3><p>They sound close and look alike.</p><div class=\"tip\"><p>Try this: Than = comparison, that = connector.</p></div><h3>Counting syllables</h3><p>Learners cannot remember which adjectives are short.</p><div class=\"tip\"><p>Try this: When unsure, test: does -er sound natural?</p></div><h3>Illogical comparison</h3><p>Learners compare a number with a place instead of a number with a number.</p><div class=\"tip\"><p>Try this: Add that of / those of.</p></div><h3>Forgetting the</h3><p>Many languages do not use an article with superlatives.</p><div class=\"tip\"><p>Try this: Every superlative needs the, unless there is a possessive.</p></div><h3>Small habits that help</h3><ul><li>Describe two pictures or places using five comparatives.</li><li>Practise on any Task 1 chart: write the highest, the lowest and a ratio.</li><li>Collect modifiers: slightly, considerably, far.</li><li>Write one sentence a day beginning with “The more…, the more…”.</li></ul>"}, {"id": "real", "t": "In IELTS and real life", "c": "<ul><li><b>Speaking:</b> “My city is bigger and noisier than…”, “It’s the best place I’ve been to.”</li><li><b>Writing Task 1:</b> comparison appears in almost every paragraph: the highest, higher than, twice as, slightly lower, ranked first.</li><li><b>Writing Task 2:</b> weighing options needs more effective than, less expensive than, the most important.</li><li><b>Reading:</b> superlatives often hide the answer to a question: the most, the least, the largest.</li><li><b>Listening:</b> comparing options (cheaper, faster, closer) is common in Section 1.</li></ul><h3>Reading: spot the superlative</h3><div class=\"tw\"><table><thead><tr><th>Text says</th><th>Question asks</th><th>Answer</th></tr></thead><tbody><tr><td>Dhaka is the largest city.</td><td>Which is the biggest?</td><td>Dhaka</td></tr><tr><td>Prices rose faster than wages.</td><td>What rose faster?</td><td>Prices</td></tr><tr><td>The latter is the cheapest.</td><td>Which option is cheapest?</td><td>The second one mentioned</td></tr></tbody></table></div><h3>Real-world use</h3><ul><li><b>Shopping:</b> “This one is cheaper but the other is better quality.”</li><li><b>Travel:</b> “The train is faster than the bus but not as cheap.”</li><li><b>Work:</b> “The new system is much easier to use.”</li><li><b>Study:</b> “The second exam was harder than the first.”</li></ul><div class=\"tip\"><p><b>Real world:</b> shopping and travel all depend on comparing: cheaper, closer, faster, better.</p></div>"}, {"id": "practice", "t": "Practice", "c": "<h3>Spot the mistake</h3><ol><li>She is more taller than me.<details><summary>Show answer</summary><ins>She is taller than me.</ins></details></li><li>This is the most easiest question.<details><summary>Show answer</summary><ins>This is the easiest question.</ins></details></li><li>He is bigger that me.<details><summary>Show answer</summary><ins>He is bigger than me.</ins></details></li><li>There were less students.<details><summary>Show answer</summary><ins>There were fewer students.</ins></details></li><li>She is best student in the class.<details><summary>Show answer</summary><ins>She is the best student in the class.</ins></details></li><li>It is very bigger than mine.<details><summary>Show answer</summary><ins>It is much bigger than mine.</ins></details></li><li>The population of Dhaka is larger than Sylhet.<details><summary>Show answer</summary><ins>The population of Dhaka is larger than that of Sylhet.</ins></details></li><li>He is as tall than his brother.<details><summary>Show answer</summary><ins>He is as tall as his brother.</ins></details></li><li>It is the best film I saw.<details><summary>Show answer</summary><ins>It is the best film I have ever seen.</ins></details></li><li>She is the most smartest.<details><summary>Show answer</summary><ins>She is the smartest.</ins></details></li></ol><h3>Write the comparative and superlative</h3><ol><li>big<details><summary>Show answer</summary><ins>bigger, the biggest</ins></details></li><li>easy<details><summary>Show answer</summary><ins>easier, the easiest</ins></details></li><li>beautiful<details><summary>Show answer</summary><ins>more beautiful, the most beautiful</ins></details></li><li>good<details><summary>Show answer</summary><ins>better, the best</ins></details></li><li>bad<details><summary>Show answer</summary><ins>worse, the worst</ins></details></li><li>far<details><summary>Show answer</summary><ins>farther / further, the farthest / furthest</ins></details></li><li>clever<details><summary>Show answer</summary><ins>cleverer / more clever, the cleverest / the most clever</ins></details></li><li>little<details><summary>Show answer</summary><ins>less, the least</ins></details></li></ol><h3>Say it another way</h3><ol><li>Rewrite: “A is 100. B is 50.”<details><summary>Show answer</summary><ins>A is twice as high as B. / B is half as high as A.</ins></details></li><li>Make a superlative: “Dhaka is big. No city here is bigger.”<details><summary>Show answer</summary><ins>Dhaka is the biggest city here.</ins></details></li><li>Use as … as: “This bag costs $20. That bag costs $20.”<details><summary>Show answer</summary><ins>This bag is as expensive as that bag.</ins></details></li><li>Use not as … as: “Trains are slower than planes.”<details><summary>Show answer</summary><ins>Trains are not as fast as planes.</ins></details></li><li>Use the … the …: “You study more. You learn more.”<details><summary>Show answer</summary><ins>The more you study, the more you learn.</ins></details></li><li>Fix: “There were less cars sold in 2020 than in 2019.”<details><summary>Show answer</summary><ins>There were fewer cars sold in 2020 than in 2019.</ins></details></li></ol><h3>Fill the gaps</h3><p>Tokyo is (1) ___ than Paris. It is (2) ___ city in Japan. This book is (3) ___ interesting than that one. He is (4) ___ best player. There were (5) ___ cars than last year. This is (6) ___ the best film I have ever seen. She runs (7) ___ than me. The (8) ___ you practise, the better you become. His figure was (9) ___ as high as hers. (10) ___ information is available online.</p><details><summary>Show answers</summary>1 bigger · 2 the biggest / the largest · 3 more · 4 the · 5 fewer / more · 6 by far / easily · 7 faster · 8 more · 9 twice / half / just · 10 Further</details><h3>Speak and write</h3><ul><li>Compare two cities you know in five sentences.</li><li>Describe three charts or numbers using the highest, twice as, and slightly lower than.</li><li>Compare two schools, two jobs or two phones using as … as, fewer, less and much.</li><li>Write a paragraph about the best and worst things in your town.</li><li>Write five “the more … the more …” sentences about life.</li></ul>"}, {"id": "quiz", "t": "Quiz", "quiz": 1}, {"id": "stick", "t": "Making it stick", "prog": 1}];
