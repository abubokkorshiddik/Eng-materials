SC.push({id:"last-bus",type:"Story",e:"🚌",title:"The Last Bus Home",blurb:"A quiet story about a late night, a missed chance and a kind stranger.",text:`It was almost ten o'clock on a cold winter night when I finally left the office. My shoulders were tired, my head was full of numbers, and all I wanted was a warm bed.

I walked quickly to the bus stop at the corner of the street. The road was empty. A thin fog covered the lights, and the only sound was the wind moving a plastic bag along the pavement.

I looked at my watch. The last bus to my neighbourhood left at ten fifteen. If I missed it, I would have to walk for two hours or pay for an expensive taxi. I sat down on the cold metal bench and waited.

After five minutes, an old man came and sat beside me. He wore a brown coat and a woollen hat, and he carried a small paper bag. He smiled at me and said, good evening. I nodded politely, but I did not feel like talking.

Ten fifteen came and went. No bus. Ten twenty. Still nothing. I began to feel worried. I stood up, looked down the road, and checked my phone. There was no signal at all.

The old man laughed softly. He said, don't worry, young man. The last bus is always late on Fridays. The driver stops for a cup of tea at the corner shop. I have been taking this bus for thirty years, and it has never left me behind.

I was surprised. I asked him why he was out so late. He opened his paper bag and showed me two warm samosas. He said his granddaughter had a fever, and he had gone to buy her favourite snack. She was sleeping when he left, but he wanted something sweet and hot waiting for her in the morning.

Without thinking, I said that she was lucky to have a grandfather like him. He shrugged and said that luck had nothing to do with it. Family is the only thing that really stays, he told me. Offices change, jobs change, even cities change. But somebody who waits for you at night is the best thing in the world.

I felt something warm in my chest, and for a moment I forgot about my tired shoulders. I thought about my own mother, who always left the kitchen light on until I came home. I realised that I had not called her for two weeks.

At last, we saw the yellow headlights coming through the fog. The bus stopped with a long, noisy sound. The driver looked at us and said, sorry, friends, the tea was very hot.

We climbed in and sat near the window. The old man offered me a samosa. I refused at first, but he insisted, and it was delicious.

When my stop came, I stood up and thanked him. He raised his hand and said, call your mother tonight. I smiled and stepped out into the cold air.

Walking the last few steps to my building, I took out my phone. I had a signal now. I dialled my mother's number. When she answered in her soft, sleepy voice, I said, I am home, Mum. I just wanted to hear you.

That night, I understood something simple. A missed bus can be a gift if it teaches us where we really belong.`});
SC.push({id:"boy-river",type:"Story",e:"🌊",title:"The Boy and the River",blurb:"A village tale about patience, courage and listening to nature.",text:`Long ago, in a small village beside a wide, green river, there lived a boy named Rafi. He was eleven years old, thin and quick, and he loved the river more than anything else.

Every morning, before school, Rafi ran to the bank and watched the water. He knew when it was happy and when it was angry. He could tell from the colour of the current whether the fishermen would catch much that day.

The villagers often laughed at him. They said, Rafi, why do you waste your time staring at water? Come and help in the fields! But Rafi only smiled. He believed the river was talking, and he wanted to understand its language.

One summer, the monsoon came early. The sky turned dark grey, and the rain fell for three days without stopping. On the fourth morning, Rafi stood at the bank and felt a strange chill. The water was brown and fast, and it carried broken branches. The river was not talking anymore. It was shouting.

He ran to the village chief and said, please, sir, we must leave the low houses. The river will rise tonight. The chief shook his head. He said, we have lived here for a hundred years. The river has never reached our doors. Go home and do not frighten the people.

Rafi did not give up. He knocked on every door. Some people listened, but most were too busy or too proud. By evening, only twelve families agreed to move to the school building on the hill.

That night, the rain became a storm. The wind pushed against the walls, and the river roared like a hungry animal. Rafi sat awake in the school, holding his little sister's hand. At midnight, a loud crash came from below. The river had broken the bank.

Water poured into the village. The people who stayed behind woke up in terror. They climbed onto their roofs and screamed for help. Rafi heard them, and without waiting, he ran down the hill with a rope and a lantern.

He tied the rope to a strong tree and moved slowly from roof to roof, calling names, guiding the frightened families toward safety. His arms hurt, and the cold water reached his chest, but he did not stop. Other brave men from the hill joined him, and together they saved every single person.

By dawn, the storm was over. The village was covered with mud, and many houses had fallen. But nobody was lost. The chief walked to Rafi with tears in his eyes. He said, my boy, I laughed at you for years. Today you were wiser than all of us.

From that day, the villagers listened carefully whenever Rafi spoke. And Rafi kept visiting the river each morning, not only to watch it, but to thank it for teaching him that those who listen to nature will never be taken by surprise.`});
SC.push({id:"lost-wallet",type:"Story",e:"👛",title:"The Lost Wallet",blurb:"A moral story about honesty when nobody is watching.",text:`Nila was walking home from school one afternoon when she saw something shining near the edge of the road. She bent down and picked it up. It was a leather wallet, thick and heavy.

She looked around. The street was almost empty. Only a tea seller was pouring hot tea for a customer in the distance. Nobody was watching her.

Her heart began to beat faster. She opened the wallet carefully. Inside, there were a lot of notes, maybe ten thousand taka, and a small photograph of a smiling little girl. There was also an identity card with a name and an address.

Nila stood very still. She thought about her family. Her father was a rickshaw driver, and her mother sewed clothes at home. Money was always a problem. Last month, her little brother needed medicine, and they could not buy it for three days. This much money could solve so many problems.

A small voice in her head said, take it. Nobody will ever know. It is not stealing if you found it. You deserve some luck.

But another voice, stronger and quieter, said, would you like it if someone took your father's money?

She remembered what her grandmother used to say. Honesty is like a light, my dear. When you carry it, you may feel it is heavy, but it always shows you the right road.

Nila looked at the photograph again. The little girl had bright eyes, and she was holding a balloon. Perhaps the wallet belonged to her father. Perhaps he was searching everywhere right now, with fear in his heart.

She made up her mind. She closed the wallet, held it tightly against her chest, and read the address on the card. It was on the next street, not far from her house.

Ten minutes later, she knocked on a green door. A tired man in a white shirt opened it. His eyes were red, and his hands were shaking. Nila said, excuse me, sir. Is this your wallet? I found it near the tea stall.

The man stared at her for a moment as if he could not believe his eyes. Then he took the wallet and almost fell to his knees. He said, thank you, thank you, my child. I was carrying my daughter's school fees, and it was all the money I had. I was going to lose my job if I could not pay today.

A little girl ran to the door and hugged her father's leg. She was the girl from the photograph. She looked at Nila and smiled shyly.

The man opened the wallet and tried to give Nila some money as a reward. She shook her head politely and said, no, sir. I only did what is right. I am glad your daughter will go to school.

The man was silent for a while. Then he said softly, you have a rare treasure, young lady. Please never lose it.

That evening, Nila walked home with empty hands but a very full heart. She understood that money can buy many things, but peace of mind is a gift only honesty can give.`});
SC.push({id:"clockmaker",type:"Story",e:"⏰",title:"The Old Clockmaker",blurb:"A gentle story about time, work and what we leave behind.",text:`At the end of a narrow lane in the old part of the city, there was a tiny shop with a wooden door and a window full of clocks. Above the door, in faded gold letters, were the words, Mr Hashim, Clockmaker.

Mr Hashim was seventy years old. He had thick white eyebrows, round glasses and hands that moved as carefully as a surgeon's. Every morning he opened the shop at eight, made a cup of tea, and began to listen. He said that every clock had its own voice, and a good clockmaker must hear it.

People brought him everything. Wall clocks from grandmothers, broken watches from fathers, and once a little alarm clock shaped like a rabbit. He never hurried. He opened each one slowly, cleaned the tiny wheels, and replaced the tired parts. When the clock started ticking again, he smiled like a doctor who had saved a patient.

One rainy afternoon, a young girl named Sara came into the shop. She was about twelve and held a small silver watch in her fingers. She said, please, sir, this was my mother's. It stopped many years ago. Can you fix it?

Mr Hashim looked at the watch and then at her face. He said, it is very old. The inside may be broken. But I will try.

Sara came back every afternoon after school. She sat on a stool in the corner and watched him work. She asked many questions. Why are the wheels so small? Why does the watch need winding? Mr Hashim answered every one patiently. He told her that a clock was a promise. It promises to tell the truth, even when we do not want to hear it.

After three weeks, the old watch finally made a soft, steady sound. Tick, tick, tick. Sara jumped from the stool with joy. Her eyes were full of tears. She asked how much she should pay. Mr Hashim shook his head and said, there is no price. A watch that is ticking again for a daughter is payment enough.

But then he asked her a question. He said, would you like to learn how to repair clocks yourself? I am getting old, and my hands are not as strong as before. Someone must continue this work.

Sara nodded at once. From that day, she became his student. Years passed. She learned to open the smallest watches, to hear the faintest sounds, and to wait with patience. When Mr Hashim's eyes grew weak, it was Sara who sat at the workbench.

Many years later, he passed away peacefully on a quiet morning. People from the whole neighbourhood came to say goodbye. The shop did not close. The wooden door opened every day at eight, and a woman with kind eyes sat inside, listening carefully to the voices of clocks.

On the window, new golden letters were painted. They said, Sara and Hashim, Clockmakers. Because she knew that time is not only something we measure, but something we pass from one hand to another.`});
SC.push({id:"rainy-dhaka",type:"Story",e:"🌧️",title:"A Rainy Day in Dhaka",blurb:"A descriptive tale of a city, a sudden storm and small moments of joy.",text:`The morning began with a hot, heavy silence. In Dhaka, when the air feels like a wet towel and the birds stop singing, everyone knows that rain is coming.

I was standing on a crowded footpath in Farmgate, holding a half empty cup of tea. Rickshaws were moving slowly, buses were blowing their horns, and a street vendor was shouting about fresh guavas. Then, without any warning, the first drop fell on my nose.

In a few seconds, the sky opened. The rain came down in thick, silver lines, and the whole city seemed to take a deep breath. People ran in every direction. Some covered their heads with newspapers, some jumped under shop awnings, and some simply laughed and let the water fall.

I ran too, and I found shelter under the roof of a small tea stall. Six or seven strangers were already standing there, pressed together like books on a shelf. The tea seller, a man with a round face and a bright green shirt, said, welcome, brothers and sisters. The best tea in Dhaka is made when it rains.

He was right. The smell of ginger and cardamom mixed with the smell of wet earth, and every cup that he poured felt like a warm hug. A schoolboy next to me shared his biscuits with a tired office worker. An old woman told us about the great storm of nineteen seventy, when she was a little girl. Nobody was in a hurry anymore, because nobody could go anywhere.

Outside, the road slowly became a shallow river. The rickshaw pullers rolled up their trousers and pulled their vehicles through the water. Their passengers sat under colourful plastic sheets, looking like small tents on wheels. A group of children ran through the puddles with bare feet, kicking the water high into the air and screaming with happiness.

I watched a young couple share one umbrella that was far too small. They were laughing so hard that they did not notice they were both soaking wet. Close to them, a street dog sat patiently under a parked truck, waiting for the storm to end.

After half an hour, the rain became softer. The wind carried the sound of a distant radio playing an old Bengali song. For the first time that month, the air was cool, and the dust had disappeared. The trees along the road looked brighter and greener, as if somebody had washed every leaf by hand.

I thought about how strange our lives are. We spend our days in a rush, worrying about meetings and traffic, and we rarely stop to feel the world around us. It took a sudden storm and a small tea stall to remind me that happiness can be very simple. A hot cup, a kind smile and a shared roof are often enough.

When the rain finally stopped, the sun appeared between two grey clouds, and a faint rainbow stretched over the buildings. The strangers around me smiled, said goodbye, and slowly returned to their busy lives.

I paid for my tea, thanked the man in the green shirt, and walked out into the shining streets. My shoes were wet, my shirt was damp, but I felt lighter than I had in months. Dhaka had given me a lesson for free, and I carried it home like a small, precious gift.`});
SC.push({id:"mountain",type:"Story",e:"🏔️",title:"The Mountain Climb",blurb:"An adventure about fear, teamwork and reaching a goal step by step.",text:`When our teacher announced the school trip to the hills, most of the class cheered. I did not. I was afraid of heights, and the thought of climbing a real mountain made my stomach turn.

But my best friend Imran looked at me and said, come on, Arif. We will do it together. I took a deep breath and signed my name on the list.

We left early on a Saturday morning. The bus climbed through green valleys and small villages, and by noon we reached the foot of the mountain. It stood in front of us like a giant sleeping animal, with clouds around its shoulders. Our guide, a tall man called Mr Karim, gathered us in a circle. He said, this mountain is not difficult, but it needs respect. Walk slowly, drink water, and never leave the group.

The first hour was easy. We walked along a narrow path between pine trees, listening to birds and the sound of a small stream. I felt proud and almost forgot my fear.

Then the path became steeper. The stones were loose, and my backpack suddenly felt like it was full of bricks. My legs were shaking, and my breath was short. Some of my classmates were already far ahead. I wanted to stop, to sit down, and to go back to the bus.

Imran noticed my face. He did not say anything clever. He only said, one step, Arif. Just look at your next step. I nodded and tried. One step, then another. Slowly, my fear grew quieter.

After three hours, we reached a flat rock where we ate our lunch. The view was breathtaking. The valley lay far below, with rivers shining like silver threads, and the houses looked like tiny toys. I had never seen the world from so high, and for a moment I felt almost happy.

But the real test was still ahead. To reach the top, we had to cross a narrow ridge with a deep drop on both sides. The wind was strong, and the guide told us to move one by one. My heart began to pound, and my hands became cold.

When my turn came, I stood at the edge and could not move. Everything inside me said, go back. Then I heard Imran's voice behind me. He said, I am here. I will walk behind you. You are not alone.

I closed my eyes for a second, took a breath, and stepped forward. Slowly, carefully, I crossed the ridge, listening to the wind and to my friend's steady footsteps. When I opened my eyes, I was on the other side.

Ten minutes later, we stood on the summit. The whole class clapped and shouted. The clouds were beneath our feet, and the sun was pouring golden light across the sky. I felt tears of joy in my eyes.

On the way down, Mr Karim told me, courage does not mean having no fear. It means walking even when you are afraid. I never forgot his words. That day, I learned that a mountain is not climbed with strong legs alone, but with a friend who believes in you.`});
SC.push({id:"alchemist",type:"Book summary",e:"📗",title:"The Alchemist: A Summary",blurb:"A retelling of Paulo Coelho's famous novel about following your dream.",text:`Today I would like to tell you about a book that has inspired millions of readers around the world. It is called The Alchemist, and it was written by the Brazilian author Paulo Coelho. It is a simple story, but it carries a powerful message about dreams and destiny.

The hero of the book is a young shepherd named Santiago, who lives in Spain. Every day he walks with his sheep across the fields, enjoying the sun and the quiet. But one night, he has a strange dream. In the dream, a child tells him that there is a hidden treasure near the Egyptian pyramids.

At first, Santiago ignores the dream. But when he sees the same vision again, he decides to meet an old woman who explains dreams. She tells him that the dream is a sign, and that he should go to Egypt. Soon after, he meets a mysterious old king named Melchizedek, who gives him an important idea. He says that when you want something with all your heart, the whole universe helps you to get it.

Encouraged, Santiago sells his sheep and travels to Africa. But the journey is not easy. In the first city, a thief steals all his money, and Santiago is left alone and poor. He could have given up, but he decides to work in a crystal shop to earn enough for the next step. During this time, he learns patience and hard work, and the shop owner learns to take new risks.

After a year, Santiago joins a caravan crossing the great Sahara desert. On the journey, he meets an Englishman who is studying alchemy, the old art of turning metal into gold. The two men become friends, and they travel to an oasis where they meet a wise alchemist.

At the oasis, Santiago also falls in love with a girl named Fatima. She tells him to follow his dream, and promises that she will wait for him. It is a difficult choice, but he understands that true love does not stop a person from pursuing his destiny.

The alchemist teaches Santiago to listen to his heart and to read the signs of the world. In the desert, they face danger from tribal wars, and Santiago has to show that he can speak with the wind and the sun. He proves that he understands the language of the universe.

At last, Santiago reaches the pyramids and begins to dig. But he finds nothing. Soldiers beat him and laugh at him. Then one of them says that he once had a dream about treasure hidden under a tree in a small church in Spain. It is the same place where Santiago began his journey.

Santiago returns home and digs under the old tree. There he finally finds the treasure. He realises that the real treasure was not the gold, but the journey, the people, and the wisdom he gained.

This book teaches us that our dreams are worth following, that fear is the biggest enemy, and that every obstacle is a chance to learn. If you have never read it, I recommend that you try. It may be small in size, but it leaves a very large mark on the heart.`});
SC.push({id:"animal-farm",type:"Book summary",e:"🐷",title:"Animal Farm: A Summary",blurb:"A retelling of George Orwell's story about power and promises.",text:`Good evening, everyone. Tonight I would like to share a short summary of a famous novel called Animal Farm, written by George Orwell and published in nineteen forty five. On the surface, it is a story about farm animals. But underneath, it is a sharp comment on power, politics and human weakness.

The story begins at Manor Farm, where the animals are tired of working for a careless farmer named Mr Jones. One night, an old pig called Major gathers everyone in the barn. He tells them that animals live in misery because humans take everything from them. He dreams of a farm where all animals are free and equal, and he teaches them a song called Beasts of England.

Major dies a few days later, but his dream lives on. Two clever young pigs, Snowball and Napoleon, lead a rebellion. The animals drive Mr Jones away and rename the place Animal Farm. They write seven rules on the barn wall. The most important one says that all animals are equal.

At first, life is wonderful. The animals work hard and feel proud, because the farm belongs to them. Harvests are good, and everyone has enough food. Snowball starts a school, and he plans to build a windmill to produce electricity.

But soon, the two leaders begin to quarrel. Napoleon is a silent, ambitious pig who wants all the power for himself. One day, he secretly trains a group of fierce dogs, and when Snowball makes a speech about the windmill, Napoleon lets the dogs chase him out of the farm. From that moment, Napoleon becomes the only ruler.

The pigs begin to change the rules, little by little. They move into the farmhouse and sleep in beds. When the other animals complain, a pig named Squealer explains that the rules have never been broken, they were only improved. Slowly, the seven rules disappear, and a new sentence appears on the wall. It says that all animals are equal, but some animals are more equal than others.

Meanwhile, the ordinary animals work harder and harder with less and less food. A loyal horse called Boxer works until he collapses, and Napoleon sells him to a butcher, while telling everyone that he died peacefully in hospital. It is one of the saddest moments in the book.

In the final chapter, the pigs walk on two legs, carry whips, and wear clothes. They invite human farmers to dinner. When the other animals look through the window, they can no longer tell who is a pig and who is a man.

Animal Farm teaches us that power can slowly corrupt those who hold it, and that people who do not question their leaders may lose their freedom without noticing. It also reminds us how easily language can be used to hide the truth.

Although it was written long ago, it is still very relevant today. That is why I believe it is one of the most important short novels ever written, and why I recommend it to every reader.`});
SC.push({id:"tom-sawyer",type:"Book summary",e:"🎣",title:"Tom Sawyer: A Summary",blurb:"A cheerful retelling of Mark Twain's classic adventure on the river.",text:`Today I would like to introduce a book that has made readers smile for more than a hundred and forty years. It is called The Adventures of Tom Sawyer, and it was written by the American author Mark Twain. It is a funny, exciting story about a clever boy growing up beside the Mississippi River.

The hero, Tom Sawyer, lives in a small town called St Petersburg with his strict but loving Aunt Polly. Tom is full of energy. He hates school, he loves adventures, and he is always finding new ways to avoid work.

One of the most famous scenes happens early in the book. As a punishment, Aunt Polly orders Tom to paint a long fence on a sunny Saturday. Tom is miserable until he gets a brilliant idea. When his friends walk past, he pretends that painting is a wonderful pleasure. Soon the other boys are begging him for a turn, and they even give him gifts in return. By the end of the day, the fence is painted, and Tom is richer than before. It is a perfect example of his cleverness.

Tom has a best friend named Huckleberry Finn, a poor boy who lives freely without a home or school. One night, the two friends go to the graveyard to try an old magic cure for warts. There they secretly witness a terrible crime. A man called Injun Joe kills the town doctor, and an innocent drunk man named Muff Potter is blamed.

Tom and Huck are terrified. They promise each other to keep quiet, because Injun Joe is dangerous. Even so, Tom's conscience troubles him, and it grows stronger when Muff Potter is put on trial.

In the meantime, Tom has other adventures. He falls in love with a girl named Becky Thatcher. Together with Huck and another friend, he runs away to a small island on the river and pretends to be a pirate. The boys enjoy their freedom so much that the whole town believes they have drowned. They return in time to attend their own funeral, which is one of the funniest moments in the book.

Finally, at the trial, Tom decides to do the right thing. He bravely tells the truth in court, and Muff Potter is saved. Injun Joe escapes through a window, and Tom is afraid of his revenge.

Later, during a school picnic, Tom and Becky explore a huge cave and get lost in the darkness. Days pass, and they become weak and hungry. By chance, Tom sees a faint light, and, to his surprise, he also sees Injun Joe hiding in the same cave. Eventually, Tom finds an exit, and the town celebrates their return.

The story ends happily. Injun Joe is found dead in the cave, and Tom and Huck discover a box of hidden gold. They become wealthy, and Huck is adopted by a kind widow.

What I love about this book is that it captures the spirit of childhood. It reminds us of a time when every day felt like an adventure and every friendship felt like a treasure. It also teaches us that courage means telling the truth, even when we are afraid.`});
SC.push({id:"metamorphosis",type:"Book summary",e:"🪲",title:"The Metamorphosis: A Summary",blurb:"A calm retelling of Franz Kafka's strange story about family and change.",text:`In this talk, I would like to summarise one of the strangest and most famous stories in world literature. It is called The Metamorphosis, and it was written by the Czech author Franz Kafka in nineteen fifteen. The word metamorphosis means a complete change, and this story begins with one of the most surprising sentences ever written.

One morning, a young salesman named Gregor Samsa wakes up in his bed and discovers that he has turned into a huge insect. He has many thin legs, a hard brown back, and a round belly. At first, he cannot believe it. He thinks that he must be dreaming, but he is awake, and the change is real.

The first thing that worries Gregor is not his body, but his job. He is late for work, and he is afraid that his boss will be angry. Gregor is the only person who earns money for his family. His father lost his business years ago, his mother has weak lungs, and his young sister Grete is still a student. Gregor has been working for years in a job that he hates, to pay his parents' debts.

When the manager of the company arrives at the house, Gregor tries to speak, but his voice sounds strange. He slowly opens the door, and everyone is shocked. His mother faints, the manager runs away, and his father pushes Gregor back into the room with a stick.

From that day, Gregor lives in his bedroom, locked away from the family. At first, his sister Grete takes care of him. She brings him food and cleans the room. She is kind and patient. Gregor begins to enjoy crawling on the walls and ceiling, but he also feels lonely.

As time passes, the family's situation becomes more difficult. Because Gregor cannot work, his father returns to a job at a bank, his mother sews clothes, and Grete works as a shop assistant. They even rent a room to three strict men. Slowly, their kindness turns into tiredness, and later into anger.

One evening, Gregor hears Grete playing the violin for the guests and comes out of his room, attracted by the music. The guests are disgusted and threaten to leave. Grete cries and says that the family must get rid of the creature. She says that it is not Gregor anymore, because the real Gregor would have left on his own.

Gregor goes back to his room, weak and sad. He thinks of his family with love and understands that he is only a burden. During that night, he quietly dies. The next morning, the family feels relieved, and they take a day off to enjoy a walk in the sunshine. Their future suddenly looks bright.

This story is very short, but it leaves many questions. It makes us think about how people treat those who can no longer help them, and about the pressure of work and duty. It also shows how fragile love can be when it depends on usefulness. That is why the book is still widely read today.`});
SC.push({id:"learn-english",type:"Presentation",e:"🗣️",title:"How to Learn English Effectively",blurb:"A clear presentation with practical steps for daily improvement.",text:`Good morning, everyone, and thank you for coming. Today I would like to talk about something that many of us care about, which is how to learn English effectively. I will share five simple steps that have worked for me and for many students I know.

Let me begin with a question. How many of you have studied English for years, but still feel nervous when you have to speak? Please raise your hand. Many of you. Don't worry, you are not alone. The problem is not your intelligence. The problem is usually the method.

My first step is to make English part of your daily life. Many learners study for three hours on Sunday and then forget the language for the whole week. But the brain learns better with short, regular practice. Twenty minutes every day is much stronger than three hours once a week. Choose a fixed time, perhaps after breakfast or before bed, and protect it like a meeting.

The second step is to listen a lot. Children learn their first language by listening for years before they can speak. You can do the same. Watch short videos, listen to podcasts, and follow news in simple English. At the start, you may understand only a few words. That is normal. Keep listening, and your ear will slowly adjust to the rhythm of the language.

The third step is to speak aloud, even when you are alone. This is the secret that most students ignore. Reading silently is useful, but it does not train your mouth. Try describing your day to your mirror. Read a paragraph aloud, record your voice, and listen to it. You will notice mistakes that you cannot hear while you are speaking. Shadowing is another excellent method. You play a short audio clip and try to repeat it at the same speed and with the same melody.

The fourth step is to learn words in context. Instead of memorising long lists, learn each new word inside a sentence. For example, instead of writing only the word reliable, write, my brother is a reliable friend. Context helps your memory, and it also shows you how the word is really used. Review your new words on the next day, then after three days, then after a week. This simple schedule moves the words into long term memory.

The fifth and final step is to accept mistakes. Many people stay silent because they fear sounding foolish. But every mistake is information. When a teacher corrects you, you are getting a free lesson. Native speakers also make mistakes every day. What matters is that you keep talking, and that you stay curious.

Let me summarise. Practise a little every day. Listen as much as possible. Speak aloud, even when nobody is listening. Learn words in context. And welcome your mistakes like friends.

If you follow these five steps for just three months, I believe you will notice a big difference. You will understand more, speak more fluently, and feel much more confident.

Thank you very much for your attention. Now I would be happy to answer any questions.`});
SC.push({id:"sleep",type:"Presentation",e:"😴",title:"Why Sleep Matters",blurb:"A health talk explaining what sleep does and how to improve it.",text:`Good afternoon, ladies and gentlemen. Today I want to talk about something we all do every night, but rarely think about. I want to talk about sleep. By the end of this presentation, I hope you will see it not as wasted time, but as one of the most powerful tools for a healthy life.

Let us start with a simple fact. We spend about one third of our lives asleep. If a person lives for seventy years, that is more than twenty years in bed. Why would nature give us so much time for something that looks like doing nothing? The answer is that during sleep, your body and brain are actually working very hard.

First, sleep repairs your body. While you rest, your muscles recover, your immune system becomes stronger, and your heart gets a chance to slow down. Doctors have found that people who sleep badly for a long time are more likely to suffer from heart disease, high blood pressure and weight problems.

Second, sleep supports your memory. During the night, your brain sorts the information that you learned during the day. It keeps the important parts and removes the rest. This is why students who sleep well after studying usually remember more in the exam than those who stay awake until morning.

Third, sleep protects your mood. After a bad night, most of us feel irritated and sad. Scientists have shown that lack of sleep makes the emotional part of the brain more sensitive, and reduces our ability to control anger. A tired mind sees problems that are bigger than they really are.

So how much sleep do we need? Most adults need between seven and nine hours each night. Teenagers need even more, about nine hours, because their bodies are still growing. Unfortunately, many young people today sleep only five or six hours, mainly because of late night phone use.

This brings me to my practical advice. Here are four simple habits that can improve your sleep.

One, keep a regular schedule. Go to bed and wake up at nearly the same time every day, even on weekends. Your body loves routine.

Two, avoid screens for at least thirty minutes before bed. The bright blue light from phones tells your brain that it is still daytime, and it delays the production of the sleep hormone.

Three, be careful with caffeine. A cup of strong tea or coffee in the evening can stay in your body for up to eight hours.

Four, make your bedroom calm. Keep it dark, quiet and cool. A comfortable pillow and a clean bed also make a big difference.

In conclusion, sleep is not a luxury. It is a basic need, as important as food and water. If you protect your sleep, you protect your health, your mind and your happiness.

Thank you for listening, and I wish you all a very good night tonight.`});
SC.push({id:"electric-cars",type:"Presentation",e:"🔋",title:"The Future of Electric Vehicles",blurb:"A technology talk about how electric cars work and why they matter.",text:`Good morning, everyone. Thank you for being here. Today I am going to talk about a technology that is changing our roads and our cities. It is the electric vehicle. I will explain how it works, why it is becoming popular, and what challenges we still need to solve.

Let me start with a short comparison. A traditional car burns petrol or diesel in an engine, and this creates movement, noise, heat and smoke. An electric car works in a very different way. It stores energy in a large battery, and an electric motor uses this energy to turn the wheels. There is no tailpipe, so no smoke comes out.

Why are electric vehicles becoming so popular? I see three main reasons.

The first reason is the environment. Transport is responsible for a large part of the carbon dioxide that is warming our planet. Cities with heavy traffic also suffer from dirty air, which causes breathing problems, especially for children and older people. When we replace petrol cars with electric ones, the air near our homes and schools becomes cleaner.

The second reason is cost. It is true that an electric car is often more expensive to buy. However, the cost of using it is much lower. Electricity is cheaper than fuel, and the motor has fewer moving parts, so it needs less repair. Over ten years, many owners save a lot of money.

The third reason is performance. Electric motors give power immediately, so these cars accelerate very smoothly and quietly. Many drivers say that once they try an electric car, they never want to go back.

But we should also be honest about the problems. The first problem is charging. In many countries, there are not enough public charging stations. Charging can also take longer than filling a tank, from thirty minutes to several hours. The second problem is the battery. Making batteries needs minerals such as lithium and cobalt, and mining these materials can harm nature and local communities. The third problem is the source of electricity. If the power comes from coal, then the environmental benefit is smaller.

So what is the solution? Governments, companies and ordinary citizens must work together. Governments can build more charging stations and support clean energy. Companies can develop longer lasting batteries and recycle old ones. And we, as users, can think carefully about how we travel.

Let me give you a hopeful example. In Norway, more than eighty percent of new cars sold today are electric. Their cities are quieter, their air is cleaner, and their people have shown that the change is possible.

Looking at the future, I believe that we will see smaller, cheaper and smarter electric vehicles. Cars may even share information with each other and drive themselves, which could reduce accidents. Electric buses and rickshaws could also change daily life in countries like ours.

To conclude, electric vehicles are not a perfect answer, but they are a very important step. If we invest wisely, they can help us build cities that are healthier, quieter and more sustainable.

Thank you for your attention. I would be glad to take your questions.`});
SC.push({id:"save-money",type:"Presentation",e:"💰",title:"Smart Ways to Save Money",blurb:"A practical talk on budgeting and building good money habits.",text:`Hello everyone, and welcome. Today I would like to talk about a subject that affects every family, every student and every worker. It is money. More exactly, I want to talk about simple and smart ways to save it.

Let me begin with a story. A friend of mine earns a good salary, but at the end of each month he has nothing left. He asks me, where does my money go? The truth is that most of us do not know. Small expenses disappear quietly, like water from a leaking bucket. So the first rule of saving is to understand your spending.

Step one is to track your expenses. For one month, write down everything you spend, even a cup of tea or a short rickshaw ride. You can use a notebook or a free phone app. At the end of the month, divide your spending into three groups: needs, wants and savings. Needs are things like rent, food and transport. Wants are things that are nice to have, such as snacks, clothes or games.

Step two is to make a budget. A very popular method is the fifty, thirty, twenty rule. Use fifty percent of your income for needs, thirty percent for wants, and twenty percent for savings. If your situation is different, you can change the numbers, but the idea remains the same. Decide in advance where each taka will go.

Step three is to pay yourself first. Many people try to save whatever is left at the end of the month, but there is usually nothing left. Instead, move your saving to a separate account on the day that you receive your income. Then live with the rest. If possible, make this transfer automatic, so you do not have to rely on willpower.

Step four is to think before you buy. Before every large purchase, wait for twenty four hours. Ask yourself three questions. Do I really need this? Can I find it cheaper? Will I still want it next month? You will be surprised how often the desire disappears after one night.

Step five is to avoid debt, especially for things that quickly lose value. Borrowing money for a new phone or expensive clothes can become a heavy burden, because the interest keeps growing. If you must borrow, choose a trusted source and plan how you will repay.

Step six is to prepare for emergencies. Try to build a small fund that equals at least three months of your expenses. It will protect you if you lose your job, or if someone in your family becomes sick.

Finally, remember that saving is not about being mean. It is about freedom. When you have savings, you can say no to a bad job, you can study without stress, and you can help others when they need support.

In conclusion, start small. Even a hundred taka a week will grow into a habit, and the habit will grow into security.

Thank you for listening. Please share your ideas and questions.`});
SC.push({id:"social-media",type:"Presentation",e:"📱",title:"Social Media: Good or Bad?",blurb:"A balanced talk about the benefits and dangers of social media.",text:`Good afternoon, everyone. Today I would like to discuss a topic that almost everyone in this room knows well. Social media. Many people say it is the best invention of our time, and others say it is destroying our lives. In my talk, I will look at both sides and then give my own opinion.

Let us begin with the advantages. The most obvious benefit is communication. Thirty years ago, if you wanted to speak to a relative in another country, you had to book an expensive phone call or wait weeks for a letter. Today, you can see their face and hear their voice in seconds, for free. For families who live far apart, this is a great gift.

Second, social media gives everyone a voice. A student in a small village can share a poem, a farmer can sell vegetables online, and a young business owner can advertise without paying a large amount. Many successful small companies began on social platforms.

Third, it is a powerful source of learning and news. You can watch a free lesson from a university professor, learn cooking from a stranger, or follow important events as they happen. During emergencies, such as floods or earthquakes, social media helps people ask for help and organise rescue.

However, there is another side. The first problem is time. Many of us open an app for five minutes and look up one hour later. These platforms are designed to keep us watching, with endless videos and constant notifications. As a result, students lose focus, and workers lose valuable hours.

The second problem is mental health. When we scroll through other people's photos, we often compare our real life with their best moments. This can make us feel lonely, jealous or unhappy about our bodies and our success. Researchers have found a link between heavy use and anxiety among teenagers.

The third problem is false information. A rumour can travel faster than the truth, and it can hurt innocent people or even cause panic. Because it is so easy to share, we must be careful before we believe or forward any message.

The fourth problem is privacy. Many companies collect our personal data and use it to show advertisements. Careless sharing can also attract criminals.

So what is my opinion? I believe that social media itself is neither good nor bad. It is a tool, like a knife. In the hands of a cook, it is useful. In careless hands, it can hurt. The important question is how we use it.

I suggest four simple rules. Set a daily time limit. Turn off unnecessary notifications. Check the source before sharing news. And spend more time with real people, face to face.

To conclude, if we use social media wisely, it can connect us, educate us and inspire us. If we let it control us, it can steal our time and peace of mind. The choice is ours.

Thank you very much for listening.`});
SC.push({id:"climate",type:"Presentation",e:"🌍",title:"Climate Change and Our Daily Choices",blurb:"A clear talk about what climate change is and what each of us can do.",text:`Good morning, everyone. Thank you for joining this session. Today I would like to talk about climate change. This is a big and serious topic, but my message is hopeful. I believe that ordinary people can make a real difference through small daily choices.

First, let me explain what climate change means. Our planet is surrounded by a layer of gases that keeps some of the sun's heat, like a warm blanket. This is natural, and it makes life possible. But when we burn coal, oil and gas, we release extra carbon dioxide into the air. The blanket becomes too thick, and the Earth slowly becomes hotter.

What are the effects? Scientists have measured that the average temperature of the planet has risen by more than one degree in the last hundred and fifty years. It may sound small, but it has big consequences. Glaciers are melting, the sea level is rising, and storms and heatwaves are becoming stronger. Our own country is one of the most affected, because we have a long coastline, many rivers, and millions of people who live close to the water.

Farmers see the changes first. When the rain comes too early or too late, crops are damaged. When salt water enters the land, rice fields can no longer be used. Many families must leave their villages and move to crowded cities.

So what can we do? I would like to suggest five daily choices.

The first choice is to save energy. Switch off lights and fans when you leave a room. Choose efficient bulbs and appliances. Every unit of electricity that we save means less fuel burned.

The second choice is to travel smartly. Walk or cycle for short distances, and use buses or trains instead of private cars when possible. If we share rides, we reduce traffic and pollution.

The third choice is to waste less food. When food is thrown away, all the water, energy and labour used to grow it are wasted too. Plan your meals, store food carefully, and share extra with neighbours.

The fourth choice is to reduce plastic. Carry a cloth bag, use a bottle that you can refill, and avoid products with too much packaging. Plastic does not disappear. It stays in our rivers and soil for hundreds of years.

The fifth choice is to plant trees. A tree takes in carbon dioxide, gives shade, cleans the air, and offers a home to birds. If every family plants and protects even one tree each year, our country will become greener.

Of course, individual action is not enough by itself. We also need strong decisions from governments and companies. But when many people change their habits, they send a clear message to leaders that we care about the future.

To conclude, climate change is a challenge, but it is also a chance to act together. Let us begin today, with one small choice, and let our children inherit a healthy, beautiful planet.

Thank you.`});
SC.push({id:"small-habits",type:"Podcast",e:"🎙️",title:"Podcast: The Power of Small Habits",blurb:"A friendly podcast episode about changing your life one tiny step at a time.",text:`Hello, and welcome back to the show. I'm your host, and today's episode is called The Power of Small Habits. If you are listening while walking, cooking, or travelling, great. Stay with me for the next few minutes, because I want to share an idea that changed my life.

Let me start with a confession. Last year, I made a long list of goals. I wanted to exercise every morning, read two books a month, learn a new language and wake up at five. After two weeks, I had done almost nothing. I felt tired, guilty and a little silly. Does that sound familiar?

Then I met an old teacher who gave me simple advice. He said, you don't need a big change. You need a tiny one that you can repeat every day. At first, I thought it was too easy. But I decided to try.

I started with just two minutes. Two minutes of walking after breakfast. Two minutes of reading before sleeping. That was all. Honestly, it felt almost funny, because the goal was so small that I could not fail.

And then something surprising happened. After a few days, two minutes became five. After a few weeks, five became twenty. I did not force it. The habit pulled me forward, like a gentle river. After six months, I was walking for forty minutes every day, and I finished eleven books.

Why does this work? There are three reasons.

The first reason is that small actions remove fear. When a task is huge, your brain says, it's too hard, let's do it tomorrow. But a tiny task looks easy, so you simply begin. And beginning is the most difficult part.

The second reason is that small habits create identity. When you read two pages every night, you start to see yourself as a reader. When you walk daily, you become a person who takes care of their health. The habit shapes the person, and the person keeps the habit.

The third reason is the power of repetition. If you improve by one percent every day, after a year you are almost thirty seven times better. It sounds like magic, but it is just mathematics.

So how can you build your own small habit? Here are four simple tips.

Tip one, choose something very small, so small that you cannot say no.

Tip two, attach it to something you already do. For example, after I brush my teeth, I write one sentence in my diary.

Tip three, make it visible. Put your book on your pillow, or your running shoes near the door.

Tip four, celebrate. When you finish, smile or say, well done. This tells your brain that the habit is pleasant, and it wants to repeat it.

And please, be patient with yourself. If you miss a day, it is not a disaster. Just return the next day. The only real mistake is giving up completely.

Before I finish, I have a small challenge for you. Choose one tiny habit today. Just one. Do it for seven days and see how you feel. If you like, send me a message and tell me about your experience.

Thank you for listening, and until next time, take care and keep taking small steps.`});
SC.push({id:"flood-report",type:"News report",e:"📰",title:"News Report: Floods in the Village",blurb:"A radio style report with facts, voices and a message of hope.",text:`Good evening. This is your evening news bulletin. Our top story tonight comes from the northern district, where heavy rain over the last four days has caused serious flooding. Thousands of people have lost their homes, and rescue teams are working day and night.

According to the local weather office, rivers in the region rose above the danger level on Tuesday morning. By Wednesday, water had entered more than forty villages. Roads have been cut off, electricity has failed in many areas, and several schools are being used as emergency shelters.

Our reporter, who is at the scene, says that the situation is difficult but under control. Boats are carrying families from rooftops to safer ground. Volunteers from nearby towns have arrived with rice, drinking water and medicine. Many of them are students who have given up their holidays to help.

One of the people we spoke to is Mrs Rahima, a mother of three. She told our team that the water entered her house in the middle of the night. She said, we woke up and found the beds floating. I took my children and ran to the roof. We stayed there for ten hours without food. When the boat came, I cried with relief.

The district officer said that more than twelve thousand people are now staying in sixty shelters. He explained that the biggest problems are clean water and health. When floodwater mixes with dirty water, diseases spread quickly. Doctors have started mobile clinics, and they are warning people to drink only boiled or treated water.

Farmers have also suffered great losses. The flood has destroyed rice fields that were almost ready for harvest, and many animals have been lost. An agriculture official said that it will take months to recover, and the government is preparing support for affected families.

In the capital, the Prime Minister's office has announced an emergency fund, and several charities have opened donation accounts. Ordinary citizens are also helping. Social media pages are collecting clothes, blankets and dry food, and trucks are leaving every hour towards the north.

Meanwhile, weather experts have given some good news. They say that the rain is expected to decrease from tomorrow, and the water level in the main river should begin to fall by the weekend. Even so, they ask people living near the banks to remain careful and follow official advice.

What can you do if you wish to help? Officials suggest donating through trusted organisations, and sending only useful items such as dry food, clean clothes, and basic medicine. Please avoid sharing rumours or unconfirmed photos, because false information can create panic and delay the work of rescuers.

Despite the difficult situation, there are stories of hope. In one village, neighbours built a bamboo bridge in just two hours to reach a family trapped by water. In another, a group of children kept a shelter cheerful by singing songs.

That was our report on the floods. We will continue to follow the story and bring you updates throughout the week. Stay safe, and thank you for watching.`});
SC.push({id:"sylhet-vlog",type:"Travel vlog",e:"🍃",title:"Travel Vlog: The Tea Gardens of Sylhet",blurb:"A cheerful travel video script about green hills, tea and friendly people.",text:`Hello, friends, and welcome to my channel. Today I am taking you on a very special trip to one of the most beautiful places in our country. We are in Sylhet, and we are going to visit the famous tea gardens. So please sit back, relax, and come with me.

We left Dhaka at six in the morning by train. The journey took about six hours, but it passed quickly, because the view outside the window was wonderful. Green fields, small rivers and white clouds followed us all the way. I also had a cup of hot tea and a packet of biscuits, which is a tradition for me.

When we arrived in Sylhet, the weather was cool and misty. The air smelled of wet grass and flowers. We took a small van and travelled for about forty minutes towards Srimangal, which is known as the tea capital of Bangladesh.

And here we are. Look at this view. Everywhere you look, there are soft green hills, covered with perfectly shaped tea bushes. The land looks like a giant carpet, and the tall shade trees stand over it like umbrellas. I have never seen a green so fresh.

Let me introduce you to our guide, Mr Anwar. Good morning, Mr Anwar. He has worked in the garden for more than twenty years, and he knows every corner. He tells us that tea leaves are picked by hand, mostly by women, and that only the top two leaves and one bud are chosen. Look at how quickly they move. Their hands are like small, fast birds.

Now we are visiting a tea factory. Inside, the smell is strong and sweet. The leaves are first dried, then rolled, then heated, and finally sorted into different grades. The manager explains that the whole process takes about one day. Now we have a chance to taste. This one is black tea. And this one is the famous seven colour tea, which has seven layers of colour in one cup. Wow, it is both beautiful and delicious.

After lunch, we are going for a walk in the Lawachara forest. It is a small national park, home to monkeys, birds and rare gibbons. We are walking quietly along a narrow path. Do you hear that? That is a wild bird calling from the top of a tree. And look up there, one gibbon is jumping between branches. It is magical.

In the evening, we are visiting a local family and I am enjoying homemade pitha with a cup of warm tea. They are so kind. They welcomed us as if we were old friends, and they refuse to take any money. This is the true spirit of our country.

Before we end the video, let me give you three quick travel tips. One, visit between October and March, when the weather is pleasant. Two, wear comfortable shoes, because the hills can be slippery. And three, respect the local people and keep the environment clean.

That's all for today. If you enjoyed this trip, please like the video, subscribe, and tell me where you want to go next. Thank you for travelling with me, and see you in the next adventure. Goodbye.`});
SC.push({id:"inventor",type:"Interview",e:"💡",title:"Interview with a Young Inventor",blurb:"A one person interview script about creativity, failure and never giving up.",text:`Thank you very much for inviting me. It's a great pleasure to be here today, and I'm happy to talk about my journey.

You asked me first how I became an inventor. The honest answer is that I never planned it. When I was twelve, my grandmother's old radio stopped working. Instead of throwing it away, I opened it with a screwdriver. I did not know anything about electronics, but I was curious. It took me two weeks, a lot of videos, and many mistakes, but finally it played music again. That moment gave me a feeling that I wanted to repeat for the rest of my life.

You also asked what my main invention is. It's a small, low cost water filter that uses sunlight and a layer of local clay. In my village, many families drink water from ponds or tube wells that are not safe. Children often get sick because of it. I thought, why can't we clean the water using materials that people already have around them? After eight months of testing, my team built a simple model, and it removes more than ninety percent of dangerous bacteria.

Now, was it easy? Not at all. In the beginning, I failed again and again. My first filter leaked all over the floor. My second one was too slow. My third one broke when my little brother kicked it by accident. Some of my friends laughed and told me to stop wasting time. There were nights when I felt like giving up.

What kept me going? Three things. First, my family. My mother always said that a failed experiment is only a lesson in disguise. Second, my teacher, who believed in me and arranged a small space in the school laboratory. And third, the faces of the children in my village. I kept thinking that each failure was bringing me one step closer to a solution.

You asked what advice I would give to young people who want to invent something. I would say, begin with a real problem. Ask yourself, who needs help, and how can I make their life easier? Talk to the people who face the problem every day, because they usually understand it better than experts.

Next, be ready to fail. Failure is not the opposite of success. It is a part of it. Every great invention began with many unsuccessful attempts. And finally, work with others. No one can build everything alone. My project became better when I invited engineers, doctors and even farmers to give me their opinion.

As for my dreams, I would like to produce thousands of these filters at a very low price and give them to schools and clinics in remote areas. I also hope to inspire other young people, especially girls, to enter science and technology.

Before I finish, I would like to say something to everyone who is listening. Don't wait until you feel ready or until you have the best tools. Start with what you have, ask questions, and keep learning. A small idea today may become a big change tomorrow.

Thank you once again for this opportunity. It was a pleasure to share my story with you.`});

function openR(m){RM=m;renderR();dr2.classList.add("on");bg.classList.add("on")}
function closeR(){dr2.classList.remove("on");bg.classList.remove("on");RM="";if(tocOpen&&!wide())setToc(false)}
function renderR(){dr2.textContent="";var x=el("button","✕","sp",closeR);x.style.float="right";dr2.appendChild(x);(RM==="add"?rAdd:rSet)()}
bg.onclick=closeR;$("bAdd").onclick=function(){openR("add")};$("bSt").onclick=function(){openR("set")};
function rAdd(){dr2.appendChild(el("h2","Add your own script"));dr2.appendChild(el("p","Paste or type any text: a speech, a presentation, a story or answers you want to practise. For best voice checking, write numbers as words.","m"));
 var t=document.createElement("input");t.className="si";t.placeholder="Title";var a=document.createElement("textarea");a.className="si";a.rows=12;a.placeholder="Your script…";a.style.marginTop="8px";dr2.appendChild(t);dr2.appendChild(a);var m=el("p","","res");dr2.appendChild(m);
 dr2.appendChild(el("button","Save and practise","btn",function(){var x=a.value.trim();if(wc(x)<15){m.textContent="Please write at least 15 words.";m.className="res no";return}var id="my-"+Date.now();MY.push({id:id,title:t.value.trim()||"My script "+(MY.length+1),text:x});lw("ps-my",JSON.stringify(MY));closeR();openScript(id)}))}
function seg(o,c,f){var d=el("div","","seg");o.forEach(function(x){var b=el("button",x[1],"",function(){f(x[0])});b.setAttribute("aria-pressed",String(String(x[0])===String(c)));d.appendChild(b)});return d}
function rng(a,b,v,fn){var i=document.createElement("input");i.type="range";i.min=a;i.max=b;i.value=v;i.oninput=function(){fn(+i.value)};return i}
function chk(t,on,fn){var l=el("label","","chk"),i=document.createElement("input");i.type="checkbox";i.checked=on;i.onchange=function(){fn(i.checked)};l.appendChild(i);l.appendChild(document.createTextNode(" "+t));return l}
var EYE=Object.assign({b:100,w:0,auto:false,wake:false},jp("ps-eye",{}));
function applyEye(){$("dim").style.opacity=((100-EYE.b)/100*.85).toFixed(3);var h=new Date().getHours(),w=Math.max(EYE.w,EYE.auto&&(h>=22||h<6)?30:0);$("warm").style.opacity=(w/100*.55).toFixed(3)}
function autoTheme(){var t="light";try{t=JSON.parse(ls("ielts-gl-reader")||"{}").theme||"light"}catch(e){}if(EYE.auto){var h=new Date().getHours();t=(h>=22||h<6)?"dark":(h>=18?"sepia":t)}document.documentElement.dataset.theme=t;applyEye()}
function saveEye(){lw("ps-eye",JSON.stringify(EYE))}
var wl=null;function wake(){try{if(EYE.wake&&"wakeLock"in navigator&&document.visibilityState==="visible")navigator.wakeLock.request("screen").then(function(x){wl=x});else if(wl){wl.release();wl=null}}catch(e){}}
document.addEventListener("visibilitychange",function(){if(EYE.wake)wake()});
function setOpt(k,v){if(k==="theme"){try{var q=JSON.parse(ls("ielts-gl-reader")||"{}");q.theme=v;lw("ielts-gl-reader",JSON.stringify(q))}catch(e){}autoTheme()}else if(k==="font"){CFG.font=v;saveCfg();applyCfg()}else if(k==="acc"){CFG.acc=v;saveCfg()}renderR()}
function rSet(){var H=function(t){dr2.appendChild(el("div",t,"sh"))};dr2.appendChild(el("h2","Settings"));
 H("Theme");dr2.appendChild(seg([["light","Light"],["sepia","Sepia"],["dark","Night"]],document.documentElement.dataset.theme,function(v){setOpt("theme",v)}));
 H("Typeface");dr2.appendChild(seg([["serif","Serif"],["sans","Sans"]],CFG.font,function(v){setOpt("font",v)}));
 H("Page text size");dr2.appendChild(rng(13,26,CFG.fs,function(v){CFG.fs=v;saveCfg();applyCfg()}));
 H("Prompter text size");dr2.appendChild(rng(16,44,CFG.tps,function(v){CFG.tps=v;saveCfg();applyCfg();scroll()}));
 H("Accent (listening voice)");dr2.appendChild(seg([["en-GB","British"],["en-US","American"]],CFG.acc,function(v){setOpt("acc",v)}));
 H("Eye comfort");dr2.appendChild(el("div","Brightness","m"));dr2.appendChild(rng(30,100,EYE.b,function(v){EYE.b=v;applyEye();saveEye()}));
 dr2.appendChild(el("div","Warm light (less blue)","m"));dr2.appendChild(rng(0,100,EYE.w,function(v){EYE.w=v;applyEye();saveEye()}));
 dr2.appendChild(chk("Auto night mode (sepia from 6 pm, dark from 10 pm)",EYE.auto,function(v){EYE.auto=v;saveEye();autoTheme();renderR()}));
 dr2.appendChild(chk("Keep screen on while practising",EYE.wake,function(v){EYE.wake=v;saveEye();wake()}))}
autoTheme();wake();setInterval(autoTheme,600000);
addEventListener("keydown",function(e){if(e.key==="Escape")closeR();if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key===" "&&cur){e.preventDefault();(mode==="listen"?startListen:startAuto)()}});
addEventListener("resize",function(){scroll()});
function setTop(){document.documentElement.style.setProperty("--top",$("bar").offsetHeight+"px")}setTop();if(window.ResizeObserver)new ResizeObserver(setTop).observe($("bar"));
var h0=decodeURIComponent(location.hash.slice(1));
if(h0&&all().some(function(s){return s.id===h0}))openScript(h0,true);else showLib();
setToc(wide()?ls("ps-toc")!=="0":false);
})();
