/* ---------- content ---------- */
var CH=[{"id": "real", "t": "1. Find the real subject", "c": "<p class=\"say\">The verb agrees with the main subject, not with a nearby noun in a phrase beginning with <em>of, with, together with, as well as</em> or <em>in addition to</em>.</p><div class=\"tw\"><table><thead><tr><th>Sentence</th><th>Subject</th><th>Correct verb</th></tr></thead><tbody><tr><td>The quality of the products ___ improving.</td><td>quality (singular)</td><td>is</td></tr><tr><td>The results of the experiment ___ reliable.</td><td>results (plural)</td><td>are</td></tr><tr><td>The professor, along with two students, ___ attending.</td><td>professor (singular)</td><td>is</td></tr></tbody></table></div><p class=\"note\">Ignore the words between the subject and the verb when identifying the main subject.</p><h3>Interrupting phrases</h3><ul><li><b>of:</b> the list of items is long.</li><li><b>with / along with / together with:</b> the manager, together with her team, is here.</li><li><b>as well as / in addition to:</b> The teacher, as well as the students, was late.</li><li><b>between commas:</b> The report, which includes many figures, is clear.</li></ul><h3>Quick test</h3><p>Cross out everything between the subject and the verb. <em>The quality (of the products) is improving.</em> The sentence now reads: <em>The quality is improving.</em></p>"}, {"id": "conj", "t": "2. Subjects joined by conjunctions", "c": "<div class=\"tw\"><table><thead><tr><th>Structure</th><th>Usual agreement</th><th>Example</th></tr></thead><tbody><tr><td>A and B</td><td>Plural</td><td>Research and innovation are essential.</td></tr><tr><td>Either A or B</td><td>Usually agrees with the nearer subject</td><td>Either the manager or the assistants are coming.</td></tr><tr><td>Neither A nor B</td><td>Usually agrees with the nearer subject</td><td>Neither the assistants nor the manager is coming.</td></tr><tr><td>A or B (alternatives)</td><td>Often agrees with the nearer subject</td><td>Neither the teacher nor the students are available.</td></tr></tbody></table></div><p>When the result sounds awkward, rewrite the sentence to make the subject and verb easier to follow.</p><h3>Special cases</h3><ul><li><b>One idea:</b> <em>Bread and butter is my usual breakfast.</em> (one dish)</li><li><b>Each / every + and:</b> <em>Every man and woman has a right.</em></li><li><b>Place the plural noun last</b> in or/nor structures for a smoother sentence: Neither the manager nor the assistants are coming.</li></ul>"}, {"id": "indef", "t": "3. Indefinite pronouns", "c": "<div class=\"tw\"><table><thead><tr><th>Usually singular</th><th>Usually plural</th><th>Examples</th></tr></thead><tbody><tr><td>everyone, everybody, someone, somebody, each, either, neither</td><td>both, few, many, several</td><td>Everyone is ready. Several reports contain errors.</td></tr></tbody></table></div><p>Some expressions depend on the noun after <em>of</em>: <em>all, some, most, none</em>.</p><ul><li>Some of the water <b>is</b> contaminated.</li><li>Some of the samples <b>are</b> contaminated.</li></ul><h3>More singular words</h3><ul><li>anyone, anybody, anything, everything, nothing, no one, nobody, somebody</li><li>Each of the students <b>has</b> a book. Neither of the answers <b>is</b> correct.</li></ul><h3>Remember</h3><p><em>Everyone</em> sounds like a group, but it is grammatically singular: <em>Everyone is here.</em> A later pronoun may be plural (<em>Everyone has their own opinion</em>), but the verb stays singular.</p>"}, {"id": "coll", "t": "4. Collective nouns", "c": "<p>Words such as <em>team, family, committee, staff</em> and <em>government</em> name groups. Use singular agreement when the group acts as one unit. British English may use plural agreement when members are viewed as individuals; usage differs by variety and context.</p><div class=\"tw\"><table><thead><tr><th>One unit</th><th>Members as individuals (common in British English)</th></tr></thead><tbody><tr><td>The committee has made its decision.</td><td>The committee are arguing among themselves.</td></tr></tbody></table></div><h3>Tips</h3><ul><li>Be consistent inside a sentence: <em>The team has won its first match.</em></li><li>In IELTS Writing, singular is the safest: <em>The government has introduced new laws.</em></li><li>People, police and cattle are always plural: <em>The police are investigating.</em></li></ul>"}, {"id": "amount", "t": "5. Amounts, time and distance", "c": "<p>A sum, measurement or period considered one total usually takes a singular verb.</p><div class=\"tw\"><table><thead><tr><th>One total</th><th>Separate countable items</th></tr></thead><tbody><tr><td>Ten kilometres is a long distance.</td><td>Ten kilometres of roads were inspected.</td></tr><tr><td>Five years is a long time.</td><td>The five years they spent abroad were challenging.</td></tr></tbody></table></div><h3>More examples</h3><ul><li>Fifty dollars is too much for this book.</li><li>Two hours is not enough time.</li><li>Three-quarters of the cake has gone.</li></ul>"}, {"id": "there", "t": "6. There is / there are", "c": "<p>In these structures, the verb agrees with the noun phrase that follows.</p><div class=\"example\"><p>There is one reason. / There are several reasons.</p></div><p class=\"note\">In formal writing, avoid using “there’s” with a plural noun if you want a consistently formal style.</p><h3>With two nouns</h3><div class=\"example\"><p>There is a pen and two books on the desk.</p><p class=\"note\">The verb may agree with the first noun, but rewrite if it sounds odd: There are a pen and two books…</p></div><h3>Also for questions</h3><div class=\"example\"><p>Is there a problem? Are there any questions?</p></div>"}, {"id": "quiz", "t": "Quiz", "quiz": 1}, {"id": "stick", "t": "Making it stick", "prog": 1}];
