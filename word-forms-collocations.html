var CH=[{"id": "what", "t": "What are word forms and collocations?", "c": "<p class=\"say\">One idea can appear in four shapes: <em>decide, decision, decisive, decisively</em>. Choosing the wrong shape is one of the most common errors in IELTS writing, and it often makes a good idea look weak. A second skill is <b>collocation</b>: words that naturally go together. We <em>make</em> a decision, <em>do</em> homework and have <em>heavy</em> traffic. They are not wrong in other forms because of grammar, but because native speakers simply do not say them.</p><div class=\"tw\"><table><thead><tr><th>Skill</th><th>Question it answers</th><th>Example</th></tr></thead><tbody><tr><td>Word form</td><td>Which shape of the word fits this gap?</td><td>She made a <b>decision</b>. She decided <b>quickly</b>.</td></tr><tr><td>Collocation</td><td>Which partner word sounds natural?</td><td><b>make</b> a decision, not <del>do</del> a decision</td></tr><tr><td>Word family</td><td>What are all the members of this word?</td><td>decide, decision, decisive, decisively, indecision</td></tr></tbody></table></div><h3>Why they matter for IELTS</h3><ul><li><b>Writing:</b> Lexical Resource rewards correct word forms and natural collocations. Wrong forms lower Grammatical Accuracy too.</li><li><b>Speaking:</b> natural collocations make you sound fluent.</li><li><b>Reading:</b> gap-fill and summary tasks often test the word type, not just the meaning.</li><li><b>Listening:</b> in a form or note, you must decide whether the gap needs a noun, an adjective or a number.</li></ul><h3>The two big ideas</h3><div class=\"rule\"><p><b>Position decides form</b> Look at the gap: what job must the word do here? Noun, verb, adjective or adverb?</p><p><b>Words travel in groups</b> Learn chunks: <em>make progress, a heavy rain, strongly agree</em>.</p></div><p class=\"note\">Learn every new word as a family and as a chunk. A word learned alone is hard to use correctly.</p>"}, {"id": "jobs", "t": "Position decides form", "c": "<p>Every English word does a job in the sentence, and the job decides the form. Before you choose a word, look at the gap and the words around it.</p><div class=\"tw\"><table><thead><tr><th>If the gap is…</th><th>You need a…</th><th>Example</th></tr></thead><tbody><tr><td>after the / a / an / this / my</td><td>noun</td><td>The <b>economy</b> grew. (after the)</td></tr><tr><td>after an adjective</td><td>noun</td><td>a rapid <b>development</b></td></tr><tr><td>after a subject, before an object</td><td>verb</td><td>Governments <b>develop</b> policies.</td></tr><tr><td>after modals (can, must, will, should)</td><td>base verb</td><td>We must <b>protect</b> nature.</td></tr><tr><td>after be, seem, become, feel, look</td><td>adjective</td><td>The test was <b>difficult</b>.</td></tr><tr><td>before a noun</td><td>adjective (or noun used as adjective)</td><td>an <b>economic</b> crisis</td></tr><tr><td>after a verb, or before an adjective or another adverb</td><td>adverb</td><td>She spoke <b>clearly</b>. It was <b>extremely</b> hard.</td></tr><tr><td>after a preposition</td><td>noun or -ing</td><td>interested in <b>education</b> / <b>learning</b></td></tr><tr><td>at the start of a sentence, before a comma</td><td>adverb or connector</td><td><b>Fortunately</b>, it worked.</td></tr></tbody></table></div><h3>Four-step method</h3><ol><li>Read the whole sentence.</li><li>Check what comes before and after the gap.</li><li>Decide the word type: noun, verb, adjective or adverb.</li><li>Add the correct ending and check singular or plural.</li></ol><h3>Try it</h3><div class=\"example\"><p>The ___ (develop) of the city was rapid. → <b>development</b></p><p class=\"note\">After the, a noun. Of the city tells you it is a noun, so development.</p></div><div class=\"example\"><p>The city ___ (rapid) developed. → <b>rapidly</b></p><p class=\"note\">Before a verb, an adverb.</p></div><h3>Adjectives and adverbs with the same shape</h3><p>Some adverbs look like adjectives: <em>fast, hard, late, early, daily, weekly.</em> <b>She works hard.</b> <b>He arrived late.</b> But <em>hardly</em> and <em>lately</em> have different meanings: <em>hardly</em> = almost not; <em>lately</em> = recently.</p><h3>Linking verbs take adjectives</h3><div class=\"example\"><p>She <b>looks happy</b>. It <b>sounds strange</b>. The food <b>tastes good</b>. He <b>became rich</b>.</p><p class=\"note\">After be, seem, become, look, sound, feel, taste, smell, get, stay, remain: use an adjective, not an adverb.</p></div>"}, {"id": "suffix", "t": "Suffixes: how endings show the word type", "c": "<h3>Noun endings</h3><div class=\"tw\"><table><thead><tr><th>Ending</th><th>Examples</th><th>Verb or adjective it comes from</th></tr></thead><tbody><tr><td>-tion / -sion / -ation</td><td>decision, education, information, creation</td><td>decide, educate, inform, create</td></tr><tr><td>-ment</td><td>development, achievement, government, improvement</td><td>develop, achieve, govern, improve</td></tr><tr><td>-ness</td><td>happiness, kindness, awareness, weakness</td><td>happy, kind, aware, weak</td></tr><tr><td>-ity / -ty</td><td>ability, equality, safety, popularity</td><td>able, equal, safe, popular</td></tr><tr><td>-ance / -ence</td><td>importance, performance, difference, absence</td><td>important, perform, different, absent</td></tr><tr><td>-er / -or / -ist / -ian</td><td>teacher, actor, scientist, musician</td><td>teach, act, science, music</td></tr><tr><td>-ship</td><td>friendship, leadership, relationship</td><td>friend, lead, relate</td></tr><tr><td>-hood</td><td>childhood, neighbourhood</td><td>child, neighbour</td></tr><tr><td>-ism</td><td>tourism, capitalism, criticism</td><td>tour, capital, critic</td></tr><tr><td>-th</td><td>growth, strength, length, depth</td><td>grow, strong, long, deep</td></tr><tr><td>-age</td><td>damage, storage, usage, coverage</td><td>damage, store, use, cover</td></tr><tr><td>-ure</td><td>failure, pressure, measure</td><td>fail, press, measure</td></tr></tbody></table></div><h3>Verb endings</h3><div class=\"tw\"><table><thead><tr><th>Ending</th><th>Examples</th></tr></thead><tbody><tr><td>-ise / -ize</td><td>organise, modernise, realise, emphasise, criticise</td></tr><tr><td>-ify</td><td>simplify, clarify, identify, justify, specify</td></tr><tr><td>-en</td><td>strengthen, widen, shorten, threaten, deepen</td></tr><tr><td>-ate</td><td>create, educate, communicate, motivate, evaluate</td></tr></tbody></table></div><h3>Adjective endings</h3><div class=\"tw\"><table><thead><tr><th>Ending</th><th>Examples</th></tr></thead><tbody><tr><td>-al</td><td>national, economic (-ic), cultural, personal, traditional</td></tr><tr><td>-ful</td><td>successful, helpful, powerful, useful, harmful</td></tr><tr><td>-less</td><td>helpless, useless, homeless, careless, harmless</td></tr><tr><td>-ous</td><td>dangerous, famous, various, serious, enormous</td></tr><tr><td>-ive</td><td>active, effective, creative, productive, expensive</td></tr><tr><td>-able / -ible</td><td>available, reasonable, flexible, possible, responsible</td></tr><tr><td>-ic</td><td>economic, scientific, historic, specific, strategic</td></tr><tr><td>-ant / -ent</td><td>important, significant, different, apparent, efficient</td></tr><tr><td>-ing / -ed</td><td>interesting / interested, boring / bored, surprising / surprised</td></tr><tr><td>-y</td><td>healthy, wealthy, noisy, rainy, windy</td></tr><tr><td>-ary / -ory</td><td>necessary, temporary, satisfactory, compulsory</td></tr></tbody></table></div><h3>Adverb ending</h3><div class=\"tw\"><table><thead><tr><th>Rule</th><th>Examples</th></tr></thead><tbody><tr><td>adjective + ly</td><td>quick → quickly, careful → carefully, serious → seriously</td></tr><tr><td>-y → -ily</td><td>happy → happily, easy → easily, heavy → heavily</td></tr><tr><td>-le → -ly</td><td>possible → possibly, simple → simply</td></tr><tr><td>-ic → -ically</td><td>economic → economically, scientific → scientifically</td></tr><tr><td>irregular</td><td>good → well; fast → fast; hard → hard</td></tr></tbody></table></div><p class=\"note\">Endings are strong clues, but not perfect: <em>friendly</em> (adjective), <em>lovely</em> (adjective), <em>early</em> (adjective and adverb) end in -ly but are not simple adverbs.</p>"}, {"id": "family", "t": "Word families", "c": "<p>A <b>word family</b> groups the noun, verb, adjective and adverb of the same root. Learn them together, and your vocabulary doubles almost for free.</p><div class=\"tw\"><table><thead><tr><th>Noun</th><th>Verb</th><th>Adjective</th><th>Adverb</th></tr></thead><tbody><tr><td>decision</td><td>decide</td><td>decisive</td><td>decisively</td></tr><tr><td>economy</td><td>economise</td><td>economic / economical</td><td>economically</td></tr><tr><td>success</td><td>succeed</td><td>successful</td><td>successfully</td></tr><tr><td>creation</td><td>create</td><td>creative</td><td>creatively</td></tr><tr><td>analysis</td><td>analyse</td><td>analytical</td><td>analytically</td></tr><tr><td>education</td><td>educate</td><td>educational / educated</td><td>educationally</td></tr><tr><td>environment</td><td>—</td><td>environmental</td><td>environmentally</td></tr><tr><td>employment</td><td>employ</td><td>employed / employable</td><td>—</td></tr><tr><td>pollution</td><td>pollute</td><td>polluted</td><td>—</td></tr><tr><td>beauty</td><td>beautify</td><td>beautiful</td><td>beautifully</td></tr><tr><td>danger</td><td>endanger</td><td>dangerous</td><td>dangerously</td></tr><tr><td>science</td><td>—</td><td>scientific</td><td>scientifically</td></tr><tr><td>politics</td><td>politicise</td><td>political</td><td>politically</td></tr><tr><td>difference</td><td>differ</td><td>different</td><td>differently</td></tr><tr><td>importance</td><td>—</td><td>important</td><td>importantly</td></tr><tr><td>benefit</td><td>benefit</td><td>beneficial</td><td>beneficially</td></tr><tr><td>production</td><td>produce</td><td>productive</td><td>productively</td></tr><tr><td>strength</td><td>strengthen</td><td>strong</td><td>strongly</td></tr><tr><td>growth</td><td>grow</td><td>growing</td><td>—</td></tr><tr><td>competition</td><td>compete</td><td>competitive</td><td>competitively</td></tr><tr><td>reduction</td><td>reduce</td><td>reduced</td><td>—</td></tr><tr><td>improvement</td><td>improve</td><td>improved</td><td>—</td></tr><tr><td>development</td><td>develop</td><td>developed / developing</td><td>—</td></tr><tr><td>application</td><td>apply</td><td>applicable</td><td>—</td></tr><tr><td>protection</td><td>protect</td><td>protective</td><td>protectively</td></tr><tr><td>variety</td><td>vary</td><td>various / varied</td><td>variously</td></tr><tr><td>necessity</td><td>necessitate</td><td>necessary</td><td>necessarily</td></tr><tr><td>possibility</td><td>—</td><td>possible</td><td>possibly</td></tr><tr><td>responsibility</td><td>—</td><td>responsible</td><td>responsibly</td></tr><tr><td>comparison</td><td>compare</td><td>comparative / comparable</td><td>comparatively</td></tr><tr><td>assumption</td><td>assume</td><td>assumed</td><td>—</td></tr><tr><td>conclusion</td><td>conclude</td><td>conclusive</td><td>conclusively</td></tr></tbody></table></div><h3>Using a family in one sentence</h3><div class=\"example\"><p>The <b>economy</b> grew <b>rapidly</b>, which had a <b>significant</b> effect on <b>employment</b>. Experts say the government must <b>strengthen</b> the economy so that more people can find <b>work</b>.</p><p class=\"note\">Noun, adverb, adjective, noun, verb: the same idea in different shapes.</p></div><h3>How to build a family</h3><ul><li>Start with the headword in the dictionary entry.</li><li>Check the other forms in the same entry (usually listed at the end).</li><li>Write one sentence for each form.</li><li>Note which forms do not exist: environment has no verb.</li></ul>"}, {"id": "prefix", "t": "Prefixes: changing meaning", "c": "<p>A prefix changes the meaning, usually without changing the word type. Learn the common ones and you can guess many new words.</p><div class=\"tw\"><table><thead><tr><th>Prefix</th><th>Meaning</th><th>Examples</th></tr></thead><tbody><tr><td>un-</td><td>not, reverse</td><td>unhappy, unusual, unlock, unfair</td></tr><tr><td>in- / im- / il- / ir-</td><td>not</td><td>incorrect, impossible, illegal, irregular</td></tr><tr><td>dis-</td><td>not, opposite</td><td>disagree, dislike, disappear, dishonest</td></tr><tr><td>mis-</td><td>wrongly</td><td>misunderstand, mistake, misuse</td></tr><tr><td>re-</td><td>again, back</td><td>rewrite, rebuild, return, replace</td></tr><tr><td>pre-</td><td>before</td><td>prepare, prehistoric, pre-school</td></tr><tr><td>post-</td><td>after</td><td>postgraduate, postwar, postpone</td></tr><tr><td>over-</td><td>too much</td><td>overwork, overweight, overuse</td></tr><tr><td>under-</td><td>too little, below</td><td>underpaid, underestimate, underground</td></tr><tr><td>anti-</td><td>against</td><td>anti-social, antibiotic</td></tr><tr><td>co- / con-</td><td>together</td><td>cooperate, coexist, collaborate</td></tr><tr><td>inter-</td><td>between</td><td>international, internet, interact</td></tr><tr><td>multi-</td><td>many</td><td>multicultural, multimedia, multinational</td></tr><tr><td>sub-</td><td>under</td><td>subway, subtitle, subconscious</td></tr><tr><td>super-</td><td>above, very</td><td>superstar, supermarket</td></tr><tr><td>semi-</td><td>half</td><td>semicircle, semifinal</td></tr><tr><td>bi- / tri-</td><td>two / three</td><td>bilingual, bicycle, triangle</td></tr><tr><td>mono-</td><td>one</td><td>monolingual, monotone</td></tr><tr><td>ex-</td><td>former</td><td>ex-president, ex-wife</td></tr><tr><td>extra-</td><td>beyond</td><td>extraordinary, extracurricular</td></tr></tbody></table></div><h3>Choosing in-, im-, il-, ir-</h3><ul><li><b>im-</b> before b, m, p: impossible, immature, imbalance.</li><li><b>il-</b> before l: illegal, illogical.</li><li><b>ir-</b> before r: irregular, irresponsible.</li><li><b>in-</b> before most other letters: incorrect, inactive.</li></ul><h3>Un- or dis-?</h3><p>There is no rule: learn each word. <em>unable, unhappy, unkind</em> but <em>disable, dislike, disagree</em>. A dictionary will tell you.</p><h3>Prefixes and hyphens</h3><p>Use a hyphen with <em>ex-, self-, all-, half-</em> and before a capital: <em>ex-wife, self-confident, pre-Christmas.</em></p>"}, {"id": "verbcoll", "t": "Verb + noun collocations", "c": "<p class=\"say\">Many verbs are “light”: they have little meaning on their own, and the noun carries the idea. Which light verb you need must be learned.</p><h3>Make and do</h3><div class=\"tw\"><table><thead><tr><th>make</th><th>do</th></tr></thead><tbody><tr><td>a decision, a choice, a mistake, an effort, progress, a plan, a suggestion, a difference, money, a noise, a mess, an attempt, an impression, a promise, a profit</td><td>homework, research, business, harm, damage, good, your best, a favour, the shopping, the cleaning, an exam / a test, a course, work, a job, exercise, nothing, something</td></tr></tbody></table></div><div class=\"example\"><p>make a decision, make progress, make a mistake<br>do research, do harm, do homework</p><p class=\"note\">Make usually creates or produces something. Do is for tasks, activities and general actions.</p></div><h3>Take, have, give, get</h3><div class=\"tw\"><table><thead><tr><th>Verb</th><th>Collocations</th></tr></thead><tbody><tr><td>take</td><td>a risk, action, responsibility, a break, a look, a photo, a chance, an exam, advantage of, part in, place, care of, notice of, time, a decision (US)</td></tr><tr><td>have</td><td>an impact, an effect, a look, a chat, a meeting, a conversation, a problem, a rest, a shower, a party, fun, trouble, doubts, an idea, a right to</td></tr><tr><td>give</td><td>advice, a talk, a presentation, a reason, an opinion, an answer, information, permission, priority to, support, rise to, way to</td></tr><tr><td>get</td><td>a job, a degree, married, better, home, an idea, results, access to, the impression, a reply, permission</td></tr><tr><td>pay</td><td>attention, a visit, a compliment, a bill, a fine, tax, respect, the price</td></tr><tr><td>keep</td><td>a promise, a secret, a record, in touch, fit, quiet, calm, an eye on</td></tr><tr><td>break</td><td>a promise, a rule, the law, a record, news, silence, a habit</td></tr><tr><td>set</td><td>a goal, a target, an example, a record, the table, the alarm, a deadline</td></tr><tr><td>reach</td><td>a conclusion, an agreement, a decision, a target, the top, a peak</td></tr><tr><td>run</td><td>a business, a risk, a campaign, an experiment, a test</td></tr><tr><td>play</td><td>a role, a part, a game, an important role</td></tr><tr><td>raise</td><td>awareness, money, a question, children, standards, taxes</td></tr></tbody></table></div><h3>Academic verb + noun phrases</h3><ul><li><b>address</b> an issue, a problem, a concern</li><li><b>pose</b> a threat, a challenge, a risk</li><li><b>meet</b> demand, needs, expectations, requirements, a deadline</li><li><b>bring about</b> change, improvement, a decline</li><li><b>conduct</b> research, a survey, an experiment, an interview</li><li><b>draw</b> a conclusion, attention to, a comparison</li><li><b>face</b> a challenge, a problem, difficulties, competition</li><li><b>achieve</b> a goal, success, results, an aim</li><li><b>enjoy</b> success, popularity, a reputation</li><li><b>suffer</b> from, a loss, damage, a setback</li></ul><h3>Catch, hold, offer</h3><ul><li><b>catch</b> a cold, a bus, a thief, someone’s attention</li><li><b>hold</b> a meeting, a view, a belief, an election, a position</li><li><b>offer</b> advice, help, a job, a solution, an explanation</li></ul>"}, {"id": "adjcoll", "t": "Adjective + noun collocations", "c": "<p>Adjectives choose their nouns. We say <em>heavy rain</em> but not <del>strong rain</del>, and <em>strong evidence</em> but not <del>heavy evidence</del>.</p><div class=\"tw\"><table><thead><tr><th>Adjective</th><th>Common nouns</th></tr></thead><tbody><tr><td>heavy</td><td>rain, traffic, snow, fog, smoker, drinker, cost, burden, workload</td></tr><tr><td>strong</td><td>wind, evidence, opinion, case, support, tradition, coffee, economy, competition</td></tr><tr><td>high</td><td>demand, level, standard, risk, price, rate, hopes, quality, temperature</td></tr><tr><td>low</td><td>price, income, level, rate, standard, quality, cost, profile</td></tr><tr><td>big / great / large</td><td>problem, change, majority, number, amount, difference (big and great are not always interchangeable)</td></tr><tr><td>major / minor</td><td>problem, change, issue, factor, difference, concern, role</td></tr><tr><td>deep</td><td>sleep, trouble, breath, concern, thought, water, sense</td></tr><tr><td>fast</td><td>food, growth, train, food, track, lane</td></tr><tr><td>quick</td><td>decision, glance, reply, look, meal, fix</td></tr><tr><td>rapid</td><td>growth, change, development, increase, expansion, decline</td></tr><tr><td>sharp</td><td>increase, rise, fall, drop, contrast, mind</td></tr><tr><td>steady</td><td>growth, rise, increase, decline, pace</td></tr><tr><td>significant</td><td>difference, change, increase, role, impact, effect</td></tr><tr><td>serious</td><td>problem, injury, issue, threat, concern, crime, illness</td></tr><tr><td>common</td><td>problem, mistake, sense, practice, knowledge, cause</td></tr><tr><td>wide</td><td>range, variety, choice, gap, selection, support</td></tr><tr><td>growing</td><td>concern, number, demand, awareness, problem, trend</td></tr><tr><td>rising</td><td>prices, costs, demand, unemployment, temperatures</td></tr><tr><td>fierce</td><td>competition, debate, opposition, criticism</td></tr><tr><td>urgent</td><td>need, action, matter, attention</td></tr></tbody></table></div><h3>Noun + noun</h3><div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Examples</th></tr></thead><tbody><tr><td>traffic</td><td>traffic jam, traffic congestion, traffic lights, traffic accident</td></tr><tr><td>climate</td><td>climate change, climate crisis, climate policy</td></tr><tr><td>job</td><td>job market, job security, job satisfaction, job opportunities</td></tr><tr><td>road</td><td>road accident, road safety, road network</td></tr><tr><td>health</td><td>health care, health risk, health problem, health service</td></tr><tr><td>life</td><td>life expectancy, life cycle, life style (lifestyle), life skills</td></tr><tr><td>information</td><td>information technology, information overload</td></tr><tr><td>birth</td><td>birth rate, birth control, birth certificate</td></tr><tr><td>pressure</td><td>peer pressure, social pressure, time pressure</td></tr></tbody></table></div><h3>Fixed pairs of adjectives with “of”</h3><div class=\"example\"><p>a <b>number of</b> reasons, a <b>variety of</b> factors, a <b>range of</b> options, a <b>lack of</b> evidence, a <b>majority of</b> people, a <b>wealth of</b> information.</p><p class=\"note\">These partner nouns appear again and again in academic English.</p></div>"}, {"id": "advcoll", "t": "Adverb collocations", "c": "<div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Examples</th></tr></thead><tbody><tr><td>adverb + adjective</td><td>highly successful, deeply concerned, widely known, entirely different, fully aware, extremely important, increasingly popular, seriously ill, bitterly cold, perfectly clear, utterly impossible, completely different</td></tr><tr><td>adverb + verb</td><td>strongly agree, firmly believe, deeply regret, greatly appreciate, seriously consider, carefully consider, fully understand, totally disagree, highly recommend, closely related, sharply increase, gradually decline</td></tr><tr><td>verb + adverb</td><td>improve dramatically, increase steadily, fall sharply, rise gradually, work hard, speak fluently, listen carefully, grow rapidly, change significantly</td></tr><tr><td>adverb + past participle</td><td>widely used, highly educated, well known, heavily criticised, poorly paid, closely linked, deeply rooted, badly damaged</td></tr></tbody></table></div><h3>Sentence adverbs for writing</h3><div class=\"tw\"><table><thead><tr><th>Purpose</th><th>Adverbs</th></tr></thead><tbody><tr><td>Opinion</td><td>fortunately, unfortunately, surprisingly, sadly, ideally, hopefully</td></tr><tr><td>Certainty</td><td>clearly, obviously, undoubtedly, certainly, definitely, apparently</td></tr><tr><td>Frequency</td><td>often, rarely, occasionally, generally, typically, usually</td></tr><tr><td>Degree</td><td>highly, extremely, fairly, rather, quite, slightly, somewhat</td></tr><tr><td>Manner</td><td>carefully, quickly, easily, effectively, successfully</td></tr></tbody></table></div><h3>Adverbs with strong and weak adjectives</h3><ul><li><b>very / extremely / highly</b> + gradable adjectives: very good, extremely important.</li><li><b>absolutely / completely / totally / utterly</b> + extreme adjectives: absolutely essential, completely impossible, utterly exhausted.</li><li>Do not say <del>very fantastic</del> or <del>absolutely good</del>.</li></ul><h3>Strongly, highly, deeply</h3><div class=\"example\"><p>strongly agree, strongly believe, strongly recommend<br>highly recommended, highly successful, highly likely</p><p class=\"note\">These adverbs are not interchangeable. Learn each with its partners.</p></div>"}, {"id": "academic", "t": "Academic collocations by function", "c": "<div class=\"tw\"><table><thead><tr><th>Function</th><th>Collocations</th></tr></thead><tbody><tr><td>Introducing an idea</td><td>it is widely believed that, it is generally accepted that, a growing number of people, it is often argued that, there is no doubt that, it goes without saying that</td></tr><tr><td>Giving a reason</td><td>as a result of, due to, owing to, because of, play a role in, contribute to, give rise to, be responsible for, lead to, result in, stem from</td></tr><tr><td>Describing a problem</td><td>pose a threat, put pressure on, take a toll on, raise concerns, face challenges, give rise to problems, cause damage</td></tr><tr><td>Describing a solution</td><td>address the issue, tackle the problem, take action, introduce measures, raise awareness, provide support, bring about change, implement a policy</td></tr><tr><td>Giving evidence</td><td>evidence suggests, studies show, research indicates, statistics reveal, data confirm, according to experts</td></tr><tr><td>Contrasting</td><td>on the other hand, in contrast to, despite the fact that, in spite of, whereas, while it is true that</td></tr><tr><td>Concluding</td><td>in conclusion, to sum up, all things considered, taking everything into account, on balance</td></tr><tr><td>Hedging</td><td>tend to, are likely to, may well, appear to, seem to, to some extent, in many cases</td></tr></tbody></table></div><h3>Quantity phrases</h3><ul><li><b>a vast majority of</b>, <b>a small minority of</b>, <b>a significant proportion of</b></li><li><b>a wide range of</b>, <b>a large number of</b>, <b>a great deal of</b>, <b>a limited amount of</b></li><li><b>an increasing number of</b>, <b>a decreasing number of</b></li></ul><h3>Cause and effect pairs</h3><div class=\"tw\"><table><thead><tr><th>Cause</th><th>Effect</th></tr></thead><tbody><tr><td>contribute to</td><td>problems, growth, an increase</td></tr><tr><td>lead to</td><td>unemployment, stress, a decline</td></tr><tr><td>result in</td><td>damage, a rise, a change</td></tr><tr><td>have an impact / effect on</td><td>health, the economy, society</td></tr><tr><td>give rise to</td><td>tension, debate, concern</td></tr><tr><td>be a major cause of</td><td>illness, pollution, accidents</td></tr></tbody></table></div><p class=\"note\">Learn these as chunks and slot in your own nouns: <em>contribute to … , lead to … , have an impact on …</em></p>"}, {"id": "topic", "t": "Collocations by IELTS topic", "c": "<div class=\"tw\"><table><thead><tr><th>Topic</th><th>Useful collocations</th></tr></thead><tbody><tr><td>Education</td><td>compulsory education, higher education, tuition fees, pass an exam, gain qualifications, a degree course, academic performance, distance learning, peer pressure, a wide range of subjects, school leavers, drop out, catch up, extra-curricular activities, critical thinking skills</td></tr><tr><td>Environment</td><td>climate change, global warming, greenhouse gases, carbon emissions, renewable energy, fossil fuels, protect the environment, endangered species, natural resources, air pollution, waste disposal, deforestation, sea level rise, ecological balance, sustainable development</td></tr><tr><td>Technology</td><td>cutting-edge technology, social media, artificial intelligence, online shopping, keep in touch, digital skills, rely on technology, technological advances, information overload, cyber crime, smart phones, screen time</td></tr><tr><td>Health</td><td>a balanced diet, regular exercise, a sedentary lifestyle, mental health, health care, life expectancy, chronic illness, obesity rates, junk food, take medication, a healthy lifestyle, public health, spread of disease, preventive measures</td></tr><tr><td>Work and economy</td><td>job security, the job market, unemployment rate, work-life balance, earn a living, a decent salary, career prospects, economic growth, the cost of living, a recession, gain experience, meet deadlines, raise taxes, public spending, working conditions</td></tr><tr><td>Crime and law</td><td>commit a crime, crime rate, serve a sentence, law enforcement, a heavy fine, a deterrent, juvenile delinquency, break the law, community service, capital punishment, a criminal record, reduce crime</td></tr><tr><td>Society and family</td><td>a close-knit family, the elderly, an ageing population, generation gap, nuclear family, social problems, a sense of community, peer group, bring up children, family values, divorce rate</td></tr><tr><td>Travel and tourism</td><td>mass tourism, tourist attractions, a popular destination, cultural heritage, boost the economy, local communities, travel abroad, off the beaten track, package holiday, a tourist trap</td></tr><tr><td>Media and advertising</td><td>mass media, the press, a news story, a target audience, an advertising campaign, a social media platform, break the news, the public eye, fake news, a media outlet</td></tr><tr><td>Government and policy</td><td>introduce legislation, pass a law, public transport, invest in, allocate funds, local authorities, a policy, the welfare state, public spending, raise taxes, a tax break, a ban on</td></tr></tbody></table></div><h3>Using topic collocations</h3><div class=\"example\"><p><b>Climate change</b> <b>poses a serious threat to</b> <b>endangered species</b>, so governments should <b>invest in renewable energy</b> and <b>raise awareness</b> of the issue.</p><p class=\"note\">Seven collocations in one sentence, all natural and accurate.</p></div><p class=\"note\">Choose five collocations from a topic and use them in a practice essay. Natural language beats rare words.</p>"}, {"id": "confuse", "t": "Confusing pairs: similar words, different meanings", "c": "<div class=\"tw\"><table><thead><tr><th>Pair</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>economic / economical</td><td>of the economy / cheap to use</td><td>economic growth, an economical car</td></tr><tr><td>historic / historical</td><td>important in history / of history</td><td>a historic victory, historical records</td></tr><tr><td>sensible / sensitive</td><td>practical / easily hurt or aware</td><td>a sensible plan, a sensitive child</td></tr><tr><td>effect / affect</td><td>noun (result) / verb (influence)</td><td>an effect on health; it affects health</td></tr><tr><td>advice / advise</td><td>noun / verb</td><td>good advice; I advise you to go</td></tr><tr><td>practice / practise</td><td>noun (UK); verb (UK)</td><td>practice makes perfect; practise every day</td></tr><tr><td>licence / license</td><td>noun (UK); verb</td><td>a driving licence; license a product</td></tr><tr><td>principal / principle</td><td>main or head / a rule</td><td>the principal reason; a moral principle</td></tr><tr><td>lose / loose</td><td>verb (not win) / not tight</td><td>lose a game; a loose shirt</td></tr><tr><td>quiet / quite</td><td>silent / fairly</td><td>a quiet room; quite good</td></tr><tr><td>through / thorough</td><td>from end to end / complete</td><td>through the tunnel; a thorough check</td></tr><tr><td>stationary / stationery</td><td>not moving / writing materials</td><td>a stationary car; buy stationery</td></tr><tr><td>complement / compliment</td><td>complete / praise</td><td>complement each other; a compliment</td></tr><tr><td>accept / except</td><td>receive / not including</td><td>accept a gift; everyone except me</td></tr><tr><td>dependent / dependant</td><td>relying on / a person who depends (UK)</td><td>dependent on parents; a dependant</td></tr><tr><td>imaginary / imaginative</td><td>not real / creative</td><td>an imaginary friend; an imaginative child</td></tr><tr><td>industrial / industrious</td><td>of industry / hard-working</td><td>industrial waste; an industrious student</td></tr><tr><td>continual / continuous</td><td>repeated / without a break</td><td>continual interruptions; continuous rain</td></tr><tr><td>comprehensible / comprehensive</td><td>understandable / complete</td><td>a comprehensible text; a comprehensive guide</td></tr><tr><td>respectful / respectable / respective</td><td>showing respect / of good reputation / each of two</td><td>respectful children; a respectable job; their respective roles</td></tr><tr><td>childish / childlike</td><td>silly like a child / innocent like a child</td><td>childish behaviour; childlike wonder</td></tr><tr><td>alternate / alternative</td><td>every other / another option</td><td>on alternate days; an alternative plan</td></tr></tbody></table></div><h3>-ing and -ed adjectives</h3><div class=\"example\"><p>The film was boring. (it causes boredom)<br>I was bored. (I feel boredom)</p><p class=\"note\">-ing describes the cause. -ed describes the feeling.</p></div><div class=\"tw\"><table><thead><tr><th>-ing (cause)</th><th>-ed (feeling)</th></tr></thead><tbody><tr><td>interesting</td><td>interested</td></tr><tr><td>exciting</td><td>excited</td></tr><tr><td>surprising</td><td>surprised</td></tr><tr><td>confusing</td><td>confused</td></tr><tr><td>tiring</td><td>tired</td></tr><tr><td>worrying</td><td>worried</td></tr><tr><td>disappointing</td><td>disappointed</td></tr><tr><td>frightening</td><td>frightened</td></tr></tbody></table></div>"}, {"id": "change", "t": "Words that change form", "c": "<h3>Same form, different job</h3><div class=\"tw\"><table><thead><tr><th>Word</th><th>As a noun</th><th>As a verb</th></tr></thead><tbody><tr><td>increase</td><td>There was an increase in sales.</td><td>Sales increase every year.</td></tr><tr><td>decrease</td><td>a decrease in crime</td><td>Crime has decreased.</td></tr><tr><td>research</td><td>Research shows that…</td><td>They research the topic.</td></tr><tr><td>study</td><td>a study of schools</td><td>She studies law.</td></tr><tr><td>use</td><td>the use of computers</td><td>We use computers.</td></tr><tr><td>rise</td><td>a rise in prices</td><td>Prices rise.</td></tr><tr><td>fall</td><td>a fall in sales</td><td>Sales fall.</td></tr><tr><td>change</td><td>a change in policy</td><td>Policy changes.</td></tr><tr><td>support</td><td>government support</td><td>Parents support their children.</td></tr><tr><td>influence</td><td>the influence of media</td><td>Media influences opinions.</td></tr><tr><td>report</td><td>a report on health</td><td>Newspapers report the news.</td></tr></tbody></table></div><h3>Stress changes the word type</h3><div class=\"tw\"><table><thead><tr><th>Noun (stress first syllable)</th><th>Verb (stress second syllable)</th></tr></thead><tbody><tr><td>an <b>IN</b>crease</td><td>to in<b>CREASE</b></td></tr><tr><td>a <b>PRO</b>duct</td><td>to pro<b>DUCE</b></td></tr><tr><td>a <b>RE</b>cord</td><td>to re<b>CORD</b></td></tr><tr><td>a <b>PRE</b>sent</td><td>to pre<b>SENT</b></td></tr><tr><td>an <b>OB</b>ject</td><td>to ob<b>JECT</b></td></tr><tr><td>an <b>EX</b>port</td><td>to ex<b>PORT</b></td></tr></tbody></table></div><h3>Words with no change but a spelling change</h3><ul><li><b>advice → advise</b> (c → s)</li><li><b>practice → practise</b> (UK)</li><li><b>belief → believe</b></li><li><b>proof → prove</b></li><li><b>choice → choose</b></li><li><b>speech → speak</b></li><li><b>success → succeed</b></li></ul><h3>Words that look like one form but are another</h3><ul><li><b>friendly, lovely, lonely, elderly:</b> adjectives ending in -ly.</li><li><b>hard / hardly:</b> works hard, hardly works (almost not).</li><li><b>late / lately:</b> arrived late, has not seen him lately (recently).</li><li><b>high / highly:</b> a high mountain, highly successful.</li><li><b>near / nearly:</b> near the station, nearly finished.</li></ul><h3>Uncountable and plural forms</h3><p>Some noun forms are uncountable or have no plural: <em>information, research, advice, evidence, equipment, knowledge, progress, news, traffic.</em> Some forms are plural in a special way: <em>criterion → criteria, phenomenon → phenomena, analysis → analyses.</em></p>"}, {"id": "tasks", "t": "Word forms in IELTS tasks", "c": "<h3>Reading and Listening gap-fill</h3><ul><li>Look at the words before and after the gap: they show the word type.</li><li>Check singular vs plural: “a …” needs a singular noun, “many …” needs a plural.</li><li>Copy the form exactly as it appears in the text, unless the question tells you to change it.</li><li>Read the instruction: NO MORE THAN TWO WORDS means a hyphenated word counts as one.</li></ul><h3>Writing: improve with correct forms</h3><div class=\"tw\"><table><thead><tr><th>Basic</th><th>Better</th></tr></thead><tbody><tr><td><del>The economy growth is fast.</del></td><td><ins>Economic growth is rapid.</ins></td></tr><tr><td><del>People have different opinion.</del></td><td><ins>People have different opinions.</ins></td></tr><tr><td><del>It is very danger.</del></td><td><ins>It is very dangerous.</ins></td></tr><tr><td><del>This will help to educate.</del></td><td><ins>This will help to educate people.</ins></td></tr><tr><td><del>The government should pollute less.</del></td><td><ins>The government should reduce pollution.</ins></td></tr></tbody></table></div><h3>Using word families to avoid repetition</h3><div class=\"example\"><p>Many people <b>use</b> the Internet. The <b>use</b> of the Internet has grown. <b>Users</b> spend hours online, so it is <b>useful</b> but not always <b>usable</b> for everyone.</p><p class=\"note\">Different forms of one word give variety, but do not force forms that do not exist.</p></div><h3>Paraphrasing with word forms</h3><div class=\"tw\"><table><thead><tr><th>Original</th><th>Paraphrase</th></tr></thead><tbody><tr><td>Pollution is increasing.</td><td>There is an increase in pollution. / Pollution levels are rising.</td></tr><tr><td>People decided to move.</td><td>Their decision was to move.</td></tr><tr><td>The economy is growing fast.</td><td>There is rapid economic growth.</td></tr><tr><td>Education is important.</td><td>The importance of education cannot be overstated.</td></tr><tr><td>Technology develops quickly.</td><td>Technological development is rapid.</td></tr></tbody></table></div><h3>Speaking</h3><ul><li>Use a collocation per answer: <em>heavy traffic, make a decision, a close friend.</em></li><li>Use an adverb collocation to add depth: <em>I strongly believe…, I really enjoy…</em></li><li>Avoid memorised phrases that do not fit the question.</li></ul><h3>Proofreading checklist</h3><ol><li>Underline every word that has an ending like -tion, -ly, -ive, -al.</li><li>Check its job in the sentence.</li><li>Check singular and plural.</li><li>Check any make/do/take/have collocation.</li><li>Read the sentence aloud: does it sound natural?</li></ol>"}, {"id": "mist", "t": "Mistakes people make", "c": "<div class=\"example\"><p><del>Economy growth is rapid.</del> → <ins>Economic growth is rapid.</ins></p><p class=\"note\">An adjective is needed before growth.</p></div><div class=\"example\"><p><del>She decided quick.</del> → <ins>She decided quickly.</ins></p><p class=\"note\">Adverb after a verb.</p></div><div class=\"example\"><p><del>It is a danger place.</del> → <ins>It is a dangerous place.</ins></p><p class=\"note\">Adjective before noun.</p></div><div class=\"example\"><p><del>He did a big mistake.</del> → <ins>He made a big mistake.</ins></p><p class=\"note\">Make a mistake.</p></div><div class=\"example\"><p><del>The pollute is serious.</del> → <ins>The pollution is serious.</ins></p><p class=\"note\">Noun after the.</p></div><div class=\"example\"><p><del>People are depend on cars.</del> → <ins>People depend on cars.</ins></p><p class=\"note\">Do not combine be with a verb.</p></div><div class=\"example\"><p><del>We must protection the environment.</del> → <ins>We must protect the environment.</ins></p><p class=\"note\">Verb after must.</p></div><div class=\"example\"><p><del>She is a success woman.</del> → <ins>She is a successful woman.</ins></p><p class=\"note\">Adjective before a noun.</p></div><div class=\"example\"><p><del>He speaks English fluent.</del> → <ins>He speaks English fluently.</ins></p><p class=\"note\">Adverb after the verb phrase.</p></div><div class=\"example\"><p><del>There are many differents.</del> → <ins>There are many differences.</ins></p><p class=\"note\">Plural noun after many.</p></div><div class=\"example\"><p><del>It is an important to learn.</del> → <ins>It is important to learn.</ins></p><p class=\"note\">Adjective after be, not a noun.</p></div><div class=\"example\"><p><del>She did a decision.</del> → <ins>She made a decision.</ins></p><p class=\"note\">Make a decision.</p></div><div class=\"example\"><p><del>Strong rain fell all day.</del> → <ins>Heavy rain fell all day.</ins></p><p class=\"note\">Heavy rain.</p></div><div class=\"example\"><p><del>I am very agree.</del> → <ins>I strongly agree.</ins></p><p class=\"note\">Agree is a verb, with strongly.</p></div><div class=\"example\"><p><del>He made research on climate.</del> → <ins>He did research on climate.</ins></p><p class=\"note\">Do research.</p></div><div class=\"example\"><p><del>This is a very unique idea.</del> → <ins>This is a unique idea.</ins></p><p class=\"note\">Unique cannot be graded.</p></div><div class=\"example\"><p><del>I am interesting in music.</del> → <ins>I am interested in music.</ins></p><p class=\"note\">-ed for feelings.</p></div><div class=\"example\"><p><del>A lot of informations are available.</del> → <ins>A lot of information is available.</ins></p><p class=\"note\">Information is uncountable.</p></div><div class=\"example\"><p><del>Technology is developing rapid.</del> → <ins>Technology is developing rapidly.</ins></p><p class=\"note\">Adverb after the verb.</p></div><div class=\"example\"><p><del>The government should take a ban.</del> → <ins>The government should introduce a ban.</ins></p><p class=\"note\">Introduce a ban.</p></div>"}, {"id": "pairs", "t": "Pairs and look-alikes", "c": "<div class=\"tw\"><table><thead><tr><th>Pair</th><th>Difference</th><th>Example</th></tr></thead><tbody><tr><td>make / do</td><td>Create vs perform</td><td>make a decision, do research</td></tr><tr><td>say / tell / speak / talk</td><td>Words vs person vs language vs conversation</td><td>say hello, tell a story, speak English, talk about</td></tr><tr><td>see / look / watch</td><td>Notice vs direct eyes vs follow movement</td><td>see a bird, look at a picture, watch a film</td></tr><tr><td>hear / listen</td><td>Receive sound vs pay attention</td><td>hear a noise, listen to music</td></tr><tr><td>raise / rise</td><td>Lift something vs go up</td><td>raise prices, prices rise</td></tr><tr><td>lay / lie</td><td>Put something down vs recline</td><td>lay the table, lie down</td></tr><tr><td>bring / take</td><td>Towards the speaker vs away</td><td>bring it here, take it there</td></tr><tr><td>borrow / lend</td><td>Receive vs give</td><td>borrow a book, lend a book</td></tr><tr><td>fun / funny</td><td>Enjoyable vs makes you laugh</td><td>a fun party, a funny joke</td></tr><tr><td>lonely / alone</td><td>Feeling vs state</td><td>feel lonely, live alone</td></tr><tr><td>strong / heavy</td><td>Depends on the noun</td><td>strong wind, heavy rain</td></tr><tr><td>big / great / large</td><td>Often interchangeable, not always</td><td>a big problem, a great deal, a large number</td></tr><tr><td>high / tall</td><td>Height of objects vs people and thin things</td><td>a high mountain, a tall man</td></tr><tr><td>economy / economics / economist</td><td>System / subject / person</td><td>a strong economy, study economics</td></tr><tr><td>effect / affect</td><td>Noun / verb</td><td>an effect on health, affect health</td></tr><tr><td>person / people / persons</td><td>One / many / formal many</td><td>one person, many people</td></tr><tr><td>advantage / benefit</td><td>Favourable point / positive result</td><td>an advantage over others, a benefit to society</td></tr><tr><td>problem / issue / matter</td><td>Difficulty / topic / subject</td><td>a problem to solve, an issue to discuss</td></tr></tbody></table></div>"}, {"id": "dodont", "t": "Do, don’t and why", "c": "<div class=\"two\"><div><h3>Do</h3><ul><li>Look at the gap to decide the word type.</li><li>Learn word families together.</li><li>Learn collocations in chunks.</li><li>Check -ic/-ical and -ing/-ed pairs in a dictionary.</li><li>Use a collocation dictionary for make, do, take and have.</li><li>Keep a vocabulary notebook sorted by topic.</li></ul></div><div><h3>Don’t</h3><ul><li>Don’t put a noun where an adjective is needed.</li><li>Don’t use an adjective instead of an adverb.</li><li>Don’t translate collocations word by word.</li><li>Don’t mix make and do by guessing.</li><li>Don’t force a word family: some forms do not exist.</li><li>Don’t memorise rare words that you cannot use naturally.</li></ul></div></div><h3>Why we get it wrong</h3><h3>Learning single words</h3><p>Learners store only one form of each word.</p><div class=\"tip\"><p>Try this: Whenever you learn a word, write down its noun, verb, adjective and adverb.</p></div><h3>Word-for-word translation</h3><p>Collocations differ in every language.</p><div class=\"tip\"><p>Try this: Record phrases, not words.</p></div><h3>Reading too fast</h3><p>Endings are easy to skip.</p><div class=\"tip\"><p>Try this: Underline word endings when you proofread.</p></div><h3>Ending confusion</h3><p>Many forms look alike (economic, economical, economy).</p><div class=\"tip\"><p>Try this: Check the meaning of each ending in a dictionary.</p></div><h3>Too many rare words</h3><p>Learners use unusual words with the wrong collocation.</p><div class=\"tip\"><p>Try this: Prefer common words with correct partners.</p></div><h3>Small habits that help</h3><ul><li>Make a word-family table for every new word.</li><li>Highlight collocations while reading.</li><li>Use new collocations in your next essay.</li><li>Review five collocations each morning.</li></ul>"}, {"id": "real", "t": "In IELTS and real life", "c": "<ul><li><b>Speaking:</b> natural collocations (heavy traffic, make a decision, a close friend) show fluency and raise the Lexical Resource score.</li><li><b>Writing Task 1:</b> a sharp increase, a gradual decline, rise dramatically, peak at, remain stable.</li><li><b>Writing Task 2:</b> play a role, pose a threat, raise awareness, address an issue, bring about change.</li><li><b>Reading:</b> a gap-fill often tests the word type, not just the meaning.</li><li><b>Listening:</b> in a form, check whether the gap needs a noun, an adjective or a number.</li></ul><h3>Task 1 collocations</h3><div class=\"tw\"><table><thead><tr><th>Change</th><th>Collocations</th></tr></thead><tbody><tr><td>Up</td><td>rise sharply, increase steadily, a sharp rise, climb gradually, soar, a dramatic increase</td></tr><tr><td>Down</td><td>fall significantly, a slight decline, drop dramatically, decrease steadily, plunge</td></tr><tr><td>Stable</td><td>remain stable, remain steady, stay constant, level off, plateau, show little change</td></tr><tr><td>Peak</td><td>peak at, reach a peak of, hit a low of, bottom out at</td></tr></tbody></table></div><h3>Real-world use</h3><ul><li><b>CVs and emails:</b> “meet deadlines”, “gain experience”, “take responsibility”, “work as part of a team”, “a proven track record”.</li><li><b>Shopping and service:</b> “heavy discount”, “a good deal”, “place an order”, “return an item”.</li><li><b>Study:</b> “do research”, “write an essay”, “take notes”, “pass an exam”, “hand in an assignment”.</li></ul><div class=\"tip\"><p><b>Real world:</b> CVs and emails sound professional with collocations such as “meet deadlines” and “gain experience”.</p></div>"}, {"id": "practice", "t": "Practice", "c": "<h3>Spot the mistake</h3><ol><li>Economy growth is fast.<details><summary>Show answer</summary><ins>Economic growth is fast.</ins></details></li><li>She speaks very clear.<details><summary>Show answer</summary><ins>She speaks very clearly.</ins></details></li><li>He did a mistake.<details><summary>Show answer</summary><ins>He made a mistake.</ins></details></li><li>The pollute is serious.<details><summary>Show answer</summary><ins>The pollution is serious.</ins></details></li><li>Strong rain fell all day.<details><summary>Show answer</summary><ins>Heavy rain fell all day.</ins></details></li><li>I am very agree with you.<details><summary>Show answer</summary><ins>I strongly agree with you.</ins></details></li><li>A lot of informations are available.<details><summary>Show answer</summary><ins>A lot of information is available.</ins></details></li><li>She is a success woman.<details><summary>Show answer</summary><ins>She is a successful woman.</ins></details></li><li>He made research on climate.<details><summary>Show answer</summary><ins>He did research on climate.</ins></details></li><li>I am interesting in music.<details><summary>Show answer</summary><ins>I am interested in music.</ins></details></li></ol><h3>Word forms</h3><ol><li>Change the form: “She is success.”<details><summary>Show answer</summary><ins>She is successful. / She is a success.</ins></details></li><li>Fix: “We must protection nature.”<details><summary>Show answer</summary><ins>We must protect nature.</ins></details></li><li>Complete: The ___ (decide) was difficult.<details><summary>Show answer</summary><ins>decision</ins></details></li><li>Complete: They worked ___ (hard / hardly) all day.<details><summary>Show answer</summary><ins>hard</ins></details></li><li>Complete: He is ___ (danger) to children.<details><summary>Show answer</summary><ins>dangerous</ins></details></li><li>Complete: She spoke very ___ (careful).<details><summary>Show answer</summary><ins>carefully</ins></details></li><li>Complete: There was an ___ (increase) in sales.<details><summary>Show answer</summary><ins>increase</ins></details></li><li>Complete: The film was ___ (bore).<details><summary>Show answer</summary><ins>boring</ins></details></li></ol><h3>Collocations</h3><ol><li>___ progress (make / do)<details><summary>Show answer</summary><ins>make</ins></details></li><li>___ research (make / do)<details><summary>Show answer</summary><ins>do</ins></details></li><li>___ a risk (make / take)<details><summary>Show answer</summary><ins>take</ins></details></li><li>___ traffic (strong / heavy)<details><summary>Show answer</summary><ins>heavy</ins></details></li><li>___ evidence (strong / heavy)<details><summary>Show answer</summary><ins>strong</ins></details></li><li>___ a conclusion (reach / catch)<details><summary>Show answer</summary><ins>reach</ins></details></li><li>___ attention (pay / make)<details><summary>Show answer</summary><ins>pay</ins></details></li><li>___ a role (play / do)<details><summary>Show answer</summary><ins>play</ins></details></li></ol><h3>Fil
