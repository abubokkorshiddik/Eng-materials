<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Reader | English Materials</title>

<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/abubokkorshiddik/Eng-materials/main/10719400.png">
<meta name="theme-color" content="#1f2a44">
<meta name="description" content="Read English grammar books, IELTS practice tests, vocabulary guides and classic literature online with adjustable themes and zoom.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">

<script>
/* Share the same theme setting as the English Materials home page and lessons. */
try {
  var settings = JSON.parse(localStorage.getItem('ielts-gl-reader') || '{}');
  document.documentElement.dataset.theme =
    settings.theme || localStorage.getItem('theme') || 'light';
} catch (e) {}
</script>

<style>
:root {
  --bar: #fff;
  --bg: #e9e7e2;
  --text: #222;
  --line: #0002;
  --accent: #1f4fbf;
  --filter: none;
}

html[data-theme="sepia"] {
  --bar: #efe5cc;
  --bg: #e3d6b8;
  --text: #4a3b26;
  --line: #4a3b2633;
  --accent: #8a4b12;
  --filter: sepia(.5) saturate(.9) brightness(.97);
}

html[data-theme="dark"] {
  --bar: #1b1f29;
  --bg: #10131a;
  --text: #e6e6e6;
  --line: #fff3;
  --accent: #8fb0ff;
  --filter: invert(1) hue-rotate(180deg) brightness(.92);
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 600 14px Inter, system-ui, sans-serif;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}

/* ---------- Toolbar ---------- */
.bar {
  position: sticky;
  top: 0;
  left: 0;
  z-index: 10;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
  padding: 8px 10px;
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  transition: transform .22s ease;
}

.bar.hide { transform: translateY(-100%); }

.bar a,
.bar button {
  color: var(--text);
  background: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 11px;
  font: inherit;
  text-decoration: none;
  cursor: pointer;
  min-height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.bar button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--bar);
  border-color: var(--accent);
}

.grp { display: flex; gap: 6px; align-items: center; }

.bar input {
  width: 64px;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bar);
  color: var(--text);
  font: inherit;
  text-align: center;
  min-height: 34px;
}

#zl { min-width: 50px; font-size: 12px; }

.title {
  flex: 1 1 100%;
  font-size: 13px;
  opacity: .8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 3px;
}

#progressBar {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width .15s;
}

/* ---------- Pages ---------- */
#pages {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 12px 0 80px;
}

/* Auto margins centre a page, and let a zoomed page scroll sideways */
.pg {
  flex: none;
  margin: 0 auto;
  background: #fff;
  box-shadow: 0 1px 6px #0003;
  overflow: hidden;
}

.pg canvas {
  display: block;
  width: 100%;
  height: auto;
  filter: var(--filter);
}

.pg.empty { background: var(--bar); }

#msg {
  text-align: center;
  padding: 40px 16px;
  line-height: 1.8;
}

#msg a { color: var(--accent); }

/* Floating page counter, shown briefly while the toolbar is hidden */
#pill {
  position: fixed;
  left: 50%;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--bar);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 12px;
  box-shadow: 0 2px 8px #0003;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 9;
}

#pill.show { opacity: .95; }

/* ---------- Google Drive mode ---------- */
body.drive {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

body.drive .bar { position: relative; transform: none; flex: none; }
body.drive .pdf-only { display: none !important; }
body.drive #pages,
body.drive #pill,
body.drive #progress { display: none; }

#frame {
  flex: 1;
  width: 100%;
  min-height: 0;
  border: 0;
  background: var(--bg);
}

#note {
  display: none;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  opacity: .85;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
  text-align: center;
  flex: none;
}

body.drive #note { display: block; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

@media (max-width: 480px) {
  .bar { gap: 7px; }
  .bar a, .bar button { padding: 7px 9px; }
  .grp { gap: 4px; }
}

/* Landscape phones: slim toolbar on one row, title hidden */
@media (orientation: landscape) and (max-height: 500px) {
  .bar {
    padding-top: calc(4px + env(safe-area-inset-top, 0px));
    padding-bottom: 4px;
    gap: 6px;
    flex-wrap: nowrap;
    overflow-x: auto;
  }

  .title { display: none; }
  .bar a, .bar button, .bar input { min-height: 30px; padding-top: 3px; padding-bottom: 3px; }
  #pages { padding-top: 6px; }
  #note { display: none !important; }
}
</style>
</head>

<body>

<header class="bar" id="bar">
  <div class="grp">
    <a href="./index.html#reader">← Library</a>
  </div>

  <div class="grp pdf-only" aria-label="Page navigation">
    <button id="prev" type="button" aria-label="Previous page">‹</button>
    <input id="num" type="number" min="1" value="1" inputmode="numeric" aria-label="Page number">
    <span id="tot">/ …</span>
    <button id="next" type="button" aria-label="Next page">›</button>
  </div>

  <div class="grp pdf-only" aria-label="Zoom controls">
    <button id="zo" type="button" aria-label="Zoom out">−</button>
    <button id="zl" type="button" aria-label="Reset zoom">100%</button>
    <button id="zi" type="button" aria-label="Zoom in">+</button>
  </div>

  <div class="grp pdf-only">
    <button id="fit" type="button" aria-label="Switch between fit width and fit page">Fit width</button>
  </div>

  <div class="grp pdf-only" id="th" aria-label="Reading theme">
    <button type="button" data-t="light">Light</button>
    <button type="button" data-t="sepia">Sepia</button>
    <button type="button" data-t="dark">Dark</button>
  </div>

  <div class="grp">
    <a id="dl" href="#" target="_blank" rel="noopener">Download</a>
  </div>

  <div class="title" id="title">Loading book…</div>

  <div id="progress" aria-hidden="true"><div id="progressBar"></div></div>
</header>

<div id="note">
  This book opens in Google Drive's viewer. Pinch to zoom, and rotate your phone for a wider page.
</div>

<div id="msg" role="status" aria-live="polite">Opening book…</div>
<div id="pages"></div>
<div id="pill" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
(function () {
  "use strict";

  const RAW =
    "https://raw.githubusercontent.com/abubokkorshiddik/Eng-materials/main/";

  /*
    All books in the English Materials library.
    The key must match the b= value in the reader.html links.
      f = file name in the GitHub repository (PDF.js reader)
      d = Google Drive file ID (Google Drive viewer, because Drive does not
          allow PDF.js to read its files)
  */
  const BOOKS = {
    /* Grammar */
    adv:      { t: "Advanced Grammar in Use", f: "Advanced%20grammar%20in%20use.pdf" },
    oxford:   { t: "Oxford Guide to English Grammar", f: "Oxford-Guide-to-English-Grammar.pdf" },
    grammar:  { t: "English Grammar in Use (Intermediate)", f: "English-Grammer-In-Use-Intermediatr.pdf" },
    wren:     { t: "High School English Grammar and Composition", f: "the-languagelab-library-high-school-english-grammar-and-composition-wren-and-martin-ZmlD.pdf" },
    mistakes: { t: "Common Mistakes in English", f: "common-mistakes-in-english-by-t-j-fitikides.pdf" },

    /* Vocabulary */
    gre:      { t: "GRE Word Smart", f: "GRE-book-Word-Smart(1).pdf" },
    check:    { t: "Check Your English Vocabulary for IELTS", f: "1.3rawdon-wyatt-check-your-english-vocabulary-for-ielts_-essential-words-and-phrases-to-help-you-maximise-your-ielts-score-bloomsbury-information-ltd-2017.pdf" },
    vocab:    { t: "IELTS Vocabulary Booster", f: "IELTS%20Vocabulary%20Booster.pdf" },

    /* For Bangladeshi students */
    master:   { t: "Master English", f: "Master%20English%20%5Bbdniyog.com%5D.pdf" },
    prof:     { t: "Professors English for Compact and Exam", d: "1FdicA1s7lZwceed9l-4_axl8aY2Hhhp0" },

    /* English books */
    curious:       { t: "The Curious Incident of the Dog in the Night-Time", f: "the_curious_incident_of_the_dog_in_the_night_time.pdf" },
    metamorphosis: { t: "The Metamorphosis", f: "the-metamorphosis.pdf" },
    alchemist:     { t: "The Alchemist", f: "The-Alchemist-Paulo-Coelho.pdf" },
    tom:           { t: "The Adventures of Tom Sawyer", f: "THE%20ADVENTURES%20OF%20TOM%20SAWYER%20BY%20MARK%20TWAIN.pdf" },
    huck:          { t: "The Adventures of Huckleberry Finn", f: "the-adventures-of-huckleberry-finn.pdf" },
    farm:          { t: "Animal Farm", f: "Animal%20Farm%20by%20George%20Orwell.pdf" },
    n1984:         { t: "Nineteen Eighty-Four", f: "orwell1984.pdf" }
  };

  /* Cambridge IELTS 1-19 (Google Drive) */
  const IELTS = {
    1:  "1_5B82d0NWdK5d-XL46WImC5iRFneuM0F",
    2:  "1XHyckjrqsQwrIBr7PfCZcMl6P-XBWgkC",
    3:  "1q0XTaOoYGAMahrXNgukzLID4NVE3zlHV",
    4:  "1L33JdTi5A_eMMIKTSknsvwD3DtUr9lBE",
    5:  "1aI9_Wr6KpTLp7CeDf_XPSbNGm9HrzFXm",
    6:  "1k8KMNx_CCq3IAq99el59pEhMoS1rt5tW",
    7:  "14tmtwhCaC2OfDVMtXcBdzQc0HqK6g1HB",
    8:  "1HJBTWw4KS3m0jpwW_NhHSNt5QLJ5G2P_",
    9:  "1H26uEWHLmb_0DJ6Kf9WLkKJFSWc9Bt02",
    10: "1uzorQFIjiNtB3_oNzj3_gVQu25KS8gpk",
    11: "1RECjEHE4AXWHl7ub-xMZc8nDvG7LO_EU",
    12: "1L_jHQoqTHe2J4xm4n6Ca23tffI6pjJyv",
    13: "1Kq-H3sjXQ2Ph-Lq2sJHIG1C7qgUa6bg9",
    14: "1rmrCW6u16_iNDfxAHDTSVn0ecoBDF94L",
    15: "19FrzaAnhZSeL6mwBLoh3AVQEEF2RgMKO",
    16: "1JAXqAWSTTUItx500lEHELhxVH2tlVCSQ",
    17: "1l6o_9a22XmVFWiqrTFQyh-Fbi4M9Mfgv",
    18: "17Y-bWP2yu5VHYdItmQNQXMzoKk8Dy1nK",
    19: "1uQyyxf3FNHo1EHKoWobcDAJBmPVKAxBv"
  };

  Object.keys(IELTS).forEach(n => {
    BOOKS["ielts" + n] = { t: "Cambridge IELTS " + n, d: IELTS[n] };
  });

  const $ = id => document.getElementById(id);

  const params = new URLSearchParams(location.search);
  const requestedBook = params.get("b") || "grammar";
  const bookKey = BOOKS[requestedBook] ? requestedBook : "grammar";
  const book = BOOKS[bookKey];
  const isDrive = !!book.d;

  document.title = book.t + " | English Materials Reader";
  $("title").textContent = book.t;

  /* Safe storage helpers. Settings are shared with the home page. */
  const SETTINGS_KEY = "ielts-gl-reader";

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) {} },
    getSettings() {
      try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}"); }
      catch (e) { return {}; }
    },
    setSettings(s) {
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
    }
  };

  /* Allow both portrait and landscape (works where the browser supports it) */
  try {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  } catch (e) {}

  /* Download link */
  $("dl").href = isDrive
    ? "https://drive.google.com/uc?export=download&id=" + book.d
    : RAW + book.f;

  /* ---------- Theme ---------- */
  function setTheme(theme) {
    if (!["light", "sepia", "dark"].includes(theme)) theme = "light";

    document.documentElement.dataset.theme = theme;

    const s = store.getSettings();
    s.theme = theme;
    store.setSettings(s);
    store.set("theme", theme); /* older setting, kept for compatibility */

    document.querySelectorAll("#th button").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.t === theme));
    });
  }

  document.querySelectorAll("#th button").forEach(b => {
    b.addEventListener("click", () => setTheme(b.dataset.t));
  });

  setTheme(document.documentElement.dataset.theme || "light");

  /* ---------- Google Drive mode ---------- */
  if (isDrive) {
    document.body.classList.add("drive");
    $("msg").remove();

    const frame = document.createElement("iframe");
    frame.id = "frame";
    frame.title = book.t;
    frame.allow = "fullscreen";
    frame.src = "https://drive.google.com/file/d/" + book.d + "/preview";
    document.body.appendChild(frame);
    return;
  }

  /* ---------- PDF.js mode ---------- */
  if (typeof pdfjsLib === "undefined") {
    $("msg").textContent =
      "The PDF reader could not load. Please check your internet connection and reload the page.";
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  let pdf = null;
  let ratio = 1.4;
  let zoom = Number(store.get("zoom:" + bookKey) || store.get("zoom") || 1);
  if (!isFinite(zoom) || zoom < 0.6 || zoom > 2.5) zoom = 1;
  let fit = store.get("fit") === "page" ? "page" : "width";
  let cur = 1;
  let ready = false;
  let pages = [];
  let lastW = 0;
  let lastH = 0;
  let resizeTimer;

  const box = $("pages");
  const bar = $("bar");
  const pill = $("pill");
  const busy = Object.create(null);

  /*
    Page width.
    Fit width: the page fills the screen width (best in portrait).
    Fit page: the whole page fits the screen height (best in landscape).
  */
  function width() {
    let w = Math.min(box.clientWidth - 16, 1100);

    if (fit === "page") {
      const h = window.innerHeight - 20;
      w = Math.min(w, h / ratio);
    }

    return Math.max(200, w * zoom);
  }

  function updateLabels() {
    $("zl").textContent = Math.round(zoom * 100) + "%";
    $("fit").textContent = fit === "page" ? "Fit page" : "Fit width";
  }

  updateLabels();

  /* Render nearby pages only, to save memory on mobile devices. */
  const lazy = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const n = Number(entry.target.dataset.n);
      if (entry.isIntersecting) draw(n); else drop(n);
    });
  }, { rootMargin: "1500px 0px" });

  /* Keep page number and progress in sync with scrolling. */
  const mid = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;

      cur = Number(entry.target.dataset.n);
      $("num").value = cur;
      pill.textContent = cur + " / " + (pdf ? pdf.numPages : "…");

      if (ready) store.set("p:" + bookKey, String(cur));

      $("progressBar").style.width =
        (pdf ? (cur / pdf.numPages) * 100 : 0) + "%";
    });
  }, { rootMargin: "-45% 0px -54% 0px" });

  async function draw(n) {
    const el = pages[n - 1];
    if (!el || el.querySelector("canvas") || busy[n]) return;

    busy[n] = true;

    try {
      const page = await pdf.getPage(n);
      const targetWidth = width();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      const base = page.getViewport({ scale: 1 });
      const viewport = page.getViewport({ scale: (targetWidth / base.width) * dpr });

      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);

      const ctx = canvas.getContext("2d", { alpha: false });
      if (!ctx) throw new Error("Canvas is unavailable.");

      await page.render({ canvasContext: ctx, viewport }).promise;

      /* Skip if the layout changed while this page was rendering. */
      if (pages[n - 1] === el && Math.abs(parseFloat(el.style.width) - targetWidth) < 2) {
        el.classList.remove("empty");
        el.replaceChildren(canvas);
      }
    } catch (error) {
      console.error("Could not render PDF page " + n, error);
    } finally {
      busy[n] = false;
    }
  }

  function drop(n) {
    const el = pages[n - 1];
    if (el && el.firstChild && !busy[n]) {
      el.replaceChildren();
      el.classList.add("empty");
    }
  }

  function layout() {
    lazy.disconnect();
    mid.disconnect();

    const targetWidth = width();
    lastW = box.clientWidth;
    lastH = window.innerHeight;

    pages.forEach(el => {
      el.style.width = targetWidth + "px";
      el.style.height = (targetWidth * ratio) + "px";
      el.replaceChildren();
      el.classList.add("empty");

      lazy.observe(el);
      mid.observe(el);
    });
  }

  function scrollToPage(n, fraction) {
    const el = pages[n - 1];
    if (!el) return;

    const top = el.getBoundingClientRect().top + window.scrollY +
      (fraction || 0) * el.offsetHeight - 6;

    window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
  }

  function go(n) {
    if (!pdf || !pages.length) return;

    n = Math.max(1, Math.min(pdf.numPages, Math.trunc(Number(n) || 1)));
    cur = n;
    $("num").value = n;
    scrollToPage(n, 0);
  }

  /* Re-layout and keep the same spot on the same page (used on rotation and zoom). */
  function relayout() {
    if (!pdf) return;

    const el = pages[cur - 1];
    let fraction = 0;

    if (el && el.offsetHeight) {
      fraction = Math.max(0, Math.min(0.95, -el.getBoundingClientRect().top / el.offsetHeight));
    }

    const page = cur;
    layout();
    scrollToPage(page, fraction);
  }

  /* Load the requested PDF. */
  async function loadBook() {
    try {
      const task = pdfjsLib.getDocument({
        url: RAW + book.f,
        disableAutoFetch: true,
        rangeChunkSize: 262144
      });

      pdf = await task.promise;

      const first = await pdf.getPage(1);
      const vp = first.getViewport({ scale: 1 });
      ratio = vp.height / vp.width;

      $("msg").remove();
      $("tot").textContent = "/ " + pdf.numPages;
      $("num").max = pdf.numPages;
      $("num").min = 1;

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = document.createElement("div");
        page.className = "pg empty";
        page.dataset.n = i;
        page.setAttribute("aria-label", "Page " + i);
        box.appendChild(page);
        pages.push(page);
      }

      layout();

      const lastPage = Number(store.get("p:" + bookKey) || 1);
      go(lastPage);

      /* Start saving positions only after the saved page is restored. */
      setTimeout(() => { ready = true; }, 600);

    } catch (error) {
      console.error("PDF loading failed:", error);

      $("msg").innerHTML =
        "Could not load this book. Check your internet connection or open the PDF directly.<br><br>" +
        '<a href="' + RAW + book.f + '" target="_blank" rel="noopener">Open the PDF directly</a>';
    }
  }

  /* ---------- Controls ---------- */
  $("prev").addEventListener("click", () => go(cur - 1));
  $("next").addEventListener("click", () => go(cur + 1));

  $("num").addEventListener("change", e => go(e.target.value));
  $("num").addEventListener("keydown", e => {
    if (e.key === "Enter") { go(e.target.value); e.target.blur(); }
  });

  function setZoom(value) {
    zoom = Math.max(0.6, Math.min(2.5, Math.round(value * 100) / 100));

    store.set("zoom:" + bookKey, String(zoom));
    store.set("zoom", String(zoom));
    updateLabels();
    relayout();
  }

  $("zi").addEventListener("click", () => setZoom(zoom + 0.2));
  $("zo").addEventListener("click", () => setZoom(zoom - 0.2));
  $("zl").addEventListener("click", () => setZoom(1));

  $("fit").addEventListener("click", () => {
    fit = fit === "page" ? "width" : "page";
    store.set("fit", fit);
    updateLabels();
    relayout();
  });

  /* Keyboard navigation */
  window.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;

    if (e.key === "ArrowRight") go(cur + 1);
    if (e.key === "ArrowLeft") go(cur - 1);
  });

  /* ---------- Auto-hide toolbar for distraction-free reading ---------- */
  let lastY = window.scrollY;
  let ticking = false;
  let pillTimer;

  function showPill() {
    pill.classList.add("show");
    clearTimeout(pillTimer);
    pillTimer = setTimeout(() => pill.classList.remove("show"), 1200);
  }

  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;

    requestAnimationFrame(() => {
      const y = window.scrollY;
      const delta = y - lastY;

      if (y < 80) {
        bar.classList.remove("hide");
      } else if (delta > 8) {
        bar.classList.add("hide");
        showPill();
      } else if (delta < -8) {
        bar.classList.remove("hide");
      }

      lastY = y;
      ticking = false;
    });
  }, { passive: true });

  /* Tap a page to show or hide the toolbar */
  box.addEventListener("click", () => {
    bar.classList.toggle("hide");
    if (bar.classList.contains("hide")) showPill();
  });

  /* ---------- Rotation and resizing ----------
     Mobile browsers also fire resize when the address bar hides, which must
     not reset the pages. So re-layout only when the width changes, or, in
     Fit page mode, when the height changes by a lot (a real rotation). */
  function onResize() {
    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(() => {
      if (!pdf) return;

      const widthChanged = Math.abs(box.clientWidth - lastW) > 4;
      const heightChanged = fit === "page" && Math.abs(window.innerHeight - lastH) > 100;

      if (widthChanged || heightChanged) relayout();
    }, 200);
  }

  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", () => setTimeout(onResize, 350));

  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener("change", () => setTimeout(onResize, 350));
  }

  loadBook();
})();
</script>

</body>
</html>
