body{margin:0;background:var(--paper);color:var(--text);font:18px/1.7 Literata,Georgia,serif;overflow-wrap:anywhere;padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}

body{background:var(--desk);font-size:1.125rem;padding-top:var(--top,100px)}

.pane h2{margin:6px 0 10px;text-align:center}.pane>p.m{text-align:center}

.ib{width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;position:relative;flex:none}.ib:hover{background:var(--line)}.ib svg{pointer-events:none}

#cnt2{position:absolute;top:2px;right:0;background:var(--blue);color:var(--paper);border-radius:99px;padding:0 5px;font:600 10px/15px Inter,sans-serif}

.sh{margin:16px 0 6px;font:600 .72rem Inter,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{font:600 .8rem Inter,sans-serif;border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}.chip.on{background:var(--ink);color:var(--paper)}

.flash{background:color-mix(in srgb,var(--blue) 18%,transparent)}

.pane h3{margin:22px 0 8px;font-size:1.15rem}.hint{font-size:.82rem;margin:6px 0}

.si{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--text);font:1rem Inter,sans-serif}
.pn{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:28px;border-top:1px solid var(--rule);padding-top:14px}.pn .btn{margin:0}
#toc{position:fixed;left:0;top:var(--top,60px);bottom:0;width:min(88vw,300px);background:var(--sheet);color:var(--text);border-right:1px solid var(--rule);z-index:41;overflow:auto;transform:translateX(-102%);transition:transform .25s;padding:12px 16px 24px;box-shadow:2px 0 20px rgba(0,0,0,.35);font-family:Inter,sans-serif}

.tp{font:700 .95rem Fraunces,serif;color:var(--ink);margin:16px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.te{display:flex;align-items:baseline;gap:6px;width:100%;background:none;border:0;padding:8px 2px;text-align:left;cursor:pointer;color:var(--text);font:500 .92rem Inter,sans-serif}.te .n{width:1.5em;flex:none;color:var(--muted)}.te .t{flex:none;max-width:75%}.te .l{flex:1;min-width:10px;border-bottom:1px dotted var(--muted);transform:translateY(-3px)}.te small{flex:none;color:var(--muted);font:500 .72rem Inter,sans-serif}.te.on .t{color:var(--blue);font-weight:700}.te:hover .t{text-decoration:underline}
@media(min-width:1000px){#toc{box-shadow:none;z-index:25;width:290px}body{transition:padding-left .25s}body.tocOpen{padding-left:290px}}
