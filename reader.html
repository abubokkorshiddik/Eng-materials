<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reader | English Materials</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){}</script>
<style>
:root{--bar:#fff;--bg:#e9e7e2;--text:#222;--line:#0002;--accent:#1f4fbf;--filter:none}
html[data-theme=sepia]{--bar:#efe5cc;--bg:#e3d6b8;--text:#4a3b26;--line:#4a3b2633;--accent:#8a4b12;--filter:sepia(.5) saturate(.9) brightness(.97)}
html[data-theme=dark]{--bar:#1b1f29;--bg:#10131a;--text:#e6e6e6;--line:#fff3;--accent:#8fb0ff;--filter:invert(1) hue-rotate(180deg) brightness(.92)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:600 14px Inter,system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.bar a,.bar button{color:var(--text);background:none;border:1px solid var(--line);border-radius:6px;padding:7px 11px;font:inherit;text-decoration:none;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--accent);color:var(--bar);border-color:var(--accent)}
.grp{display:flex;gap:6px;align-items:center}
.bar input{width:64px;padding:7px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--text);font:inherit;text-align:center}
.title{flex:1 1 100%;font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pages{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0 60px}
.pg{background:#fff;box-shadow:0 1px 6px #0003;max-width:100%;overflow:hidden}
.pg canvas{display:block;width:100%;height:auto;filter:var(--filter)}
.pg.empty{background:var(--bar)}
#msg{text-align:center;padding:40px 16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="bar">
<div class="grp"><a href="index.html#reader">← Back</a></div>
<div class="grp"><button id="prev" aria-label="Previous page">‹</button><input id="num" type="number" min="1" value="1" aria-label="Page number"><span id="tot">/ –</span><button id="next" aria-label="Next page">›</button></div>
<div class="grp"><button id="zo" aria-label="Zoom out">−</button><button id="zi" aria-label="Zoom in">+</button></div>
<div class="grp" id="th"><button data-t="light">Light</button><button data-t="sepia">Sepia</button><button data-t="dark">Dark</button></div>
<div class="title" id="title">Loading…</div>
</div>
<div id="msg">Opening book…</div>
<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const RAW='https://raw.githubusercontent.com/abubokkorshiddik/Eng-materials/main/';
const BOOKS={
 grammar:{t:'English Grammar in Use (Intermediate)',f:'English-Grammer-In-Use-Intermediatr.pdf'},
 vocab:{t:'IELTS Vocabulary Booster',f:'IELTS%20Vocabulary%20Booster.pdf'},
 wren:{t:'High School English Grammar and Composition (Wren & Martin)',f:'the-languagelab-library-high-school-english-grammar-and-composition-wren-and-martin-ZmlD.pdf'}
};
const $=id=>document.getElementById(id);
const key=new URLSearchParams(location.search).get('b')||'grammar';
const book=BOOKS[key]||BOOKS.grammar;
document.title=book.t+' | Reader';$('title').textContent=book.t;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// Theme
function setTheme(t){document.documentElement.dataset.theme=t;store.set('theme',t);document.querySelectorAll('#th button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))}
document.querySelectorAll('#th button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
setTheme(document.documentElement.dataset.theme);

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdf,ratio=1.4,zoom=+(store.get('zoom')||1),cur=1,pages=[];
const box=$('pages');

function width(){return Math.min(box.clientWidth-16,900)*zoom}

const lazy=new IntersectionObserver(es=>es.forEach(e=>{
  const n=+e.target.dataset.n;
  e.isIntersecting?draw(n):drop(n);
}),{rootMargin:'1500px 0px'});

const mid=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){cur=+e.target.dataset.n;$('num').value=cur;store.set('p:'+key,cur)}
}),{rootMargin:'-45% 0px -54% 0px'});

const busy={};
async function draw(n){
  const el=pages[n-1];
  if(el.querySelector('canvas')||busy[n])return;
  busy[n]=1;
  try{
    const p=await pdf.getPage(n);
    const w=width(),dpr=Math.min(window.devicePixelRatio||1,2);
    const vp1=p.getViewport({scale:1}),s=(w/vp1.width)*dpr;
    const vp=p.getViewport({scale:s});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    el.classList.remove('empty');el.replaceChildren(c);
  }catch(e){}
  busy[n]=0;
}
function drop(n){const el=pages[n-1];if(el&&el.firstChild){el.replaceChildren();el.classList.add('empty')}}

function layout(){
  lazy.disconnect();mid.disconnect();
  const w=width();
  pages.forEach(el=>{el.style.width=w+'px';el.style.height=(w*ratio)+'px';el.replaceChildren();el.classList.add('empty');lazy.observe(el);mid.observe(el)});
}
function go(n){n=Math.max(1,Math.min(pdf.numPages,n|0));pages[n-1].scrollIntoView();}

(async()=>{
  try{
    pdf=await pdfjsLib.getDocument({url:RAW+book.f,disableAutoFetch:true,rangeChunkSize:262144}).promise;
    const p1=await pdf.getPage(1),v=p1.getViewport({scale:1});ratio=v.height/v.width;
    $('msg').remove();$('tot').textContent='/ '+pdf.numPages;$('num').max=pdf.numPages;
    for(let i=1;i<=pdf.numPages;i++){const d=document.createElement('div');d.className='pg empty';d.dataset.n=i;box.appendChild(d);pages.push(d)}
    layout();
    const last=+store.get('p:'+key)||1;if(last>1)go(last);
  }catch(e){$('msg').innerHTML='Could not load the book. <a href="'+RAW+book.f+'">Open the PDF directly</a>.'}
})();

$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
$('num').onchange=e=>go(+e.target.value);
function setZoom(z){zoom=Math.max(.6,Math.min(2.5,z));store.set('zoom',zoom);const n=cur;layout();go(n)}
$('zi').onclick=()=>setZoom(zoom+.2);$('zo').onclick=()=>setZoom(zoom-.2);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(pdf){const n=cur;layout();go(n)}},250)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
</script>
</body>
</html>
