var CH=[{"id": "why", "t": "What is subject–verb agreement?", "c": "<p class=\"say\">A verb must match its subject. A singular subject takes a singular verb, and a plural subject takes a plural verb. The idea is simple, but the difficulty grows quickly: long subjects, phrases in between, group nouns, quantities and formal word order can all hide the real subject.</p><div class=\"example\"><p>The student studies English.<br>The students study English.</p><p class=\"note\">The -s moves from the verb to the noun.</p></div><div class=\"example\"><p>The quality of the products is improving.<br>The products are improving.</p><p class=\"note\">Find the real subject first.</p></div><h3>Why it matters</h3><ul><li><b>Writing:</b> agreement is one of the most checked accuracy points in IELTS Writing.</li><li><b>Speaking:</b> fluent speech needs agreement to be automatic.</li><li><b>Reading and Listening:</b> agreement clues reveal who the sentence is about.</li></ul><h3>Your path</h3><p>Work through the three levels in order. Each page has tables, examples and a ten-question quiz.</p>"}, {"id": "levels", "t": "Choose your level", "c": "<div class=\"tw\"><table><thead><tr><th>Level</th><th>You will learn</th><th>Open</th></tr></thead><tbody><tr><td>Level 1 · Beginner</td><td>Basic rule, adding -s/-es, the verb be, negatives and questions</td><td><a href=\"subject-verb-agreement-beginner.html\">Start Level 1 →</a></td></tr><tr><td>Level 2 · Intermediate</td><td>Finding the real subject, either/or, indefinite pronouns, collective nouns, amounts, there is/are</td><td><a href=\"subject-verb-agreement-intermediate.html\">Start Level 2 →</a></td></tr><tr><td>Level 3 · Advanced</td><td>One of / the only one, inversion, a number of / the number of, percentages, titles, gerund subjects, academic diagnosis</td><td><a href=\"subject-verb-agreement-advanced.html\">Start Level 3 →</a></td></tr></tbody></table></div><h3>Which level should I choose?</h3><ul><li>Often write “he go” or “they is”? Start with <b>Level 1</b>.</li><li>Mostly correct, but unsure with everyone, neither, committee? Try <b>Level 2</b>.</li><li>Preparing for Band 7 or higher? Study <b>Level 3</b> and then take all three quizzes.</li></ul><p class=\"note\">Tip: take the quiz on this page first. If you score 9 or 10, move straight to Level 3.</p>"}, {"id": "rules", "t": "The rules at a glance", "c": "<div class=\"tw\"><table><thead><tr><th>Rule</th><th>Example</th><th>Level</th></tr></thead><tbody><tr><td>Present simple: he/she/it + -s</td><td>She works every day.</td><td>1</td></tr><tr><td>Plural noun, plural verb</td><td>The students study English.</td><td>1</td></tr><tr><td>be: am / is / are, was / were</td><td>I am, she is, they are.</td><td>1</td></tr><tr><td>After does / doesn’t, base verb</td><td>She doesn’t like tea.</td><td>1</td></tr><tr><td>Ignore phrases between subject and verb</td><td>The quality of the products is improving.</td><td>2</td></tr><tr><td>A and B = plural</td><td>Research and innovation are essential.</td><td>2</td></tr><tr><td>either…or, neither…nor: nearer subject</td><td>Neither the students nor the teacher is here.</td><td>2</td></tr><tr><td>everyone, each, either, neither = singular</td><td>Everyone is ready.</td><td>2</td></tr><tr><td>both, few, many, several = plural</td><td>Several reports contain errors.</td><td>2</td></tr><tr><td>Collective nouns: one unit = singular</td><td>The committee has decided.</td><td>2</td></tr><tr><td>Amounts as a total = singular</td><td>Five years is a long time.</td><td>2</td></tr><tr><td>there is / there are agrees with what follows</td><td>There are several reasons.</td><td>2</td></tr><tr><td>one of the + plural + who → plural</td><td>She is one of the researchers who work here.</td><td>3</td></tr><tr><td>the only one … who → singular</td><td>She is the only one who works here.</td><td>3</td></tr><tr><td>a number of = plural, the number of = singular</td><td>A number of studies have shown this.</td><td>3</td></tr><tr><td>Percentages follow the noun after of</td><td>Sixty per cent of participants live in cities.</td><td>3</td></tr><tr><td>Title of one work = singular</td><td>Great Expectations is a novel.</td><td>3</td></tr><tr><td>Gerund subject = singular</td><td>Collecting data is essential.</td><td>3</td></tr></tbody></table></div>"}, {"id": "traps", "t": "The common traps", "c": "<div class=\"tw\"><table><thead><tr><th>Trap</th><th>Wrong</th><th>Right</th></tr></thead><tbody><tr><td>Phrase in the middle</td><td><del>The quality of the products are improving.</del></td><td><ins>The quality of the products is improving.</ins></td></tr><tr><td>Everyone / each</td><td><del>Everyone have a role.</del></td><td><ins>Everyone has a role.</ins></td></tr><tr><td>Doesn’t + s</td><td><del>She doesn’t likes tea.</del></td><td><ins>She doesn’t like tea.</ins></td></tr><tr><td>A number of</td><td><del>A number of studies has shown this.</del></td><td><ins>A number of studies have shown this.</ins></td></tr><tr><td>Inversion</td><td><del>Among the findings is several associations.</del></td><td><ins>Among the findings are several associations.</ins></td></tr><tr><td>Uncountable noun</td><td><del>The evidence suggest a change.</del></td><td><ins>The evidence suggests a change.</ins></td></tr><tr><td>Neither … nor</td><td><del>Neither the students nor the teacher are here.</del></td><td><ins>Neither the students nor the teacher is here.</ins></td></tr></tbody></table></div><h3>The five-step check</h3><ol><li>Find the verb.</li><li>Ask who or what does it.</li><li>Ignore phrases between the subject and the verb.</li><li>Decide singular or plural.</li><li>Match the verb.</li></ol>"}, {"id": "ielts", "t": "Agreement in IELTS", "c": "<ul><li><b>Task 1:</b> data nouns need care: <em>The number of visitors was…, The figures were…, The proportion of men was…</em></li><li><b>Task 2:</b> long subjects (<em>The growing number of people who use social media has…</em>) hide the real subject.</li><li>
