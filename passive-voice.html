<main>
<h1>Passive voice</h1>
<p class="m">Intermediate level · Use the passive when the action or the result matters more than who did it.</p>
<div id="panes"></div>
</main>

var CH=[{"id": "plain", "t": "In plain words", "c": "<p class=\"say\">In an active sentence the subject does the action: <em>Scientists discovered a new planet.</em> In a passive sentence the thing that receives the action becomes the subject: <em>A new planet was discovered.</em> Same facts, different focus. In academic writing, reports and process descriptions we often do not know who did the action, or it does not matter, so the passive fits perfectly. The pattern never changes: a form of <b>be</b> plus the <b>past participle</b>.</p><h3>How to build it</h3><div class=\"rule\"><p><b>Pattern</b> subject + be + past participle (+ by agent)</p><p><b>Present</b> The report is written every year.</p><p><b>Past</b> The bridge was built in 1990.</p><p><b>Perfect</b> The problem has been solved.</p><p><b>Future</b> The results will be announced tomorrow.</p><p><b>Modal</b> The rules must be followed.</p><p><b>Continuous</b> The road is being repaired.</p></div>"}, {"id": "use", "t": "When we use it", "c": "<h3>The doer is unknown or unimportant</h3><div class=\"example\"><p>My bike was stolen.</p><p class=\"note\">We do not know who did it, and it does not matter.</p></div><h3>The result matters more</h3><div class=\"example\"><p>The experiment was repeated three times.</p><p class=\"note\">Typical academic style.</p></div><h3>Describing a process</h3><div class=\"example\"><p>First the glass is collected. Then it is sorted by colour.</p><p class=\"note\">Very common in IELTS Task 1 process diagrams.</p></div><h3>Formal and impersonal</h3><div class=\"example\"><p>It is believed that the policy will work.</p><p class=\"note\">Common in reports and news.</p></div><h3>Naming the doer with by</h3><div class=\"example\"><p>The Mona Lisa was painted by Leonardo da Vinci.</p><p class=\"note\">Add by only when the doer is important.</p></div><h3>Pairs to notice</h3><div class=\"example\"><p>The chef cooked the meal.<br>The meal was cooked by the chef.</p><p class=\"note\">Active puts the doer first. Passive puts the result first.</p></div><div class=\"example\"><p>The room is being cleaned.<br>The room has been cleaned.</p><p class=\"note\">Happening now vs finished.</p></div><div class=\"example\"><p>People say that it is safe.<br>It is said to be safe.</p><p class=\"note\">A reporting passive: formal and impersonal.</p></div><div class=\"example\"><p>The window broke.<br>The window was broken.</p><p class=\"note\">It happened by itself vs someone or something broke it.</p></div><p class=\"note\">The passive is not “better”. Use it for a reason. Too many passives make writing heavy.</p>"}, {"id": "mist", "t": "Mistakes people make", "c": "<div class=\"example\"><p><del>The meeting was happened yesterday.</del> → <ins>The meeting happened yesterday.</ins></p><p class=\"note\">Happen, occur, arrive, die and seem have no passive.</p></div><div class=\"example\"><p><del>The book is writing by him.</del> → <ins>The book is written by him.</ins></p><p class=\"note\">Use the past participle, not -ing.</p></div><div class=\"example\"><p><del>The house built in 1990.</del> → <ins>The house was built in 1990.</ins></p><p class=\"note\">Do not forget be.</p></div><div class=\"example\"><p><del>The problem has solved.</del> → <ins>The problem has been solved.</ins></p><p class=\"note\">Present perfect passive needs been.</p></div><div class=\"example\"><p><del>It was cost fifty dollars.</del> → <ins>It cost fifty dollars.</ins></p><p class=\"note\">Cost, fit, suit and resemble do not normally take the passive.</p></div><div class=\"example\"><p><del>The cake was ate.</del> → <ins>The cake was eaten.</ins></p><p class=\"note\">Learn the irregular participles.</p></div><div class=\"example\"><p><del>The letters is sent every day.</del> → <ins>The letters are sent every day.</ins></p><p class=\"note\">Be agrees with the new subject.</p></div>"}, {"id": "deep", "t": "Going deeper", "c": "<h3>Core test: does the verb take an object?</h3><p>Only verbs that can take an object can be made passive. Active: <em>They built a bridge.</em> The object (a bridge) becomes the subject: <em>A bridge was built.</em></p><h3>How to change active to passive</h3><ol><li>Find the object.</li><li>Make it the subject.</li><li>Put <b>be</b> in the same tense as the active verb.</li><li>Add the past participle.</li><li>Add <b>by</b> + doer only if needed.</li></ol><h3>Tenses</h3><ul><li>Present simple: is/are + participle.</li><li>Past simple: was/were + participle.</li><li>Present perfect: has/have been + participle.</li><li>Future: will be + participle.</li><li>Present continuous: is/are being + participle.</li><li>Modal: modal + be + participle.</li></ul><h3>Two objects</h3><p><em>They gave her a prize</em> can become <em>She was given a prize</em> or <em>A prize was given to her.</em> Both are fine.</p><h3>Reporting passives</h3><p><em>It is said that… He is believed to be… The company is reported to have…</em> All formal and common in news and academic writing.</p><h3>Get-passive</h3><p>Informal: <em>He got fired. The window got broken.</em> Fine in speech, but avoid it in academic writing.</p><h3>Have something done</h3><p><em>I had my car repaired. She had her hair cut.</em> Have or get + object + past participle means someone else did it for you.</p><h3>Shortcuts that work in exams</h3><ul><li><b>Be + past participle.</b> Always, in every tense.</li><li><b>No object, no passive.</b> Happen, arrive, die, seem.</li><li><b>Use by only when needed.</b> Most doers are better left out.</li><li><b>Process = passive.</b> Task 1 process diagrams rely on it.</li></ul><h3>Where exams try to catch you</h3><ul><li><b>Irregular participles:</b> built, written, eaten, taken, chosen, driven, begun.</li><li><b>“Is being” and “has been”:</b> The road is being repaired (now). The road has been repaired (done).</li><li><b>Modals:</b> should be done, must be completed, can be seen.</li><li><b>Words that look passive but are adjectives:</b> He is interested in art. The door is closed. These describe a state.</li></ul>"}, {"id": "dodont", "t": "Do, don’t and why", "c": "<div class=\"two\"><div><h3>Do</h3><ul><li>Use the passive for processes and when the doer is unknown.</li><li>Check be + past participle every time.</li><li>Match be to the tense.</li><li>Add by only when it is important.</li></ul></div><div><h3>Don’t</h3><ul><li>Don’t make passives from verbs without an object.</li><li>Don’t use -ing instead of the participle.</li><li>Don’t write a whole essay in the passive.</li><li>Don’t forget been in perfect forms.</li></ul></div></div><h3>Why we get it wrong</h3><h3>Different structures</h3><p>Some languages use the passive less, or build it differently.</p><div class=\"tip\"><p>Try this: Always write be first, then the participle.</p></div><h3>Irregular participles</h3><p>Many forms do not end in -ed.</p><div class=\"tip\"><p>Try this: Learn the thirty most common ones by heart.</p></div><h3>Over-correcting</h3><p>Some learners add the passive where active is more natural.</p><div class=\"tip\"><p>Try this: Ask yourself why you chose passive.</p></div><h3>Small habits that help</h3><ul><li>Turn the active sentences in a paragraph into passives, then back again.</li><li>Learn the participles of twenty irregular verbs.</li><li>Describe a process you know well in the passive.</li></ul>"}, {"id": "real", "t": "In IELTS and real life", "c": "<ul><li><b>Speaking:</b> use the passive for general statements. “English is spoken all over the world.”</li><li><b>Writing:</b> Task 1 processes. “The water is heated, then it is filtered.”</li><li><b>Reading:</b> passives often hide the doer. Ask who did it.</li><li><b>Listening:</b> listen for was/were/been + -ed in descriptions.</li></ul><div class=\"tip\"><p><b>Real world:</b> reports, instructions and news often use the passive. “The shop was closed at six.”</p></div><p class=\"note\">Academic writing does use the passive, but good writers balance it with active sentences.</p>"}, {"id": "practice", "t": "Practice", "c": "<h3>Spot the mistake</h3><ol><li>The meeting was happened yesterday.<details><summary>Show answer</summary><ins>The meeting happened yesterday.</ins> Happen has no passive.</details></li><li>The report has written.<details><summary>Show answer</summary><ins>The report has been written.</ins> Been is needed.</details></li><li>The letters is sent every day.<details><summary>Show answer</summary><ins>The letters are sent every day.</ins> Plural subject.</details></li><li>The bridge built in 1990.<details><summary>Show answer</summary><ins>The bridge was built in 1990.</ins> Was is missing.</details></li></ol><h3>Say it another way</h3><ol><li>Make passive: “They repair the road.”<details><summary>Show answer</summary><ins>The road is repaired.</ins></details></li><li>Make passive: “Someone stole my phone.”<details><summary>Show answer</summary><ins>My phone was stolen.</ins></details></li></ol><h3>Fill the gaps</h3><p>The glass (1) ___ (collect) and then it (2) ___ (sort). The report (3) ___ (finish) last week. The results (4) ___ (announce) tomorrow. The road (5) ___ (repair) now.</p><details><summary>Show answers</summary>1 is collected · 2 is sorted · 3 was finished · 4 will be announced · 5 is being repaired</details><h3>Speak and write</h3><ul><li>Describe how tea or coffee is made, using the passive.</li><li>Write six sentences about your school or workplace using the passive.</li></ul>"}, {"id": "quiz", "t": "Quiz", "quiz": 1}, {"id": "stick", "t": "Making it stick", "prog": 1}];
