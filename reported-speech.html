var CH=[{"id": "what", "t": "What is reported speech?", "c": "<p class=\"say\"><b>Direct speech</b> gives the exact words with quotation marks: <em>“I am tired,” she said.</em> <b>Reported speech</b> (also called indirect speech) tells what was said from the reporter’s point of view, usually later: <em>She said that she was tired.</em> There are no quotation marks, and several words change because time, place and speaker have changed.</p><div class=\"tw\"><table><thead><tr><th>Direct speech</th><th>Reported speech</th></tr></thead><tbody><tr><td>“I like tea,” she said.</td><td>She said (that) she liked tea.</td></tr><tr><td>“Where do you live?” he asked.</td><td>He asked where I lived.</td></tr><tr><td>“Sit down,” the teacher said.</td><td>The teacher told us to sit down.</td></tr><tr><td>“Don’t touch it,” she said.</td><td>She told me not to touch it.</td></tr></tbody></table></div><h3>What changes?</h3><ul><li><b>Tense:</b> usually one step back (am → was, will → would).</li><li><b>Pronouns:</b> I → he / she, my → his / her, we → they.</li><li><b>Time and place words:</b> today → that day, here → there.</li><li><b>Word order:</b> questions become statements.</li><li><b>Punctuation:</b> no quotation marks, no question mark in a reported question.</li></ul><h3>The reporting verb</h3><p>The <b>reporting verb</b> (said, told, asked, claimed, suggested…) introduces the reported clause. Its tense decides whether you need to shift the tense.</p><div class=\"rule\"><p><b>Past reporting verb</b> said, told, asked + tense shift: <em>She said she was tired.</em></p><p><b>Present reporting verb</b> says, claims, states + no shift: <em>She says she is tired.</em></p><p><b>Optional that</b> <em>He said (that) he was busy.</em> That is often dropped in speech and kept in formal writing.</p></div><h3>Why we use it</h3><ul><li>To tell stories and report conversations (<b>Speaking Part 2 and 3</b>).</li><li>To refer to sources and other people’s opinions (<b>Writing Task 2</b>).</li><li>To summarise texts and lectures (<b>Reading and Listening</b>).</li><li>To pass on messages and instructions in everyday life.</li></ul>"}, {"id": "shift", "t": "Tense changes (backshift)", "c": "<p>When the reporting verb is in the past, the tense of the original words normally moves one step back in time. This is called <b>backshift</b>.</p><div class=\"tw\"><table><thead><tr><th>Direct speech</th><th>Reported speech</th><th>Example</th></tr></thead><tbody><tr><td>present simple</td><td>past simple</td><td>“I work.” → She said she worked.</td></tr><tr><td>present continuous</td><td>past continuous</td><td>“I am working.” → She said she was working.</td></tr><tr><td>present perfect</td><td>past perfect</td><td>“I have worked.” → She said she had worked.</td></tr><tr><td>present perfect continuous</td><td>past perfect continuous</td><td>“I have been working.” → She said she had been working.</td></tr><tr><td>past simple</td><td>past perfect (or stays)</td><td>“I worked.” → She said she had worked.</td></tr><tr><td>past continuous</td><td>past perfect continuous (or stays)</td><td>“I was working.” → She said she had been working.</td></tr><tr><td>past perfect</td><td>past perfect (no change)</td><td>“I had worked.” → She said she had worked.</td></tr><tr><td>will</td><td>would</td><td>“I will work.” → She said she would work.</td></tr><tr><td>is going to</td><td>was going to</td><td>“I’m going to work.” → She said she was going to work.</td></tr><tr><td>can</td><td>could</td><td>“I can work.” → She said she could work.</td></tr><tr><td>may</td><td>might</td><td>“I may work.” → She said she might work.</td></tr><tr><td>must</td><td>had to (or must)</td><td>“I must work.” → She said she had to work.</td></tr><tr><td>shall (offer)</td><td>should / would</td><td>“Shall I help?” → He asked if he should help.</td></tr></tbody></table></div><h3>Think of it as a staircase</h3><div class=\"example\"><p>Now → Then<br>Present → Past<br>Past → Past perfect<br>Will → Would</p></div><h3>Two past tenses stay the same</h3><ul><li>The <b>past perfect</b> cannot go back further: <em>“I had left.” → She said she had left.</em></li><li>Modals that already express the past or hypothetical often stay: <em>would, could, should, might, ought to</em>.</li></ul><h3>Past simple: with or without backshift?</h3><div class=\"example\"><p>“I bought a car.” → She said she had bought a car.<br>“I bought a car.” → She said she bought a car.</p><p class=\"note\">Both are possible, especially in spoken English. The perfect form is clearer in writing.</p></div><h3>Quick method</h3><ol><li>Find the tense in the direct speech.</li><li>Check the reporting verb: is it past?</li><li>Move the tense back one step.</li><li>Change the pronouns, time words and place words.</li></ol>"}, {"id": "pron", "t": "Pronouns, time and place words", "c": "<p>Reported speech is told from a new point of view, so pronouns and expressions of time and place change with it. Think about <b>who is speaking now</b> and <b>when and where</b> you are reporting from.</p><h3>Pronouns and possessives</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th><th>Example</th></tr></thead><tbody><tr><td>I / me / my</td><td>he, she / him, her / his, her</td><td>“I lost my bag.” → She said she had lost her bag.</td></tr><tr><td>we / us / our</td><td>they / them / their</td><td>“We love our town.” → They said they loved their town.</td></tr><tr><td>you / your</td><td>I / me / my, he, she, they…</td><td>“You are late.” → He told me I was late.</td></tr><tr><td>this / these</td><td>that / those</td><td>“I like this.” → She said she liked that.</td></tr></tbody></table></div><h3>Time expressions</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th></tr></thead><tbody><tr><td>now</td><td>then / at that time</td></tr><tr><td>today</td><td>that day</td></tr><tr><td>tonight</td><td>that night</td></tr><tr><td>yesterday</td><td>the day before / the previous day</td></tr><tr><td>tomorrow</td><td>the next day / the following day</td></tr><tr><td>last week / year</td><td>the week / year before / the previous week / year</td></tr><tr><td>next week / year</td><td>the week / year after / the following week / year</td></tr><tr><td>two days ago</td><td>two days before</td></tr><tr><td>this week</td><td>that week</td></tr></tbody></table></div><h3>Place words and verbs</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th></tr></thead><tbody><tr><td>here</td><td>there</td></tr><tr><td>this place</td><td>that place</td></tr><tr><td>come</td><td>go (if the speaker is in another place)</td></tr><tr><td>bring</td><td>take</td></tr></tbody></table></div><p class=\"note\">If you are reporting on the same day and in the same place, the time and place words may not change at all: “I’ll see you tomorrow,” she said <em>today</em> → She said she would see me tomorrow.</p><h3>Example, step by step</h3><div class=\"example\"><p><b>Direct:</b> “I will meet you here tomorrow,” she said to me last week.<br><b>Reported:</b> She told me that she would meet me there the next day.</p><p class=\"note\">will → would, I → she, you → me, here → there, tomorrow → the next day.</p></div>"}, {"id": "statements", "t": "Reporting statements", "c": "<div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Example</th></tr></thead><tbody><tr><td>say + (that) + clause</td><td>He said (that) he was busy.</td></tr><tr><td>say to someone + (that)</td><td>He said to me that he was busy.</td></tr><tr><td>tell + person + (that)</td><td>He told me (that) he was busy.</td></tr></tbody></table></div><h3>Say or tell?</h3><div class=\"example\"><p>She said that she was ill.<br>She told me that she was ill.</p><p class=\"note\">Tell needs a person directly after it. Say does not.</p></div><ul><li><b>say</b> + that (no person): She said that…</li><li><b>say to + person:</b> She said to me that… (formal or less common).</li><li><b>tell + person:</b> She told me that…</li><li><b>Never</b> “said me” and never “told that” without a person.</li></ul><h3>Tell without that: fixed expressions</h3><div class=\"example\"><p><b>tell</b> the truth, <b>tell</b> a lie, <b>tell</b> a story, <b>tell</b> the time, <b>tell</b> the difference, <b>tell</b> a secret.</p><p class=\"note\">These need no person: He told a lie. She told the truth.</p></div><h3>Examples</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th></tr></thead><tbody><tr><td>“I like tea.”</td><td>She said she liked tea.</td></tr><tr><td>“We are leaving.”</td><td>They said they were leaving.</td></tr><tr><td>“I can swim.”</td><td>He said he could swim.</td></tr><tr><td>“I have finished.”</td><td>She said she had finished.</td></tr><tr><td>“I’ll call you tomorrow.”</td><td>He told me he would call me the next day.</td></tr><tr><td>“It was raining.”</td><td>She said it had been raining.</td></tr></tbody></table></div><h3>Using more than one sentence</h3><div class=\"example\"><p>“I’m tired. I want to go home,” she said. → She said that she was tired and that she wanted to go home.</p><p class=\"note\">Repeat that, or use and.</p></div>"}, {"id": "questions", "t": "Reporting questions", "c": "<p>In reported questions, the question word order disappears. Use <b>statement order</b> (subject + verb), no do/does/did, and no question mark.</p><h3>Wh- questions</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th></tr></thead><tbody><tr><td>“Where do you live?”</td><td>She asked me where I lived.</td></tr><tr><td>“What is your name?”</td><td>He asked me what my name was.</td></tr><tr><td>“Why did you leave?”</td><td>She asked why I had left.</td></tr><tr><td>“When will you arrive?”</td><td>He asked when I would arrive.</td></tr><tr><td>“How long have you worked here?”</td><td>She asked how long I had worked there.</td></tr><tr><td>“Who is she?”</td><td>He asked who she was.</td></tr></tbody></table></div><h3>Yes/no questions: if or whether</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th></tr></thead><tbody><tr><td>“Are you ready?”</td><td>He asked if / whether I was ready.</td></tr><tr><td>“Do you like coffee?”</td><td>She asked if I liked coffee.</td></tr><tr><td>“Have you finished?”</td><td>He asked whether I had finished.</td></tr><tr><td>“Can you swim?”</td><td>She asked if I could swim.</td></tr><tr><td>“Will you help me?”</td><td>He asked if I would help him.</td></tr></tbody></table></div><h3>If or whether?</h3><ul><li><b>if</b> and <b>whether</b> are usually interchangeable.</li><li><b>whether</b> is preferred before an infinitive: <em>He asked whether to go.</em></li><li><b>whether … or not:</b> <em>She asked whether or not I was coming.</em></li></ul><h3>Rules to remember</h3><div class=\"rule\"><p><b>No do/does/did</b> <del>He asked where did I live.</del> → He asked where I lived.</p><p><b>No inversion</b> <del>She asked if was I ready.</del> → She asked if I was ready.</p><p><b>No question mark</b> He asked what time it was. (full stop)</p><p><b>Same rule for indirect questions</b> <em>Could you tell me where the station is?</em> (not where is the station)</p></div><h3>Questions with “to” and a question word</h3><div class=\"example\"><p>She asked me how to get there. He asked what to do. I wondered whether to go.</p><p class=\"note\">question word + to + base verb: useful when the subject is unknown.</p></div>"}, {"id": "commands", "t": "Reporting commands, requests and advice", "c": "<div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th><th>Pattern</th></tr></thead><tbody><tr><td>“Sit down.”</td><td>She told me to sit down.</td><td>tell + person + to + base verb</td></tr><tr><td>“Don’t touch it.”</td><td>She told me not to touch it.</td><td>tell + person + not to + base verb</td></tr><tr><td>“Please help me.”</td><td>He asked me to help him.</td><td>ask + person + to + base verb</td></tr><tr><td>“Could you open the window?”</td><td>She asked me to open the window.</td><td>ask + person + to + verb</td></tr><tr><td>“You should rest.”</td><td>He advised me to rest.</td><td>advise + person + to + verb</td></tr><tr><td>“Be careful!”</td><td>She warned me to be careful.</td><td>warn + person + to + verb</td></tr><tr><td>“Don’t be late.”</td><td>She reminded me not to be late.</td><td>remind + person + not to + verb</td></tr><tr><td>“Please stay.”</td><td>He begged me to stay.</td><td>beg + person + to + verb</td></tr></tbody></table></div><h3>Asking for things</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th></tr></thead><tbody><tr><td>“Can I have some water?”</td><td>He asked for some water.</td></tr><tr><td>“Can I borrow your pen?”</td><td>She asked to borrow my pen.</td></tr><tr><td>“May I leave?”</td><td>He asked if he could leave. / He asked to leave.</td></tr></tbody></table></div><h3>Offers, promises and refusals</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th><th>Pattern</th></tr></thead><tbody><tr><td>“I’ll carry it.”</td><td>He offered to carry it.</td><td>offer + to + verb</td></tr><tr><td>“I’ll be on time.”</td><td>She promised to be on time.</td><td>promise + to + verb</td></tr><tr><td>“I won’t help.”</td><td>He refused to help.</td><td>refuse + to + verb</td></tr><tr><td>“Yes, I’ll come.”</td><td>She agreed to come.</td><td>agree + to + verb</td></tr></tbody></table></div><h3>Watch out</h3><ul><li>Tell and ask need a person: <del>He told to wait</del> → He told <b>me</b> to wait.</li><li>Negative: <b>not</b> goes before <b>to</b>: told me <b>not to</b> go.</li><li>Order words can change the verb: <em>order, command, instruct, tell</em> are stronger than <em>ask, request, invite</em>.</li></ul>"}, {"id": "verbs", "t": "Reporting verbs and their patterns", "c": "<p class=\"say\"><b>Say</b>, <b>tell</b> and <b>ask</b> are the basic reporting verbs, but good speakers and writers choose more precise verbs that show the speaker’s attitude or intention. Each verb follows a pattern, so learn the verb with its pattern.</p><h3>Pattern 1: verb + (that) clause</h3><div class=\"tw\"><table><thead><tr><th>Verbs</th><th>Example</th></tr></thead><tbody><tr><td>say, state, claim, explain, admit, argue, mention, announce, complain, insist, suggest, warn, add, agree, reply, deny, assume, believe, report, reveal, confirm, point out</td><td>She claimed that she had never seen him. He admitted that he had made a mistake.</td></tr></tbody></table></div><h3>Pattern 2: verb + person + (that) clause</h3><div class=\"tw\"><table><thead><tr><th>Verbs</th><th>Example</th></tr></thead><tbody><tr><td>tell, inform, assure, convince, remind, persuade, notify, warn</td><td>She assured me that everything was fine.</td></tr></tbody></table></div><h3>Pattern 3: verb + to-infinitive</h3><div class=\"tw\"><table><thead><tr><th>Verbs</th><th>Example</th></tr></thead><tbody><tr><td>offer, promise, refuse, agree, threaten, claim, demand, decide, propose, volunteer</td><td>He refused to pay. She promised to call.</td></tr></tbody></table></div><h3>Pattern 4: verb + person + to-infinitive</h3><div class=\"tw\"><table><thead><tr><th>Verbs</th><th>Example</th></tr></thead><tbody><tr><td>tell, ask, order, advise, warn, remind, invite, encourage, beg, instruct, persuade, urge, forbid</td><td>She urged me to apply. He forbade us to enter.</td></tr></tbody></table></div><h3>Pattern 5: verb + -ing</h3><div class=\"tw\"><table><thead><tr><th>Verbs</th><th>Example</th></tr></thead><tbody><tr><td>admit, deny, suggest, recommend, propose, mention</td><td>He denied taking the money. She suggested going out.</td></tr></tbody></table></div><h3>Pattern 6: verb + preposition + -ing</h3><div class=\"tw\"><table><thead><tr><th>Verbs</th><th>Example</th></tr></thead><tbody><tr><td>apologise for, accuse (someone) of, blame (someone) for, insist on, congratulate (someone) on, thank (someone) for, complain about, boast about</td><td>He apologised for being late. She accused him of lying.</td></tr></tbody></table></div><h3>By meaning</h3><div class=\"tw\"><table><thead><tr><th>Meaning</th><th>Verbs</th></tr></thead><tbody><tr><td>Neutral</td><td>say, tell, ask, state, mention, report, add, reply</td></tr><tr><td>Opinion or argument</td><td>argue, claim, maintain, suggest, believe, point out, insist</td></tr><tr><td>Advice and warning</td><td>advise, recommend, warn, urge, remind, suggest</td></tr><tr><td>Admitting and denying</td><td>admit, confess, deny, acknowledge, accept</td></tr><tr><td>Offering and promising</td><td>offer, promise, volunteer, refuse, agree, threaten</td></tr><tr><td>Complaining</td><td>complain, grumble, protest, object</td></tr></tbody></table></div><h3>Suggest: a special case</h3><ul><li>He suggested <b>going</b> out. (-ing)</li><li>He suggested <b>that we go</b> out. (that + base verb, or should + base verb)</li><li><del>He suggested me to go out.</del> No: suggest has no person + to-infinitive pattern.</li></ul>"}, {"id": "modalsr", "t": "Modal verbs in reported speech", "c": "<div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th><th>Notes</th></tr></thead><tbody><tr><td>can</td><td>could</td><td>“I can swim.” → She said she could swim.</td></tr><tr><td>could</td><td>could</td><td>No change.</td></tr><tr><td>will</td><td>would</td><td>“I will call.” → He said he would call.</td></tr><tr><td>would</td><td>would</td><td>No change.</td></tr><tr><td>may</td><td>might</td><td>“I may go.” → She said she might go.</td></tr><tr><td>might</td><td>might</td><td>No change.</td></tr><tr><td>must</td><td>had to / must</td><td>“I must go.” → He said he had to go. / he must go.</td></tr><tr><td>should</td><td>should</td><td>No change: “You should rest.” → He said I should rest.</td></tr><tr><td>ought to</td><td>ought to</td><td>No change.</td></tr><tr><td>shall (suggestion)</td><td>should</td><td>“Shall we go?” → He asked if we should go.</td></tr><tr><td>needn’t</td><td>didn’t have to / needn’t</td><td>“You needn’t come.” → He said I needn’t come.</td></tr></tbody></table></div><h3>Must: two meanings</h3><div class=\"example\"><p>“You must be tired.” → He said I must be tired.<br>“I must go now.” → She said she had to go then.</p><p class=\"note\">Deduction stays must. Obligation often becomes had to.</p></div><h3>Mixed example</h3><div class=\"example\"><p>“You should see a doctor, and you must rest. I can drive you,” he said.<br>→ He said I should see a doctor and that I had to rest. He said he could drive me.</p></div>"}, {"id": "special", "t": "Special cases", "c": "<h3>Conditionals</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th></tr></thead><tbody><tr><td>“If I have time, I’ll call.”</td><td>She said that if she had time, she would call.</td></tr><tr><td>“If I were rich, I would travel.”</td><td>He said that if he were rich, he would travel. (no change)</td></tr><tr><td>“If I had known, I would have come.”</td><td>She said that if she had known, she would have come. (no change)</td></tr></tbody></table></div><p class=\"note\">Second and third conditionals do not change, because they are already unreal and past.</p><h3>Exclamations and greetings</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th></tr></thead><tbody><tr><td>“What a lovely day!”</td><td>She said what a lovely day it was. / She exclaimed that it was a lovely day.</td></tr><tr><td>“Happy birthday!”</td><td>She wished me a happy birthday.</td></tr><tr><td>“Thank you.”</td><td>He thanked me.</td></tr><tr><td>“Congratulations!”</td><td>She congratulated me.</td></tr><tr><td>“Good morning.”</td><td>He greeted me. / He said good morning.</td></tr></tbody></table></div><h3>Let’s: suggestions</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th></tr></thead><tbody><tr><td>“Let’s go out.”</td><td>He suggested going out. / He suggested that we go out.</td></tr><tr><td>“Why don’t we eat?”</td><td>She suggested eating. / She suggested that we should eat.</td></tr><tr><td>“Shall we dance?”</td><td>He proposed dancing. / He asked if we should dance.</td></tr></tbody></table></div><h3>Yes and no answers</h3><div class=\"example\"><p>“Are you coming?” “Yes, I am.” → He asked if I was coming and I said I was. / “No, I’m not.” → I said I wasn’t.</p></div><h3>Two speakers in a conversation</h3><div class=\"example\"><p>“What are you doing?” “I’m reading.” → I asked what she was doing and she said she was reading.</p></div><h3>Quoted words kept for effect</h3><p>Writers sometimes keep the exact words as a short quotation inside a reported clause: <em>She described the situation as “completely unacceptable”.</em> Use this for striking phrases only.</p>"}, {"id": "nochange", "t": "When no tense change is needed", "c": "<p>Backshift is not an absolute rule. The tense can stay the same when the reporting verb is in the present or when the information is still true.</p><div class=\"tw\"><table><thead><tr><th>Situation</th><th>Example</th></tr></thead><tbody><tr><td>Present reporting verb (says, claims, states, argues)</td><td>She says that she is tired. The report claims that pollution is rising.</td></tr><tr><td>Future or present perfect reporting verb</td><td>She will say that she is tired. He has said that he is busy.</td></tr><tr><td>Still true at the time of reporting</td><td>She said that the Earth goes round the Sun. He told me his name is Ali.</td></tr><tr><td>General truths and facts</td><td>The teacher said that water boils at 100°C.</td></tr><tr><td>Already past perfect</td><td>“I had finished.” → She said she had finished.</td></tr><tr><td>Would, could, should, might, ought to</td><td>“You should go.” → He said I should go.</td></tr><tr><td>Second and third conditional</td><td>She said if she were me, she would apply.</td></tr><tr><td>Reporting immediately (same day, same place)</td><td>“I’m hungry.” → She says she’s hungry. / She said she’s hungry.</td></tr></tbody></table></div><h3>Backshift or not? Examples</h3><div class=\"example\"><p>He said he lived in Dhaka. (not sure it is still true)<br>He said he lives in Dhaka. (still true now)</p><p class=\"note\">Both are acceptable. The second stresses that the fact is current.</p></div><p class=\"note\">In IELTS Writing, when you refer to a source, use the <b>present</b> reporting verb (<em>The author argues…</em>) for a clear, current view.</p>"}, {"id": "writing", "t": "Reporting in IELTS Writing and Speaking", "c": "<h3>Writing Task 2: referring to views</h3><ul><li><b>Some people argue / claim / believe that…</b></li><li><b>It is often claimed / suggested / said that…</b></li><li><b>Critics point out that…</b></li><li><b>Supporters of this view maintain that…</b></li><li><b>According to experts, …</b></li><li><b>The report concludes that…</b></li></ul><h3>Writing Task 1: reports and sources</h3><div class=\"example\"><p><b>According to the survey</b>, 60% of respondents said they were satisfied. The report states that sales will rise.</p><p class=\"note\">Use present reporting verbs for statements about the data source.</p></div><h3>Impersonal reporting structures</h3><div class=\"tw\"><table><thead><tr><th>Structure</th><th>Example</th></tr></thead><tbody><tr><td>It is said / believed / thought / reported that…</td><td>It is believed that exercise improves memory.</td></tr><tr><td>Subject + is said / believed to + verb</td><td>Exercise is believed to improve memory.</td></tr><tr><td>Subject + is said / believed to have + participle</td><td>He is said to have left the country.</td></tr><tr><td>There is said to be…</td><td>There is said to be a problem.</td></tr></tbody></table></div><h3>Choose verbs with the right strength</h3><div class=\"tw\"><table><thead><tr><th>Weak / neutral</th><th>Medium</th><th>Strong</th></tr></thead><tbody><tr><td>says, states, mentions</td><td>argues, suggests, claims</td><td>insists, maintains, asserts</td></tr></tbody></table></div><h3>Speaking Part 2: telling a story</h3><div class=\"example\"><p>My friend <b>told me that</b> he had lost his phone, so I <b>asked him where</b> he had last seen it. He <b>said that</b> he couldn’t remember, so we <b>agreed to</b> look together.</p><p class=\"note\">A good Part 2 story includes at least three reported statements, one reported question and one reported request.</p></div><h3>Speaking Part 3: reporting opinions</h3><ul><li>“Many people <b>say that</b>…, but I think…”</li><li>“My friends <b>often tell me that</b>…”</li><li>“Experts <b>claim that</b>…”</li></ul><h3>Avoid these in formal writing</h3><ul><li>Overusing “said”: use argue, claim, state, suggest.</li><li>Long chains of reported statements: they confuse the reader.</li><li>Informal tags: “he was like” or “she goes”.</li></ul>"}, {"id": "mist", "t": "Mistakes people make", "c": "<div class=\"example\"><p><del>She said me that she was late.</del> → <ins>She told me that she was late.</ins></p><p class=\"note\">Say has no person, tell does.</p></div><div class=\"example\"><p><del>He asked where did I live.</del> → <ins>He asked where I lived.</ins></p><p class=\"note\">Statement order in reported questions.</p></div><div class=\"example\"><p><del>She asked if was I ready.</del> → <ins>She asked if I was ready.</ins></p><p class=\"note\">No inversion after if.</p></div><div class=\"example\"><p><del>He told to wait.</del> → <ins>He told me to wait.</ins></p><p class=\"note\">Tell needs a person.</p></div><div class=\"example\"><p><del>She said she will come.</del> → <ins>She said she would come.</ins></p><p class=\"note\">Will becomes would.</p></div><div class=\"example\"><p><del>He said me to go.</del> → <ins>He told me to go.</ins></p><p class=\"note\">Told + person + to.</p></div><div class=\"example\"><p><del>I asked her what was her name.</del> → <ins>I asked her what her name was.</ins></p><p class=\"note\">Normal order.</p></div><div class=\"example\"><p><del>He asked me do I like tea.</del> → <ins>He asked me if I liked tea.</ins></p><p class=\"note\">Use if or whether.</p></div><div class=\"example\"><p><del>She told that she was tired.</del> → <ins>She said that she was tired. / She told me that she was tired.</ins></p><p class=\"note\">Tell needs a person.</p></div><div class=\"example\"><p><del>He suggested me to go.</del> → <ins>He suggested going. / He suggested that I go.</ins></p><p class=\"note\">Suggest has no person + to pattern.</p></div><div class=\"example\"><p><del>She asked me that where I lived.</del> → <ins>She asked me where I lived.</ins></p><p class=\"note\">No that before a question word.</p></div><div class=\"example\"><p><del>She said, that she was tired.</del> → <ins>She said that she was tired.</ins></p><p class=\"note\">No comma between said and that.</p></div><div class=\"example\"><p><del>He said that “I am busy”.</del> → <ins>He said that he was busy.</ins></p><p class=\"note\">Do not mix direct and reported speech.</p></div><div class=\"example\"><p><del>She asked me to not go.</del> → <ins>She asked me not to go.</ins></p><p class=\"note\">Not goes before to.</p></div><div class=\"example\"><p><del>They said that they will come yesterday.</del> → <ins>They said that they would come the next day.</ins></p><p class=\"note\">Change the tense and the time word.</p></div><div class=\"example\"><p><del>He asked what time is it?</del> → <ins>He asked what time it was.</ins></p><p class=\"note\">No question mark, no inversion.</p></div>"}, {"id": "pairs", "t": "Pairs and look-alikes", "c": "<div class=\"tw\"><table><thead><tr><th>Pair</th><th>Difference</th><th>Example</th></tr></thead><tbody><tr><td>say / tell</td><td>No person vs person needed</td><td>She said that… / She told me that…</td></tr><tr><td>ask / tell</td><td>Question or request vs instruction</td><td>He asked me to wait. He told me to wait.</td></tr><tr><td>say / speak / talk</td><td>Reporting words vs language or conversation</td><td>She said hello. He speaks English. We talked for hours.</td></tr><tr><td>if / whether</td><td>Mostly the same; whether with to or or not</td><td>asked if / whether I was ready</td></tr><tr><td>said that / told that</td><td>Without person vs with person</td><td>said that… / told me that…</td></tr><tr><td>suggest + -ing / suggest that</td><td>Two correct patterns</td><td>suggested going / suggested that we go</td></tr><tr><td>explain / explain to</td><td>Explain something to someone</td><td>He explained the rule to me.</td></tr><tr><td>admit / confess</td><td>Admit a fact vs confess guilt</td><td>He admitted he was late. She confessed to the crime.</td></tr><tr><td>advise / recommend</td><td>Advise + person + to vs recommend + -ing</td><td>He advised me to go. He recommended going.</td></tr><tr><td>remind / remember</td><td>Make someone remember vs recall</td><td>She reminded me to call. I remembered to call.</td></tr><tr><td>warn / threaten</td><td>Danger vs force</td><td>He warned me of the risk. He threatened to leave.</td></tr><tr><td>claim / argue</td><td>State as true vs give reasons</td><td>He claimed he was innocent. She argued that taxes are fair.</td></tr><tr><td>tell the truth / say the truth</td><td>Fixed phrase: tell the truth</td><td>She told the truth.</td></tr></tbody></table></div>"}, {"id": "dodont", "t": "Do, don’t and why", "c": "<div class=\"two\"><div><h3>Do</h3><ul><li>Use told + person, said without a person.</li><li>Move the tense back after a past reporting verb.</li><li>Use statement order in reported questions.</li><li>Change pronouns, time words and place words.</li><li>Use stronger reporting verbs in writing.</li><li>Learn each reporting verb with its pattern.</li></ul></div><div><h3>Don’t</h3><ul><li>Don’t say “said me”.</li><li>Don’t keep do/does/did in reported questions.</li><li>Don’t forget to change time and place words when the situation changes.</li><li>Don’t use a question mark in a reported question.</li><li>Don’t mix quotation marks with reported speech.</li><li>Don’t say “suggested me to” or “told to”.</li></ul></div></div><h3>Why we get it wrong</h3><h3>Keeping the question form</h3><p>Learners copy the direct question word order.</p><div class=\"tip\"><p>Try this: Turn the question into a statement after the wh- word.</p></div><h3>Say and tell mixed</h3><p>They look similar and mean nearly the same.</p><div class=\"tip\"><p>Try this: Remember: tell + person always.</p></div><h3>Forgetting the time change</h3><p>Words like today and here change with the situation.</p><div class=\"tip\"><p>Try this: Ask: when and where am I reporting from?</p></div><h3>Translating word by word</h3><p>Other languages use different tense rules in reported speech.</p><div class=\"tip\"><p>Try this: Learn the English backshift table and practise with short sentences.</p></div><h3>Using only said</h3><p>Learners rely on one verb for everything.</p><div class=\"tip\"><p>Try this: Build a list of ten precise reporting verbs and use one each day.</p></div><h3>Small habits that help</h3><ul><li>Retell a conversation from today in reported speech.</li><li>Turn five direct quotes from a news article into reported form.</li><li>Learn five new reporting verbs each week.</li><li>Record yourself telling a story with reported speech and listen back.</li></ul>"}, {"id": "real", "t": "In IELTS and real life", "c": "<ul><li><b>Speaking Part 1:</b> “My teacher told me to practise every day.”</li><li><b>Speaking Part 2:</b> telling a story needs reported speech: “She said she would help me, so I asked her to…”</li><li><b>Speaking Part 3:</b> “Many experts say that…”, “Some people claim that…”</li><li><b>Writing Task 2:</b> “Critics argue that…”, “It is widely believed that…” show balanced arguments.</li><li><b>Reading:</b> writers report what experts said. Notice the verb: claim (doubt), state (fact), suggest (possibility), insist (strong).</li><li><b>Listening:</b> speakers retell what others said: “He told me the meeting had been moved to Friday.”</li></ul><h3>Reading: reporting verbs show attitude</h3><div class=\"tw\"><table><thead><tr><th>Verb</th><th>Attitude</th></tr></thead><tbody><tr><td>claim</td><td>Writer may doubt it</td></tr><tr><td>state / report</td><td>Neutral and factual</td></tr><tr><td>suggest</td><td>Possibility, not proof</td></tr><tr><td>insist</td><td>Strong, firm</td></tr><tr><td>admit</td><td>Reluctantly true</td></tr><tr><td>deny</td><td>Says it is not true</td></tr></tbody></table></div><h3>Real-world use</h3><ul><li><b>Email:</b> “He asked me to send the report by Friday.”</li><li><b>Work:</b> “The manager said that the deadline had moved.”</li><li><b>News:</b> “The minister told reporters that talks would continue.”</li><li><b>Everyday:</b> “She told me she was running late.”</li></ul><div class=\"tip\"><p><b>Real world:</b> when you pass on a message, the tense and the time words must match the moment you tell it, not the moment it was said.</p></div>"}, {"id": "practice", "t": "Practice", "c": "<h3>Spot the mistake</h3><ol><li>She said me that she was ill.<details><summary>Show answer</summary><ins>She told me that she was ill.</ins></details></li><li>He asked where did I live.<details><summary>Show answer</summary><ins>He asked where I lived.</ins></details></li><li>She said she will come.<details><summary>Show answer</summary><ins>She said she would come.</ins></details></li><li>He told to sit down.<details><summary>Show answer</summary><ins>He told me to sit down.</ins></details></li><li>She asked me that where I lived.<details><summary>Show answer</summary><ins>She asked me where I lived.</ins></details></li><li>He suggested me to go.<details><summary>Show answer</summary><ins>He suggested going. / He suggested that I go.</ins></details></li><li>She asked me to not go.<details><summary>Show answer</summary><ins>She asked me not to go.</ins></details></li><li>He asked what time is it?<details><summary>Show answer</summary><ins>He asked what time it was.</ins></details></li><li>They said they will come yesterday.<details><summary>Show answer</summary><ins>They said they would come the day before / the next day (check the meaning).</ins></details></li><li>She told that she was tired.<details><summary>Show answer</summary><ins>She said that she was tired. / She told me that she was tired.</ins></details></li></ol><h3>Report it: statements</h3><ol><li>“I am tired,” she said.<details><summary>Show answer</summary><ins>She said (that) she was tired.</ins></details></li><li>“We have finished,” they said.<details><summary>Show answer</summary><ins>They said they had finished.</ins></details></li><li>“I will call you tomorrow,” he said to me.<details><summary>Show answer</summary><ins>He told me he would call me the next day.</ins></details></li><li>“I can’t find my keys,” she said.<details><summary>Show answer</summary><ins>She said she couldn’t find her keys.</ins></details></li><li>“I went to Paris last year,” he said.<details><summary>Show answer</summary><ins>He said he had gone to Paris the year before.</ins></details></li><li>“I’m living here now,” she said.<details><summary>Show answer</summary><ins>She said she was living there then.</ins></details></li></ol><h3>Report it: questions and commands</h3><ol><li>“Do you like tea?” he asked me.<details><summary>Show answer</summary><ins>He asked me if / whether I liked tea.</ins></details></li><li>“Where are you going?” she asked.<details><summary>Show answer</summary><ins>She asked where I was going.</ins></details></li><li>“Have you seen my phone?” he asked.<details><summary>Show answer</summary><ins>He asked if I had seen his phone.</ins></details></li><li>“Open the window,” she said to me.<details><summary>Show answer</summary><ins>She told me to open the window.</ins></details></li><li>“Don’t be late,” he said to us.<details><summary>Show answer</summary><ins>He told us not to be late.</ins></details></li><li>“Could you help me?” she asked.<details><summary>Show answer</summary><ins>She asked me to help her.</ins></details></li></ol><h3>Choose the best reporting verb</h3><ol><li>“I did it. I’m sorry.” (admit)<details><summary>Show answer</summary><ins>He admitted doing it. / He admitted that he had done it.</ins></details></li><li>“I didn’t take it.” (deny)<details><summary>Show answer</summary><ins>She denied taking it.</ins></details></li><li>“Let’s go to the park.” (suggest)<details><summary>Show answer</summary><ins>He suggested going to the park.</ins></details></li><li>“I’ll lend you money.” (offer)<details><summary>Show answer</summary><ins>She offered to lend me money.</ins></details></li><li>“Don’t go near the river!” (warn)<details><summary>Show answer</summary><ins>He warned us not to go near the river.</ins></details></li><li>“Thank you for the gift.” (thank)<details><summary>Show answer</summary><ins>She thanked me for the gift.</ins></details></li></ol><h3>Fill the gaps</h3><p>She (1) ___ me that she was busy. He asked (2) ___ I was ready. She said she (3) ___ come tomorrow. He (4) ___ me to wait. They asked where (5) ___ lived. She (6) ___ me not to worry. He asked (7) ___ he could leave. The report (8) ___ that pollution is rising. She (9) ___ to help. He (10) ___ taking the money.</p><details><summary>Show answers</summary>1 told · 2 if / whether · 3 would · 4 told / asked · 5 I (statement order) · 6 told / advised · 7 if / whether · 8 states / claims · 9 offered / promised · 10 denied / admitted</details><h3>Speak and write</h3><ul><li>Retell a short conversation you had today using reported speech.</li><li>Write five sentences about what an expert might say about education, using claim, suggest, argue, state and point out.</li><li>Tell a short story with three reported statements, one reported question and one reported command.</li><li>Turn this into reported speech: a dialogue between a customer and a shop assistant.</li><li>Write a paragraph for Task 2 that reports two opposing opinions with “some people argue” and “others claim”.</li></ul>"}, {"id": "quiz", "t": "Quiz", "quiz": 1}, {"id": "stick", "t": "Making it stick", "prog": 1}];
