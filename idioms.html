var D={"Idioms": [["a piece of cake", "very easy", "I thought the grammar test would be hard, but it was a piece of cake.‖Making tea is a piece of cake once you know the steps.‖“Can you fix my phone?” “Sure, that's a piece of cake.”", "Use: casual, everyday"], ["break the ice", "start a conversation in an awkward situation", "He told a funny story to break the ice at the start of the meeting.‖On my first day at university I asked a simple question to break the ice with my roommate.‖A short game is a great way to break the ice with new students.", "Use: neutral"], ["bite the bullet", "do something unpleasant bravely", "I didn't want to visit the dentist, but I finally bit the bullet and booked an appointment.‖Sometimes you just have to bite the bullet and say sorry.‖She bit the bullet, sold her car and paid off the debt.", "Use: neutral"], ["call it a day", "stop working for today", "We've been painting since morning, so let's call it a day and finish tomorrow.‖After ten hours of studying, I called it a day and went for a walk.‖When the rain got heavier, the workers decided to call it a day.", "Use: casual"], ["cost an arm and a leg", "be very expensive", "Studying abroad can cost an arm and a leg.‖That designer bag cost him an arm and a leg.‖Dental treatment costs an arm and a leg in some countries.", "Use: casual"], ["cut corners", "do something cheaply or carelessly", "The builder cut corners, and now the roof leaks.‖Never cut corners when you revise for an important exam.‖The company cut corners on safety to save money.", "Use: neutral, negative"], ["get out of hand", "become uncontrolled", "The party got out of hand, and the neighbours called the police.‖Spending can easily get out of hand during the holidays.‖The argument got out of hand, and everyone started shouting.", "Use: neutral"], ["hit the books", "start studying hard", "I can't go out tonight; I have to hit the books for my IELTS test.‖After a relaxed holiday, it was time to hit the books again.‖Students usually hit the books hard a week before the exams.", "Use: casual"], ["in the long run", "after a long time, eventually", "Cheap shoes may save money now, but good ones are cheaper in the long run.‖Practising speaking every day will help you a lot in the long run.‖In the long run, honesty is always the best policy.", "Use: neutral"], ["on the same page", "in agreement, understanding the same thing", "Before we start the project, let's make sure everyone is on the same page.‖My sister and I are on the same page about moving to a bigger house.‖The teacher repeated the rules until the whole class was on the same page.", "Use: work, neutral"], ["once in a blue moon", "very rarely", "I only eat fast food once in a blue moon.‖My brother calls me once in a blue moon.‖It snows here once in a blue moon.", "Use: casual"], ["under the weather", "slightly ill", "I'm feeling a bit under the weather, so I'll skip the party tonight.‖He looked under the weather this morning, so we sent him home.‖If you feel under the weather, drink warm water and rest.", "Use: casual, everyday"], ["spill the beans", "reveal a secret", "She spilled the beans about the surprise party.‖Don't spill the beans before the announcement.‖Who spilled the beans about my new job?", "Use: casual"], ["the last straw", "the final problem that makes you lose patience", "When he forgot my birthday again, that was the last straw.‖The noisy neighbours were bad, but the broken lift was the last straw.‖Missing the deadline was the last straw for the manager.", "Use: neutral"], ["a blessing in disguise", "something bad that turns out good", "Losing that job was a blessing in disguise because I found a better one.‖The cancelled flight was a blessing in disguise; the plane had technical problems.‖Failing the first test was a blessing in disguise; it made me study harder.", "Use: neutral"], ["add insult to injury", "make a bad situation worse", "The bus was late, and to add insult to injury, it started raining.‖They lost my luggage and, to add insult to injury, charged me for the delay.‖He broke my cup and then laughed, which added insult to injury.", "Use: neutral"], ["at the end of the day", "when everything is considered", "You can ask everyone for advice, but at the end of the day it's your decision.‖We argued a lot, but at the end of the day we are still best friends.‖At the end of the day, what matters is that you tried your best.", "Use: spoken, very common"], ["back to square one", "start again from the beginning", "The file was deleted, so we are back to square one.‖The plan failed, and we were back to square one.‖After the test results, the doctors were back to square one.", "Use: neutral"], ["beat around the bush", "avoid the main point", "Stop beating around the bush and tell me what happened.‖He beat around the bush instead of saying he was leaving.‖Don't beat around the bush in an interview; answer directly.", "Use: casual"], ["better late than never", "it's good to do it even if late", "He finally apologised, and better late than never.‖You came an hour late, but better late than never.‖I started learning English at forty; better late than never.", "Use: everyday"], ["burn the midnight oil", "work late at night", "She burned the midnight oil to finish her thesis.‖Students often burn the midnight oil before exams.‖We burned the midnight oil to meet the deadline.", "Use: neutral"], ["by the book", "exactly following the rules", "The manager does everything by the book.‖The police handled the case by the book.‖If you play it by the book, you will avoid trouble.", "Use: work"], ["catch someone off guard", "surprise someone", "His question caught me off guard, and I couldn't answer.‖The sudden rain caught us off guard.‖Don't let tricky questions catch you off guard in the interview.", "Use: neutral"], ["come up with", "think of an idea or plan", "Can you come up with a better solution?‖She came up with a great title for the essay.‖We need to come up with a plan by Friday.", "Use: phrasal verb, everyday"], ["cross that bridge when you come to it", "deal with a problem only when it happens", "We don't know if it will rain, so let's cross that bridge when we come to it.‖“What if I fail?” “We'll cross that bridge when we come to it.”‖I'll worry about the cost when we come to that bridge.", "Use: spoken"], ["cut a long story short", "tell only the main points", "To cut a long story short, we missed the train and walked home.‖To cut a long story short, he got the job.‖Cutting a long story short, the shop closed in May.", "Use: spoken"], ["down to earth", "practical and honest, not proud", "Despite being famous, she is very down to earth.‖My teacher is kind and down to earth.‖I like him because he is so down to earth.", "Use: describing people"], ["drive someone up the wall", "annoy someone very much", "The noise from next door drives me up the wall.‖His habit of tapping the desk drives me up the wall.‖Slow internet drives everyone up the wall.", "Use: casual"], ["every cloud has a silver lining", "there is something good in every bad situation", "I failed the test, but it showed me what to improve. Every cloud has a silver lining.‖Losing my phone made me read more; every cloud has a silver lining.‖The rain cancelled the match, but we had a fun day indoors. Every cloud has a silver lining.", "Use: everyday"], ["get the hang of", "learn how to do something", "It took a week, but I finally got the hang of driving.‖You'll get the hang of the new software soon.‖She got the hang of cooking after a few tries.", "Use: casual"], ["give it a shot", "try something", "I've never cooked fish, but I'll give it a shot.‖Why don't you give it a shot and apply?‖He gave it a shot and won a prize.", "Use: casual"], ["go the extra mile", "make a special extra effort", "Our teacher went the extra mile and stayed after class to help me with my essay.‖If you want a high band score, you must be ready to go the extra mile.‖The hotel staff went the extra mile to make our stay special.", "Use: work, school"], ["hang in there", "don't give up", "Hang in there; the exams will be over soon.‖Hang in there, mate. Things will get better.‖She told him to hang in there during the hard week.", "Use: casual, encouraging"], ["have a lot on my plate", "be very busy", "I can't help now; I have a lot on my plate this week.‖She has a lot on her plate with work and study.‖With two projects due, he has a lot on his plate.", "Use: everyday"], ["in a nutshell", "in a few words", "In a nutshell, the plan is cheap and fast.‖In a nutshell, we need more time and money.‖Can you explain the story in a nutshell?", "Use: spoken, presenting"], ["it's not rocket science", "it's not difficult", "Using this app is not rocket science.‖Cooking rice is not rocket science.‖Don't worry; it's not rocket science.", "Use: casual"], ["keep an eye on", "watch carefully", "Could you keep an eye on my bag for a minute?‖Keep an eye on the time during the exam.‖Parents should keep an eye on what children watch online.", "Use: everyday"], ["let the cat out of the bag", "reveal a secret by accident", "He let the cat out of the bag about the wedding.‖Don't let the cat out of the bag before the party.‖She let the cat out of the bag about the new job.", "Use: casual"], ["look on the bright side", "think positively", "Look on the bright side: at least nobody was hurt.‖Look on the bright side; you still have two chances.‖He always looks on the bright side of life.", "Use: casual, encouraging"], ["make ends meet", "have just enough money to live", "With two jobs, she barely makes ends meet.‖Many families struggle to make ends meet.‖He teaches at night to make ends meet.", "Use: neutral"], ["miss the boat", "lose a chance", "Tickets were cheap last month, but I waited and missed the boat.‖If you don't apply for the scholarship this week, you'll miss the boat.‖Many small shops missed the boat when online shopping became popular.", "Use: neutral"], ["no pain, no gain", "you must work hard to succeed", "Training is tough, but no pain, no gain.‖Studying at night is hard, but no pain, no gain.‖“I'm tired.” “No pain, no gain.”", "Use: casual"], ["off the top of my head", "without thinking or checking", "Off the top of my head, I think it's about ten kilometres.‖Off the top of my head, I can't remember his name.‖I can give you three examples off the top of my head.", "Use: spoken"], ["on the fence", "undecided", "I'm still on the fence about which university to choose.‖Many voters are on the fence this year.‖She was on the fence about moving abroad.", "Use: neutral"], ["out of the blue", "suddenly, unexpectedly", "I was cooking dinner when my old school friend called me out of the blue.‖Out of the blue, the lights went off and the whole street went dark.‖He proposed to her out of the blue on a quiet Sunday evening.", "Use: everyday"], ["play it by ear", "decide as things happen", "We don't have a fixed plan; we'll play it by ear.‖I'll play it by ear and see how I feel tomorrow.‖Let's play it by ear depending on the weather.", "Use: casual"], ["pull someone's leg", "joke with someone", "Are you serious, or are you pulling my leg?‖He was only pulling your leg.‖Stop pulling my leg; I don't believe it.", "Use: casual"], ["put your foot down", "be firm about something", "My parents put their foot down about late nights.‖The manager put his foot down and refused any more delays.‖It's time to put your foot down and say no.", "Use: neutral"], ["the ball is in your court", "it's your turn to decide", "I've made my offer, so the ball is in your court.‖The ball is in your court now; call me when you decide.‖We've done our part, and the ball is in their court.", "Use: work"], ["throw in the towel", "give up", "After three failed attempts, he refused to throw in the towel.‖She nearly threw in the towel, but her friends encouraged her.‖Don't throw in the towel yet; you're so close.", "Use: neutral"], ["you can't judge a book by its cover", "don't judge by appearance", "The shop looks old, but you can't judge a book by its cover.‖He looks strict, but you can't judge a book by its cover.‖That cheap cafe has great food; you can't judge a book by its cover.", "Use: everyday"]], "Nouns": [["routine", "a regular way of doing things", "My morning routine starts with a glass of water.‖Changing your daily routine can feel strange at first.‖A good study routine helps you stay focused.", "Countable · plural: routines · common noun"], ["challenge", "something difficult that tests you", "Speaking in front of strangers is a big challenge for me.‖The team accepted the challenge and finished the work in two days.‖Every job has its own challenges.", "Countable · plural: challenges · abstract noun"], ["opportunity", "a chance to do something good", "Studying abroad is a wonderful opportunity to meet new people.‖Don't miss this opportunity to practise your English.‖There are few job opportunities in small villages.", "Countable · plural: opportunities · abstract noun"], ["habit", "something you do regularly", "Reading before bed is a good habit.‖He has a bad habit of biting his nails.‖Healthy habits protect you from illness.", "Countable · plural: habits · often with good/bad"], ["experience", "knowledge from doing something", "She has five years of teaching experience.‖Our trip to the mountains was an unforgettable experience.‖Employers usually ask about your work experience.", "Uncountable (knowledge: no plural) · Countable (an event: an experience)"], ["schedule", "a plan of times", "My schedule is very full on Tuesdays.‖The train is running behind schedule.‖We made a study schedule for the whole month.", "Countable · plural: schedules · UK say /ˈʃedjuːl/"], ["reason", "why something happens", "What is the reason for the delay?‖I have three reasons for moving.‖She gave no reason for leaving early.", "Countable · plural: reasons"], ["advantage", "a good point", "One advantage of living here is the low rent.‖Speaking two languages gives you an advantage at work.‖Take advantage of free classes.", "Countable · plural: advantages · opposite: disadvantage"], ["appointment", "a planned meeting", "I have a dentist appointment at noon.‖She made an appointment with the doctor.‖He missed his appointment.", "Countable · plural: appointments"], ["budget", "a plan for spending money", "We have a small budget for the trip.‖Stay within your budget.‖The school has a tight budget this year.", "Countable · plural: budgets"], ["deadline", "the last time to finish something", "The deadline for the essay is Friday.‖We missed the deadline.‖She works well under a tight deadline.", "Countable · plural: deadlines"], ["environment", "the natural world around us", "Plastic harms the environment.‖The office is a friendly working environment.‖We must protect the environment.", "Countable (a place) · Uncountable (nature) · the environment"], ["fashion", "a popular style", "She loves fashion.‖Short skirts were in fashion then.‖Fashions change quickly.", "Uncountable (style in general) · Countable (a trend)"], ["fever", "a high body temperature", "She stayed home with a fever.‖He has a high fever.‖The fever went down overnight.", "Countable · plural: fevers"], ["gadget", "a small useful device", "He loves buying new gadgets.‖This gadget peels apples.‖Kitchen gadgets can be useful.", "Countable · plural: gadgets"], ["generation", "people born at about the same time", "My generation grew up with phones.‖Three generations live in this house.‖The next generation will face new problems.", "Countable · plural: generations"], ["guest", "a person invited or staying", "We had ten guests for dinner.‖The hotel's guests enjoy free breakfast.‖Be a good guest.", "Countable · plural: guests"], ["income", "money you earn", "Her monthly income is not high.‖Families with a low income need support.‖Tourism is an important source of income here.", "Uncountable (usually) · abstract noun"], ["journey", "a long trip", "The journey to the village took six hours.‖Have a safe journey!‖Our journey began at dawn.", "Countable · plural: journeys"], ["knowledge", "what you know", "Reading increases your knowledge of the world.‖She has a good knowledge of history.‖Share your knowledge with others.", "Uncountable · never ‘a knowledge’ · abstract noun"], ["lecture", "a long talk to students", "The lecture on history was fascinating.‖She gave a lecture on health.‖I fell asleep during the lecture.", "Countable · plural: lectures"], ["luggage", "bags you travel with", "I lost my luggage at the airport.‖How much luggage can I take on the plane?‖Please leave your luggage at the hotel desk.", "Uncountable · never ‘luggages’ · use ‘a piece of luggage’"], ["neighbour", "a person living near you", "Our neighbour often helps us carry shopping.‖My neighbours are very friendly.‖He is my next-door neighbour.", "Countable · plural: neighbours"], ["noise", "an unpleasant sound", "The noise from the street kept me awake.‖I heard a strange noise in the kitchen.‖The children made a lot of noise.", "Uncountable (sound in general) · Countable (a particular noise)"], ["patient", "a person getting medical care", "The doctor saw ten patients today.‖The patient is feeling better.‖Nurses care for patients at night.", "Countable · plural: patients"], ["pollution", "harmful dirt in air or water", "Air pollution is serious in big cities.‖Pollution kills fish in the river.‖Cars cause a lot of pollution.", "Uncountable · no plural"], ["priority", "something more important than others", "My priority this year is passing IELTS.‖Safety is our top priority.‖Set your priorities clearly.", "Countable · plural: priorities"], ["promotion", "a move to a higher job", "He got a promotion after two years.‖She hopes for a promotion.‖The shop has a special promotion this week.", "Countable · plural: promotions"], ["queue", "a line of waiting people", "There was a long queue at the bank.‖We stood in a queue for an hour.‖Please join the queue.", "Countable · plural: queues"], ["receipt", "a paper showing you paid", "Keep the receipt in case you return it.‖She asked for a receipt.‖I lost the receipt.", "Countable · plural: receipts"], ["resident", "a person who lives in a place", "Residents complained about the traffic.‖He is a resident of Dhaka.‖Only residents can park here.", "Countable · plural: residents"], ["salary", "regular pay for a job", "Her salary rises every year.‖He earns a good salary.‖Teachers' salaries are paid monthly.", "Countable · plural: salaries"], ["scenery", "the natural view", "The scenery in the hills is beautiful.‖We stopped the car to enjoy the scenery.‖The film is famous for its stunning scenery.", "Uncountable · no plural · don't say ‘sceneries’"], ["shortcut", "a quicker way", "We took a shortcut through the park.‖There is no shortcut to success.‖Use this keyboard shortcut.", "Countable · plural: shortcuts"], ["shift", "a work period", "He works the night shift at the hospital.‖My shift starts at six.‖Nurses work long shifts.", "Countable · plural: shifts"], ["society", "people living together", "Education improves society.‖She joined a drama society.‖Modern society depends on technology.", "Uncountable (people in general) · Countable (a club)"], ["souvenir", "a thing kept to remember a trip", "I bought a small souvenir in Sylhet.‖The shop sells cheap souvenirs.‖This shell is my souvenir from the beach.", "Countable · plural: souvenirs"], ["stranger", "a person you don't know", "Don't talk to strangers online.‖He felt like a stranger in the city.‖A stranger helped me find the way.", "Countable · plural: strangers"], ["tradition", "a custom passed down", "Eating together is a family tradition.‖Every country has its own traditions.‖It is a tradition to give gifts on Eid.", "Countable · plural: traditions"], ["traffic", "vehicles on the road", "Traffic was terrible this morning.‖I was late because of heavy traffic.‖We left early to avoid the evening traffic.", "Uncountable · no plural · use ‘much traffic’"], ["victim", "a person harmed by something", "The victims received help quickly.‖She was a victim of a scam.‖Flood victims need food.", "Countable · plural: victims"], ["volunteer", "someone who helps without pay", "She is a volunteer at a local school.‖We need more volunteers.‖Volunteers cleaned the beach.", "Countable · plural: volunteers"], ["warning", "a sign of danger", "The storm warning came late.‖He ignored the warning.‖There is a warning sign on the door.", "Countable · plural: warnings"], ["weakness", "a point where you are not strong", "My weakness is spelling.‖Everyone has strengths and weaknesses.‖Sweets are his weakness.", "Countable · plural: weaknesses"], ["wealth", "a lot of money or goods", "Health matters more than wealth.‖The family's wealth came from trade.‖Wealth does not guarantee happiness.", "Uncountable · no plural"], ["accent", "a way of pronouncing words", "He has a soft Scottish accent.‖She lost her accent abroad.‖Many accents exist in English.", "Countable · plural: accents"], ["benefit", "a good result", "Walking has many health benefits.‖The job has good benefits.‖The benefit of this plan is low cost.", "Countable · plural: benefits"], ["cause", "what makes something happen", "Stress is a common cause of headaches.‖The cause of the fire is unknown.‖She supports a good cause.", "Countable · plural: causes"], ["solution", "an answer to a problem", "We need a solution to the water shortage.‖He found a simple solution.‖There is no easy solution.", "Countable · plural: solutions"], ["standard", "a level of quality", "The hotel is of a high standard.‖Schools must meet safety standards.‖Her standards are very high.", "Countable · plural: standards"]], "Verbs": [["manage", "to succeed in doing something", "I managed to finish the report before dinner.‖She manages a small clothes shop.‖How do you manage so many tasks?", "Base: manage · Past: managed · Past participle: managed · -ing: managing · Regular · Transitive & intransitive"], ["realise", "to understand suddenly", "I realised I had left my keys at home.‖She realised her mistake too late.‖Do you realise how late it is?", "Base: realise · Past: realised · Past participle: realised · -ing: realising · Regular · Transitive"], ["suggest", "to offer an idea", "I suggest we take the early train.‖She suggested a new way to learn words.‖They suggested meeting at six.", "Base: suggest · Past: suggested · Past participle: suggested · -ing: suggesting · Regular · Transitive · + -ing or that-clause"], ["improve", "to get better", "My listening has improved a lot this year.‖Reading helps improve your vocabulary.‖How can I improve my speaking?", "Base: improve · Past: improved · Past participle: improved · -ing: improving · Regular · Transitive & intransitive"], ["rely on", "to depend on", "You can rely on me.‖Many people rely on public transport.‖We relied on the map to find the hotel.", "Base: rely on · Past: relied on · Past participle: relied on · -ing: relying on · Regular · Transitive"], ["look forward to", "to wait happily for", "I'm looking forward to the holiday.‖She looks forward to seeing her family.‖We looked forward to the weekend all week.", "Base: look forward to · Past: looked forward to · Past participle: looked forward to · -ing: looking forward to · Regular · Transitive · followed by -ing"], ["figure out", "to understand or solve", "I can't figure out how this machine works.‖She figured out the answer in a minute.‖Let's figure out where to meet.", "Base: figure out · Past: figured out · Past participle: figured out · -ing: figuring out · Regular · Phrasal verb"], ["give up", "to stop trying", "Don't give up when the task gets hard.‖He gave up smoking last year.‖I'm giving up chocolate for a month.", "Base: give up · Past: gave up · Past participle: given up · -ing: giving up · Irregular · Phrasal verb"], ["afford", "to have enough money for", "I can't afford a new phone.‖They couldn't afford to travel abroad.‖Can you afford the rent here?", "Base: afford · Past: afforded · Past participle: afforded · -ing: affording · Regular · Transitive"], ["apologise", "to say sorry", "He apologised for being late.‖I apologise for the mistake.‖She apologised to everyone in the room.", "Base: apologise · Past: apologised · Past participle: apologised · -ing: apologising · Regular · Intransitive"], ["apply", "to ask formally for a job or place", "She applied for a scholarship.‖Apply the cream twice a day.‖He applied to three universities.", "Base: apply · Past: applied · Past participle: applied · -ing: applying · Regular · Transitive & intransitive"], ["arrange", "to plan or organise", "Can you arrange a meeting for Monday?‖They arranged flowers on the table.‖We arranged to meet at six.", "Base: arrange · Past: arranged · Past participle: arranged · -ing: arranging · Regular · Transitive"], ["attend", "to go to an event", "Over 200 people attended the lecture.‖She attends English classes every evening.‖He didn't attend the meeting.", "Base: attend · Past: attended · Past participle: attended · -ing: attending · Regular · Transitive"], ["avoid", "to stay away from", "Try to avoid eating late at night.‖He avoided answering my question.‖We took a side road to avoid traffic.", "Base: avoid · Past: avoided · Past participle: avoided · -ing: avoiding · Regular · Transitive · followed by -ing, not ‘to’"], ["borrow", "to take and return later", "Can I borrow your pen?‖She borrowed a book from the library.‖You can't borrow my laptop today.", "Base: borrow · Past: borrowed · Past participle: borrowed · -ing: borrowing · Regular · Transitive · opposite: lend"], ["cancel", "to stop something planned", "They cancelled the match because of rain.‖I need to cancel my booking.‖The flight was cancelled.", "Base: cancel · Past: cancelled · Past participle: cancelled · -ing: cancelling · Regular · Transitive"], ["cheat", "to act dishonestly", "He was caught cheating in the exam.‖She cheated at cards.‖It is wrong to cheat customers.", "Base: cheat · Past: cheated · Past participle: cheated · -ing: cheating · Regular · Transitive & intransitive"], ["compare", "to look at differences", "Compare the two phones before buying.‖People often compare themselves with others.‖She compared prices in three shops.", "Base: compare · Past: compared · Past participle: compared · -ing: comparing · Regular · Transitive"], ["complain", "to say you are unhappy", "Guests complained about the noise.‖He always complains about the food.‖I complained to the manager.", "Base: complain · Past: complained · Past participle: complained · -ing: complaining · Regular · Intransitive"], ["decide", "to make a choice", "We decided to take the train.‖I can't decide between tea and coffee.‖She has decided to study medicine.", "Base: decide · Past: decided · Past participle: decided · -ing: deciding · Regular · Regular · + to-infinitive"], ["describe", "to say what something is like", "Describe your hometown in detail.‖She described the thief to the police.‖Can you describe how it felt?", "Base: describe · Past: described · Past participle: described · -ing: describing · Regular · Transitive"], ["disappear", "to go out of sight", "The sun disappeared behind clouds.‖My keys have disappeared again.‖Many old customs are disappearing.", "Base: disappear · Past: disappeared · Past participle: disappeared · -ing: disappearing · Regular · Intransitive"], ["discover", "to find something new", "Scientists discovered a new species.‖I discovered a great cafe near my home.‖He discovered that he loved painting.", "Base: discover · Past: discovered · Past participle: discovered · -ing: discovering · Regular · Transitive"], ["earn", "to get money for work", "She earns a good salary.‖He earned money by teaching.‖How much do you earn a month?", "Base: earn · Past: earned · Past participle: earned · -ing: earning · Regular · Transitive"], ["expect", "to think something will happen", "I expect the bus to be late.‖We are expecting guests tonight.‖She articiple: joined · -ing: joining · Regular · Transitive"], ["lend", "to give for a short time", "Could you lend me ten dollars?‖He lent me his bike for the weekend.‖Banks lend money to businesses.", "Base: lend · Past: lent · Past participle: lent · -ing: lending · Irregular · Transitive · opposite: borrow"], ["mention", "to speak about briefly", "He mentioned that he might move.‖Don't mention it to anyone.‖She mentioned her new job.", "Base: mention · Past: mentioned · Past participle: mentioned · -ing: mentioning · Regular · Transitive"], ["miss", "to feel sad that someone is not there", "I miss my family.‖We missed the last bus.‖Don't miss this chance.", "Base: miss · Past: missed · Past participle: missed · -ing: missing · Regular · Transitive"], ["notice", "to see something", "I noticed a small mistake in the report.‖Did you notice the new sign?‖She noticed him waiting outside.", "Base: notice · Past: noticed · Past participle: noticed · -ing: noticing · Regular · Transitive"], ["offer", "to give someone a choice", "They offered me a job.‖He offered to help with my bags.‖The shop offers free delivery.", "Base: offer · Past: offered · Past participle: offered · -ing: offering · Regular · Transitive"], ["persuade", "to convince someone to do something", "She persuaded me to try yoga.‖I couldn't persuade him to stay.‖They persuaded the council to build a park.", "Base: persuade · Past: persuaded · Past participle: persuaded · -ing: persuading · Regular · Transitive"], ["postpone", "to delay until later", "The trip was postponed until spring.‖We postponed the meeting by a week.‖Don't postpone your homework.", "Base: postpone · Past: postponed · Past participle: postponed · -ing: postponing · Regular · Transitive"], ["prefer", "to like more", "I prefer tea to coffee.‖She preferred to walk.‖Which do you prefer?", "Base: prefer · Past: preferred · Past participle: preferred · -ing: preferring · Regular · Transitive"], ["prevent", "to stop something happening", "Washing hands prevents illness.‖Rain prevented us from going out.‖How can we prevent accidents?", "Base: prevent · Past: prevented · Past participle: prevented · -ing: preventing · Regular · Transitive"], ["recommend", "to say something is good", "Can you recommend a good restaurant?‖The doctor recommended rest.‖I recommend that you book early.", "Base: recommend · Past: recommended · Past participle: recommended · -ing: recommending · Regular · Transitive"], ["refuse", "to say no", "He refused to answer.‖She refused the offer politely.‖They refused entry to the guests.", "Base: refuse · Past: refused · Past participle: refused · -ing: refusing · Regular · Transitive & intransitive"], ["remind", "to help someone remember", "Remind me to call my mother.‖This song reminds me of school.‖She reminded him about the meeting.", "Base: remind · Past: reminded · Past participle: reminded · -ing: reminding · Regular · Transitive"], ["reply", "to answer", "She replied to my email quickly.‖He replied that he was busy.‖I haven't replied yet.", "Base: reply · Past: replied · Past participle: replied · -ing: replying · Regular · Intransitive"], ["require", "to need", "The job requires good English.‖This course requires daily practice.‖All students are required to wear uniforms.", "Base: require · Past: required · Past participle: required · -ing: requiring · Regular · Transitive · often passive"], ["share", "to use together", "We share a room.‖She shared her notes with me.‖Please share the cake.", "Base: share · Past: shared · Past participle: shared · -ing: sharing · Regular · Transitive & intransitive"], ["solve", "to find an answer to", "We solved the problem together.‖He solved the puzzle in a minute.‖Can you solve this equation?", "Base: solve · Past: solved · Past participle: solved · -ing: solving · Regular · Transitive"], ["survive", "to stay alive", "Few plants survive in the desert.‖He survived the accident with only a broken arm.‖How do small shops survive these days?", "Base: survive · Past: survived · Past participle: survived · -ing: surviving · Regular · Transitive & intransitive"]], "Adjectives": [["exhausted", "very tired", "After the long trip, we were exhausted.‖She felt exhausted after a night shift.‖I'm too exhausted to cook tonight.", "Ungradable (extreme) · say ‘absolutely exhausted’, not ‘very exhausted’"], ["reliable", "can be trusted", "He is a reliable friend who always keeps his promises.‖Is this website a reliable source?‖My old car is cheap but reliable.", "Gradable · comparative: more reliable · opposite: unreliable"], ["suitable", "right for a purpose", "Is this room suitable for a meeting?‖She wore clothes suitable for the weather.‖He is not suitable for the job.", "Gradable · comparative: more suitable · opposite: unsuitable"], ["convenient", "easy and useful", "The shop is convenient because it is near my house.‖Is Monday convenient for you?‖A convenient bus runs every ten minutes.", "Gradable · comparative: more convenient · opposite: inconvenient"], ["awkward", "uncomfortable or embarrassing", "There was an awkward silence.‖I felt awkward at the formal dinner.‖He asked an awkward question.", "Gradable · comparative: more awkward · opposite: comfortable"], ["curious", "wanting to know", "Children are naturally curious.‖I was curious about her new job.‖The curious cat looked into the box.", "Gradable · comparative: more curious · opposite: uninterested"], ["crowded", "full of people", "The bus was crowded this morning.‖We avoided the crowded market.‖Dhaka is one of the most crowded cities.", "Gradable · comparative: more crowded · opposite: empty"], ["familiar", "well known to you", "Your voice sounds familiar.‖I felt at home in the familiar streets.‖She is familiar with several languages.", "Gradable · comparative: more familiar · opposite: unfamiliar"], ["ancient", "very old", "We visited an ancient temple.‖Ancient Rome had a huge empire.‖The village has ancient customs.", "Ungradable (extreme) · say ‘absolutely ancient’, not ‘very ancient’"], ["anxious", "worried", "I felt anxious before the interview.‖She is anxious about the results.‖The anxious parents waited outside.", "Gradable · comparative: more anxious · opposite: calm"], ["available", "free to use or meet", "Is this seat available?‖Tickets are available online.‖The doctor is not available today.", "Gradable · comparative: more available · opposite: unavailable"], ["brilliant", "very clever or bright", "She came up with a brilliant idea.‖He is a brilliant student.‖It was a brilliant performance.", "Ungradable (extreme) · say ‘absolutely brilliant’, not ‘very brilliant’"], ["cheerful", "happy and positive", "He is always cheerful in the morning.‖She gave a cheerful smile.‖The cheerful music lifted everyone's mood.", "Gradable · comparative: more cheerful · opposite: gloomy"], ["complicated", "difficult to understand", "The instructions were too complicated.‖It's a complicated story.‖Rules for the visa are complicated.", "Gradable · comparative: more complicated · opposite: simple"], ["confident", "sure of yourself", "I feel confident about the test.‖She is a confident speaker.‖He looked confident on stage.", "Gradable · comparative: more confident · opposite: unsure"], ["cruel", "causing pain", "It is cruel to keep a bird in a small cage.‖The cruel winter killed many animals.‖Her cruel words hurt him.", "Gradable · comparative: more cruel · opposite: kind"], ["delicious", "tasting very good", "The soup was absolutely delicious.‖She baked a delicious cake.‖Everything on the menu looks delicious.", "Ungradable (extreme) · say ‘absolutely delicious’, not ‘very delicious’"], ["dull", "not interesting", "The lecture was dull.‖It was a dull, grey day.‖He found the book dull.", "Gradable · comparative: duller · opposite: exciting"], ["efficient", "working well without waste", "The new system is more efficient.‖She is an efficient manager.‖Solar panels are an efficient source of power.", "Gradable · comparative: more efficient · opposite: inefficient"], ["embarrassed", "ashamed in front of others", "I was embarrassed when I forgot his name.‖She felt embarrassed about her accent.‖He gave an embarrassed laugh.", "Gradable · comparative: more embarrassed · opposite: proud"], ["fascinating", "extremely interesting", "The documentary was fascinating.‖She told us a fascinating story.‖It is a fascinating place to visit.", "Ungradable (extreme) · say ‘absolutely fascinating’, not ‘very fascinating’"], ["fragile", "easily broken", "Be careful; the glass is fragile.‖The fragile old bridge needs repair.‖Peace in the region is fragile.", "Gradable · comparative: more fragile · opposite: strong"], ["generous", "happy to give", "He is generous with his time.‖She made a generous donation.‖The generous host offered us more food.", "Gradable · comparative: more generous · opposite: mean"], ["grateful", "thankful", "I'm grateful for your help.‖She was grateful to her teachers.‖We are grateful that you came.", "Gradable · comparative: more grateful · opposite: ungrateful"], ["honest", "telling the truth", "Be honest with me.‖She is an honest person.‖Give me your honest opinion.", "Gradable · comparative: more honest · opposite: dishonest"], ["impatient", "unable to wait calmly", "The children grew impatient in the queue.‖He is impatient with slow computers.‖Don't be impatient; it takes time.", "Gradable · comparative: more impatient · opposite: patient"], ["independent", "not needing help", "She is independent and lives alone.‖Many students become independent at university.‖He runs an independent bookshop.", "Gradable · comparative: more independent · opposite: dependent"], ["jealous", "unhappy about what others have", "He felt jealous of his friend's success.‖She is jealous of her sister's grades.‖Don't be jealous; you will get your turn.", "Gradable · comparative: more jealous · opposite: content"], ["lazy", "not wanting to work", "I felt lazy on Sunday.‖He is too lazy to cook.‖A lazy afternoon by ", "also, in addition", "It is too far; besides, I'm tired.‖I don't want to go. Besides, it's raining.‖Besides English, she speaks French.", "Addition · informal · adds a stronger reason"], ["therefore", "as a result", "It rained; therefore, we stayed in.‖He is ill; therefore, he cannot come.‖The road was closed. Therefore, we took the train.", "Result · formal · common in IELTS Writing"], ["in addition", "also", "In addition, the hotel offers free breakfast.‖In addition to maths, he teaches physics.‖The job is well paid. In addition, it has good holidays.", "Addition · formal · use a comma"], ["as soon as", "immediately when", "Call me as soon as you arrive.‖I'll start as soon as he leaves.‖As soon as the bell rang, the children ran out.", "Time · no future tense after it"], ["although", "even though", "Although he was ill, he came to work.‖I went out although it was raining.‖Although the food was cheap, it was good.", "Contrast · don't use ‘but’ in the same sentence"], ["for instance", "for example", "Some fruits, for instance apples, last long.‖Many cities, for instance Tokyo, are very crowded.‖Use linking words, for instance however and therefore.", "Example · put commas around it"], ["on the other hand", "used to show a different view", "Cities are exciting; on the other hand, they are noisy.‖Online classes are flexible. On the other hand, they can feel lonely.‖Cars are fast; on the other hand, they cause pollution.", "Contrast · use after stating one side first"]]};

var GUIDE={"Idioms":"An idiom's meaning is not the same as its separate words. Learn the whole phrase, notice when it is used (casual, work, spoken), and copy the example sentences aloud.","Nouns":"Countable nouns can be counted and have a plural (one habit, two habits). Uncountable nouns have no plural and no a/an (some luggage, not ‘a luggage’). Use many/a few with countable and much/a little with uncountable. Some nouns can be both (experience, noise).","Verbs":"Finite verbs show tense and agree with the subject (She works). Non-finite forms do not: infinitive (to work), -ing form (working), past participle (worked). Regular verbs add -ed; irregular verbs change (lend, lent, lent). Transitive verbs need an object (borrow a book); intransitive verbs do not (arrive). The past participle is used after have/has/had and in the passive.","Adjectives":"Gradable adjectives can be used with very/more/less (very reliable). Ungradable (extreme) adjectives cannot (exhausted, tiny); say ‘absolutely’ instead. Short adjectives add -er/-est; long ones use more/most.","Adverbs":"Adverbs describe verbs, adjectives or other adverbs. Many end in -ly. Frequency adverbs (usually, hardly) usually go before the main verb.","Connectors":"Connectors link ideas. Use them to contrast (however), add (besides), give a result (therefore) or give examples (for instance)."};
