var I=[["a piece of cake", "very easy", "I thought the grammar test would be hard, but it was a piece of cake.‖Making tea is a piece of cake once you know the steps.‖“Can you fix my phone?” “Sure, that's a piece of cake.”", "casual, everyday"], ["break the ice", "start a conversation in an awkward situation", "He told a funny story to break the ice at the start of the meeting.‖On my first day at university I asked a simple question to break the ice with my roommate.‖A short game is a great way to break the ice with new students.", "neutral"], ["bite the bullet", "do something unpleasant bravely", "I didn't want to visit the dentist, but I finally bit the bullet and booked an appointment.‖Sometimes you just have to bite the bullet and say sorry.‖She bit the bullet, sold her car and paid off the debt.", "neutral"], ["call it a day", "stop working for today", "We've been painting since morning, so let's call it a day and finish tomorrow.‖After ten hours of studying, I called it a day and went for a walk.‖When the rain got heavier, the workers decided to call it a day.", "casual"], ["cost an arm and a leg", "be very expensive", "Studying abroad can cost an arm and a leg.", "casual"], ["cut corners", "do something cheaply or carelessly", "The builder cut corners, and now the roof leaks.", "neutral, negative"], ["get out of hand", "become uncontrolled", "The party got out of hand, and the neighbours called the police.", "neutral"], ["hit the books", "start studying hard", "I can't go out tonight; I have to hit the books for my IELTS test.‖After a relaxed holiday, it was time to hit the books again.‖Students usually hit the books hard a week before the exams.", "casual"], ["in the long run", "after a long time, eventually", "Cheap shoes may save money now, but good ones are cheaper in the long run.‖Practising speaking every day will help you a lot in the long run.‖In the long run, honesty is always the best policy.", "neutral"], ["on the same page", "in agreement, understanding the same thing", "Before we start the project, let's make sure everyone is on the same page.‖My sister and I are on the same page about moving to a bigger house.‖The teacher repeated the rules until the whole class was on the same page.", "work, neutral"], ["once in a blue moon", "very rarely", "I only eat fast food once in a blue moon.", "casual"], ["under the weather", "slightly ill", "I'm feeling a bit under the weather, so I'll skip the party tonight.‖He looked under the weather this morning, so we sent him home.‖If you feel under the weather, drink warm water and rest.", "casual, everyday"], ["spill the beans", "reveal a secret", "She spilled the beans about the surprise party.", "casual"], ["the last straw", "the final problem that makes you lose patience", "When he forgot my birthday again, that was the last straw.", "neutral"], ["a blessing in disguise", "something bad that turns out good", "Losing that job was a blessing in disguise because I found a better one.", "neutral"], ["add insult to injury", "make a bad situation worse", "The bus was late, and to add insult to injury, it started raining.", "neutral"], ["at the end of the day", "when everything is considered", "You can ask everyone for advice, but at the end of the day it's your decision.‖We argued a lot, but at the end of the day we are still best friends.‖At the end of the day, what matters is that you tried your best.", "spoken, very common"], ["back to square one", "start again from the beginning", "The file was deleted, so we are back to square one.", "neutral"], ["beat around the bush", "avoid the main point", "Stop beating around the bush and tell me what happened.", "casual"], ["better late than never", "it's good to do it even if late", "He finally apologised, and better late than never.", "everyday"], ["burn the midnight oil", "work late at night", "She burned the midnight oil to finish her thesis.", "neutral"], ["by the book", "exactly following the rules", "The manager does everything by the book.", "work"], ["catch someone off guard", "surprise someone", "His question caught me off guard, and I couldn't answer.", "neutral"], ["come up with", "think of an idea or plan", "Can you come up with a better solution?", "phrasal verb, everyday"], ["cross that bridge when you come to it", "deal with a problem only when it happens", "We don't know if it will rain, so let's cross that bridge when we come to it.", "spoken"], ["cut a long story short", "tell only the main points", "To cut a long story short, we missed the train and walked home.", "spoken"], ["down to earth", "practical and honest, not proud", "Despite being famous, she is very down to earth.", "describing people"], ["drive someone up the wall", "annoy someone very much", "The noise from next door drives me up the wall.", "casual"], ["every cloud has a silver lining", "there is something good in every bad situation", "I failed the test, but it showed me what to improve. Every cloud has a silver lining.", "everyday"], ["get the hang of", "learn how to do something", "It took a week, but I finally got the hang of driving.", "casual"], ["give it a shot", "try something", "I've never cooked fish, but I'll give it a shot.", "casual"], ["go the extra mile", "make a special extra effort", "Our teacher went the extra mile and stayed after class to help me with my essay.‖If you want a high band score, you must be ready to go the extra mile.‖The hotel staff went the extra mile to make our stay special.", "work, school"], ["hang in there", "don't give up", "Hang in there; the exams will be over soon.", "casual, encouraging"], ["have a lot on my plate", "be very busy", "I can't help now; I have a lot on my plate this week.", "everyday"], ["in a nutshell", "in a few words", "In a nutshell, the plan is cheap and fast.", "spoken, presenting"], ["it's not rocket science", "it's not difficult", "Using this app is not rocket science.", "casual"], ["keep an eye on", "watch carefully", "Could you keep an eye on my bag for a minute?", "everyday"], ["let the cat out of the bag", "reveal a secret by accident", "He let the cat out of the bag about the wedding.", "casual"], ["look on the bright side", "think positively", "Look on the bright side: at least nobody was hurt.", "casual, encouraging"], ["make ends meet", "have just enough money to live", "With two jobs, she barely makes ends meet.", "neutral"], ["miss the boat", "lose a chance", "Tickets were cheap last month, but I waited and missed the boat.‖If you don't apply for the scholarship this week, you'll miss the boat.‖Many small shops missed the boat when online shopping became popular.", "neutral"], ["no pain, no gain", "you must work hard to succeed", "Training is tough, but no pain, no gain.", "casual"], ["off the top of my head", "without thinking or checking", "Off the top of my head, I think it's about ten kilometres.", "spoken"], ["on the fence", "undecided", "I'm still on the fence about which university to choose.", "neutral"], ["out of the blue", "suddenly, unexpectedly", "I was cooking dinner when my old school friend called me out of the blue.‖Out of the blue, the lights went off and the whole street went dark.‖He proposed to her out of the blue on a quiet Sunday evening.", "everyday"], ["play it by ear", "decide as things happen", "We don't have a fixed plan; we'll play it by ear.", "casual"], ["pull someone's leg", "joke with someone", "Are you serious, or are you pulling my leg?", "casual"], ["put your foot down", "be firm about something", "My parents put their foot down about late nights.", "neutral"], ["the ball is in your court", "it's your turn to decide", "I've made my offer, so the ball is in your court.", "work"], ["throw in the towel", "give up", "After three failed attempts, he refused to throw in the towel.", "neutral"], ["you can't judge a book by its cover", "don't judge by appearance", "The shop looks old, but you can't judge a book by its cover.", "everyday"]],P={"Nouns": [["routine", "a regular way of doing things", "My morning routine starts with a glass of water.‖Changing your daily routine can feel strange at first.‖A good study routine helps you stay focused.‖Her exercise routine takes only twenty minutes.", "Countable · plural: routines · common noun"], ["challenge", "something difficult that tests you", "Speaking in front of strangers is a big challenge for me.‖The team accepted the challenge and finished the work in two days.‖Learning a new language is a great challenge.‖Every job has its own challenges.", "Countable · plural: challenges · abstract noun"], ["opportunity", "a chance to do something good", "Studying abroad is a wonderful opportunity to meet new people.‖Don't miss this opportunity to practise your English.‖She took the opportunity to ask the manager a question.‖There are few job opportunities in small villages.", "Countable · plural: opportunities · abstract noun"], ["habit", "something you do regularly", "Reading before bed is a good habit.‖He has a bad habit of biting his nails.‖It takes weeks to build a new habit.‖Healthy habits protect you from illness.", "Countable · plural: habits · often with good/bad"], ["experience", "knowledge from doing something", "She has five years of teaching experience.‖Our trip to the mountains was an unforgettable experience.‖You can't learn some things without experience.‖Employers usually ask about your work experience.", "Uncountable (knowledge: no plural) · Countable (an event: an experience)"], ["schedule", "a plan of times", "My schedule is very full on Tuesdays.‖The train is running behind schedule.‖We made a study schedule for the whole month.‖Please check the schedule before you come.", "Countable · plural: schedules · UK say /ˈʃedjuːl/"], ["reason", "why something happens", "What is the reason for the delay?‖I have three reasons for moving.‖She gave no reason for leaving early.", "Countable · plural: reasons"], ["advantage", "a good point", "One advantage of living here is the low rent.‖Speaking two languages gives you an advantage at work.‖Take advantage of free classes.‖The main advantage of the app is that it is free.", "Countable · plural: advantages · opposite: disadvantage"], ["appointment", "a planned meeting", "I have a dentist appointment at noon.‖She made an appointment with the doctor.‖He missed his appointment.", "Countable · plural: appointments"], ["budget", "a plan for spending money", "We have a small budget for the trip.‖Stay within your budget.‖The school has a tight budget this year.", "Countable · plural: budgets"], ["deadline", "the last time to finish something", "The deadline for the essay is Friday.‖We missed the deadline.‖She works well under a tight deadline.", "Countable · plural: deadlines"], ["environment", "the natural world around us", "Plastic harms the environment.‖The office is a friendly working environment.‖We must protect the environment.", "Countable (a place) · Uncountable (nature) · the environment"], ["fashion", "a popular style", "She loves fashion.‖Short skirts were in fashion then.‖Fashions change quickly.", "Uncountable (style in general) · Countable (a trend)"], ["fever", "a high body temperature", "She stayed home with a fever.‖He has a high fever.‖The fever went down overnight.", "Countable · plural: fevers"], ["gadget", "a small useful device", "He loves buying new gadgets.‖This gadget peels apples.‖Kitchen gadgets can be useful.", "Countable · plural: gadgets"], ["generation", "people born at about the same time", "My generation grew up with phones.‖Three generations live in this house.‖The next generation will face new problems.", "Countable · plural: generations"], ["guest", "a person invited or staying", "We had ten guests for dinner.‖The hotel's guests enjoy free breakfast.‖Be a good guest.", "Countable · plural: guests"], ["income", "money you earn", "Her monthly income is not high.‖Families with a low income need support.‖Tourism is an important source of income here.‖He has a second income from teaching.", "Uncountable (usually) · abstract noun"], ["journey", "a long trip", "The journey to the village took six hours.‖Have a safe journey!‖Our journey began at dawn.", "Countable · plural: journeys"], ["knowledge", "what you know", "Reading increases your knowledge of the world.‖She has a good knowledge of history.‖Knowledge is power.‖Share your knowledge with others.", "Uncountable · never ‘a knowledge’ · abstract noun"], ["lecture", "a long talk to students", "The lecture on history was fascinating.‖She gave a lecture on health.‖I fell asleep during the lecture.", "Countable · plural: lectures"], ["luggage", "bags you travel with", "I lost my luggage at the airport.‖How much luggage can I take on the plane?‖She was carrying too much luggage.‖Please leave your luggage at the hotel desk.", "Uncountable · never ‘luggages’ · use ‘a piece of luggage’"], ["neighbour", "a person living near you", "Our neighbour often helps us carry shopping.‖My neighbours are very friendly.‖He is my next-door neighbour.", "Countable · plural: neighbours"], ["noise", "an unpleasant sound", "The noise from the street kept me awake.‖I heard a strange noise in the kitchen.‖Too much noise makes it hard to study.‖The children made a lot of noise.", "Uncountable (sound in general) · Countable (a particular noise)"], ["patient", "a person getting medical care", "The doctor saw ten patients today.‖The patient is feeling better.‖Nurses care for patients at night.", "Countable · plural: patients"], ["pollution", "harmful dirt in air or water", "Air pollution is serious in big cities.‖Pollution kills fish in the river.‖Cars cause a lot of pollution.", "Uncountable · no plural"], ["priority", "something more important than others", "My priority this year is passing IELTS.‖Safety is our top priority.‖Set your priorities clearly.", "Countable · plural: priorities"], ["promotion", "a move to a higher job", "He got a promotion after two years.‖She hopes for a promotion.‖The shop has a special promotion this week.", "Countable · plural: promotions"], ["queue", "a line of waiting people", "There was a long queue at the bank.‖We stood in a queue for an hour.‖Please join the queue.", "Countable · plural: queues"], ["receipt", "a paper showing you paid", "Keep the receipt in case you return it.‖She asked for a receipt.‖I lost the receipt.", "Countable · plural: receipts"], ["resident", "a person who lives in a place", "Residents complained about the traffic.‖He is a resident of Dhaka.‖Only residents can park here.", "Countable · plural: residents"], ["salary", "regular pay for a job", "Her salary rises every year.‖He earns a good salary.‖Teachers' salaries are paid monthly.", "Countable · plural: salaries"], ["scenery", "the natural view", "The scenery in the hills is beautiful.‖We stopped the car to enjoy the scenery.‖There is no scenery like this in the city.‖The film is famous for its stunning scenery.", "Uncountable · no plural · don't say ‘sceneries’"], ["shortcut", "a quicker way", "We took a shortcut through the park.‖There is no shortcut to success.‖Use this keyboard shortcut.", "Countable · plural: shortcuts"], ["shift", "a work period", "He works the night shift at the hospital.‖My shift starts at six.‖Nurses work long shifts.", "Countable · plural: shifts"], ["society", "people living together", "Education improves society.‖She joined a drama society.‖Modern society depends on technology.", "Uncountable (people in general) · Countable (a club)"], ["souvenir", "a thing kept to remember a trip", "I bought a small souvenir in Sylhet.‖The shop sells cheap souvenirs.‖This shell is my souvenir from the beach.", "Countable · plural: souvenirs"], ["stranger", "a person you don't know", "Don't talk to strangers online.‖He felt like a stranger in the city.‖A stranger helped me find the way.", "Countable · plural: strangers"], ["tradition", "a custom passed down", "Eating together is a family tradition.‖Every country has its own traditions.‖It is a tradition to give gifts on Eid.", "Countable · plural: traditions"], ["traffic", "vehicles on the road", "Traffic was terrible this morning.‖I was late because of heavy traffic.‖Traffic lights help control the flow of cars.‖We left early to avoid the evening traffic.", "Uncountable · no plural · use ‘much traffic’"], ["victim", "a person harmed by something", "The victims received help quickly.‖She was a victim of a scam.‖Flood victims need food.", "Countable · plural: victims"], ["volunteer", "someone who helps without pay", "She is a volunteer at a local school.‖We need more volunteers.‖Volunteers cleaned the beach.", "Countable · plural: volunteers"], ["warning", "a sign of danger", "The storm warning came late.‖He ignored the warning.‖There is a warning sign on the door.", "Countable · plural: warnings"], ["weakness", "a point where you are not strong", "My weakness is spelling.‖Everyone has strengths and weaknesses.‖Sweets are his weakness.", "Countable · plural: weaknesses"], ["wealth", "a lot of money or goods", "Health matters more than wealth.‖The family's wealth came from trade.‖Wealth does not guarantee happiness.", "Uncountable · no plural"], ["accent", "a way of pronouncing words", "He has a soft Scottish accent.‖She lost her accent abroad.‖Many accents exist in English.", "Countable · plural: accents"], ["benefit", "a good result", "Walking has many health benefits.‖The job has good benefits.‖The benefit of this plan is low cost.", "Countable · plural: benefits"], ["cause", "what makes something happen", "Stress is a common cause of headaches.‖The cause of the fire is unknown.‖She supports a good cause.", "Countable · plural: causes"], ["solution", "an answer to a problem", "We need a solution to the water shortage.‖He found a simple solution.‖There is no easy solution.", "Countable · plural: solutions"], ["standard", "a level of quality", "The hotel is of a high standard.‖Schools must meet safety standards.‖Her standards are very high.", "Countable · plural: standards"]], "Verbs": [["manage", "to succeed in doing something", "I managed to finish the report before dinner.‖She manages a small clothes shop.‖How do you manage so many tasks?‖He couldn't manage the heavy box alone.", "Base: manage · Past: managed · Past participle: managed · -ing: managing · Regular · Transitive & intransitive"], ["realise", "to understand suddenly", "I realised I had left my keys at home.‖She realised her mistake too late.‖Do you realise how late it is?", "Base: realise · Past: realised · Past participle: realised · -ing: realising · Regular · Transitive"], ["suggest", "to offer an idea", "I suggest we take the early train.‖She suggested a new way to learn words.‖What do you suggest?‖They suggested meeting at six.", "Base: suggest · Past: suggested · Past participle: suggested · Regular · Transitive · + -ing or that-clause"], ["improve", "to get better", "My listening has improved a lot this year.‖Reading helps improve your vocabulary.‖The weather will improve tomorrow.‖How can I improve my speaking?", "Base: improve · Past: improved · Past participle: improved · Regular · Transitive & intransitive"], ["rely on", "to depend on", "You can rely on me.‖Many people rely on public transport.‖We relied on the map to find the hotel.", "Base: rely on · Past: relied on · Past participle: relied on · -ing: relying on · Regular · Transitive"], ["look forward to", "to wait happily for", "I'm looking forward to the holiday.‖She looks forward to seeing her family.‖We looked forward to the weekend all week.", "Base: look forward to · Past: looked forward to · Past participle: looked forward to · -ing: looking forward to · Regular · Transitive"], ["figure out", "to understand or solve", "I can't figure out how this machine works.‖She figured out the answer in a minute.‖We have figured out a better plan.‖Let's figure out where to meet.", "Base: figure out · Past: figured out · Past participle: figured out · Regular · Phrasal verb"], ["give up", "to stop trying", "Don't give up when the task gets hard.‖He gave up smoking last year.‖She has given up the idea of moving abroad.‖I'm giving up chocolate for a month.", "Base: give up · Past: gave up · Past participle: given up · -ing: giving up · Irregular · Phrasal verb"], ["afford", "to have enough money for", "I can't afford a new phone.‖They couldn't afford to travel abroad.‖Can you afford the rent here?", "Base: afford · Past: afforded · Past participle: afforded · -ing: affording · Regular · Transitive"], ["apologise", "to say sorry", "He apologised for being late.‖I apologise for the mistake.‖She apologised to everyone in the room.", "Base: apologise · Past: apologised · Past participle: apologised · -ing: apologising · Regular · Intransitive"], ["apply", "to ask formally for a job or place", "She applied for a scholarship.‖Apply the cream twice a day.‖He applied to three universities.", "Base: apply · Past: applied · Past participle: applied · -ing: applying · Regular · Transitive & intransitive"], ["arrange", "to plan or organise", "Can you arrange a meeting for Monday?‖They arranged flowers on the table.‖We arranged to meet at six.", "Base: arrange · Past: arranged · Past participle: arranged · -ing: arranging · Regular · Transitive"], ["attend", "to go to an event", "Over 200 people attended the lecture.‖She attends English classes every evening.‖He didn't attend the meeting.", "Base: attend · Past: attended · Past participle: attended · -ing: attending · Regular · Transitive"], ["avoid", "to stay away from", "Try to avoid eating late at night.‖He avoided answering my question.‖We took a side road to avoid traffic.‖You can avoid mistakes by checking your work.", "Base: avoid · Past: avoided · Past participle: avoided · Regular · Transitive · followed by -ing, not ‘to’"], ["borrow", "to take and return later", "Can I borrow your pen?‖She borrowed a book from the library.‖I have borrowed money from my brother.‖You can't borrow my laptop today.", "Base: borrow · Past: borrowed · Past participle: borrowed · Regular · Transitive · opposite: lend"], ["cancel", "to stop something planned", "They cancelled the match because of rain.‖I need to cancel my booking.‖The flight was cancelled.", "Base: cancel · Past: cancelled · Past participle: cancelled · -ing: cancelling · Regular · Transitive"], ["cheat", "to act dishonestly", "He was caught cheating in the exam.‖She cheated at cards.‖It is wrong to cheat customers.", "Base: cheat · Past: cheated · Past participle: cheated · -ing: cheating · Regular · Transitive & intransitive"], ["compare", "to look at differences", "Compare the two phones before buying.‖People often compare themselves with others.‖She compared prices in three shops.", "Base: compare · Past: compared · Past participle: compared · -ing: comparing · Regular · Transitive"], ["complain", "to say you are unhappy", "Guests complained about the noise.‖He always complains about the food.‖I complained to the manager.", "Base: complain · Past: complained · Past participle: complained · -ing: complaining · Regular · Intransitive"], ["decide", "to make a choice", "We decided to take the train.‖I can't decide between tea and coffee.‖She has decided to study medicine.‖Who decides the rules?", "Base: decide · Past: decided · Past participle: decided · Regular · + to-infinitive"], ["describe", "to say what something is like", "Describe your hometown in detail.‖She described the thief to the police.‖Can you describe how it felt?", "Base: describe · Past: described · Past participle: described · -ing: describing · Regular · Transitive"], ["disappear", "to go out of sight", "The sun disappeared behind clouds.‖My keys have disappeared again.‖Many old customs are disappearing.", "Base: disappear · Past: disappeared · Past participle: disappeared · -ing: disappearing · Regular · Intransitive"], ["discover", "to find something new", "Scientists discovered a new species.‖I discovered a great cafe near my home.‖He discovered that he loved pa
