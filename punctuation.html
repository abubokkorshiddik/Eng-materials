var D=[
{s:". ? !",t:"Full stop, ? and !",i:"A full stop means stop. It ends one complete idea. If you can end ideas clearly, your writing is already easier to read.",
r:[["Full stop","Ends a statement. Short sentences are fine and often better.","The test was hard."],["Question mark","Ends a direct question only.","Where do you live?"],["Reported questions","A reported question is a statement, so it ends with a full stop.","She asked where I lived."],["Exclamation mark","Rare in academic writing. Use it in messages and speech.","What a surprise!"],["Abbreviations","British English usually leaves out stops in short forms.","Mr Khan, Dr Rahman, the UK"]],
m:[["She asked where I lived?","She asked where I lived.","Reported question."],["It was late I was tired.","It was late. I was tired.","Two ideas need a stop."],["The results were amazing!!!","The results were striking.","Avoid ! in Task 2."]],
k:"Say each sentence in your head. If you hear the idea finish, put a full stop.",
q:[["Which is correct?",["He asked where I live?","He asked where I live.","He asked, where I live!"],1,"A reported question is a statement."],["Which suits an IELTS essay?",["Prices rose sharply!","Prices rose sharply.","Prices rose sharply!!"],1,"Exclamation marks are rare in academic writing."]]},
{s:",",t:"The comma",i:"A comma means slow down. It separates parts of a sentence. Learn its four jobs and you will use it with confidence.",
r:[["1. Lists","Put commas between items. A comma before and is optional, but be consistent.","I bought apples, oranges and bananas."],["2. After an opening","Opening words and clauses get a comma.","However, prices rose. Although it rained, we went out."],["3. Extra information","Put a comma on both sides of extra information.","My brother, who lives in Dubai, is a doctor."],["4. Comma + joiner","Use a comma before and, but, so or or when they join two full sentences.","It rained, so we stayed home."],["Meaning changes","Commas can change the meaning.","My brother, who lives in Dubai, is a doctor (one brother). My brother who lives in Dubai is a doctor (more than one)."]],
m:[["I bought apples oranges and bananas.","I bought apples, oranges and bananas.","Separate list items."],["The students, are tired.","The students are tired.","Never put a comma between subject and verb."],["For example I like tea.","For example, I like tea.","Comma after the opening phrase."],["The man, who called, is my uncle.","The man who called is my uncle.","No commas for essential information."]],
k:"Label every comma in a paragraph: list, opening, extra information or joiner. If it has no label, remove it.",
q:[["Which is correct?",["First, we left.","First we, left.","First we left,"],0,"An opening word gets a comma."],["Which is correct?",["The students, are tired.","The students are tired.","The, students are tired."],1,"No comma between subject and verb."],["I live in Dhaka which is the capital. Best fix:",["I live in Dhaka, which is the capital.","I live in, Dhaka which is the capital.","I live in Dhaka which, is the capital."],0,"Extra information needs a comma."]]},
{s:",⚠",t:"The comma splice",i:"The biggest punctuation mistake in IELTS is the comma splice: joining two full sentences with only a comma. Fix this and you fix most of your punctuation.",
r:[["The test","Split the sentence at the comma. Can both halves stand alone? Then it is a splice.","It was late, we went home. (both halves are full sentences)"],["Fix 1: full stop","Make two sentences.","It was late. We went home."],["Fix 2: semicolon","Join two related sentences.","It was late; we went home."],["Fix 3: comma + joiner","Add and, but, so or or.","It was late, so we went home."],["Fix 4: supporting clause","Make one half depend on the other.","Because it was late, we went home."],["However, therefore, moreover","These are not joiners. Use a stop or semicolon before and a comma after.","It rained; however, we went out."]],
m:[["It was late, we went home.","It was late, so we went home.","Comma splice."],["I like tea, I don’t like coffee.","I like tea, but I don’t like coffee.","Comma splice."],["However it was late, we stayed.","It was late; however, we stayed.","However is not a joiner."],["It rained, however we went out.","It rained; however, we went out.","Needs a semicolon or full stop."]],
k:"Reread every long Task 2 sentence and look for a hidden full stop. Long sentences hide most splices.",
q:[["Which fixes the splice? “It rained, we left.”",["It rained, so we left.","It rained we, left.","It rained; so, we left."],0,"A comma plus so joins two full sentences."],["Which is correct?",["It rained, however we went.","It rained; however, we went.","It rained however, we went."],1,"Semicolon before, comma after."],["A comma splice is…",["two full sentences joined by only a comma","a missing capital","a misplaced apostrophe"],0,"It is the most common punctuation error."]]},
{s:"; :",t:"Semicolon and colon",i:"A semicolon links two closely related complete ideas. A colon introduces a list or an explanation after a complete sentence.",
r:[["Semicolon","Joins two related full sentences.","Some prefer cities; others prefer villages."],["Semicolon + however","Also goes before words like however and therefore.","It was late; therefore, we left."],["Colon: list","Use after a complete sentence.","I need three things: time, money and focus."],["Colon: explanation","Introduces a reason or result.","There is one problem: nobody agrees."],["No colon","Do not put a colon after a verb or after such as or including.","I need time, money and focus. Fruits such as apples are cheap."]],
m:[["There are three reasons, money, time and health.","There are three reasons: money, time and health.","Colon introduces the list."],["I need: time and money.","I need time and money.","No colon after a verb."],["Fruits such as: apples, pears.","Fruits such as apples and pears.","No colon after such as."]],
k:"Semicolon: both sides must be full sentences. Colon: the part before it must be a full sentence.",
q:[["Some like cities___ others like villages.",[",",";",":"],1,"A semicolon joins two related sentences."],["I need three things___ time, money and focus.",[";",":",","],1,"A colon introduces the list."],["After “such as” use…",["a colon","no colon","a semicolon"],1,"A colon would break the sentence."]]},
{s:"’",t:"The apostrophe",i:"The apostrophe does only two jobs: it shows who owns something, and it shows missing letters. It never makes a plural.",
r:[["Missing letters","Contractions: don’t (do not), it’s (it is).","I don’t know. It’s raining."],["One owner","Add ’s.","the boy’s book, Ali’s bag"],["Several owners","Add ’ after the s.","the boys’ books, the students’ room"],["Irregular plurals","Add ’s.","the children’s toys, women’s rights"],["It’s or its?","it’s = it is. its = belonging to it. No apostrophe in its.","Its colour is red."],["No apostrophe","Plain plurals and dates never take one.","CDs, 1990s, two doctors"]],
m:[["The students book is old.","The student’s book is old.","Apostrophe shows the owner."],["Its raining.","It’s raining.","It’s means it is."],["I dont know.","I don’t know.","Contractions need one."],["The CD’s are cheap.","The CDs are cheap.","No apostrophe in plurals."]],
k:"Can you say “it is”? Then write it’s. If not, write its.",
q:[["___ raining outside.",["Its","It’s","Its’"],1,"It’s means it is."],["Many students own books. Write: the ___ books.",["student’s","students’","students"],1,"Plural owners: students’."],["Which is correct?",["CD’s are cheap.","CDs are cheap.","CD’s’ are cheap."],1,"No apostrophe in plurals."]]},
{s:"-",t:"Hyphens and dashes",i:"A hyphen joins words so they work as one idea. It is small, but it can change meaning.",
r:[["Compound adjectives","Hyphenate before a noun.","a well-known author, a long-term plan"],["No hyphen after the noun","When the phrase follows the noun, drop it.","The author is well known."],["Numbers and ages","Hyphens in two-word numbers and ages.","twenty-five, a ten-year-old boy"],["Prefixes","Some prefixes need one.","self-confident, ex-president, re-sign (sign again)"],["Dash","A dash adds an extra thought or a break. Keep it rare in formal writing.","The result – to my surprise – was positive."]],
m:[["a well known author","a well-known author","Hyphen before a noun."],["The plan is long-term.","The plan is long term.","No hyphen after the verb."],["a ten years old boy","a ten-year-old boy","Singular year in compounds."]],
k:"Hyphen before the noun, no hyphen after the verb: a well-known actor, but the actor is well known.",
q:[["Which is correct?",["a well known writer","a well-known writer","a well-known-writer"],1,"Hyphen joins the adjective before the noun."],["Which is correct?",["He is ten-years-old.","He is a ten-year-old.","He is a ten years old."],1,"Use singular year in a compound before a noun."]]},
{s:"Aa",t:"Capital letters",i:"Capital letters mark the start of a sentence and the names of special things. Use them carefully but never for emphasis.",
r:[["Sentence start","Every sentence begins with a capital.","The test was hard."],["Names","People, places, days, months.","Ali, Dhaka, Monday, March"],["Nationalities, languages","Always a capital.","Bangladeshi, English, French"],["Titles","With names only.","Dr Rahman, but my doctor"],["No capital","Seasons, directions, school subjects (except languages).","summer, north, maths, history"]],
m:[["i went to dhaka.","I went to Dhaka.","Start, I and place names."],["We study History and English.","We study history and English.","Subjects are lower case, languages are not."],["I love Summer.","I love summer.","Seasons are lower case."]],
k:"A capital shows a name or a start. If it is neither, use a small letter.",
q:[["Which is correct?",["I study Maths in summer.","I study maths in summer.","I study maths in Summer."],1,"Subjects and seasons are lower case."],["Which is correct?",["She speaks french.","She speaks French.","she speaks French."],1,"Languages take a capital."]]},
{s:"“ ”",t:"Quotes and numbers",i:"Quotation marks show someone’s exact words. Numbers follow simple rules in formal writing.",
r:[["Direct speech","Quote exact words and put punctuation inside.","“I am late,” she said."],["Reported speech","No quotation marks.","She said that she was late."],["Titles","Short titles go in quotes; long works are in italics.","the poem “Ozymandias”"],["Words under ten","Spell out in formal writing.","three reasons, nine students"],["Task 1 data","Use numerals for figures and percentages.","12%, 45 million, 2019"]],
m:[["She said, “that she was late.”","She said that she was late.","No quotes in reported speech."],["There are 3 reasons.","There are three reasons.","Spell out under ten in essays."],["Sales rose by twelve per cent in two thousand nineteen.","Sales rose by 12% in 2019.","Use numerals for Task 1 data."]],
k:"Exact words get quotation marks. Reported words do not.",
q:[["Which is correct?",["She said that “she was tired”.","She said that she was tired.","She said “that she was tired”."],1,"Reported speech has no quotation marks."],["In an essay write…",["There are 3 reasons.","There are three reasons.","There are 3 reason."],1,"Spell out numbers under ten."]]}
