<main>
<h1>Sentence structure</h1>
<p class="m">Beginner level · A complete sentence has a subject, a verb and a finished idea. Everything else is detail.</p>
<div id="panes"></div>
</main>

<script>
(function(){"use strict";
var PFX="ss-",NEXT="subject-verb-agreement.html",NEXTL="Next lesson",PREV="",PREVL="";
var $=function(i){return document.getElementById(i)};

function el(t,x,c,f){var e=document.createElement(t);if(x)e.textContent=x;if(c)e.className=c;if(f)e.onclick=f;return e}
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}function lw(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function jp(k,d){try{var v=JSON.parse(ls(k));return v==null?d:v}catch(e){return d}}
var IC={list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h5v-6h4v6h5V9"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'};
function ico(n,z){return '<svg viewBox="0 0 24 24" width="'+(z||20)+'" height="'+(z||20)+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
[].forEach.call(document.querySelectorAll("[data-i]"),function(b){b.insertAdjacentHTML("afterbegin",ico(b.dataset.i,20))});
var CFG=Object.assign({acc:"en-GB",rate:.85,fs:16,font:"serif"},jp(K("cfg"),{}));
function saveCfg(){lw(K("cfg"),JSON.stringify(CFG))}
function applyCfg(){document.documentElement.style.setProperty("--fs",CFG.fs+"px");document.documentElement.dataset.font=CFG.font}applyCfg();

/* ---------- content ---------- */
var CH=[{"id": "plain", "t": "In plain words", "c": "<p class=\"say\">Think of a sentence as a small machine with two essential parts: someone or something (the <b>subject</b>) and what they do or are (the <b>verb</b>). Add a finished thought and you have a sentence. Most learner errors are not about difficult grammar. They are about a missing part, a part in the wrong place, or two machines joined together with nothing to connect them. Before you ask whether a sentence sounds good, check that the three basics are there.</p><h3>How to build it</h3><div class=\"rule\"><p><b>Basic</b> Subject + verb: <em>Birds fly.</em></p><p><b>Object</b> Subject + verb + object: <em>She reads books.</em></p><p><b>With be</b> Subject + be + description: <em>He is a doctor. The test was difficult.</em></p><p><b>Extras</b> Add place and time: <em>I studied grammar in the library yesterday.</em></p></div>"}, {"id": "use", "t": "When we use it", "c": "<h3>The minimum: subject + verb</h3><div class=\"example\"><p>Rain fell. Prices rose.</p><p class=\"note\">Some verbs need nothing after them.</p></div><h3>Subject + verb + object</h3><div class=\"example\"><p>The government built new schools.</p><p class=\"note\">Some verbs need an object: you cannot just “build”.</p></div><h3>Subject + be + description</h3><div class=\"example\"><p>The results were surprising.</p><p class=\"note\">Be links the subject to a description, a job or a state.</p></div><h3>Questions</h3><div class=\"example\"><p>Where do you live? Does she work here?</p><p class=\"note\">The helper verb comes before the subject. With no other helper, add do, does or did.</p></div><h3>Where the extras go</h3><div class=\"example\"><p>I usually study at home in the evening.</p><p class=\"note\">Usual order: manner, place, time. Frequency words go before the main verb, but after be.</p></div><h3>Look alike, but not the same</h3><div class=\"example\"><p>Because I was tired.<br>I stayed home because I was tired.</p><p class=\"note\">The first is a fragment: it starts a reason but never gives the main idea.</p></div><div class=\"example\"><p>It is important, we must act.<br>It is important, so we must act.</p><p class=\"note\">Two full sentences need a joiner, not just a comma.</p></div><div class=\"example\"><p>Is raining.<br>It is raining.</p><p class=\"note\">English needs a subject, even when it is only “it”.</p></div><p class=\"note\">A sentence can be long and still be simple. What matters is that it has a main subject and verb that make complete sense on their own.</p>"}, {"id": "mist", "t": "Mistakes people make", "c": "<div class=\"example\"><p><del>Because the weather was bad.</del> → <ins>We cancelled the trip because the weather was bad.</ins></p><p class=\"note\">Attach the because-part to a main clause.</p></div><div class=\"example\"><p><del>Is very important to sleep well.</del> → <ins>It is very important to sleep well.</ins></p><p class=\"note\">Do not drop the subject.</p></div><div class=\"example\"><p><del>She very likes music.</del> → <ins>She likes music very much.</ins></p><p class=\"note\">Very does not go before a verb.</p></div><div class=\"example\"><p><del>I like very much music.</del> → <ins>I like music very much.</ins></p><p class=\"note\">Do not put an adverb between a verb and its object.</p></div><div class=\"example\"><p><del>Always I go early.</del> → <ins>I always go early.</ins></p><p class=\"note\">Frequency adverbs go before the main verb.</p></div><div class=\"example\"><p><del>Why you are late?</del> → <ins>Why are you late?</ins></p><p class=\"note\">In questions the helper verb comes before the subject.</p></div>"}, {"id": "deep", "t": "Going deeper", "c": "<h3>Core test: subject + verb + finished idea</h3><p>Cover everything except the first clause. Ask: who or what? did what? Does it make sense alone? If it starts with because, although, which, when, if or while and there is nothing else, it is a fragment. Fragments are very common in Task 2 introductions.</p><h3>The five basic patterns</h3><p>Almost every sentence is built on one of these: S+V (<em>Prices fell</em>), S+V+O (<em>She wrote an essay</em>), S+V+C (<em>He became a teacher</em>), S+V+O+O (<em>He gave me a book</em>), S+V+O+C (<em>They made him captain</em>). Add extras freely to any of them.</p><h3>Clauses and phrases</h3><p>A clause has its own subject and verb. A phrase does not. “After the lecture” is a phrase. “After the lecture ended” is a clause. Only a main clause can stand alone.</p><h3>Where time and place go</h3><p>Time words can open or close a sentence: <em>Yesterday I called her. I called her yesterday.</em> Do not squeeze them between verb and object. When you have both, place comes before time: <em>She studied in London in 2019.</em></p><h3>Never drop the subject or the object</h3><p>English almost never drops the subject: say “It is raining” and “There is a problem”. Keep the object when the verb needs one: “I like it”, not “I like”.</p><h3>Shortcuts that work in exams</h3><ul><li><b>Find the verb first.</b> Underline it, then ask who or what does it.</li><li><b>Read the first clause alone.</b> If it cannot stand by itself, it is not a sentence.</li><li><b>One idea, one main verb.</b> Two main verbs with no joiner means a run-on.</li><li><b>Check the first word.</b> Because, Although, Which or When at the start is a warning sign.</li></ul><h3>Where exams try to catch you</h3><ul><li><b>“Which” sentences:</b> “Which is a serious problem.” is a fragment unless it follows its noun in the same sentence.</li><li><b>Very long sentences:</b> Count the main verbs. Each one needs its own subject and a joiner.</li><li><b>Lists:</b> Keep items in the same form: “reading, writing and speaking”, not “reading, to write and speaking”.</li></ul>"}, {"id": "dodont", "t": "Do, don’t and why", "c": "<div class=\"two\"><div><h3>Do</h3><ul><li>Check every sentence has a subject and a main verb.</li><li>Put frequency adverbs before the main verb.</li><li>Say “It is…” or “There is…” when you have no other subject.</li><li>Keep long sentences to two or three ideas.</li></ul></div><div><h3>Don’t</h3><ul><li>Don’t write a because-clause alone as a full sentence.</li><li>Don’t put an adverb between verb and object.</li><li>Don’t join two sentences with only a comma.</li><li>Don’t drop the subject: “Is important”.</li></ul></div></div><h3>Why we get it wrong</h3><h3>Mother-tongue transfer</h3><p>Some languages allow the subject to be dropped or put the verb last. Learners carry that order into English.</p><div class=\"tip\"><p>Try this: Say the idea in the pattern S + V + O and see if it still fits.</p></div><h3>Writing as you think</h3><p>Under time pressure ideas arrive in pieces and get written as pieces.</p><div class=\"tip\"><p>Try this: Finish each sentence, then pause for one second before the next.</p></div><h3>Copying spoken English</h3><p>Speech is full of fragments. Writing needs the full sentence.</p><div class=\"tip\"><p>Try this: Reread every sentence and ask: could it stand alone?</p></div><h3>Small habits that help</h3><ul><li>Underline the subject and verb of every sentence in your last essay.</li><li>Turn five fragments from emails or posts into full sentences.</li><li>Read your writing aloud and listen for sentences that stop too soon.</li></ul>"}, {"id": "real", "t": "In IELTS and real life", "c": "<ul><li><b>Speaking:</b> answer in full sentences. “I live in a small town” beats “small town”.</li><li><b>Writing:</b> mix short and long sentences. Every one needs a subject and a finite verb.</li><li><b>Reading:</b> in a long sentence, find the subject and main verb first. The rest is detail.</li><li><b>Listening:</b> expect the order S + V + O, with the extras at the end.</li></ul><div class=\"tip\"><p><b>Real world:</b> in emails, short complete sentences sound clear and professional.</p></div><p class=\"note\">Examiners reward accuracy as well as range, so a correct simple sentence always beats a broken complex one.</p>"}, {"id": "practice", "t": "Practice", "c": "<h3>Spot the mistake</h3><ol><li>Because I was ill.<details><summary>Show answer</summary><ins>I stayed at home because I was ill.</ins> Attach the reason to a main clause.</details></li><li>Is a big problem.<details><summary>Show answer</summary><ins>It is a big problem.</ins> Add the subject.</details></li><li>I like very much football.<details><summary>Show answer</summary><ins>I like football very much.</ins> Keep verb and object together.</details></li><li>Always she arrives late.<details><summary>Show answer</summary><ins>She always arrives late.</ins> Frequency adverb before the main verb.</details></li></ol><h3>Say it another way</h3><ol><li>Fix the fragment: “Although it was expensive.”<details><summary>Show answer</summary><ins>Although it was expensive, I bought it.</ins></details></li><li>Put in order: yesterday / I / in the park / met / a friend<details><summary>Show answer</summary><ins>I met a friend in the park yesterday.</ins></details></li></ol><h3>Fill the gaps</h3><p>(1) ___ is cold today. I (2) ___ wear a coat. Why (3) ___ you leaving? (4) ___ are two buses.</p><details><summary>Show answers</summary>1 It · 2 usually / always · 3 are · 4 There</details><h3>Speak and write</h3><ul><li>Describe your home in five full sentences. Check each has a subject and a verb.</li><li>Write one sentence in each of the five patterns about your own life.</li></ul>"}, {"id": "quiz", "t": "Quiz", "quiz": 1}, {"id": "stick", "t": "Making it stick", "prog": 1}];
