  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Tenses: the book | IELTS Grammar Lab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Literata:wght@400;700&family=Fraunces:wght@700&family=DM+Serif+Display&family=Playfair+Display:wght@700&family=Libre+Baskerville:wght@700&family=Sora:wght@700&family=Outfit:wght@700&family=Bitter:wght@700&family=Syne:wght@700&family=Merriweather:wght@700&family=Space+Grotesk:wght@700&family=Manrope:wght@700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#2b2118;color:#222;font:16px/1.65 Literata,Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px}

@media(max-width:899px){.in{padding:20px 20px 6px}}</style></head><body><div id="book" aria-live="polite"></div><div id="ctl"><button id="pr">Previous</button><span id="st"></span><button id="nx">Next</button><a href="tenses.html" style="color:#ffd166">All lessons</a></div><script>const P=[{"h": "<div class=\"cover\"><p class=\"sm\">A small book of</p><h1>English Tenses</h1><p>Explained in plain words, with the mistakes everyone makes, and tricks for IELTS and other exams.</p><p class=\"sm\">Turn the page, press the arrow keys, or swipe.</p></div>", "s": "", "n": 0}, {"h": "<h2>Contents</h2><ol><li><a href=\"#\" data-go=\"3\">Present simple and present continuous</a></li><li><a href=\"#\" data-go=\"7\">Past simple</a></li><li><a href=\"#\" data-go=\"11\">Past continuous</a></li><li><a href=\"#\" data-go=\"15\">Future simple</a></li><li><a href=\"#\" data-go=\"19\">Future continuous</a></li><li><a href=\"#\" data-go=\"23\">Present perfect</a></li><li><a href=\"#\" data-go=\"27\">Past perfect</a></li><li><a href=\"#\" data-go=\"31\">Future perfect</a></li><li><a href=\"#\" data-go=\"35\">Present perfect continuous</a></li><li><a href=\"#\" data-go=\"39\">Past perfect continuous</a></li><li><a href=\"#\" data-go=\"43\">Future perfect continuous</a></li></ol>", "s": "", "n": 1}, {"h": "<h2>How to use this book</h2><p>Each tense has four pages: the idea and the shape, when we use it, the mistakes, and a do and don't list.</p><p>For the full practice sections and the quiz, follow the link on the last page of each chapter. Read one chapter, then close the book and write three sentences of your own. That is how it sticks.</p><p class=\"why\">Tip: tap the contents to jump to any tense.</p>", "s": "", "n": 2}, {"h": "<p class=\"lvl\">Beginner level</p><h2 class=\"ch\">Present simple and present continuous</h2><p class=\"sub\">Present simple = facts, habits, schedules. Present continuous = happening now, temporary, changing.</p><div class=\"tl\"><i class=\"dt\" style=\"left:50%\"></i><b></b><small style=\"left:0\">past</small><small style=\"left:46%\">now</small><small style=\"right:0\">future</small></div><p class=\"say\">Think of two cameras. One takes a wide shot: what is true, and what you do again and again. The other zooms in on right now. Before you write a verb, ask yourself: is this always, or is this happening now? That one question gets you most of the way.</p><h3>How to build it</h3><p class=\"f\"><b>Simple +</b> I/you/we/they work \u00b7 he/she/it works</p><p class=\"f\"><b>Simple \u2212</b> do/does not + base verb</p><p class=\"f\"><b>Simple ?</b> Do/Does + subject + base verb?</p><p class=\"f\"><b>Continuous</b> am/is/are (not) + verb-ing</p>", "s": "--a:#0f766e;--d:#064e4b;--l:#e0f5f2;--hf:'Fraunces'", "n": 3}, {"h": "<h3 class=\"first\">When we use it</h3><h4>Facts and habits (simple)</h4><p><span class=\"ex\">Water boils at 100\u00b0C. I study every evening.</span></p><p class=\"why\">Use for what is generally true or regular.</p><h4>Timetables (simple)</h4><p><span class=\"ex\">The exam starts at 10 a.m.</span></p><p class=\"why\">Fixed schedules use the simple, even for the future.</p><h4>Now and around now (continuous)</h4><p><span class=\"ex\">I am preparing for IELTS this month.</span></p><p class=\"why\">Activity in progress in the current period.</p><h4>Changes and plans (continuous)</h4><p><span class=\"ex\">Prices are rising. I am meeting her tomorrow.</span></p><p class=\"why\">Developing trends and arranged plans.</p>", "s": "--a:#0f766e;--d:#064e4b;--l:#e0f5f2;--hf:'Fraunces'", "n": 4}, {"h": "<h3 class=\"first\">Easily mixed up</h3><p class=\"pr\"><span class=\"ex\">I usually walk to work.</span><br><span class=\"ex\">I am taking the bus this week.</span><br><span class=\"why\">Routine vs temporary change.</span></p><p class=\"pr\"><span class=\"ex\">She teaches English.</span><br><span class=\"ex\">She is teaching while Ms Lee is away.</span><br><span class=\"why\">Regular role vs temporary arrangement.</span></p><p class=\"pr\"><span class=\"ex\">The train leaves at 8.</span><br><span class=\"ex\">I am leaving at 8.</span><br><span class=\"why\">Timetable vs personal arrangement.</span></p><h3>Mistakes people make</h3><p class=\"pr\"><del>She work every day.</del> &rarr; <ins>She works every day.</ins><br><span class=\"why\">Add -s for he/she/it.</span></p><p class=\"pr\"><del>He doesn't likes tea.</del> &rarr; <ins>He doesn't like tea.</ins><br><span class=\"why\">After does/doesn't use the base verb.</span></p><p class=\"pr\"><del>I am knowing him.</del> &rarr; <ins>I know him.</ins><br><span class=\"why\">Know is stative: no continuous.</span></p><p class=\"pr\"><del>I live here since 2020.</del> &rarr; <ins>I have lived here since 2020.</ins><br><span class=\"why\">Since + period up to now needs present perfect.</span></p>", "s": "--a:#0f766e;--d:#064e4b;--l:#e0f5f2;--hf:'Fraunces'", "n": 5}, {"h": "<h3 class=\"first\">Do</h3><ul><li>Ask first: habit/fact or happening now?</li><li>Add -s/-es for he, she, it, and check the subject (people = plural).</li><li>Use simple for chart descriptions and schedules.</li></ul><h3>Don't</h3><ul><li>Don't write \u201cI am knowing/wanting/agreeing\u201d.</li><li>Don't drop am/is/are: \u201cShe studying\u201d.</li><li>Don't use does + verb-s: \u201cdoes she works\u201d.</li></ul><h3>Small habits</h3><ul><li>Underline every verb in your last essay and label simple/continuous.</li><li>In Speaking, answer routine questions in simple and 'at the moment' questions in continuous.</li></ul><p><a class=\"btn\" href=\"present-simple-and-continuous.html\">Full lesson, practice and quiz</a></p>", "s": "--a:#0f766e;--d:#064e4b;--l:#e0f5f2;--hf:'Fraunces'", "n": 6}, {"h": "<p class=\"lvl\">Beginner level</p><h2 class=\"ch\">Past simple</h2><p class=\"sub\">Use the past simple for finished events, past states and past habits at a finished time.</p><div class=\"tl\"><i class=\"dt\" style=\"left:20%\"></i><b></b><small style=\"left:0\">past</small><small style=\"left:46%\">now</small><small style=\"right:0\">future</small></div><p class=\"say\">Something happened, it is over, and you know (or can say) when. That is the past simple. It is the tense of stories, news, and the history of your own life.</p><h3>How to build it</h3><p class=\"f\"><b>Positive</b> Subject + past form: worked, went</p><p class=\"f\"><b>Negative</b> did not + base verb</p><p class=\"f\"><b>Question</b> Did + subject + base verb?</p><p class=\"f\"><b>Be</b> was / were (no did)</p>", "s": "--a:#b45309;--d:#451a03;--l:#fdf0dc;--hf:'Playfair Display'", "n": 7}, {"h": "<h3 class=\"first\">When we use it</h3><h4>Finished event</h4><p><span class=\"ex\">I submitted the form yesterday.</span></p><p class=\"why\">Yesterday is a finished time.</p><h4>Sequence of events</h4><p><span class=\"ex\">She opened the file, checked it and saved it.</span></p><p class=\"why\">Story and process order.</p><h4>Past habit or state</h4><p><span class=\"ex\">We walked to school. He lived in Dhaka for ten years.</span></p><p class=\"why\">A period that is over.</p><h4>Historical data (IELTS Task 1)</h4><p><span class=\"ex\">Sales rose from 20% in 2010 to 35% in 2015.</span></p><p class=\"why\">Finished years: past simple.</p>", "s": "--a:#b45309;--d:#451a03;--l:#fdf0dc;--hf:'Playfair Display'", "n": 8}, {"h": "<h3 class=\"first\">Easily mixed up</h3><p class=\"pr\"><span class=\"ex\">I saw her yesterday.</span><br><span class=\"ex\">I have seen her.</span><br><span class=\"why\">Finished time vs experience/result now.</span></p><p class=\"pr\"><span class=\"ex\">She worked there for 5 years.</span><br><span class=\"ex\">She has worked there for 5 years.</span><br><span class=\"why\">Finished period vs still true.</span></p><p class=\"pr\"><span class=\"ex\">I cooked dinner.</span><br><span class=\"ex\">I was cooking dinner.</span><br><span class=\"why\">Completed vs in progress.</span></p><h3>Mistakes people make</h3><p class=\"pr\"><del>She didn't went.</del> &rarr; <ins>She didn't go.</ins><br><span class=\"why\">Did already shows the past.</span></p><p class=\"pr\"><del>Did you saw it?</del> &rarr; <ins>Did you see it?</ins><br><span class=\"why\">Base verb after did.</span></p><p class=\"pr\"><del>I have seen him yesterday.</del> &rarr; <ins>I saw him yesterday.</ins><br><span class=\"why\">Finished time: past simple.</span></p><p class=\"pr\"><del>Where you went?</del> &rarr; <ins>Where did you go?</ins><br><span class=\"why\">Questions need did.</span></p>", "s": "--a:#b45309;--d:#451a03;--l:#fdf0dc;--hf:'Playfair Display'", "n": 9}, {"h": "<h3 class=\"first\">Do</h3><ul><li>Mark every sentence with its time: finished or not?</li><li>Use did + base verb for ordinary questions and negatives.</li><li>Learn irregular verbs in rhyming groups.</li></ul><h3>Don't</h3><ul><li>Don't put two past markers: did went, didn't saw.</li><li>Don't use present perfect with yesterday, ago, last week.</li><li>Don't add -ed to irregular verbs: goed, buyed.</li></ul><h3>Small habits</h3><ul><li>Retell yesterday in 6 sentences every day for a week.</li><li>Check every Task 1 verb for the right year/time.</li></ul><p><a class=\"btn\" href=\"past-simple.html\">Full lesson, practice and quiz</a></p>", "s": "--a:#b45309;--d:#451a03;--l:#fdf0dc;--hf:'Playfair Display'", "n": 10}, {"h": "<p class=\"lvl\">Beginner level</p><h2 class=\"ch\">Past continuous</h2><p class=\"sub\">Use it for an activity in progress at a past moment, or as background to a past event.</p><div class=\"tl\"><i class=\"sp\" style=\"left:10%;width:30%\"></i><b></b><small style=\"left:0\">past</small><small style=\"left:46%\">now</small><small style=\"right:0\">future</small></div><p class=\"say\">Imagine pausing a video of last night. The past continuous tells us what was going on inside that frame. It sets the scene. The past simple then brings in the action.</p><h3>How to build it</h3><p class=\"f\"><b>Positive</b> was/were + verb-ing</p><p class=\"f\"><b>Negative</b> was/were not + verb-ing</p><p class=\"f\"><b>Question</b> Was/Were + subject + verb-ing?</p><p class=\"f\"><b>Spelling</b> write\u2192writing \u00b7 run\u2192running \u00b7 lie\u2192lying</p>", "s": "--a:#7c3aed;--d:#2e1065;--l:#efe7fd;--hf:'DM Serif Display'", "n": 11}, {"h": "<h3 class=\"first\">When we use it</h3><h4>In progress at a past time</h4><p><span class=\"ex\">At 9 p.m. I was studying.</span></p><p class=\"why\">Look back at one moment.</p><h4>Interrupted action</h4><p><span class=\"ex\">I was walking home when it started to rain.</span></p><p class=\"why\">Background (continuous) + event (simple).</p><h4>Two actions together</h4><p><span class=\"ex\">While I was reading, he was cooking.</span></p><p class=\"why\">Overlapping activities.</p><h4>Scene setting</h4><p><span class=\"ex\">The rain was falling and people were hurrying home.</span></p><p class=\"why\">Backdrop for a story.</p>", "s": "--a:#7c3aed;--d:#2e1065;--l:#efe7fd;--hf:'DM Serif Display'", "n": 12}, {"h": "<h3 class=\"first\">Easily mixed up</h3><p class=\"pr\"><span class=\"ex\">I read the report.</span><br><span class=\"ex\">I was reading the report at 8.</span><br><span class=\"why\">Completed vs in progress.</span></p><p class=\"pr\"><span class=\"ex\">He always interrupted me.</span><br><span class=\"ex\">He was always interrupting me.</span><br><span class=\"why\">Neutral habit vs irritation.</span></p><p class=\"pr\"><span class=\"ex\">I knew the answer.</span><br><span class=\"ex\">I was thinking about it.</span><br><span class=\"why\">Stative vs dynamic meaning.</span></p><h3>Mistakes people make</h3><p class=\"pr\"><del>They was waiting.</del> &rarr; <ins>They were waiting.</ins><br><span class=\"why\">They takes were.</span></p><p class=\"pr\"><del>She didn't studying.</del> &rarr; <ins>She wasn't studying.</ins><br><span class=\"why\">Use was/were + not.</span></p><p class=\"pr\"><del>Did you were sleeping?</del> &rarr; <ins>Were you sleeping?</ins><br><span class=\"why\">No did with was/were.</span></p><p class=\"pr\"><del>I was knowing him.</del> &rarr; <ins>I knew him.</ins><br><span class=\"why\">Know is stative.</span></p>", "s": "--a:#7c3aed;--d:#2e1065;--l:#efe7fd;--hf:'DM Serif Display'", "n": 13}, {"h": "<h3 class=\"first\">Do</h3><ul><li>Use it for background: what was in progress.</li><li>Use past simple for the event that interrupts.</li><li>Use while with two ongoing actions.</li></ul><h3>Don't</h3><ul><li>Don't use the continuous for a finished story sequence.</li><li>Don't use stative verbs: was knowing, was liking.</li><li>Don't write did + was.</li></ul><h3>Small habits</h3><ul><li>In Part 2, open with two scene-setting continuous sentences.</li><li>Draw the interrupted action as a long line crossed by a short line.</li></ul><p><a class=\"btn\" href=\"past-continuous.html\">Full lesson, practice and quiz</a></p>", "s": "--a:#7c3aed;--d:#2e1065;--l:#efe7fd;--hf:'DM Serif Display'", "n": 14}, {"h": "<p class=\"lvl\">Beginner level</p><h2 class=\"ch\">Future simple</h2><p class=\"sub\">Use will for predictions, instant decisions, promises, offers and expectations.</p><div class=\"tl\"><i class=\"dt\" style=\"left:80%\"></i><b></b><small style=\"left:0\">past</small><small style=\"left:46%\">now</small><small style=\"right:0\">future</small></div><p class=\"say\">Use will when you decide something right now, when you give an opinion about tomorrow, or when you make a promise. If you already made the plan, English often prefers going to.</p><h3>How to build it</h3><p class=\"f\"><b>Positive</b> will + base verb</p><p class=\"f\"><b>Negative</b> will not (won't) + base verb</p><p class=\"f\"><b>Question</b> Will + subject + base verb?</p><p class=\"f\"><b>Time clauses</b> when/before/after/until + present simple</p>", "s": "--a:#15803d;--d:#052e16;--l:#e1f5e8;--hf:'Bitter'", "n": 15}, {"h": "<h3 class=\"first\">When we use it</h3><h4>Prediction</h4><p><span class=\"ex\">I think it will rain tonight.</span></p><p class=\"why\">Opinion about the future.</p><h4>Instant decision</h4><p><span class=\"ex\">The phone is ringing. I'll answer it.</span></p><p class=\"why\">Decided now.</p><h4>Promise or offer</h4><p><span class=\"ex\">I will send the report by Friday.</span></p><p class=\"why\">Commitment.</p><h4>Expectation (IELTS essays)</h4><p><span class=\"ex\">Public transport will reduce congestion.</span></p><p class=\"why\">Use may/could when unsure.</p>", "s": "--a:#15803d;--d:#052e16;--l:#e1f5e8;--hf:'Bitter'", "n": 16}, {"h": "<h3 class=\"first\">Easily mixed up</h3><p class=\"pr\"><span class=\"ex\">I will study abroad.</span><br><span class=\"ex\">I am going to study abroad.</span><br><span class=\"why\">Decision now vs prior plan.</span></p><p class=\"pr\"><span class=\"ex\">I will meet her.</span><br><span class=\"ex\">I am meeting her at 4.</span><br><span class=\"why\">Statement vs arrangement.</span></p><p class=\"pr\"><span class=\"ex\">The train will leave.</span><br><span class=\"ex\">The train leaves at 8.</span><br><span class=\"why\">Prediction vs timetable.</span></p><h3>Mistakes people make</h3><p class=\"pr\"><del>She will goes.</del> &rarr; <ins>She will go.</ins><br><span class=\"why\">Base verb after will.</span></p><p class=\"pr\"><del>I will don't go.</del> &rarr; <ins>I won't go.</ins><br><span class=\"why\">Not after will.</span></p><p class=\"pr\"><del>Call me when I will arrive.</del> &rarr; <ins>Call me when I arrive.</ins><br><span class=\"why\">Present simple in time clause.</span></p><p class=\"pr\"><del>She will can drive.</del> &rarr; <ins>She will be able to drive.</ins><br><span class=\"why\">No will + can.</span></p>", "s": "--a:#15803d;--d:#052e16;--l:#e1f5e8;--hf:'Bitter'", "n": 17}, {"h": "<h3 class=\"first\">Do</h3><ul><li>Use will for instant decisions, promises, opinion-based predictions.</li><li>Use going to for existing plans and visible evidence.</li><li>Use present simple in time/if clauses.</li></ul><h3>Don't</h3><ul><li>Don't write will + third-person -s: will goes.</li><li>Don't write will can/must: use will be able to/have to.</li><li>Don't use will after when/if/before in future clauses.</li></ul><h3>Small habits</h3><ul><li>Write five promises and five opinions with will.</li><li>Underline time clauses in your essays and remove any will.</li></ul><p><a class=\"btn\" href=\"future-simple.html\">Full lesson, practice and quiz</a></p>", "s": "--a:#15803d;--d:#052e16;--l:#e1f5e8;--hf:'Bitter'", "n": 18}, {"h": "<p class=\"lvl\">Intermediate level</p><h2 class=\"ch\">Future continuous</h2><p class=\"sub\">An activity will be in progress at a future moment, or an expected future event.</p><div class=\"tl\"><i class=\"sp\" style=\"left:60%;width:20%\"></i><b></b><small style=\"left:0\">past</small><small style=\"left:46%\">now</small><small style=\"right:0\">future</small></div><p class=\"say\">Jump forward to tomorrow at 9 a.m. and look around. What is going on? That is the future continuous: a picture of the future, not a decision.</p><h3>How to build it</h3><p class=\"f\"><b>Positive</b> will be + verb-ing</p><p class=\"f\"><b>Negative</b> will not be + verb-ing</p><p class=\"f\"><b>Question</b> Will + subject + be + verb-ing?</p><p class=\"f\"><b>Key words</b> this time tomorrow \u00b7 at 8 next Monday \u00b7 while</p>", "s": "--a:#c2410c;--d:#431407;--l:#fde9dd;--hf:'Syne'", "n": 19}, {"h": "<h3 class=\"first\">When we use it</h3><h4>In progress then</h4><p><span class=\"ex\">At 9 tomorrow I will be taking my exam.</span></p><p class=\"why\">Underway at that time.</p><h4>Expected events</h4><p><span class=\"ex\">This time next week we will be travelling.</span></p><p class=\"why\">Part of the expected future.</p><h4>Polite questions</h4><p><span class=\"ex\">Will you be using the computer this afternoon?</span></p><p class=\"why\">Soft way to ask plans.</p><h4>Parallel activities</h4><p><span class=\"ex\">While I am studying, my brother will be working.</span></p><p class=\"why\">Same future period.</p>", "s": "--a:#c2410c;--d:#431407;--l:#fde9dd;--hf:'Syne'", "n": 20}, {"h": "<h3 class=\"first\">Easily mixed up</h3><p class=\"pr\"><span class=\"ex\">I will finish at 5.</span><br><span class=\"ex\">I will be finishing at 5.</span><br><span class=\"why\">Completion vs in progress.</span></p><p class=\"pr\"><span class=\"ex\">Will you use the car?</span><br><span class=\"ex\">Will you be using the car?</span><br><span class=\"why\">Direct vs polite inquiry.</span></p><p class=\"pr\"><span class=\"ex\">I will know.</span><br><span class=\"ex\">NOT I will be knowing.</span><br><span class=\"why\">Stative: simple.</span></p><h3>Mistakes people make</h3><p class=\"pr\"><del>I will working at 8.</del> &rarr; <ins>I will be working at 8.</ins><br><span class=\"why\">will be + -ing.</span></p><p class=\"pr\"><del>She will be work.</del> &rarr; <ins>She will be working.</ins><br><span class=\"why\">-ing form.</span></p><p class=\"pr\"><del>He will be knowing soon.</del> &rarr; <ins>He will know soon.</ins><br><span class=\"why\">Stative.</span></p><p class=\"pr\"><del>Will you be use it?</del> &rarr; <ins>Will you be using it?</ins><br><span class=\"why\">-ing.</span></p>", "s": "--a:#c2410c;--d:#431407;--l:#fde9dd;--hf:'Syne'", "n": 21}, {"h": "<h3 class=\"first\">Do</h3><ul><li>Use it for what will be in progress at a future time.</li><li>Use it for polite questions: Will you be using\u2026?</li><li>Use stative verbs in simple.</li></ul><h3>Don't</h3><ul><li>Don't use it for a decision: use will.</li><li>Don't use by + continuous: by = future perfect.</li><li>Don't forget be: will working.</li></ul><h3>Small habits</h3><ul><li>Write where you will be at 8 tomorrow, 8 next Monday, 8 next month.</li><li>Use it in Part 2 for dreams: 'This time next year I will be\u2026'.</li></ul><p><a class=\"btn\" href=\"future-continuous.html\">Full lesson, practice and quiz</a></p>", "s": "--a:#c2410c;--d:#431407;--l:#fde9dd;--hf:'Syne'", "n": 22}, {"h": "<p class=\"lvl\">Intermediate level</p><h2 class=\"ch\">Present perfect</h2><p class=\"sub\">Link the past to now: experience, result, or a situation that continues. No finished time.</p><div class=\"tl\"><i class=\"sp\" style=\"left:30%;width:20%\"></i><b></b><small style=\"left:0\">past</small><small style=\"left:46%\">now</small><small style=\"right:0\">future</small></div><p class=\"say\">This tense is a bridge between then and now. You are not saying when something happened. You are saying it matters today: the lost keys, the trip you have taken, the flat you have lived in for years.</p><h3>How to build it</h3><p class=\"f\"><b>Positive</b> have/has + past participle</p><p class=\"f\"><b>Negative</b> have/has not + past participle</p><p class=\"f\"><b>Question</b> Have/Has + subject + past participle?</p><p class=\"f\"><b>Key words</b> ever \u00b7 never \u00b7 just \u00b7 already \u00b7 yet \u00b7 since \u00b7 for</p>", "s": "--a:#1d4ed8;--d:#0b1e4d;--l:#e3ebfd;--hf:'Sora'", "n": 23}, {"h": "<h3 class=\"first\">When we use it</h3><h4>Result now</h4><p><span class=\"ex\">I have lost my keys.</span></p><p class=\"why\">Past action, present result.</p><h4>Life experience</h4><p><span class=\"ex\">She has visited Japan twice.</span></p><p class=\"why\">Time is not stated.</p><h4>Situation up to now</h4><p><span class=\"ex\">We have known each other for years.</span></p><p class=\"why\">Began in past, continues.</p><h4>Unfinished period</h4><p><span class=\"ex\">I have read three articles this morning.</span></p><p class=\"why\">The morning is not over.</p>", "s": "--a:#1d4ed8;--d:#0b1e4d;--l:#e3ebfd;--hf:'Sora'", "n": 24}, {"h": "<h3 class=\"first\">Easily mixed up</h3><p class=\"pr\"><span class=\"ex\">I saw it yesterday.</span><br><span class=\"ex\">I have seen it.</span><br><span class=\"why\">Finished time vs experience.</span></p><p class=\"pr\"><span class=\"ex\">She lived here for 5 years.</span><br><span class=\"ex\">She has lived here for 5 years.</span><br><span class=\"why\">Over vs continuing.</span></p><p class=\"pr\"><span class=\"ex\">Did you finish?</span><br><span class=\"ex\">Have you finished?</span><br><span class=\"why\">Past event vs state now.</span></p><h3>Mistakes people make</h3><p class=\"pr\"><del>I have seen him yesterday.</del> &rarr; <ins>I saw him yesterday.</ins><br><span class=\"why\">Finished time: past simple.</span></p><p class=\"pr\"><del>She have finished.</del> &rarr; <ins>She has finished.</ins><br><span class=\"why\">has with he/she/it.</span></p><p class=\"pr\"><del>I have went there.</del> &rarr; <ins>I have gone there.</ins><br><span class=\"why\">Participle, not past form.</span></p><p class=\"pr\"><del>I live here since 2020.</del> &rarr; <ins>I have lived here since 2020.</ins><br><span class=\"why\">Since needs perfect.</span></p>", "s": "--a:#1d4ed8;--d:#0b1e4d;--l:#e3ebfd;--hf:'Sora'", "n": 25}, {"h": "<h3 class=\"first\">Do</h3><ul><li>Check the period: does it include now?</li><li>Use for/since with states and durations.</li><li>Use ever/never/just/already/yet in the right place.</li></ul><h3>Don't</h3><ul><li>Don't use it with yesterday, ago, last, in 2019, when.</li><li>Don't use have went; use gone.</li><li>Don't use has/have with the wrong subject.</li></ul><h3>Small habits</h3><ul><li>Write three sentences daily: 'I have just\u2026'.</li><li>Underline all perfects in a reading passage and name the link to now.</li></ul><p><a class=\"btn\" href=\"present-perfect.html\">Full lesson, practice and quiz</a></p>", "s": "--a:#1d4ed8;--d:#0b1e4d;--l:#e3ebfd;--hf:'Sora'", "n": 26}, {"h": "<p class=\"lvl\">Intermediate level</p><h2 class=\"ch\">Past perfect</h2><p class=\"sub\">Show that one past event happened before another past event or time.</p><div class=\"tl\"><i class=\"dt\" style=\"left:20%\"></i><i class=\"dt\" style=\"left:40%;background:var(--d)\"></i><b></b><small style=\"left:0\">past</small><small style=\"left:46%\">now</small><small style=\"right:0\">future</small></div><p class=\"say\">Sometimes a story needs one more step back. The past perfect is the before of the before: what had already happened when the main event took place.</p><h3>How to build it</h3><p class=\"f\"><b>Positive</b> had + past participle</p><p class=\"f\"><b>Negative</b> had not (hadn't) + past participle</p><p class=\"f\"><b>Question</b> Had + subject + past participle?</p><p class=\"f\"><b>Key words</b> before \u00b7 after \u00b7 by the time \u00b7 already \u00b7 never \u00b7 until</p>", "s": "--a:#9f1239;--d:#4c0519;--l:#fde8ee;--hf:'Libre Baskerville'", "n": 27}, {"h": "<h3 class=\"first\">When we use it</h3><h4>Earlier past event</h4><p><span class=\"ex\">The train had left before we reached the station.</span></p><p class=\"why\">Leaving came first.</p><h4>Cause of a past state</h4><p><span class=\"ex\">She was tired because she had slept badly.</span></p><p class=\"why\">The earlier event explains.</p><h4>Reported speech</h4><p><span class=\"ex\">He said he had finished.</span></p><p class=\"why\">Shift back from \u201cI finished/have finished\u201d.</p><h4>Third conditional</h4><p><span class=\"ex\">If I had studied, I would have passed.</span></p><p class=\"why\">Unreal past.</p>", "s": "--a:#9f1239;--d:#4c0519;--l:#fde8ee;--hf:'Libre Baskerville'", "n": 28}, {"h": "<h3 class=\"first\">Easily mixed up</h3><p class=\"pr\"><span class=\"ex\">When I arrived, she left.</span><br><span class=\"ex\">When I arrived, she had left.</span><br><span class=\"why\">Left after vs before arrival.</span></p><p class=\"pr\"><span class=\"ex\">I finished and went home.</span><br><span class=\"ex\">I had finished before I went home.</span><br><span class=\"why\">Order stressed.</span></p><p class=\"pr\"><span class=\"ex\">I saw him yesterday.</span><br><span class=\"ex\">I had seen him before that trip.</span><br><span class=\"why\">One past point vs two.</span></p><h3>Mistakes people make</h3><p class=\"pr\"><del>The film already started when we came.</del> &rarr; <ins>The film had already started when we came.</ins><br><span class=\"why\">Earlier event needs past perfect.</span></p><p class=\"pr\"><del>She had went.</del> &rarr; <ins>She had gone.</ins><br><span class=\"why\">Past participle.</span></p><p class=\"pr\"><del>After he had ate\u2026</del> &rarr; <ins>After he had eaten\u2026</ins><br><span class=\"why\">eat \u2192 eaten.</span></p><p class=\"pr\"><del>I had finished yesterday at 5.</del> &rarr; <ins>I finished yesterday at 5.</ins><br><span class=\"why\">One event, no second past point.</span></p>", "s": "--a:#9f1239;--d:#4c0519;--l:#fde8ee;--hf:'Libre Baskerville'", "n": 29}, {"h": "<h3 class=\"first\">Do</h3><ul><li>Draw two points on a line before choosing.</li><li>Use had + participle only for the earlier event.</li><li>Use it with by the time, already, never, because.</li></ul><h3>Don't</h3><ul><li>Don't use it with only one past event.</li><li>Don't use it everywhere to sound advanced.</li><li>Don't use had went/ate/seen incorrectly.</li></ul><h3>Small habits</h3><ul><li>Retell your morning with 'before I left, I had\u2026'.</li><li>Underline first and second events in reading.</li></ul><p><a class=\"btn\" href=\"past-perfect.html\">Full lesson, practice and quiz</a></p>", "s": "--a:#9f1239;--d:#4c0519;--l:#fde8ee;--hf:'Libre Baskerville'", "n": 30}, {"h": "<p class=\"lvl\">Advanced level</p><h2 class=\"ch\">Future perfect</h2><p class=\"sub\">Something will be completed before a future time or event.</p><div class=\"tl\"><i class=\"dt\" style=\"left:60%\"></i><i class=\"dt\" style=\"left:85%;background:var(--d)\"></i><b></b><small style=\"left:0\">past</small><small style=\"left:46%\">now</small><small style=\"right:0\">future</small></div><p class=\"say\">Fast-forward to a deadline and look back. Will the job be done by then? If yes, you want the future perfect.</p><h3>How to build it</h3><p class=\"f\"><b>Positive</b> will have + past participle</p><p class=\"f\"><b>Negative</b> will not have + past participle</p><p class=\"f\"><b>Question</b> Will + subject + have + past participle?</p><p class=\"f\"><b>Key words</b> by Friday \u00b7 by then \u00b7 by the time \u00b7 by the end of</p>", "s": "--a:#a21caf;--d:#4a044e;--l:#f9e4fb;--hf:'Merriweather'", "n": 31}, {"h": "<h3 class=\"first\">When we use it</h3><h4>Done before a deadline</h4><p><span class=\"ex\">I will have finished the report by Friday.</span></p><p class=\"why\">Complete no later than Friday.</p><h4>Predicted totals</h4><p><span class=\"ex\">By June she will have published three papers.</span></p><p class=\"why\">Expected quantity.</p><h4>Looking back from the future</h4><p><span class=\"ex\">In ten years the city will have changed.</span></p><p class=\"why\">Imagined viewpoint.</p><h4>Targets</h4><p><span class=\"ex\">They will have built the bridge by 2030.</span></p><p class=\"why\">Projected completion.</p>", "s": "--a:#a21caf;--d:#4a044e;--l:#f9e4fb;--hf:'Merriweather'", "n": 32}, {"h": "<h3 class=\"first\">Easily mixed up</h3><p class=\"pr\"><span class=\"ex\">I will finish by Friday.</span><br><span class=\"ex\">I will have finished by Friday.</span><br><span class=\"why\">Both fine; perfect stresses completion.</span></p><p class=\"pr\"><span class=\"ex\">At 8 I will work.</span><br><span class=\"ex\">At 8 I will be working.</span><br><span class=\"why\">Simple vs in progress.</span></p><p class=\"pr\"><span class=\"ex\">By next year I will have worked here 10 years.</span><br><span class=\"ex\">\u2026will have been working\u2026</span><br><span class=\"why\">Period vs ongoing activity.</span></p><h3>Mistakes people make</h3><p class=\"pr\"><del>I will have finish.</del> &rarr; <ins>I will have finished.</ins><br><span class=\"why\">Participle.</span></p><p class=\"pr\"><del>She will has completed.</del> &rarr; <ins>She will have completed.</ins><br><span class=\"why\">have after will.</span></p><p class=\"pr\"><del>By the time he comes, I will finish.</del> &rarr; <ins>\u2026I will have finished.</ins><br><span class=\"why\">Completion before.</span></p><p class=\"pr\"><del>I will have been finish.</del> &rarr; <ins>I will have finished.</ins><br><span class=\"why\">No been.</span></p>", "s": "--a:#a21caf;--d:#4a044e;--l:#f9e4fb;--hf:'Merriweather'", "n": 33}, {"h": "<h3 class=\"first\">Do</h3><ul><li>Use it for completion by a deadline.</li><li>Use by to show the deadline.</li><li>Use present simple after by the time.</li></ul><h3>Don't</h3><ul><li>Don't write will have + base verb: will have finish.</li><li>Don't use it for duration of activity: use perfect continuous.</li><li>Don't use until for completion.</li></ul><h3>Small habits</h3><ul><li>Write five goals: 'By December I will have\u2026'.</li><li>In Task 1 forecasts, use it with 'by 2040'.</li></ul><p><a class=\"btn\" href=\"future-perfect.html\">Full lesson, practice and quiz</a></p>", "s": "--a:#a21caf;--d:#4a044e;--l:#f9e4fb;--hf:'Merriweather'", "n": 34}, {"h": "<p class=\"lvl\">Intermediate level</p><h2 class=\"ch\">Present perfect continuous</h2><p class=\"sub\">Stress the activity and its duration: started in the past, continues or has just stopped.</p><div class=\"tl\"><i class=\"sp\" style=\"left:25%;width:25%\"></i><b></b><small style=\"left:0\">past</small><small style=\"left:46%\">now</small><small style=\"right:0\">future</small></div><p class=\"say\">Same bridge between then and now, but now you are watching the activity itself: how long it has been going on, or what it has left behind, like wet hair after swimming.</p><h3>How to build it</h3><p class=\"f\"><b>Positive</b> have/has + been + verb-ing</p><p class=\"f\"><b>Negative</b> have/has not been + verb-ing</p><p class=\"f\"><b>Question</b> Have/Has + subject + been + verb-ing?</p><p class=\"f\"><b>Key words</b> for \u00b7 since \u00b7 all day \u00b7 lately \u00b7 how long</p>", "s": "--a:#0369a1;--d:#082f49;--l:#dff1fb;--hf:'Outfit'", "n": 35}, {"h": "<h3 class=\"first\">When we use it</h3><h4>Continuing activity</h4><p><span class=\"ex\">I have been studying for two hours.</span></p><p class=\"why\">Duration up to now.</p><h4>Recent activity, visible result</h4><p><span class=\"ex\">She is tired; she has been running.</span></p><p class=\"why\">The activity explains now.</p><h4>Repeated effort</h4><p><span class=\"ex\">They have been trying to fix it all morning.</span></p><p class=\"why\">Focus on the effort.</p><h4>Temporary process</h4><p><span class=\"ex\">It has been raining since dawn.</span></p><p class=\"why\">Ongoing process.</p>", "s": "--a:#0369a1;--d:#082f49;--l:#dff1fb;--hf:'Outfit'", "n": 36}, {"h": "<h3 class=\"first\">Easily mixed up</h3><p class=\"pr\"><span class=\"ex\">I have written three pages.</span><br><span class=\"ex\">I have been writing for three hours.</span><br><span class=\"why\">Result/amount vs duration.</span></p><p class=\"pr\"><span class=\"ex\">I have read the report.</span><br><span class=\"ex\">I have been reading the report.</span><br><span class=\"why\">Finished vs in progress.</span></p><p class=\"pr\"><span class=\"ex\">She has worked here 10 years.</span><br><span class=\"ex\">She has been working here 10 years.</span><br><span class=\"why\">Both possible; continuous stresses activity.</span></p><h3>Mistakes people make</h3><p class=\"pr\"><del>I am studying since morning.</del> &rarr; <ins>I have been studying since morning.</ins><br><span class=\"why\">Since \u2192 perfect continuous.</span></p><p class=\"pr\"><del>She has been study.</del> &rarr; <ins>She has been studying.</ins><br><span class=\"why\">Use -ing after been.</span></p><p class=\"pr\"><del>I have been knowing him.</del> &rarr; <ins>I have known him.</ins><br><span class=\"why\">Stative verb.</span></p><p class=\"pr\"><del>They has been waiting.</del> &rarr; <ins>They have been waiting.</ins><br><span class=\"why\">have with they.</span></p>", "s": "--a:#0369a1;--d:#082f49;--l:#dff1fb;--hf:'Outfit'", "n": 37}, {"h": "<h3 class=\"first\">Do</h3><ul><li>Use it for duration and visible results.</li><li>Use how long, for, since.</li><li>Use simple for completed counts.</li></ul><h3>Don't</h3><ul><li>Don't use am working since.</li><li>Don't use stative verbs: have been knowing.</li><li>Don't use it with how many.</li></ul><h3>Small habits</h3><ul><li>Say what you have been doing lately, in 5 sentences.</li><li>Notice evidence words: tired, wet, dusty.</li></ul><p><a class=\"btn\" href=\"present-perfect-continuous.html\">Full lesson, practice and quiz</a></p>", "s": "--a:#0369a1;--d:#082f49;--l:#dff1fb;--hf:'Outfit'", "n": 38}, {"h": "<p class=\"lvl\">Advanced level</p><h2 class=\"ch\">Past perfect continuous</h2><p class=\"sub\">Stress how long an activity had been going on before a past moment.</p><div class=\"tl\"><i class=\"sp\" style=\"left:5%;width:25%\"></i><b></b><small style=\"left:0\">past</small><small style=\"left:46%\">now</small><small style=\"right:0\">future</small></div><p class=\"say\">Take the present perfect continuous and move it back in time. Use it when something had been going on for a while before another past event, and it helps explain that event.</p><h3>How to build it</h3><p class=\"f\"><b>Positive</b> had been + verb-ing</p><p class=\"f\"><b>Negative</b> had not been + verb-ing</p><p class=\"f\"><b>Question</b> Had + subject + been + verb-ing?</p><p class=\"f\"><b>Key words</b> for \u00b7 since \u00b7 all day \u00b7 before \u00b7 by the time</p>", "s": "--a:#475569;--d:#0f172a;--l:#e5eaf1;--hf:'Space Grotesk'", "n": 39}, {"h": "<h3 class=\"first\">When we use it</h3><h4>Duration before a past point</h4><p><span class=\"ex\">I had been waiting for an hour when the bus came.</span></p><p class=\"why\">Duration up to that point.</p><h4>Cause of a past state</h4><p><span class=\"ex\">The road was wet; it had been raining.</span></p><p class=\"why\">Earlier activity explains.</p><h4>Effort before an event</h4><p><span class=\"ex\">They had been trying to call him.</span></p><p class=\"why\">Ongoing effort.</p><h4>Tired, upset, etc.</h4><p><span class=\"ex\">He was exhausted: he had been working all night.</span></p><p class=\"why\">Explains earlier state.</p>", "s": "--a:#475569;--d:#0f172a;--l:#e5eaf1;--hf:'Space Grotesk'", "n": 40}, {"h": "<h3 class=\"first\">Easily mixed up</h3><p class=\"pr\"><span class=\"ex\">She had written the report.</span><br><span class=\"ex\">She had been writing the report.</span><br><span class=\"why\">Result vs process.</span></p><p class=\"pr\"><span class=\"ex\">They had lived there for years.</span><br><span class=\"ex\">They had been living there for years.</span><br><span class=\"why\">Both fine; continuous foregrounds activity.</span></p><p class=\"pr\"><span class=\"ex\">I was studying at 8.</span><br><span class=\"ex\">I had been studying for two hours by 8.</span><br><span class=\"why\">Moment vs duration.</span></p><h3>Mistakes people make</h3><p class=\"pr\"><del>I had been work all day.</del> &rarr; <ins>I had been working all day.</ins><br><span class=\"why\">-ing after been.</span></p><p class=\"pr\"><del>They has been waiting.</del> &rarr; <ins>They had been waiting.</ins><br><span class=\"why\">had for all subjects.</span></p><p class=\"pr\"><del>I had been knowing him.</del> &rarr; <ins>I had known him.</ins><br><span class=\"why\">Stative.</span></p><p class=\"pr\"><del>studying since three hours</del> &rarr; <ins>studying for three hours</ins><br><span class=\"why\">for + duration, since + start.</span></p>", "s": "--a:#475569;--d:#0f172a;--l:#e5eaf1;--hf:'Space Grotesk'", "n": 41}, {"h": "<h3 class=\"first\">Do</h3><ul><li>Use it for duration before a past point.</li><li>Use it for the cause of a past state.</li><li>Use for/since.</li></ul><h3>Don't</h3><ul><li>Don't use it without a past reference.</li><li>Don't use stative verbs.</li><li>Don't use it for completed results.</li></ul><h3>Small habits</h3><ul><li>Explain why you were tired yesterday with had been.</li><li>Mark reference point + duration in reading.</li></ul><p><a class=\"btn\" href=\"past-perfect-continuous.html\">Full lesson, practice and quiz</a></p>", "s": "--a:#475569;--d:#0f172a;--l:#e5eaf1;--hf:'Space Grotesk'", "n": 42}, {"h": "<p class=\"lvl\">Advanced level</p><h2 class=\"ch\">Future perfect continuous</h2><p class=\"sub\">Stress how long an activity will have been going on by a future time.</p><div class=\"tl\"><i class=\"sp\" style=\"left:55%;width:30%\"></i><b></b><small style=\"left:0\">past</small><small style=\"left:46%\">now</small><small style=\"right:0\">future</small></div><p class=\"say\">This one measures time from the future. By June I will have been studying for a year. You will not need it often, but when you want to say how long, nothing else fits.</p><h3>How to build it</h3><p class=\"f\"><b>Positive</b> will have been + verb-ing</p><p class=\"f\"><b>Negative</b> will not have been + verb-ing</p><p class=\"f\"><b>Question</b> Will + subject + have been + verb-ing?</p><p class=\"f\"><b>Key words</b> by then \u00b7 by next month \u00b7 for \u00b7 by the time</p>", "s": "--a:#0e7490;--d:#083344;--l:#dbf3f8;--hf:'Manrope'", "n": 43}, {"h": "<h3 class=\"first\">When we use it</h3><h4>Duration by a future point</h4><p><span class=\"ex\">By July I will have been studying English for a year.</span></p><p class=\"why\">Length up to July.</p><h4>Work before a deadline</h4><p><span class=\"ex\">By noon they will have been working six hours.</span></p><p class=\"why\">Accumulated time.</p><h4>Explaining a future state</h4><p><span class=\"ex\">She will be tired: she will have been travelling all night.</span></p><p class=\"why\">Cause of the condition.</p><h4>Long processes</h4><p><span class=\"ex\">By 2035 scientists will have been monitoring the reef for 20 years.</span></p><p class=\"why\">Length of monitoring.</p>", "s": "--a:#0e7490;--d:#083344;--l:#dbf3f8;--hf:'Manrope'", "n": 44}, {"h": "<h3 class=\"first\">Easily mixed up</h3><p class=\"pr\"><span class=\"ex\">By June I will have written my thesis.</span><br><span class=\"ex\">By June I will have been writing for a year.</span><br><span class=\"why\">Result vs duration.</span></p><p class=\"pr\"><span class=\"ex\">At 8 I will be working.</span><br><span class=\"ex\">By 8 I will have been working for 3 hours.</span><br><span class=\"why\">Moment vs duration.</span></p><p class=\"pr\"><span class=\"ex\">I will have been knowing her.</span><br><span class=\"ex\">I will have known her.</span><br><span class=\"why\">Stative.</span></p><h3>Mistakes people make</h3><p class=\"pr\"><del>I will have been work.</del> &rarr; <ins>I will have been working.</ins><br><span class=\"why\">-ing.</span></p><p class=\"pr\"><del>She will has been studying.</del> &rarr; <ins>She will have been studying.</ins><br><span class=\"why\">have.</span></p><p class=\"pr\"><del>By June I will be studying for a year.</del> &rarr; <ins>By June I will have been studying for a year.</ins><br><span class=\"why\">Duration up to future point.</span></p><p class=\"pr\"><del>He will have been knowing him.</del> &rarr; <ins>He will have known him.</ins><br><span class=\"why\">Stative.</span></p>", "s": "--a:#0e7490;--d:#083344;--l:#dbf3f8;--hf:'Manrope'", "n": 45}, {"h": "<h3 class=\"first\">Do</h3><ul><li>Use it for duration measured to a future point.</li><li>Use by + for/since-type duration.</li><li>Use future perfect simple for stative verbs.</li></ul><h3>Don't</h3><ul><li>Don't use it for ordinary future duration without the by point.</li><li>Don't write will have been + base.</li><li>Don't use it everywhere.</li></ul><h3>Small habits</h3><ul><li>Write anniversaries: 'In May I will have been\u2026'.</li><li>Use it for goals in Part 3 sparingly.</li></ul><p><a class=\"btn\" href=\"future-perfect-continuous.html\">Full lesson, practice and quiz</a></p>", "s": "--a:#0e7490;--d:#083344;--l:#dbf3f8;--hf:'Manrope'", "n": 46}, {"h": "<div class=\"cover\"><h2>Keep going</h2><p>Re-read one chapter a day and keep an error notebook. Accuracy beats fancy grammar.</p><p><a class=\"btn\" href=\"tenses.html\">All lessons</a></p></div>", "s": "", "n": 47}, {"h": "", "s": "", "n": 48}];const N=P.length;let p=0;const bk=document.getElementById('book');const wide=()=>matchMedia('(min-width:900px)').matches;
const pg=(i,c)=>{const x=P[i];if(!x)return '<div class="pg blank '+c+'"></div>';return '<div class="pg '+c+'" style="'+x.s+'"><div class="in">'+x.h+'</div><div class="num">'+(i>2&&i<N-2?i-2:'')+'</div></div>'};
function sp(){return p==0?0:Math.ceil(p/2)}
function render(){if(wide()){const s=sp();bk.innerHTML=s==0?pg(0,'only'):pg(2*s-1,'l')+pg(2*s,'r');}else bk.innerHTML=pg(p,'only');
bind();document.getElementById('pr').disabled=p==0;document.getElementById('nx').disabled=wide()?sp()>=(N/2):p>=N-2;
document.getElementById('st').textContent=wide()?'Spread '+(sp()+1):'Page '+(p+1)+' of '+(N-1);history.replaceState(null,'','#'+p);}
function bind(){bk.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();go(+a.dataset.go)})}
function anim(dir,after){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;const els=bk.querySelectorAll('.pg');if(rm||!els.length){after();return}
const side=wide()&&els.length==2?(dir>0?els[1]:els[0]):els[0];side.style.transformOrigin=dir>0?'left center':'right center';
side.animate([{transform:'rotateY(0)'},{transform:'rotateY('+(dir>0?-85:85)+'deg)'}],{duration:200,easing:'ease-in'}).onfinish=()=>{after();const e2=bk.querySelectorAll('.pg');const s2=wide()&&e2.length==2?(dir>0?e2[1]:e2[0]):e2[0];s2.style.transformOrigin=dir>0?'right center':'left center';s2.animate([{transform:'rotateY('+(dir>0?85:-85)+'deg)'},{transform:'rotateY(0)'}],{duration:220,easing:'ease-out'})}}
function go(n,dir){n=Math.max(0,Math.min(N-1,n));const d=dir||(n>=p?1:-1);anim(d,()=>{p=n;render()})}
function nxt(){go(wide()?2*sp()+1:p+1,1)}function prv(){go(wide()?(sp()<=1?0:2*sp()-3):p-1,-1)}
document.getElementById('nx').onclick=nxt;document.getElementById('pr').onclick=prv;
addEventListener('keydown',e=>{if(e.key=='ArrowRight')nxt();if(e.key=='ArrowLeft')prv()});
let x0=null;bk.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});bk.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60)dx<0?nxt():prv();x0=null});
addEventListener('resize',render);const h=parseInt(location.hash.slice(1));if(h>=0&&h<N)p=h;render();</script></body></html>
