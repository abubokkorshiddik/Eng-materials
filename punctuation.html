var CH=[
{id:"why",t:"Why punctuation matters",c:`
<p>Punctuation marks organise written language. They show where ideas end, how clauses relate to one another, and whether a word or phrase adds extra information.</p>
<div class="rule"><strong>Key principle</strong>Punctuation should reflect the grammatical structure and intended meaning of your sentence, not simply where you pause when speaking.</div>
<h3>Compare these sentences</h3>
<div class="example"><span class="label">Correct</span><span class="good">Although the weather was poor, the researchers continued their fieldwork.</span></div>
<div class="example"><span class="label">Incorrect</span><span class="bad">Although the weather was poor. The researchers continued their fieldwork.</span><p class="note">The word “although” introduces a dependent clause. It cannot normally stand alone as a complete sentence.</p></div>
<p>In IELTS Writing, punctuation is part of grammatical accuracy. Repeated punctuation errors can make otherwise strong ideas difficult to follow.</p>
<h3>Learning objectives</h3>
<ul><li>Recognise the function of common punctuation marks.</li><li>Join independent and dependent clauses correctly.</li><li>Avoid sentence fragments, comma splices and apostrophe errors.</li><li>Use punctuation appropriately in formal academic writing.</li></ul>`},
{id:"stops",t:"Full stops and sentence boundaries",c:`
<p>A full stop (.) marks the end of a declarative sentence. It separates complete thoughts and helps the reader process information.</p>
<div class="rule"><strong>Rule 1: End a complete statement with a full stop.</strong><span class="good">The findings support the original hypothesis.</span></div>
<div class="rule"><strong>Rule 2: Do not join two complete sentences with only a comma.</strong><span class="bad">The sample was small, the results were significant.</span><br><span class="good">The sample was small. The results were significant.</span></div>
<h3>Sentence fragments</h3>
<p>A sentence fragment is an incomplete sentence presented as if it were complete.</p>
<div class="example"><span class="label">Fragment</span><span class="bad">Because the temperature increased significantly.</span></div>
<div class="example"><span class="label">Complete sentence</span><span class="good">Because the temperature increased significantly, disease transmission became more likely.</span></div>
<h3>IELTS tip</h3>
<p>Keep sentences manageable. Longer sentences can be effective, but each one must have a clear grammatical structure.</p>`},
{id:"commas",t:"Commas",c:`
<p>Commas (,) separate elements within a sentence. They are especially important after introductory phrases, between items in a list, and around non-essential information.</p>
<h3>1. After an introductory dependent clause</h3>
<div class="example"><span class="good">Although the evidence was limited, the study identified a clear pattern.</span></div>
<h3>2. Between items in a list</h3>
<div class="example"><span class="good">The analysis considered temperature, rainfall, humidity, and population density.</span></div>
<h3>3. Around non-essential information</h3>
<div class="example"><span class="good">Dhaka, which is the capital of Bangladesh, has a large population.</span></div>
<p>The clause “which is the capital of Bangladesh” adds information but is not essential to identify Dhaka.</p>
<h3>4. Between coordinate adjectives</h3>
<div class="example"><span class="good">The researchers developed a reliable, cost-effective method.</span></div>
<p>A useful test: can you place “and” between the adjectives, or reverse their order naturally?</p>
<h3>Comma splice: a common mistake</h3>
<div class="example"><span class="label">Incorrect</span><span class="bad">The study had limitations, the findings were useful.</span></div>
<div class="example"><span class="label">Correct alternatives</span><ul><li>The study had limitations. The findings were useful.</li><li>The study had limitations, but the findings were useful.</li><li>The study had limitations; the findings were useful.</li></ul></div>
<div class="rule"><strong>Remember</strong>A comma alone cannot normally join two independent clauses.</div>`},
{id:"semi",t:"Semicolons",c:`
<p>A semicolon (;) links closely related independent clauses. It creates a stronger pause than a comma but a closer connection than a full stop.</p>
<div class="rule"><strong>Use a semicolon between closely related complete sentences.</strong><span class="good">The initial model performed well; the revised model performed even better.</span></div>
<p>Both sides of the semicolon can stand as complete sentences.</p>
<h3>Using conjunctive adverbs</h3>
<p>Words such as <em>however, therefore, consequently, moreover</em> and <em>nevertheless</em> can connect related ideas. When they link two independent clauses, use a semicolon before the word and usually a comma after it.</p>
<div class="example"><span class="label">Correct</span><span class="good">The dataset was incomplete; however, the analysis remained informative.</span></div>
<div class="example"><span class="label">Incorrect</span><span class="bad">The dataset was incomplete, however, the analysis remained informative.</span></div>
<h3>Semicolon in a complex list</h3>
<p>Semicolons can separate list items that already contain commas.</p>
<div class="example"><span class="good">Participants came from Dhaka, Bangladesh; Delhi, India; and Bangkok, Thailand.</span></div>
<p class="note">Do not put a semicolon between a dependent clause and the independent clause it introduces.</p>`},
{id:"colons",t:"Colons",c:`
<p>A colon (:) introduces an explanation, example, list or conclusion that expands on what comes before it.</p>
<div class="rule"><strong>Use a colon after a complete introductory clause.</strong><span class="good">The study examined three factors: temperature, rainfall, and population density.</span></div>
<h3>Introducing an explanation</h3>
<div class="example"><span class="good">The conclusion was clear: early intervention can reduce avoidable risks.</span></div>
<h3>Introducing an example</h3>
<div class="example"><span class="good">One limitation affected the analysis: several districts had missing observations.</span></div>
<h3>Common mistake</h3>
<div class="example"><span class="label">Incorrect</span><span class="bad">The variables included: temperature, rainfall, and humidity.</span></div>
<div class="example"><span class="label">Correct</span><span class="good">The variables included temperature, rainfall, and humidity.</span><br><span class="good">The study considered three variables: temperature, rainfall, and humidity.</span></div>
<p>In the incorrect version, the colon separates the verb “included” from its object. In the second correct version, the words before the colon form a complete clause.</p>`},
{id:"apos",t:"Apostrophes",c:`
<p>An apostrophe (') is used mainly for possession and contractions. In formal academic writing, contractions are often avoided.</p>
<h3>1. Singular possession</h3>
<div class="example"><span class="good">The researcher's conclusion was carefully worded.</span></div>
<h3>2. Plural possession</h3>
<div class="example"><span class="good">The researchers' conclusions were consistent.</span></div>
<p>When a regular plural already ends in <em>s</em>, place the apostrophe after the <em>s</em>.</p>
<h3>3. Irregular plural possession</h3>
<div class="example"><span class="good">The children's health was monitored.</span></div>
<p>Because <em>children</em> does not end in <em>s</em>, add apostrophe + <em>s</em>.</p>
<h3>4. Its or it's?</h3>
<div class="tw"><table><thead><tr><th>Form</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>its</td><td>Possession</td><td>The country revised its policy.</td></tr><tr><td>it's</td><td>It is / it has</td><td>It's important to check the data.</td></tr></tbody></table></div>
<h3>Frequent errors</h3>
<ul><li><span class="bad">The results are it's strength.</span> → <span class="good">The results are its strength.</span></li><li><span class="bad">The student's' results</span> → <span class="good">The students' results</span> (multiple students).</li><li><span class="bad">The 1990's</span> → <span class="good">The 1990s</span> (the decade).</li></ul>
<div class="rule"><strong>Academic writing tip</strong>Prefer “it is” and “they are” over “it's” and “they're” when a formal style is appropriate.</div>`},
{id:"quotes",t:"Quotation marks",c:`
<p>Quotation marks (“ ”) commonly enclose direct speech or text reproduced word for word. Conventions differ between British and American English, so consistency matters.</p>
<h3>Direct quotation</h3>
<div class="example"><span class="good">The report states, “Further research is needed.”</span></div>
<h3>Introducing a quotation</h3>
<div class="example"><span class="good">The author describes the findings as “preliminary but promising.”</span></div>
<h3>Quotation marks and academic integrity</h3>
<p>When you reproduce another author's exact words, quotation marks alone are not enough. You must also provide an appropriate citation in the required referencing style.</p>
<h3>Do not overuse quotation marks</h3>
<p>In IELTS essays, paraphrasing ideas in your own words is generally more useful than inserting many direct quotations. Quotation marks should not be used merely to make ordinary words look important.</p>
<div class="rule"><strong>Consistency matters</strong>British English commonly uses single quotation marks for primary quotations, while American English commonly uses double quotation marks. Choose one style and keep to it.</div>`},
{id:"hyphens",t:"Hyphens and dashes",c:`
<p>Hyphens and dashes look similar but have different functions.</p>
<div class="tw"><table><thead><tr><th>Mark</th><th>Main function</th><th>Example</th></tr></thead><tbody><tr><td>Hyphen (-)</td><td>Connects parts of a compound word</td><td>a long-term strategy</td></tr><tr><td>En dash (–)</td><td>Indicates a range or connection</td><td>1990–2020</td></tr><tr><td>Em dash (—)</td><td>Marks a strong break or parenthetical comment</td><td>The result—although unexpected—was reliable.</td></tr></tbody></table></div>
<h3>Compound modifiers before nouns</h3>
<div class="example"><span class="good">A district-level analysis identified local patterns.</span></div>
<div class="example"><span class="good">The study used a well-designed survey.</span></div>
<p>A hyphen makes it clear that two or more words work together as one modifier before a noun.</p>
<h3>When a hyphen may be unnecessary</h3>
<div class="example"><span class="good">The survey was well designed.</span></div>
<p>When the compound comes after the noun, a hyphen is often not needed. Check a reliable dictionary when unsure.</p>
<h3>Use dashes sparingly in formal writing</h3>
<p>Dashes can be effective, but commas, parentheses or a colon often produce a clearer and more conventional academic sentence.</p>`},
{id:"other",t:"Question marks, exclamation marks and brackets",c:`
<h3>Question marks (?)</h3>
<p>Use a question mark after a direct question.</p>
<div class="example"><span class="good">How does rainfall affect dengue transmission?</span></div>
<p>An indirect question usually ends with a full stop when it forms part of a statement.</p>
<div class="example"><span class="good">The study examined how rainfall affects dengue transmission.</span></div>
<h3>Exclamation marks (!)</h3>
<p>Exclamation marks express strong emotion. They are uncommon in formal academic essays and usually unnecessary in IELTS Writing Task 1 and Task 2.</p>
<div class="example"><span class="bad">The results were remarkable!</span><br><span class="good">The results were substantial.</span></div>
<h3>Parentheses ( )</h3>
<p>Parentheses enclose supplementary information that is not essential to the main sentence.</p>
<div class="example"><span class="good">The study covered 64 districts (the full set of districts in the country).</span></div>
<p>Do not place essential information in parentheses if it makes the sentence hard to understand.</p>
<h3>Square brackets [ ]</h3>
<p>Square brackets are used within a quotation to clarify or add words without suggesting they appeared in the original.</p>
<div class="example"><span class="good">The report states that “[the intervention] reduced the risk.”</span></div>
<h3>Ellipses (...)</h3>
<p>An ellipsis indicates omitted material in a quotation. Use it carefully and follow the required style guide. It is not a substitute for a full stop in ordinary academic prose.</p>`},
{id:"ielts",t:"Punctuation in IELTS academic writing",c:`
<p>Accurate punctuation makes arguments, comparisons and explanations easier to follow. The goal is not to use as many marks as possible, but to use the right mark for the grammatical relationship.</p>
<h3>Task 1: Describing data</h3>
<div class="example"><span class="good">The proportion increased steadily from 2000 to 2010, before falling slightly in the following decade.</span></div>
<div class="example"><span class="good">Three countries recorded substantial increases: Bangladesh, Nepal, and India.</span></div>
<h3>Task 2: Building an argument</h3>
<div class="example"><span class="good">Although technology can improve access to education, it cannot replace every aspect of face-to-face learning.</span></div>
<div class="example"><span class="good">Public transport reduces congestion; therefore, governments should invest in reliable transport networks.</span></div>
<h3>Editing checklist</h3>
<ul><li>Does every sentence have a complete grammatical structure?</li><li>Have I separated complete sentences correctly?</li><li>Have I used commas after introductory dependent clauses?</li><li>Have I avoided comma splices and unnecessary commas?</li><li>Are apostrophes used correctly for possession?</li><li>Have I used colons and semicolons only where appropriate?</li><li>Is my punctuation consistent throughout the essay?</li></ul>
<div class="rule"><strong>Best strategy</strong>After writing, check sentence boundaries first. Then review commas, apostrophes and less common marks.</div>`},
