var CH=[
{id:"basics",t:"The basics",c:`
<p>A gerund and an infinitive are two common forms of English verbs. Both can function as subjects, objects or complements, but the grammatical pattern and the meaning decide which form you need.</p>
<div class="tw"><table><thead><tr><th>Form</th><th>Structure</th><th>Example</th></tr></thead><tbody>
<tr><td>Gerund</td><td>verb + -ing</td><td>Swimming is good exercise.</td></tr>
<tr><td>To-infinitive</td><td>to + base verb</td><td>I want to swim.</td></tr>
<tr><td>Bare infinitive</td><td>base verb without to</td><td>You should swim regularly.</td></tr></tbody></table></div>
<h3>Gerund versus present participle</h3>
<p>Both end in <b>-ing</b>, but their functions differ.</p>
<div class="example"><p><b>Gerund:</b> <em>Reading</em> improves vocabulary.</p><p class="note">The -ing form acts as a noun and is the subject.</p>
<p><b>Present participle:</b> She is <em>reading</em> a novel.</p><p class="note">The -ing form helps form the present continuous.</p>
<p><b>Participle as adjective:</b> It was an <em>interesting</em> lecture.</p></div>
<h3>How to form the -ing form</h3>
<div class="tw"><table><thead><tr><th>Rule</th><th>Base verb</th><th>-ing form</th></tr></thead><tbody>
<tr><td>Usually add -ing</td><td>work</td><td>working</td></tr>
<tr><td>Drop final silent -e</td><td>make</td><td>making</td></tr>
<tr><td>Double the final consonant in suitable cases</td><td>run</td><td>running</td></tr>
<tr><td>Change -ie to -y</td><td>lie</td><td>lying</td></tr></tbody></table></div>
<div class="rule"><p><b>Important:</b> Spelling changes depend on the word and its final letters. For example, <em>study → studying</em>, but <em>die → dying</em>.</p></div>`},

{id:"gerunds",t:"Gerunds: verb + -ing",c:`
<h3>Rule 1: A gerund can be the subject</h3>
<span class="formula">Gerund + verb + rest of sentence</span>
<div class="example"><p><span class="good">Learning a language requires patience.</span></p><p><span class="good">Exercising regularly improves physical health.</span></p><p><span class="good">Collecting reliable data is essential for research.</span></p></div>
<h3>Rule 2: A gerund can be the object of a verb</h3>
<p>Some verbs are normally followed by a gerund rather than a to-infinitive.</p>
<div class="tw"><table><thead><tr><th>Verb</th><th>Example</th></tr></thead><tbody>
<tr><td>admit</td><td>He admitted making a mistake.</td></tr>
<tr><td>avoid</td><td>Try to avoid making unsupported claims.</td></tr>
<tr><td>consider</td><td>The team considered changing the method.</td></tr>
<tr><td>deny</td><td>She denied copying the report.</td></tr>
<tr><td>enjoy</td><td>I enjoy reading academic articles.</td></tr>
<tr><td>finish</td><td>They finished collecting the data.</td></tr>
<tr><td>imagine</td><td>Imagine living without internet access.</td></tr>
<tr><td>keep</td><td>He kept asking questions.</td></tr>
<tr><td>mind</td><td>Would you mind opening the window?</td></tr>
<tr><td>miss</td><td>I miss working with that team.</td></tr>
<tr><td>postpone</td><td>They postponed publishing the results.</td></tr>
<tr><td>practise</td><td>She practises writing essays every day.</td></tr>
<tr><td>recommend</td><td>The researcher recommended collecting more data.</td></tr>
<tr><td>risk</td><td>We risk losing valuable information.</td></tr>
<tr><td>suggest</td><td>He suggested using a larger sample.</td></tr></tbody></table></div>
<div class="warn"><p><b>Common error:</b> Do not automatically use a to-infinitive after every verb that describes an action.</p>
<p class="bad">Incorrect: I enjoy to read.</p><p class="good">Correct: I enjoy reading.</p>
<p><b>Why?</b> The verb <em>enjoy</em> is normally followed by a gerund.</p></div>
<h3>Rule 3: A gerund follows a preposition</h3>
<p>When a verb comes immediately after a preposition, it normally takes the -ing form.</p>
<div class="example"><ul><li>She is interested in <b>learning</b> statistics.</li><li>He left without <b>saying</b> goodbye.</li><li>They succeeded in <b>reducing</b> the error rate.</li><li>I am looking forward to <b>meeting</b> the team.</li><li>She apologised for <b>arriving</b> late.</li></ul></div>
<h3>Rule 4: A gerund after a possessive or object</h3>
<p>A possessive adjective or noun can show who performs the action.</p>
<div class="example"><p>I appreciate <b>your helping</b> me.</p><p>We were surprised by <b>John's leaving</b> early.</p><p class="note">In everyday English, <em>I appreciate you helping me</em> is also common.</p></div>
<h3>Rule 5: Gerunds follow common expressions</h3>
<div class="tw"><table><thead><tr><th>Expression</th><th>Example</th></tr></thead><tbody>
<tr><td>It is worth</td><td>It is worth reading the full report.</td></tr>
<tr><td>There is no point in</td><td>There is no point in arguing about it.</td></tr>
<tr><td>Cannot help</td><td>I cannot help laughing at that joke.</td></tr>
<tr><td>Feel like</td><td>I feel like taking a short break.</td></tr>
<tr><td>Have difficulty</td><td>She has difficulty understanding the graph.</td></tr>
<tr><td>Spend time</td><td>He spends two hours studying every evening.</td></tr>
<tr><td>Be busy</td><td>They are busy preparing the presentation.</td></tr></tbody></table></div>`},

{id:"infinitives",t:"To-infinitives",c:`
<h3>Rule 1: Use a to-infinitive to express purpose</h3>
<span class="formula">Subject + verb + to + base verb</span>
<div class="example"><p>I study English <b>to improve</b> my communication skills.</p><p>The government introduced the policy <b>to reduce</b> pollution.</p><p>Researchers collected additional data <b>to validate</b> the model.</p></div>
<p>You can often use <em>in order to</em> or <em>so as to</em> for a more explicit purpose.</p>
<div class="example"><p>They expanded the sample <b>in order to improve</b> reliability.</p><p>She left early <b>so as to avoid</b> the traffic.</p></div>
<h3>Rule 2: Use a to-infinitive after certain verbs</h3>
<div class="tw"><table><thead><tr><th>Verb</th><th>Example</th></tr></thead><tbody>
<tr><td>agree</td><td>They agreed to cooperate.</td></tr>
<tr><td>aim</td><td>The study aims to identify key risk factors.</td></tr>
<tr><td>choose</td><td>She chose to study statistics.</td></tr>
<tr><td>decide</td><td>We decided to conduct another analysis.</td></tr>
<tr><td>expect</td><td>Experts expect temperatures to rise.</td></tr>
<tr><td>fail</td><td>He failed to submit the form.</td></tr>
<tr><td>hope</td><td>I hope to pursue further research.</td></tr>
<tr><td>learn</td><td>She learned to interpret the results.</td></tr>
<tr><td>manage</td><td>They managed to complete the project.</td></tr>
<tr><td>offer</td><td>He offered to help.</td></tr>
<tr><td>plan</td><td>We plan to publish the findings.</td></tr>
<tr><td>prepare</td><td>They prepared to present their results.</td></tr>
<tr><td>promise</td><td>She promised to send the document.</td></tr>
<tr><td>refuse</td><td>He refused to answer.</td></tr>
<tr><td>seem</td><td>The findings seem to support the hypothesis.</td></tr>
<tr><td>want</td><td>I want to improve my writing.</td></tr>
<tr><td>would like</td><td>I would like to discuss the proposal.</td></tr></tbody></table></div>
<h3>Rule 3: Use a to-infinitive after adjectives</h3>
<div class="example"><ul><li>It is important <b>to check</b> the source.</li><li>She was delighted <b>to receive</b> the offer.</li><li>The problem is difficult <b>to solve</b>.</li><li>I am pleased <b>to meet</b> you.</li><li>It is essential <b>to protect</b> patient confidentiality.</li></ul></div>
<h3>Rule 4: Use a to-infinitive after question words</h3>
<p>Common patterns include <em>what to do</em>, <em>how to begin</em> and <em>where to go</em>.</p>
<div class="example"><p>I do not know <b>what to write</b>.</p><p>She explained <b>how to use</b> the software.</p><p>They could not decide <b>where to meet</b>.</p><p>He showed us <b>which file to open</b>.</p></div>
<h3>Rule 5: After nouns and pronouns</h3>
<div class="example"><p>I need something <b>to drink</b>.</p><p>She was the first person <b>to arrive</b>.</p><p>We have several issues <b>to discuss</b>.</p><p>The team needs a method <b>to estimate</b> the missing values.</p></div>
<h3>Rule 6: Too and enough</h3>
<div class="tw"><table><thead><tr><th>Pattern</th><th>Example</th></tr></thead><tbody>
<tr><td>too + adjective + to-infinitive</td><td>The box is too heavy to lift.</td></tr>
<tr><td>adjective + enough + to-infinitive</td><td>She is confident enough to present.</td></tr>
<tr><td>enough + noun + to-infinitive</td><td>We have enough evidence to proceed.</td></tr></tbody></table></div>`},

{id:"bare",t:"Bare infinitives",c:`
<p>The bare infinitive is the base verb without <em>to</em>.</p>
<h3>Rule 1: After modal verbs</h3>
<p>Modals include can, could, may, might, must, shall, should, will and would.</p>
<div class="example"><p>You should <b>revise</b> your essay.</p><p>Researchers must <b>report</b> their methods clearly.</p><p>She can <b>analyse</b> the data independently.</p><p>The results may <b>indicate</b> a seasonal pattern.</p></div>
<p class="bad">Incorrect: You should to revise your essay.</p><p class="good">Correct: You should revise your essay.</p>
<h3>Rule 2: After make and let</h3>
<div class="example"><p>The evidence made us <b>reconsider</b> the conclusion.</p><p>My supervisor let me <b>choose</b> the topic.</p></div>
<p>In the passive, <em>make</em> is followed by a to-infinitive.</p>
<div class="example"><p>Active: The teacher made him <b>rewrite</b> the essay.</p><p>Passive: He was made <b>to rewrite</b> the essay.</p></div>
<h3>Rule 3: After some perception verbs</h3>
<p><em>See, hear, watch</em> and <em>feel</em> can take an object and a bare infinitive when the whole action is perceived.</p>
<div class="example"><p>I saw him <b>cross</b> the road.</p><p>We heard the audience <b>applaud</b>.</p></div>
<p>The -ing form emphasises an action in progress.</p>
<div class="example"><p>I saw him <b>crossing</b> the road.</p><p class="note">This focuses on the action as it was happening, not necessarily the whole crossing.</p></div>
<h3>Rule 4: After had better and would rather</h3>
<div class="example"><p>You had better <b>leave</b> now.</p><p>I would rather <b>stay</b> at home.</p><p>We would rather <b>analyse</b> the original data.</p></div>
<div class="rule"><p><b>Remember:</b> <em>Ought to</em> is different. It takes a to-infinitive: <em>You ought to check the results.</em></p></div>`},

{id:"patterns",t:"Verb patterns",c:`
<h3>Verbs that allow both forms with little change in meaning</h3>
<div class="tw"><table><thead><tr><th>Verb</th><th>Gerund</th><th>To-infinitive</th></tr></thead><tbody>
<tr><td>begin</td><td>It began raining.</td><td>It began to rain.</td></tr>
<tr><td>continue</td><td>She continued working.</td><td>She continued to work.</td></tr>
<tr><td>hate</td><td>I hate waiting.</td><td>I hate to interrupt.</td></tr>
<tr><td>like</td><td>I like reading.</td><td>I like to read before bed.</td></tr>
<tr><td>love</td><td>He loves travelling.</td><td>He loves to travel.</td></tr>
<tr><td>prefer</td><td>I prefer walking.</td><td>I prefer to walk.</td></tr>
<tr><td>start</td><td>It started snowing.</td><td>It started to snow.</td></tr></tbody></table></div>
<p>With <em>like, love, hate</em> and <em>prefer</em>, the gerund often describes enjoyment or general preference. The to-infinitive can describe a habit, choice or action in a particular situation. The difference is not absolute.</p>
<h3>Verb + object + to-infinitive</h3>
<span class="formula">Verb + object + to-infinitive</span>
<div class="tw"><table><thead><tr><th>Pattern</th><th>Example</th></tr></thead><tbody>
<tr><td>advise someone to do</td><td>The doctor advised him to rest.</td></tr>
<tr><td>allow someone to do</td><td>The policy allows students to work part-time.</td></tr>
<tr><td>ask someone to do</td><td>She asked me to review the draft.</td></tr>
<tr><td>encourage someone to do</td><td>The teacher encouraged us to practise.</td></tr>
<tr><td>expect someone to do</td><td>We expect the model to perform well.</td></tr>
<tr><td>invite someone to do</td><td>They invited her to present the findings.</td></tr>
<tr><td>persuade someone to do</td><td>He persuaded them to reconsider.</td></tr>
<tr><td>remind someone to do</td><td>Please remind me to send the email.</td></tr>
<tr><td>teach someone to do</td><td>She taught me to use the software.</td></tr>
<tr><td>want someone to do</td><td>I want you to check the calculation.</td></tr></tbody></table></div>
<h3>Verb + object + bare infinitive</h3>
<div class="example"><p>The teacher made the students <b>rewrite</b> the paragraph.</p><p>Let the participants <b>finish</b> their answers.</p><p>We watched the children <b>play</b> outside.</p></div>
<h3>Verbs that change meaning</h3>
<p><em>Remember, forget, stop, try, regret</em> and <em>go on</em> change meaning depending on the form that follows. Study these contrasts in the next chapter.</p>`},

{id:"meaning",t:"Meaning changes",c:`
<h3>Remember doing / remember to do</h3>
<div class="tw"><table><thead><tr><th>Pattern</th><th>Meaning</th><th>Example</th></tr></thead><tbody>
<tr><td>remember + gerund</td><td>Recall a past action</td><td>I remember meeting her at the conference.</td></tr>
<tr><td>remember + to-infinitive</td><td>Remember that a task must be done</td><td>Remember to submit the application.</td></tr></tbody></table></div>
<h3>Forget doing / forget to do</h3>
<div class="example"><p><b>Forget + gerund:</b> I will never forget visiting the museum.</p><p class="note">The speaker will always remember the experience.</p><p><b>Forget + to-infinitive:</b> I forgot to lock the door.</p><p class="note">The speaker failed to perform the task.</p></div>
<h3>Stop doing / stop to do</h3>
<div class="example"><p><b>Stop + gerund:</b> He stopped smoking.</p><p class="note">He quit the habit.</p><p><b>Stop + to-infinitive:</b> He stopped to smoke.</p><p class="note">He stopped another activity in order to smoke.</p></div>
<h3>Try doing / try to do</h3>
<div class="example"><p><b>Try + gerund:</b> Try restarting the computer.</p><p class="note">Experiment with this as a possible solution.</p><p><b>Try + to-infinitive:</b> I tried to lift the box.</p><p class="note">Make an effort, whether or not it succeeds.</p></div>
<h3>Regret doing / regret to do</h3>
<div class="example"><p><b>Regret + gerund:</b> She regrets leaving the job.</p><p class="note">She feels sorry about a past action.</p><p><b>Regret + to-infinitive:</b> We regret to inform you that your application was unsuccessful.</p><p class="note">A formal expression used when giving unwelcome information.</p></div>
<h3>Go on doing / go on to do</h3>
<div class="example"><p><b>Go on + gerund:</b> He went on talking for another hour.</p><p class="note">He continued the same activity.</p><p><b>Go on + to-infinitive:</b> After discussing the problem, she went on to explain the solution.</p><p class="note">She moved to a different activity or stage.</p></div>
<h3>Mean doing / mean to do</h3>
<div class="example"><p><b>Mean + gerund:</b> Taking this job means moving to another city.</p><p class="note">Moving is a consequence of taking the job.</p><p><b>Mean + to-infinitive:</b> I meant to call you yesterday.</p><p class="note">I intended to call, but perhaps I did not.</p></div>
<h3>Need doing / need to do</h3>
<div class="example"><p><b>Need + gerund:</b> The report needs editing.</p><p class="note">The report needs to be edited.</p><p><b>Need + to-infinitive:</b> I need to edit the report.</p><p class="note">I must perform the action.</p></div>
<h3>Compare the patterns</h3>
<div class="tw"><table><thead><tr><th>Verb</th><th>Verb + -ing</th><th>Verb + to-infinitive</th></tr></thead><tbody>
<tr><td>remember</td><td>Recall a past event</td><td>Remember a task</td></tr>
<tr><td>forget</td><td>Fail to retain a memory</td><td>Fail to perform a task</td></tr>
<tr><td>stop</td><td>End an activity</td><td>Pause another activity to do something</td></tr>
<tr><td>try</td><td>Experiment with a method</td><td>Make an effort</td></tr>
<tr><td>regret</td><td>Feel sorry about an action</td><td>Formally introduce unwelcome news</td></tr>
<tr><td>go on</td><td>Continue the same activity</td><td>Move to another activity or stage</td></tr>
<tr><td>mean</td><td>Involve or entail</td><td>Intend</td></tr></tbody></table></div>`},

{id:"preps",t:"Prepositions and fixed expressions",c:`
<h3>Preposition to versus infinitive to</h3>
<p>The word <em>to</em> does not always introduce an infinitive. Sometimes it is a preposition, and a following verb then normally takes the -ing form.</p>
<div class="tw"><table><thead><tr><th>Expression</th><th>Pattern</th><th>Example</th></tr></thead><tbody>
<tr><td>look forward to</td><td>to + gerund</td><td>I look forward to hearing from you.</td></tr>
<tr><td>be used to</td><td>to + gerund or noun</td><td>She is used to working under pressure.</td></tr>
<tr><td>get around to</td><td>to + gerund</td><td>I finally got around to writing the report.</td></tr>
<tr><td>object to</td><td>to + gerund</td><td>They objected to changing the schedule.</td></tr>
<tr><td>devote time to</td><td>to + gerund or noun</td><td>She devotes time to learning English.</td></tr>
<tr><td>in addition to</td><td>to + gerund or noun</td><td>In addition to teaching, he conducts research.</td></tr></tbody></table></div>
<div class="warn"><p class="bad">Incorrect: I look forward to meet you.</p><p class="good">Correct: I look forward to meeting you.</p><p><b>Why?</b> In this expression, <em>to</em> is a preposition.</p></div>
<h3>Used to / be used to / get used to</h3>
<div class="tw"><table><thead><tr><th>Structure</th><th>Meaning</th><th>Example</th></tr></thead><tbody>
<tr><td>used to + base verb</td><td>A past habit or state that is no longer true</td><td>I used to walk to school.</td></tr>
<tr><td>be used to + gerund/noun</td><td>Be accustomed to something</td><td>I am used to walking long distances.</td></tr>
<tr><td>get used to + gerund/noun</td><td>Become accustomed to something</td><td>I am getting used to working remotely.</td></tr></tbody></table></div>
<h3>Adjective + preposition + gerund</h3>
<div class="example"><ul><li>She is interested in <b>conducting</b> research.</li><li>He is good at <b>solving</b> statistical problems.</li><li>They are responsible for <b>managing</b> the project.</li><li>I am worried about <b>missing</b> the deadline.</li><li>We are committed to <b>improving</b> public health.</li><li>She is capable of <b>handling</b> complex datasets.</li></ul></div>`},

{id:"advanced",t:"Advanced forms",c:`
<h3>Perfect gerund</h3>
<span class="formula">having + past participle</span>
<p>Emphasises that an action happened before the main verb.</p>
<div class="example"><p>He denied <b>having copied</b> the material.</p><p>She regretted <b>having ignored</b> the advice.</p><p>They admitted <b>having made</b> an error.</p></div>
<h3>Passive gerund</h3>
<span class="formula">being + past participle</span>
<div class="example"><p>He dislikes <b>being interrupted</b>.</p><p>She appreciates <b>being included</b> in the discussion.</p></div>
<div class="rule"><p><b>Note:</b> <em>The report needs being checked</em> is not standard. Use <em>The report needs checking</em> or <em>The report needs to be checked</em>.</p></div>
<h3>Perfect passive gerund</h3>
<span class="formula">having been + past participle</span>
<div class="example"><p>He resented <b>having been excluded</b> from the meeting.</p><p>She denied <b>having been informed</b> about the change.</p></div>
<h3>Perfect infinitive</h3>
<span class="formula">to have + past participle</span>
<p>Refers to an action that happened before the time of the main verb.</p>
<div class="example"><p>She seems <b>to have misunderstood</b> the instructions.</p><p>He claims <b>to have completed</b> the analysis.</p><p>The team appears <b>to have identified</b> a new risk factor.</p></div>
<h3>Passive infinitive</h3>
<span class="formula">to be + past participle</span>
<div class="example"><p>The results need <b>to be verified</b>.</p><p>She hopes <b>to be selected</b> for the programme.</p><p>The paper is expected <b>to be published</b> next year.</p></div>
<h3>Perfect passive infinitive</h3>
<span class="formula">to have been + past participle</span>
<div class="example"><p>The data appear <b>to have been collected</b> incorrectly.</p><p>The findings are believed <b>to have been influenced</b> by seasonal variation.</p></div>
<h3>Negative forms</h3>
<p>Place <em>not</em> before the gerund or infinitive phrase.</p>
<div class="example"><p><b>Not + gerund:</b> He admitted not knowing the answer.</p><p><b>Not + to-infinitive:</b> She decided not to participate.</p><p><b>Not + perfect gerund:</b> He denied not having received the email.</p></div>
<h3>Split infinitives</h3>
<p>A split infinitive has a word, often an adverb, between <em>to</em> and the base verb.</p>
<div class="example"><p>The team hopes <b>to quickly identify</b> the source of the problem.</p><p class="note">Acceptable in modern English when it sounds natural and keeps the meaning clear.</p></div>`},

{id:"ielts",t:"Use in IELTS",c:`
<h3>IELTS Writing Task 1</h3>
<div class="example"><p>The chart illustrates the proportion of people <b>using</b> public transport.</p><p>The percentage continued <b>to increase</b> over the period.</p><p>The figure began <b>to decline</b> after 2015.</p><p>Collecting accurate data is essential for interpreting the trend.</p></div>
<h3>IELTS Writing Task 2</h3>
<div class="example"><p><b>Gerund as subject:</b> Investing in public transport can reduce congestion.</p><p><b>Purpose infinitive:</b> Governments should improve cycling facilities to encourage sustainable travel.</p><p><b>Verb pattern:</b> Many researchers recommend introducing evidence-based policies.</p><p><b>Preposition + gerund:</b> By improving access to education, societies can reduce inequality.</p><p><b>Advanced pattern:</b> Authorities need to consider the long-term consequences of expanding urban areas.</p></div>
<h3>IELTS Speaking</h3>
<div class="example"><p>I enjoy <b>reading</b> because it helps me expand my vocabulary.</p><p>I hope <b>to pursue</b> a career in research.</p><p>I used to <b>spend</b> more time watching television, but now I prefer reading.</p><p>I am interested in <b>learning</b> about different cultures.</p></div>
<h3>Academic and research writing</h3>
<div class="example"><p>The study aims <b>to investigate</b> the association between climate and disease incidence.</p><p>Using spatial data can help researchers identify high-risk areas.</p><p>The authors recommend <b>conducting</b> further longitudinal studies.</p><p>The analysis was designed <b>to evaluate</b> the predictive performance of several models.</p><p>After <b>adjusting</b> for potential confounders, the association remained statistically significant.</p></div>
<div class="tip"><p><b>IELTS tip:</b> Use gerunds and infinitives accurately rather than forcing complicated structures into every sentence. Clear grammar, precise vocabulary, logical development and sentence variety are worth more than unnecessary complexity.</p></div>`},

{id:"mistakes",t:"Common mistakes",c:`
<div class="tw"><table><thead><tr><th>Incorrect</th><th>Correct</th><th>Explanation</th></tr></thead><tbody>
<tr><td class="bad">I enjoy to read.</td><td class="good">I enjoy reading.</td><td>Enjoy is followed by a gerund.</td></tr>
<tr><td class="bad">She suggested to go.</td><td class="good">She suggested going.</td><td>Suggest takes a gerund or a that-clause.</td></tr>
<tr><td class="bad">He wants going home.</td><td class="good">He wants to go home.</td><td>Want is followed by a to-infinitive.</td></tr>
<tr><td class="bad">I look forward to meet you.</td><td class="good">I look forward to meeting you.</td><td>Here, to is a preposition.</td></tr>
<tr><td class="bad">You should to study.</td><td class="good">You should study.</td><td>A modal verb takes a bare infinitive.</td></tr>
<tr><td class="bad">She made me to apologise.</td><td class="good">She made me apologise.</td><td>Active make + object takes a bare infinitive.</td></tr>
<tr><td class="bad">He avoided to answer.</td><td class="good">He avoided answering.</td><td>Avoid is followed by a gerund.</td></tr>
<tr><td class="bad">They decided going home.</td><td class="good">They decided to go home.</td><td>Decide takes a to-infinitive.</td></tr>
<tr><td class="bad">I am used to wake up early.</td><td class="good">I am used to waking up early.</td><td>Be used to takes a noun or gerund.</td></tr>
<tr><td class="bad">I stopped to smoke last year.</td><td class="good">I stopped smoking last year.</td><td>Stopping smoking means quitting the habit.</td></tr>
<tr><td class="bad">He suggested me to apply.</td><td class="good">He suggested that I apply.</td><td>Suggest does not use this object + infinitive pattern.</td></tr>
<tr><td class="bad">She is interested to learn English.</td><td class="good">She is interested in learning English.</td><td>Interested in is followed by a noun or gerund.</td></tr></tbody></table></div>
<h3>Three questions to ask yourself</h3>
<ol><li>Does the preceding verb require a gerund or an infinitive?</li><li>Is the word <em>to</em> a preposition or part of an infinitive?</li><li>Does changing the form change the meaning?</li></ol>`},

{id:"practice",t:"Practice exercises",c:`
<p>Complete each sentence with the correct form of the verb in brackets. Then open the answers to check.</p>
<ol>
<li>She enjoys <span class="blank">________</span> (read) scientific articles.</li>
<li>We decided <span class="blank">________</span> (conduct) another survey.</li>
<li>He apologised for <span class="blank">________</span> (arrive) late.</li>
<li>They made us <span class="blank">________</span> (wait) outside.</li>
<li>I look forward to <span class="blank">________</span> (hear) from you.</li>
<li>Remember <span class="blank">________</span> (lock) the door before leaving.</li>
<li>He stopped <span class="blank">________</span> (smoke) because of health concerns.</li>
<li>She tried <span class="blank">________</span> (restart) the computer to fix the issue.</li>
<li>The report needs <span class="blank">________</span> (revise).</li>
<li>It is important <span class="blank">________</span> (check) the results carefully.</li></ol>
<details><summary>Show answers and explanations</summary><ol>
<li><b>reading:</b> Enjoy is followed by a gerund.</li>
<li><b>to conduct:</b> Decide is followed by a to-infinitive.</li>
<li><b>arriving:</b> A verb after the preposition for takes the -ing form.</li>
<li><b>wait:</b> Active make + object takes a bare infinitive.</li>
<li><b>hearing:</b> To is a preposition in look forward to.</li>
<li><b>to lock:</b> Remember to do means remember a task that must be performed.</li>
<li><b>smoking:</b> Stop smoking means quit the habit.</li>
<li><b>restarting:</b> Try doing means test a possible solution.</li>
<li><b>revising / to be revised:</b> The report needs revising or needs to be revised.</li>
<li><b>to check:</b> The pattern important + to-infinitive is correct.</li></ol></details>`},
