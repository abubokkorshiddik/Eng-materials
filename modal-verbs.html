/* ---------- content ---------- */
var CH=[{"id": "what", "t": "What are modal verbs?", "c": "<p class=\"say\">A modal verb is a helper verb that sits before a main verb and adds <b>attitude</b>: how possible, how necessary, how advisable or how permitted something is. The action itself does not change. Only the speaker’s view of it changes.</p><div class=\"example\"><p>She <b>swims</b> every day. She <b>can</b> swim. She <b>must</b> swim. She <b>might</b> swim.</p><p class=\"note\">Same action, four different attitudes: fact, ability, duty, possibility.</p></div><h3>The main modal verbs</h3><ul><li><b>Core modals:</b> can, could, may, might, must, shall, should, will, would.</li><li><b>Semi-modals:</b> ought to, have to, need to, be able to, had better, used to, dare.</li><li><b>Why they matter:</b> every IELTS band descriptor for Grammar and Lexical Resource rewards control of possibility, obligation and hedging.</li></ul><h3>Five jobs a modal can do</h3><div class=\"tw\"><table><thead><tr><th>Job</th><th>Typical modals</th><th>Example</th></tr></thead><tbody><tr><td>Ability</td><td>can, could, be able to</td><td>She can speak four languages.</td></tr><tr><td>Possibility and certainty</td><td>must, will, should, may, might, could, can’t</td><td>It might rain. He must be tired.</td></tr><tr><td>Advice and opinion</td><td>should, ought to, had better, could</td><td>You should see a doctor.</td></tr><tr><td>Obligation and rules</td><td>must, have to, need to, mustn’t, can’t</td><td>You must wear a seat belt.</td></tr><tr><td>Permission and requests</td><td>can, could, may, would, shall</td><td>Could I borrow your pen?</td></tr></tbody></table></div><p class=\"note\">One modal can do several jobs. Context tells you which one is meant: <em>He can swim</em> (ability) and <em>Can I swim here?</em> (permission).</p>"}, {"id": "forms", "t": "The grammar of modals", "c": "<p>Modals follow a few simple rules, and these rules never change. Learn them once and they apply to every modal.</p><h3>Rule 1: modal + base verb</h3><div class=\"example\"><p>She <b>can</b> swim. They <b>should</b> leave. He <b>might</b> come.</p><p class=\"note\">The verb after a modal is always the base form, with no -s, no -ing, no to, no -ed.</p></div><h3>Rule 2: no -s with he, she, it</h3><div class=\"example\"><p><del>She cans swim.</del> → <ins>She can swim.</ins></p></div><h3>Rule 3: negatives add not</h3><div class=\"tw\"><table><thead><tr><th>Modal</th><th>Negative</th><th>Short form</th></tr></thead><tbody><tr><td>can</td><td>cannot / can not</td><td>can’t</td></tr><tr><td>could</td><td>could not</td><td>couldn’t</td></tr><tr><td>will</td><td>will not</td><td>won’t</td></tr><tr><td>would</td><td>would not</td><td>wouldn’t</td></tr><tr><td>should</td><td>should not</td><td>shouldn’t</td></tr><tr><td>must</td><td>must not</td><td>mustn’t</td></tr><tr><td>may / might</td><td>may not / might not</td><td>mayn’t (rare) / mightn’t (rare)</td></tr><tr><td>shall</td><td>shall not</td><td>shan’t (British)</td></tr></tbody></table></div><h3>Rule 4: questions put the modal first</h3><div class=\"example\"><p><b>Can</b> you help? <b>Should</b> we leave now? <b>Where could</b> she be?</p><p class=\"note\">No do/does/did. Modal + subject + base verb.</p></div><h3>Rule 5: short answers repeat the modal</h3><div class=\"example\"><p>“Can you swim?” “Yes, I can.” / “No, I can’t.”</p></div><h3>Rule 6: two modals cannot go together</h3><div class=\"example\"><p><del>You will can do it.</del> → <ins>You will be able to do it.</ins></p><p class=\"note\">Use be able to, have to or need to when you need a second form.</p></div><h3>Rule 7: the passive and continuous work the same way</h3><div class=\"tw\"><table><thead><tr><th>Form</th><th>Pattern</th><th>Example</th></tr></thead><tbody><tr><td>Passive</td><td>modal + be + past participle</td><td>The rules must be followed.</td></tr><tr><td>Continuous</td><td>modal + be + -ing</td><td>She may be sleeping.</td></tr><tr><td>Perfect</td><td>modal + have + past participle</td><td>He must have left.</td></tr><tr><td>Perfect passive</td><td>modal + have been + participle</td><td>It should have been done.</td></tr></tbody></table></div>"}, {"id": "scale", "t": "The certainty scale", "c": "<p>When you talk about whether something is true or will happen, modals form a scale from 100% sure to very unlikely. Choosing the right place on the scale is the key to natural and accurate English.</p><div class=\"tw\"><table><thead><tr><th>Certainty</th><th>Present or future</th><th>Example</th><th>Negative side</th></tr></thead><tbody><tr><td>100%</td><td>will / is</td><td>The sun will rise tomorrow.</td><td>will not</td></tr><tr><td>About 95%</td><td>must</td><td>She must be at work. Her car is outside.</td><td>can’t</td></tr><tr><td>About 80%</td><td>should / ought to</td><td>The test should be easy.</td><td>shouldn’t</td></tr><tr><td>About 50%</td><td>may / might / could</td><td>It may rain. He could be late.</td><td>may not / might not</td></tr><tr><td>Under 30%</td><td>might (weak) / could (weak)</td><td>We might go, but I doubt it.</td><td>—</td></tr></tbody></table></div><h3>Important: must and can’t for deduction</h3><div class=\"example\"><p>He is not answering. He must be asleep.<br>He is yelling at me. He can’t be asleep.</p><p class=\"note\">Must is the logical conclusion. Can’t is the logical opposite. Do not use mustn’t for this meaning.</p></div><h3>Why the scale matters</h3><p>In Task 2, an unsupported claim stated with <em>will</em> sounds careless. The same idea with <em>may</em> or <em>could</em> sounds measured and academic. See the chapter on hedging for exactly how to use it.</p>"}, {"id": "can", "t": "Can and could (and be able to)", "c": "<h3>Can: ability now</h3><div class=\"example\"><p>She <b>can</b> speak four languages.</p><p class=\"note\">General ability in the present.</p></div><h3>Can: permission</h3><div class=\"example\"><p><b>Can</b> I use your phone? You <b>can</b> park here.</p><p class=\"note\">Informal permission.</p></div><h3>Can: possibility</h3><div class=\"example\"><p>Heavy rain <b>can</b> cause flooding.</p><p class=\"note\">General possibility, true at any time. Not a prediction for one event.</p></div><h3>Can’t: impossibility or deduction</h3><div class=\"example\"><p>That <b>can’t</b> be right. It is much too cheap.</p><p class=\"note\">You are sure it is not true.</p></div><h3>Could: past ability</h3><div class=\"example\"><p>I <b>could</b> read at the age of four.</p><p class=\"note\">General ability in the past.</p></div><h3>Could vs was able to</h3><div class=\"example\"><p>She could swim when she was five.<br>She was able to swim across the river yesterday.</p><p class=\"note\">Could for a general past skill. Was able to for one successful event.</p></div><div class=\"example\"><p>The firefighters <b>were able to</b> save everyone. (Not: could save, for one particular event.)</p></div><p class=\"note\">Exception: with negatives and verbs of perception, could is fine for one event: <em>I couldn’t open the door. I could hear music.</em></p><h3>Could: polite requests and suggestions</h3><div class=\"example\"><p><b>Could</b> you help me, please? We <b>could</b> try a different route.</p><p class=\"note\">Could is softer than can.</p></div><h3>Could: present or future possibility</h3><div class=\"example\"><p>The new bridge <b>could</b> reduce congestion.</p><p class=\"note\">Possible, not certain.</p></div><h3>Be able to</h3><p><em>Be able to</em> works in tenses where can does not exist: <em>She has been able to…, You will be able to…, I would like to be able to…</em></p><div class=\"tw\"><table><thead><tr><th>Modal</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>can</td><td>ability, permission, general possibility</td><td>I can drive.</td></tr><tr><td>can’t</td><td>inability, prohibition, impossibility</td><td>You can’t smoke here. It can’t be true.</td></tr><tr><td>could</td><td>past ability, polite request, weak possibility</td><td>Could you wait?</td></tr><tr><td>be able to</td><td>ability in any tense</td><td>She will be able to join us.</td></tr></tbody></table></div>"}, {"id": "may", "t": "May and might", "c": "<h3>May and might: possibility</h3><div class=\"example\"><p>It <b>may</b> rain this afternoon. She <b>might</b> be at home.</p><p class=\"note\">About 50% sure. Might is often felt as slightly weaker than may.</p></div><div class=\"example\"><p>This may cause serious damage.<br>This might cause some damage.</p><p class=\"note\">May is slightly stronger than might. In formal writing they are often interchangeable.</p></div><h3>May and might: negative</h3><div class=\"example\"><p>It <b>may not</b> work. He <b>might not</b> come.</p><p class=\"note\">Do not shorten to mayn’t in modern English.</p></div><p class=\"note\">You cannot use <em>can’t</em> here. <em>It can’t work</em> means you are sure it does not work.</p><h3>May: permission (formal)</h3><div class=\"example\"><p><b>May</b> I come in? You <b>may</b> leave now.</p><p class=\"note\">More formal than can. Common in notices and formal talk.</p></div><h3>May: wishes and formal expressions</h3><div class=\"example\"><p><b>May</b> you both be very happy!</p><p class=\"note\">Rare, fixed and formal.</p></div><h3>May and might in the past</h3><div class=\"example\"><p>She <b>may have</b> missed the bus. He <b>might have</b> forgotten.</p><p class=\"note\">May/might + have + past participle: it is possible that it happened.</p></div><h3>Might for unreal or weak possibility</h3><div class=\"example\"><p>If I had more time, I <b>might</b> learn Spanish.</p><p class=\"note\">Might can appear in conditionals.</p></div><h3>May and might vs maybe and perhaps</h3><div class=\"example\"><p>She may be late.<br>Maybe she will be late.</p><p class=\"note\">May is a verb and goes after the subject. Maybe is an adverb and goes at the start. Do not write ‘may be’ for ‘maybe’ unless it really is verb + be.</p></div><div class=\"tw\"><table><thead><tr><th>Modal</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>may</td><td>possibility, formal permission</td><td>It may rain.</td></tr><tr><td>might</td><td>weaker possibility</td><td>He might call.</td></tr><tr><td>may not</td><td>possibly not (not forbidden unless formal)</td><td>It may not be true.</td></tr><tr><td>may / might have + participle</td><td>possibility about the past</td><td>She may have left.</td></tr></tbody></table></div>"}, {"id": "must", "t": "Must, have to and need to", "c": "<h3>Must: strong obligation from the speaker</h3><div class=\"example\"><p>You <b>must</b> finish this today. I <b>must</b> call my mother.</p><p class=\"note\">The speaker feels the duty or imposes it.</p></div><h3>Have to: obligation from rules or outside</h3><div class=\"example\"><p>I <b>have to</b> wear a uniform at work.</p><p class=\"note\">The obligation comes from a rule, a situation, a boss or the law.</p></div><div class=\"example\"><p>I must stop smoking.<br>I have to stop smoking. The doctor insisted.</p><p class=\"note\">Must: personal decision. Have to: external reason. In practice they often overlap.</p></div><h3>Mustn’t: it is forbidden</h3><div class=\"example\"><p>You <b>mustn’t</b> touch that wire. You <b>mustn’t</b> park here.</p><p class=\"note\">Prohibition.</p></div><h3>Don’t have to / needn’t: it is not necessary</h3><div class=\"example\"><p>You <b>don’t have to</b> come. You <b>needn’t</b> bring a gift.</p><p class=\"note\">No obligation. You are free to do it or not.</p></div><div class=\"tw\"><table><thead><tr><th>Sentence</th><th>Meaning</th></tr></thead><tbody><tr><td>You must not park here.</td><td>It is forbidden.</td></tr><tr><td>You don’t have to park here.</td><td>You may park elsewhere. It is not required.</td></tr><tr><td>You needn’t park here.</td><td>Same as don’t have to (formal).</td></tr><tr><td>You can’t park here.</td><td>It is not allowed (rule or law).</td></tr></tbody></table></div><h3>Must: logical deduction</h3><div class=\"example\"><p>You have worked all day. You <b>must</b> be tired.</p><p class=\"note\">You are almost sure. Opposite: can’t.</p></div><h3>Must have: deduction about the past</h3><div class=\"example\"><p>The ground is wet. It <b>must have</b> rained.</p><p class=\"note\">You are nearly sure it happened.</p></div><h3>Must has no past tense</h3><div class=\"example\"><p><del>I musted go.</del> → <ins>I had to go.</ins></p><p class=\"note\">Use had to for the past, will have to for the future.</p></div><h3>Need to, needn’t and need as a modal</h3><ul><li><b>Need to</b> is a normal verb: <em>She needs to go. Do I need to wait?</em></li><li><b>Need</b> as a modal is mostly negative or in questions: <em>You needn’t worry. Need I explain?</em></li><li><b>Needn’t have + participle</b> means you did something that was not necessary: <em>You needn’t have bought flowers. We have plenty.</em></li></ul><h3>Must in writing and signs</h3><div class=\"example\"><p>Passengers <b>must</b> keep their seat belts fastened. Applicants <b>must</b> submit the form by Friday.</p><p class=\"note\">Formal rules and notices.</p></div>"}, {"id": "should", "t": "Should, ought to and had better", "c": "<h3>Should: advice and recommendation</h3><div class=\"example\"><p>You <b>should</b> see a doctor. Governments <b>should</b> invest more in public transport.</p><p class=\"note\">A good idea or a duty in the speaker’s opinion. Very common in Task 2 solutions.</p></div><h3>Shouldn’t: advice against</h3><div class=\"example\"><p>You <b>shouldn’t</b> stay up so late.</p></div><h3>Should: probability</h3><div class=\"example\"><p>The train <b>should</b> arrive at six. This <b>should</b> be easy.</p><p class=\"note\">You expect it to happen if all goes normally.</p></div><h3>Ought to</h3><div class=\"example\"><p>You <b>ought to</b> apologise. We <b>ought not to</b> waste water.</p><p class=\"note\">Almost the same as should, a little more formal. Keeps the word to.</p></div><h3>Had better</h3><div class=\"example\"><p>You <b>had better</b> hurry. We <b>had better not</b> be late.</p><p class=\"note\">Strong advice with a warning of a bad result. It refers to the present or future, and it has no -ing or past form.</p></div><div class=\"tw\"><table><thead><tr><th>Strength</th><th>Modal</th><th>Example</th></tr></thead><tbody><tr><td>Mild</td><td>could, might want to</td><td>You could talk to your teacher.</td></tr><tr><td>Medium</td><td>should, ought to</td><td>You should talk to your teacher.</td></tr><tr><td>Strong</td><td>had better, must</td><td>You had better talk to your teacher.</td></tr></tbody></table></div><h3>Should have + past participle</h3><div class=\"example\"><p>I <b>should have</b> studied harder. (I didn’t.) You <b>shouldn’t have</b> said that. (You did.)</p><p class=\"note\">Regret or criticism about the past.</p></div><h3>Should in that-clauses</h3><div class=\"example\"><p>It is important that every student <b>should</b> have access to books. The doctor suggested that she <b>should</b> rest.</p><p class=\"note\">After verbs and adjectives of recommendation, should is common in British English. American English often uses the base form: It is important that every student have access.</p></div><h3>Should in formal conditionals</h3><div class=\"example\"><p><b>Should</b> you need help, please call us.</p><p class=\"note\">This means: If you need help. It is very formal and appears in emails and notices.</p></div>"}, {"id": "will", "t": "Will, would and shall", "c": "<h3>Will: future facts and predictions</h3><div class=\"example\"><p>The sun <b>will</b> rise at 6. It <b>will</b> be cold tomorrow.</p><p class=\"note\">Very sure predictions.</p></div><h3>Will: instant decisions, promises and offers</h3><div class=\"example\"><p>I’ll answer the phone. I <b>will</b> help you. I <b>won’t</b> tell anyone.</p><p class=\"note\">Said at the moment of speaking.</p></div><h3>Will: willingness and refusal</h3><div class=\"example\"><p>She <b>won’t</b> listen to anyone. The door <b>won’t</b> open.</p><p class=\"note\">Refusal, even for things.</p></div><h3>Will: general truths and habits</h3><div class=\"example\"><p>Oil <b>will</b> float on water. He <b>will</b> sit for hours reading.</p><p class=\"note\">Typical behaviour. With stress it can show irritation: He will leave his socks everywhere.</p></div><h3>Would: polite requests and offers</h3><div class=\"example\"><p><b>Would</b> you open the window? <b>Would</b> you like some tea?</p><p class=\"note\">Polite. Would you like is the standard offer.</p></div><h3>Would: results of imaginary situations</h3><div class=\"example\"><p>If I won the lottery, I <b>would</b> travel.</p><p class=\"note\">Second conditional.</p></div><h3>Would: past habits</h3><div class=\"example\"><p>When I was a child, we <b>would</b> play outside every evening.</p><p class=\"note\">Repeated past actions. Cannot be used for states: <del>I would live in London.</del> → I used to live in London.</p></div><h3>Would: the past of will</h3><div class=\"example\"><p>He said he <b>would</b> call. (Reported speech.)</p><p class=\"note\">Reported promises and future in the past.</p></div><h3>Would rather</h3><div class=\"example\"><p>I <b>would rather</b> stay home. I’d rather you didn’t smoke.</p><p class=\"note\">Preference: would rather + base verb, or + past form for another person.</p></div><h3>Shall</h3><div class=\"example\"><p><b>Shall</b> I open the window? <b>Shall</b> we go?</p><p class=\"note\">Offers and suggestions with I and we. Rare in American English.</p></div><p class=\"note\"><em>Shall</em> in statements (I shall arrive at six) is very formal British English. Use will in IELTS writing.</p>"}, {"id": "others", "t": "Other modal-like expressions", "c": "<h3>Used to</h3><div class=\"example\"><p>I <b>used to</b> live in Dhaka. She didn’t use to like tea.</p><p class=\"note\">Past habit or state that is no longer true. In negatives and questions, use did + use to.</p></div><div class=\"example\"><p>I used to walk to school.<br>I am used to walking to school.</p><p class=\"note\">Used to + base verb = past habit. Be used to + -ing = familiar with.</p></div><h3>Be going to</h3><div class=\"example\"><p>It <b>is going to</b> rain. I’m going to study medicine.</p><p class=\"note\">Plans and predictions based on present evidence.</p></div><h3>Be supposed to</h3><div class=\"example\"><p>You <b>are supposed to</b> arrive by nine. The train was supposed to leave at five.</p><p class=\"note\">Duty, plan or expectation, often not followed.</p></div><h3>Be allowed to / be permitted to</h3><div class=\"example\"><p>Students <b>are not allowed to</b> use phones here.</p><p class=\"note\">Permission by a rule.</p></div><h3>Be bound to</h3><div class=\"example\"><p>Prices are <b>bound to</b> rise.</p><p class=\"note\">Certain to happen.</p></div><h3>Be likely to / be unlikely to</h3><div class=\"example\"><p>Young people <b>are likely to</b> move to cities.</p><p class=\"note\">Excellent for academic hedging.</p></div><h3>Dare</h3><div class=\"example\"><p>How <b>dare</b> you! I daren’t ask.</p><p class=\"note\">Rare modal. Normally: She didn’t dare to ask.</p></div><h3>Would like / would love / would prefer</h3><div class=\"example\"><p>I <b>would like</b> to book a table.</p><p class=\"note\">Polite wants. Don’t use want in formal requests.</p></div><div class=\"tw\"><table><thead><tr><th>Modal</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>used to</td><td>past habit/state</td><td>I used to smoke.</td></tr><tr><td>be able to</td><td>ability in all tenses</td><td>I’ve been able to…</td></tr><tr><td>have to</td><td>external obligation</td><td>I have to go.</td></tr><tr><td>be allowed to</td><td>permission by rule</td><td>You are allowed to…</td></tr><tr><td>be supposed to</td><td>expected duty</td><td>You’re supposed to…</td></tr><tr><td>be likely to</td><td>probable</td><td>It is likely to rain.</td></tr></tbody></table></div>"}, {"id": "past", "t": "Modals in the past", "c": "<p>To talk about the past, most modals use <b>modal + have + past participle</b>. The meaning depends on the modal.</p><div class=\"tw\"><table><thead><tr><th>Pattern</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>must have + participle</td><td>I am nearly sure it happened</td><td>She must have forgotten.</td></tr><tr><td>can’t / couldn’t have + participle</td><td>I am nearly sure it did not happen</td><td>He can’t have seen us.</td></tr><tr><td>may / might / could have + participle</td><td>It is possible it happened</td><td>They might have missed the bus.</td></tr><tr><td>should have + participle</td><td>It was a good idea, but we did not do it</td><td>You should have called.</td></tr><tr><td>shouldn’t have + participle</td><td>It was a bad idea, but we did it</td><td>I shouldn’t have said that.</td></tr><tr><td>could have + participle</td><td>It was possible, but we did not do it</td><td>I could have won.</td></tr><tr><td>would have + participle</td><td>Imaginary result in the past (third conditional)</td><td>I would have helped if I had known.</td></tr><tr><td>needn’t have + participle</td><td>We did it, but it was not necessary</td><td>You needn’t have waited.</td></tr></tbody></table></div><h3>Compare</h3><div class=\"example\"><p>She might come.<br>She might have come.</p><p class=\"note\">Future possibility vs past possibility.</p></div><div class=\"example\"><p>You should study.<br>You should have studied.</p><p class=\"note\">Advice now vs regret about the past.</p></div><div class=\"example\"><p>I couldn’t swim when I was young.<br>I couldn’t have swum that far.</p><p class=\"note\">General past ability vs deduction.</p></div><h3>Past obligation and ability</h3><ul><li><b>Must → had to:</b> <em>I had to leave early.</em></li><li><b>Can → could / was able to:</b> <em>He could read at three.</em></li><li><b>Will → would:</b> <em>She said she would help.</em></li></ul><h3>Past continuous modals</h3><div class=\"example\"><p>She <b>must have been</b> sleeping. They <b>could have been</b> waiting for us.</p><p class=\"note\">Modal + have been + -ing for a longer action in the past.</p></div><h3>Pronunciation note</h3><p>In speech, <em>have</em> is weak: <em>should’ve, could’ve, must’ve</em>. It is never ‘should of’ in writing. Writing <del>should of</del> is a common error.</p>"}, {"id": "special", "t": "Special structures with modals", "c": "<h3>Passive with modals</h3><div class=\"example\"><p>The rules <b>must be followed</b>. The problem <b>can be solved</b>. Mistakes <b>should be corrected</b>.</p><p class=\"note\">modal + be + past participle. Perfect for formal writing and process descriptions.</p></div><h3>Modals in questions</h3><div class=\"example\"><p><b>Could</b> I ask you something? <b>Would</b> you mind waiting? <b>Why should</b> we pay more?</p><p class=\"note\">Modal first, then the subject.</p></div><h3>Indirect and polite forms</h3><div class=\"tw\"><table><thead><tr><th>Level</th><th>Request</th><th>Use</th></tr></thead><tbody><tr><td>Direct</td><td>Open the window.</td><td>Close friends, commands.</td></tr><tr><td>Neutral</td><td>Can you open the window?</td><td>Daily life.</td></tr><tr><td>Polite</td><td>Could you open the window?</td><td>Strangers, work.</td></tr><tr><td>Very polite</td><td>Would you mind opening the window?</td><td>Formal.</td></tr><tr><td>Very formal</td><td>I wonder if you could open the window.</td><td>Requests to someone senior.</td></tr></tbody></table></div><h3>Offers and suggestions</h3><div class=\"example\"><p><b>Shall</b> I carry that? <b>Why don’t</b> we go? We <b>could</b> try again. <b>How about</b> going out?</p><p class=\"note\">Offers use shall I, can I, would you like. Suggestions use could, should, let’s.</p></div><h3>Modal + not + have: ‘it is not true’</h3><div class=\"example\"><p>She <b>can’t have</b> done it. She was abroad.</p><p class=\"note\">Deduction about the past.</p></div><h3>Inversion for formal style</h3><div class=\"example\"><p><b>Should</b> prices rise, demand will fall. <b>Had</b> I known, I would have called. <b>Were</b> it not for the rain, we would go.</p><p class=\"note\">Should / Had / Were at the start replace if. Very formal and impressive in IELTS Writing, but use it only when it is accurate.</p></div><h3>Modals in reported speech</h3><div class=\"tw\"><table><thead><tr><th>Direct</th><th>Reported</th></tr></thead><tbody><tr><td>I can swim.</td><td>She said she could swim.</td></tr><tr><td>I will help.</td><td>He said he would help.</td></tr><tr><td>I may come.</td><td>She said she might come.</td></tr><tr><td>You must go.</td><td>He said I had to go. / I must go.</td></tr><tr><td>You should rest.</td><td>He said I should rest. (no change)</td></tr></tbody></table></div><h3>Modals in conditionals</h3><div class=\"example\"><p>If you <b>should</b> see him, tell him. If I were you, I <b>would</b> apologise. If it rains, we <b>may</b> stay home.</p><p class=\"note\">Would is the usual modal in the main clause of second and third conditionals.</p></div><h3>Combining with adverbs</h3><p><em>definitely will, probably should, possibly might, certainly can’t</em>. Adverbs add precision: <em>This will probably lead to…</em></p>"}, {"id": "hedge", "t": "Hedging and IELTS use", "c": "<p class=\"say\"><b>Hedging</b> means softening a claim so it matches the evidence. Academic writers hedge constantly, because very few things are always true. Examiners look for it as a sign of mature, accurate English.</p><h3>Without and with a hedge</h3><div class=\"tw\"><table><thead><tr><th>Too strong</th><th>Hedged</th></tr></thead><tbody><tr><td>Technology will destroy jobs.</td><td>Technology may reduce the number of jobs in some sectors.</td></tr><tr><td>Social media makes teenagers lonely.</td><td>Social media can make some teenagers feel lonely.</td></tr><tr><td>This will solve the problem.</td><td>This could help to reduce the problem.</td></tr><tr><td>Everyone must go to university.</td><td>Many young people should be encouraged to go to university.</td></tr><tr><td>It is always cheaper.</td><td>It is usually cheaper. / It can be cheaper.</td></tr></tbody></table></div><h3>Useful hedging patterns</h3><ul><li><b>May / might / could + verb:</b> This may lead to higher costs.</li><li><b>can + verb</b> for general truths: Exercise can improve mood.</li><li><b>tend to:</b> Teenagers tend to spend more time online.</li><li><b>be likely / unlikely to:</b> Prices are likely to rise.</li><li><b>It is possible that:</b> It is possible that demand will fall.</li><li><b>seem / appear to:</b> The trend appears to be growing.</li><li><b>Adverbs:</b> probably, generally, usually, often, in many cases.</li></ul><h3>Modals for recommendations in Task 2</h3><div class=\"tw\"><table><thead><tr><th>Purpose</th><th>Modal</th><th>Example</th></tr></thead><tbody><tr><td>Strong recommendation</td><td>should, must</td><td>Governments should invest in public transport.</td></tr><tr><td>Necessary action</td><td>must, need to</td><td>Schools need to teach digital skills.</td></tr><tr><td>Possible action</td><td>could, might</td><td>Cities could introduce congestion charges.</td></tr><tr><td>Result</td><td>will, would</td><td>This would reduce emissions.</td></tr></tbody></table></div><h3>Modals in Task 1</h3><p>In describing future predictions on a chart, use <em>is expected to, is predicted to, will, is likely to</em>. For past data use the past tenses, not modals.</p><div class=\"example\"><p>The population <b>is projected to</b> reach 12 million by 2040. It <b>will probably</b> exceed that figure.</p></div><h3>Modals in Speaking</h3><ul><li><b>Part 1:</b> “I might go to the park later.” “I’d rather stay home.”</li><li><b>Part 2:</b> “If I could change one thing, I would…”, “I should have learned earlier.”</li><li><b>Part 3:</b> “It could be argued that…”, “That depends, but it might…”</li></ul><h3>Sample paragraph</h3><div class=\"example\"><p>Many people believe that cars <b>should</b> be banned from city centres. This <b>could</b> reduce pollution, and it <b>might</b> encourage more people to walk. However, shops <b>may</b> lose customers, so the policy <b>must</b> be introduced carefully.</p><p class=\"note\">Five modals, each with a clear job: recommendation, possible result, possible result, risk, necessary condition.</p></div>"}, {"id": "mist", "t": "Mistakes people make", "c": "<div class=\"example\"><p><del>She cans swim.</del> → <ins>She can swim.</ins></p><p class=\"note\">No -s after a modal.</p></div><div class=\"example\"><p><del>He must to go.</del> → <ins>He must go.</ins></p><p class=\"note\">No to after a modal (ought to is the exception).</p></div><div class=\"example\"><p><del>I will can help you.</del> → <ins>I will be able to help you.</ins></p><p class=\"note\">Two modals cannot go together.</p></div><div class=\"example\"><p><del>She might to be late.</del> → <ins>She might be late.</ins></p><p class=\"note\">Base verb only.</p></div><div class=\"example\"><p><del>You mustn’t come if you don’t want to.</del> → <ins>You don’t have to come if you don’t want to.</ins></p><p class=\"note\">Mustn’t means forbidden.</p></div><div class=\"example\"><p><del>He should has finished.</del> → <ins>He should have finished.</ins></p><p class=\"note\">Modal + have + participle.</p></div><div class=\"example\"><p><del>She could of come.</del> → <ins>She could have come.</ins></p><p class=\"note\">Never could of / should of / would of.</p></div><div class=\"example\"><p><del>Do you can swim?</del> → <ins>Can you swim?</ins></p><p class=\"note\">Modals do not use do.</p></div><div class=\"example\"><p><del>He doesn’t can drive.</del> → <ins>He can’t drive.</ins></p><p class=\"note\">Use the negative modal.</p></div><div class=\"example\"><p><del>I musted go home.</del> → <ins>I had to go home.</ins></p><p class=\"note\">Must has no past form.</p></div><div class=\"example\"><p><del>This will lead to unemployment.</del> → <ins>This may lead to unemployment.</ins></p><p class=\"note\">Hedge uncertain claims.</p></div><div class=\"example\"><p><del>She said she will come.</del> → <ins>She said she would come.</ins></p><p class=\"note\">Reported speech shifts will to would.</p></div><div class=\"example\"><p><del>I am used to live alone.</del> → <ins>I am used to living alone.</ins></p><p class=\"note\">Be used to + -ing.</p></div><div class=\"example\"><p><del>He didn’t used to smoke. (spelling slip)</del> → <ins>He didn’t use to smoke.</ins></p><p class=\"note\">Did + use to, without the d.</p></div><div class=\"example\"><p><del>It may be rains.</del> → <ins>It may rain.</ins></p><p class=\"note\">Do not add be before a base verb.</p></div><div class=\"example\"><p><del>You should to study.</del> → <ins>You should study.</ins></p><p class=\"note\">No to.</p></div>"}, {"id": "pairs", "t": "Pairs and look-alikes", "c": "<div class=\"tw\"><table><thead><tr><th>Pair</th><th>Difference</th><th>Example</th></tr></thead><tbody><tr><td>must not / don’t have to</td><td>Forbidden vs not necessary</td><td>You must not enter. You don’t have to enter.</td></tr><tr><td>may / maybe</td><td>Verb vs adverb</td><td>It may rain. Maybe it will rain.</td></tr><tr><td>can / may (permission)</td><td>Informal vs formal</td><td>Can I go? May I go?</td></tr><tr><td>could / was able to</td><td>General past skill vs one event</td><td>She could swim. She was able to swim the lake.</td></tr><tr><td>must / have to</td><td>Speaker’s feeling vs rule</td><td>I must diet. I have to wear a uniform.</td></tr><tr><td>should / must</td><td>Advice vs strong duty</td><td>You should rest. You must rest.</td></tr><tr><td>would / used to</td><td>Past habit (action only) vs past habit or state</td><td>We would play. We used to live there.</td></tr><tr><td>can’t / mustn’t</td><td>Impossible vs forbidden</td><td>It can’t be him. You mustn’t go.</td></tr><tr><td>should / ought to</td><td>Nearly the same; ought keeps to</td><td>You should go. You ought to go.</td></tr><tr><td>will / going to</td><td>Sudden decision vs plan or evidence</td><td>I’ll help. It is going to rain.</td></tr><tr><td>might / may</td><td>Slightly weaker vs slightly stronger</td><td>He might come. He may come.</td></tr><tr><td>could (possible) / could have</td><td>Possible now vs possible in the past</td><td>She could win. She could have won.</td></tr><tr><td>need to / have to</td><td>Personal need vs rule</td><td>I need to sleep. I have to work.</td></tr></tbody></table></div>"}, {"id": "dodont", "t": "Do, don’t and why", "c": "<div class=\"two\"><div><h3>Do</h3><ul><li>Use may, might or could for uncertain predictions.</li><li>Use should for advice and solutions in Task 2.</li><li>Follow every modal with the base verb.</li><li>Use modal + have + participle for the past.</li><li>Use be able to when you need another form.</li><li>Choose must not for forbidden, don’t have to for not necessary.</li></ul></div><div><h3>Don’t</h3><ul><li>Don’t add -s, -ing or to after a modal.</li><li>Don’t use two modals together.</li><li>Don’t use must not for ‘not necessary’.</li><li>Don’t make absolute claims with will or always.</li><li>Don’t write should of, could of, would of.</li><li>Don’t use do/does to make modal questions.</li></ul></div></div><h3>Why we get it wrong</h3><h3>Translation</h3><p>Many languages use one word for must and have to, so the difference between mustn’t and don’t have to is invisible.</p><div class=\"tip\"><p>Try this: Learn must not and don’t have to as a pair, and test yourself with signs.</p></div><h3>Sounding too sure</h3><p>Learners write ‘will’ everywhere to sound strong.</p><div class=\"tip\"><p>Try this: Replace will with may or could once in every paragraph.</p></div><h3>Treating modals like normal verbs</h3><p>Learners add -s, -ing and to automatically, and use do in questions.</p><div class=\"tip\"><p>Try this: Say it aloud: modal + base verb, always.</p></div><h3>Sound-alike spelling</h3><p>Should’ve sounds like should of.</p><div class=\"tip\"><p>Try this: Always write should have, and learn the contraction ’ve.</p></div><h3>Time confusion</h3><p>Past meaning needs have + participle, not a past tense modal.</p><div class=\"tip\"><p>Try this: Draw a timeline: now, then, and which modal fits.</p></div><h3>Small habits that help</h3><ul><li>Take five claims from an essay and soften them with a modal.</li><li>Write the same sentence with must, should and might. Notice the change in meaning.</li><li>Highlight modals when you read news articles and note what each one does.</li><li>Keep a page of sign phrases: You must not…, Passengers may…, Visitors are not allowed to…</li></ul>"}, {"id": "real", "t": "In IELTS and real life", "c": "<ul><li><b>Speaking:</b> “I might go abroad next year” sounds natural. “Could you repeat that?” is polite. “I’d rather stay home” shows preference.</li><li><b>Writing Task 1:</b> predictions use will, is expected to, is likely to.</li><li><b>Writing Task 2:</b> solutions use should and must. Predictions use may and could. Hedging earns marks for accuracy and style.</li><li><b>Reading:</b> modals show how sure the writer is. May and might mean the writer is not certain. Must and will mean strong certainty. True / False / Not Given questions often hinge on a modal.</li><li><b>Listening:</b> a speaker who says “might” or “could” is not promising. “Must” and “have to” signal important rules.</li></ul><h3>True / False / Not Given and modals</h3><div class=\"tw\"><table><thead><tr><th>Text says</th><th>Statement</th><th>Answer</th></tr></thead><tbody><tr><td>The drug may reduce pain.</td><td>The drug reduces pain.</td><td>Not given or False (may is not certain)</td></tr><tr><td>Students must register.</td><td>Students are required to register.</td><td>True</td></tr><tr><td>The plan could save money.</td><td>The plan will save money.</td><td>False or Not Given (could is not certain)</td></tr></tbody></table></div><h3>Real-world uses</h3><ul><li><b>Emails:</b> “Could you please send…”, “I would appreciate it if…”</li><li><b>Workplace:</b> “We should schedule a meeting.”, “You must submit by Friday.”</li><li><b>Travel:</b> “May I see your passport?”, “You must not take photographs here.”</li><li><b>Study:</b> “You might want to review chapter 3.”</li></ul><div class=\"tip\"><p><b>Real world:</b> in emails, “Could you please…?” is more polite than “Can you…?”. In meetings, “We could try…” sounds more open than “We must…”.</p></div>"}, {"id": "practice", "t": "Practice", "c": "<h3>Spot the mistake</h3><ol><li>She cans speak French.<details><summary>Show answer</summary><ins>She can speak French.</ins> No -s.</details></li><li>You must to wear a helmet.<details><summary>Show answer</summary><ins>You must wear a helmet.</ins> No to.</details></li><li>I will can come tomorrow.<details><summary>Show answer</summary><ins>I will be able to come tomorrow.</ins> No double modal.</details></li><li>He should has called.<details><summary>Show answer</summary><ins>He should have called.</ins> Have + participle.</details></li><li>Do you can swim?<details><summary>Show answer</summary><ins>Can you swim?</ins> No do.</details></li><li>She could of come.<details><summary>Show answer</summary><ins>She could have come.</ins> Never ‘of’.</details></li><li>I musted leave early.<details><summary>Show answer</summary><ins>I had to leave early.</ins> Must has no past.</details></li><li>You mustn’t come. It’s optional.<details><summary>Show answer</summary><ins>You don’t have to come.</ins> Not necessary.</details></li><li>This will definitely cause huge problems. (uncertain)<details><summary>Show answer</summary><ins>This may cause serious problems.</ins> Hedge.</details></li><li>He doesn’t can drive.<details><summary>Show answer</summary><ins>He can’t drive.</ins></details></li></ol><h3>Choose the best modal</h3><ol><li>You ___ park here. It is against the law. (forbidden)<details><summary>Show answer</summary><ins>must not / can’t</ins></details></li><li>You ___ pay. It is free. (not necessary)<details><summary>Show answer</summary><ins>don’t have to / needn’t</ins></details></li><li>She’s not answering. She ___ be asleep. (sure)<details><summary>Show answer</summary><ins>must</ins></details></li><li>He is always on time. He ___ be late. (sure he is not)<details><summary>Show answer</summary><ins>can’t</ins></details></li><li>It is cloudy. It ___ rain. (possible)<details><summary>Show answer</summary><ins>may / might / could</ins></details></li><li>I ___ swim when I was five. (general past ability)<details><summary>Show answer</summary><ins>could</ins></details></li><li>We ___ have left earlier. We missed the train. (regret)<details><summary>Show answer</summary><ins>should</ins></details></li><li>___ you pass me the salt, please? (polite)<details><summary>Show answer</summary><ins>Could / Would / Can</ins></details></li><li>When I was young, we ___ play outside every evening. (habit)<details><summary>Show answer</summary><ins>would / used to</ins></details></li><li>You ___ do your homework. I’m not telling you. It’s just advice.<details><summary>Show answer</summary><ins>should</ins></details></li></ol><h3>Rewrite with a modal</h3><ol><li>It is possible that he is lost.<details><summary>Show answer</summary><ins>He might / may be lost.</ins></details></li><li>It is necessary for all drivers to wear seat belts.<details><summary>Show answer</summary><ins>All drivers must wear seat belts.</ins></details></li><li>I advise you to see a doctor.<details><summary>Show answer</summary><ins>You should see a doctor.</ins></details></li><li>Tourism will increase. (soften)<details><summary>Show answer</summary><ins>Tourism may / could increase.</ins></details></li><li>It was a mistake not to call her.<details><summary>Show answer</summary><ins>I should have called her.</ins></details></li><li>I am sure he left. (past deduction)<details><summary>Show answer</summary><ins>He must have left.</ins></details></li><li>It is not necessary to bring a pen.<details><summary>Show answer</summary><ins>You don’t have to bring a pen.</ins></details></li></ol><h3>Fill the gaps</h3><p>You (1) ___ wear a seat belt. It is the law. You (2) ___ pay to enter. It is free. She (3) ___ be at home. I saw her light. It (4) ___ rain later, so take an umbrella. We (5) ___ have left earlier. We missed the train. (6) ___ I open the window? He (7) ___ have forgotten. Nobody has seen him. You (8) ___ better hurry. You (9) ___ be joking! That’s impossible. If I were you, I (10) ___ accept.</p><details><summary>Show answers</summary>1 must / have to · 2 don’t have to · 3 must · 4 might / may · 5 should · 6 Shall / Can / May · 7 must / may / might · 8 had · 9 must / can’t (must for ‘surely’) · 10 would</details><h3>Speak and write</h3><ul><li>Give advice to a friend who wants to learn English, using should, must and could.</li><li>Describe a future trend in your country using may, might and could.</li><li>Describe a rule at your school or workplace using must, mustn’t, have to and don’t have to.</li><li>Tell a short story about a regret using should have, could have and wish.</li><li>Write a Task 2 paragraph with five different modals, each with a different job.</li></ul>"}, {"id": "quiz", "t": "Quiz", "quiz": 1}, {"id": "stick", "t": "Making it stick", "prog": 1}];
