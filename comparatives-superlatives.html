var CH=[{"id": "plain", "t": "In plain words", "c": "<p class=\"say\">We compare to say how two things differ (<b>comparative</b>: taller, more expensive) and to pick the extreme in a group (<b>superlative</b>: the tallest, the most expensive). Short adjectives add <em>-er / -est</em>. Long ones use <em>more / most</em>. This is the heart of IELTS Writing Task 1, where you compare numbers, countries and years, so accuracy here pays off quickly.</p><h3>How to build it</h3><div class=\"rule\"><p><b>Short adjectives</b> adjective + er / est: <em>tall → taller → the tallest</em></p><p><b>Long adjectives</b> more / most + adjective: <em>expensive → more expensive → the most expensive</em></p><p><b>Irregular</b> good → better → the best · bad → worse → the worst · far → farther → the farthest</p><p><b>Equal</b> as + adjective + as: <em>as high as</em></p><p><b>Than</b> comparative + than: <em>higher than</em></p></div>"}, {"id": "use", "t": "When we use it", "c": "<h3>Comparing two</h3><div class=\"example\"><p>Dhaka is bigger than Sylhet.</p><p class=\"note\">Comparative + than.</p></div><h3>The extreme of a group</h3><div class=\"example\"><p>It is the largest city in the country.</p><p class=\"note\">Superlative with the.</p></div><h3>Equal</h3><div class=\"example\"><p>Cars were as popular as buses.</p><p class=\"note\">as … as for equal, not as … as for less.</p></div><h3>Multiples and fractions</h3><div class=\"example\"><p>Prices were twice as high as in 2010.</p><p class=\"note\">twice / three times as + adjective + as.</p></div><h3>Gradual change</h3><div class=\"example\"><p>Rents are getting more expensive.</p><p class=\"note\">Also: the more…, the more…</p></div><h3>Look alike, but not the same</h3><div class=\"example\"><p>He is taller than me.<br>He is the tallest in the class.</p><p class=\"note\">Two vs a group.</p></div><div class=\"example\"><p>This is more important.<br>This is the most important.</p><p class=\"note\">Comparative vs superlative.</p></div><div class=\"example\"><p>A is as high as B.<br>A is higher than B.</p><p class=\"note\">Equal vs different.</p></div><div class=\"example\"><p>fewer people<br>less water</p><p class=\"note\">Fewer for countable, less for uncountable.</p></div><p class=\"note\">Use the before a superlative, but not before a comparative.</p>"}, {"id": "mist", "t": "Mistakes people make", "c": "<div class=\"example\"><p><del>She is more taller than me.</del> → <ins>She is taller than me.</ins></p><p class=\"note\">Never more + -er.</p></div><div class=\"example\"><p><del>This is the most easiest test.</del> → <ins>This is the easiest test.</ins></p><p class=\"note\">Never most + -est.</p></div><div class=\"example\"><p><del>He is taller that me.</del> → <ins>He is taller than me.</ins></p><p class=\"note\">Than, not that.</p></div><div class=\"example\"><p><del>It is the better of all.</del> → <ins>It is the best of all.</ins></p><p class=\"note\">Superlative for three or more.</p></div><div class=\"example\"><p><del>There were less people.</del> → <ins>There were fewer people.</ins></p><p class=\"note\">Fewer with countable nouns.</p></div><div class=\"example\"><p><del>She is as tall than me.</del> → <ins>She is as tall as me.</ins></p><p class=\"note\">As … as.</p></div><div class=\"example\"><p><del>It is more cheap.</del> → <ins>It is cheaper.</ins></p><p class=\"note\">Cheap is short: -er.</p></div>"}, {"id": "deep", "t": "Going deeper", "c": "<h3>Core test: how many syllables?</h3><p>One syllable: add -er/-est (tall, old). Two syllables ending in -y: change y to i (happy → happier → happiest). Three or more: use more/most (beautiful, expensive). Many two-syllable adjectives accept both (clever, quiet).</p><h3>Spelling rules</h3><p>Add -r/-st after e (large → larger). Double the final consonant after one vowel (big → bigger, hot → hottest). Change y to i (easy → easier).</p><h3>Comparing numbers in Task 1</h3><p><em>X was the highest, followed by Y. A was twice as high as B. The figure was slightly lower than… Sales were considerably higher in…</em></p><h3>Modifiers</h3><p>Strong: <em>much, far, considerably, significantly.</em> Weak: <em>slightly, a little, marginally.</em> Equal: <em>almost, nearly, roughly the same as.</em></p><h3>The … the …</h3><p><em>The more you practise, the better you become.</em> Useful in Speaking and Task 2.</p><h3>Shortcuts that work in exams</h3><ul><li><b>Never double the marker.</b> Not more taller, not most easiest.</li><li><b>Than for comparative, the for superlative.</b></li><li><b>Use data words:</b> twice as many as, slightly higher than, the highest.</li><li><b>Fewer + countable, less + uncountable.</b></li></ul><h3>Where exams try to catch you</h3><ul><li><b>Further / farther:</b> Further also means additional (further information).</li><li><b>Elder / older:</b> Elder is only for family: my elder brother.</li><li><b>Latest / last:</b> Latest is newest, last is final.</li><li><b>Different than:</b> Use different from or different to.</li></ul>"}, {"id": "dodont", "t": "Do, don’t and why", "c": "<div class=\"two\"><div><h3>Do</h3><ul><li>Use -er/-est for short adjectives and more/most for long ones.</li><li>Add than after a comparative.</li><li>Use the before a superlative.</li><li>Use data words: twice as high as, slightly lower than.</li></ul></div><div><h3>Don’t</h3><ul><li>Don’t write more + -er or most + -est.</li><li>Don’t use that instead of than.</li><li>Don’t say less with countable nouns.</li><li>Don’t use superlatives for two things.</li></ul></div></div><h3>Why we get it wrong</h3><h3>Double marking</h3><p>Learners feel that more adds emphasis, so they add it to -er forms.</p><div class=\"tip\"><p>Try this: Choose one way: -er or more, never both.</p></div><h3>Than and that</h3><p>They sound close and look alike.</p><div class=\"tip\"><p>Try this: Than = comparison, that = connector.</p></div><h3>Counting syllables</h3><p>Learners cannot remember which adjectives are short.</p><div class=\"tip\"><p>Try this: When unsure, test: does -er sound natural?</p></div><h3>Small habits that help</h3><ul><li>Describe two pictures or places using five comparatives.</li><li>Practise on any Task 1 chart: write the highest, the lowest and a ratio.</li><li>Collect modifiers: slightly, considerably, far.</li></ul>"}, {"id": "real", "t": "In IELTS and real life", "c": "<ul><li><b>Speaking:</b> “My city is bigger and noisier than…”, “It’s the best place I’ve been to.”</li><li><b>Writing:</b> Task 1 needs comparison in almost every paragraph.</li><li><b>Reading:</b> superlatives often hide the answer to a question: the most, the least.</li><li><b>Listening:</b> comparing options (cheaper, faster) is common in Section 1.</li></ul><div class=\"tip\"><p><b>Real world:</b> shopping and travel all depend on comparing: cheaper, closer, faster.</p></div>"}, {"id": "practice", "t": "Practice", "c": "<h3>Spot the mistake</h3><ol><li>She is more taller than me.<details><summary>Show answer</summary><ins>She is taller than me.</ins></details></li><li>This is the most easiest question.<details><summary>Show answer</summary><ins>This is the easiest question.</ins></details></li><li>He is bigger that me.<details><summary>Show answer</summary><ins>He is bigger than me.</ins></details></li><li>There were less students.<details><summary>Show answer</summary><ins>There were fewer students.</ins></details></li></ol><h3>Say it another way</h3><ol><li>Rewrite: “A is 100. B is 50.”<details><summary>Show answer</summary><ins>A is twice as high as B.</ins></details></li><li>Make a superlative: “Dhaka is big. No city here is bigger.”<details><summary>Show answer</summary><ins>Dhaka is the biggest city here.</ins></details></li></ol><h3>Fill the gaps</h3><p>Tokyo is (1) ___ than Paris. It is (2) ___ city in Japan. This book is (3) ___ interesting than that one. He is (4) ___ best player. There were (5) ___ cars than last year.</p><details><summary>Show answers</summary>1 bigger · 2 the biggest
