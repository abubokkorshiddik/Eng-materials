k:"Exact words get quotation marks. Reported words do not.",
q:[
["Which is correct?",["She said that “she was tired”.","She said that she was tired.","She said “that she was tired”."],1,"Reported speech has no quotation marks."],
["In an essay write…",["There are 3 reasons.","There are three reasons.","There are 3 reason."],1,"Spell out numbers under ten."]
]
}
];

/* Reader settings */
var storedConfig = readJSON("punct-cfg", {});
if (!storedConfig || typeof storedConfig !== "object" || Array.isArray(storedConfig)) {
  storedConfig = {};
}

var C = {
  acc: storedConfig.acc === "en-US" ? "en-US" : "en-GB",
  fs: Number(storedConfig.fs) >= 13 && Number(storedConfig.fs) <= 26
    ? Number(storedConfig.fs)
    : 16
};

var cur = 0;
var main = $("book");
var speech = window.speechSynthesis || null;

function saveConfig() {
  setItem("punct-cfg", JSON.stringify(C));
  document.documentElement.style.setProperty("--fs", C.fs + "px");
}

saveConfig();

function say(text) {
  if (!speech || typeof SpeechSynthesisUtterance === "undefined") return;

  speech.cancel();

  var utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = C.acc;
  utterance.rate = 0.85;

  speech.speak(utterance);
}

/* Build the lesson chapters */
function buildChapter(d, n) {
  var pane = el("section", null, "pane");
  pane.id = "chapter-" + n;
  pane.setAttribute("role", "tabpanel");
  pane.setAttribute("aria-label", d.t);
  pane.setAttribute("aria-labelledby", "tab-" + n);
  pane.hidden = true;

  var heading = el("h2", d.t);
  heading.dataset.ch = "Chapter " + (n + 1);
  pane.appendChild(heading);

  pane.appendChild(el("span", d.s, "sym"));
  pane.appendChild(el("p", d.i, "m gt"));

  pane.appendChild(el("h3", "The rules"));

  d.r.forEach(function (rule) {
    var card = el("div", null, "card");
    card.appendChild(el("b", rule[0]));
    card.appendChild(el("p", rule[1]));

    var example = el("p", null, "ex");
    example.appendChild(el("span", rule[2]));

    var speakButton = el("button", "🔊", "sp", function () {
      say(rule[2]);
    });
    speakButton.type = "button";
    speakButton.setAttribute("aria-label", "Read example aloud: " + rule[2]);

    example.appendChild(speakButton);
    card.appendChild(example);
    pane.appendChild(card);
  });

  pane.appendChild(el("h3", "Common mistakes"));

  d.m.forEach(function (mistake) {
    var card = el("div", null, "pair");
    var line = el("p");

    line.appendChild(el("del", mistake[0]));
    line.appendChild(document.createTextNode(" → "));
    line.appendChild(el("ins", mistake[1]));

    card.appendChild(line);
    card.appendChild(el("p", mistake[2], "why"));
    pane.appendChild(card);
  });

  pane.appendChild(el("div", d.k, "tip"));
  pane.appendChild(el("h3", "Quick quiz"));

  var quiz = el("div", null, "qc");
  var scoreLine = el("p", "Answer all questions to see your score.", "qd");
  scoreLine.setAttribute("aria-live", "polite");

  var totalCorrect = 0;
  var answered = 0;
  var questionCount = d.q.length;

  d.q.forEach(function (question, questionIndex) {
    var questionId = "q-" + n + "-" + questionIndex;

    quiz.appendChild(
      el("p", (questionIndex + 1) + ". " + question[0], "qd")
    );

    var options = [];
    var explanation = el("p", "", "why");
    explanation.setAttribute("aria-live", "polite");

    question[1].forEach(function (option, optionIndex) {
      var button = el("button", option, "opt");
      button.type = "button";
      button.dataset.question = questionId;

      button.addEventListener("click", function () {
        /* Prevent a second answer from changing the score. */
        if (button.disabled) return;

        options.forEach(function (item) {
          item.disabled = true;
          item.setAttribute("aria-pressed", "false");
        });

        button.setAttribute("aria-pressed", "true");

        var correctIndex = question[2];
        var correctButton = options[correctIndex];

        if (optionIndex === correctIndex) {
          totalCorrect++;
          button.classList.add("g");
          explanation.textContent = "Correct. " + question[3];
        } else {
          button.classList.add("r");

          if (correctButton) {
            correctButton.classList.add("g");
          }

          explanation.textContent = "Not quite. The correct answer is “" +
            question[1][correctIndex] + "”. " + question[3];
        }

        answered++;

        if (answered === questionCount) {
          scoreLine.textContent = "Your score: " + totalCorrect +
            " / " + questionCount + " (" +
            Math.round((totalCorrect / questionCount) * 100) + "%)";

          quiz.appendChild(el("p",
            totalCorrect === questionCount
              ? "Excellent work! You answered every question correctly."
              : totalCorrect >= Math.ceil(questionCount * 0.7)
                ? "Good work! Review any mistakes and try the next chapter."
                : "Keep practising. Review the rules above and try again.",
            "why"
          ));

          var retry = el("button", "Try this quiz again", "btn alt", function () {
            buildChapterAndRestoreQuiz(n, quiz, scoreLine);
          });
          retry.type = "button";
          quiz.appendChild(retry);
        }
      });

      options.push(button);
      quiz.appendChild(button);
    });

    quiz.appendChild(explanation);
  });

  quiz.appendChild(scoreLine);
  pane.appendChild(quiz);
  main.appendChild(pane);

  return pane;
}

/*
 * Rebuild only the current chapter to reset the quiz.
 * This keeps navigation and the user's selected chapter intact.
 */
function buildChapterAndRestoreQuiz(chapterIndex, oldQuiz, oldScoreLine) {
  var oldPane = $("chapter-" + chapterIndex);
  var wasCurrent = chapterIndex === cur;

  if (oldPane) oldPane.remove();

  var children = Array.from(main.children);
  var newPane = buildChapter(D[chapterIndex], chapterIndex);
  var nav = main.querySelector(".pn");

  if (nav) {
    main.insertBefore(newPane, nav);
  }

  if (wasCurrent) {
    newPane.hidden = false;
  }

  go(cur, false);
}

/* Table of contents */
function buildContents() {
  var contents = $("toc");
  contents.textContent = "";
  contents.appendChild(el("h2", "Contents"));

  D.forEach(function (chapter, index) {
    var button = el("button", null, "te" + (index === cur ? " on" : ""), function () {
      go(index);
    });

    button.type = "button";
    button.appendChild(el("i", chapter.s));
    button.appendChild(el("span", chapter.t));
    contents.appendChild(button);
  });
}

/* Drawers and backdrop */
function updateDrawerState() {
  var contentsOpen = $("toc").classList.contains("on");
  var settingsOpen = $("set").classList.contains("on");
  var anyOpen = contentsOpen || settingsOpen;

  $("bg").classList.toggle("on", anyOpen);
  $("bg").setAttribute("aria-hidden", String(!anyOpen));

  $("toc").setAttribute("aria-hidden", String(!contentsOpen));
  $("set").setAttribute("aria-hidden", String(!settingsOpen));

  $("bT").setAttribute("aria-expanded", String(contentsOpen));
  $("bS").setAttribute("aria-expanded", String(settingsOpen));
}

function panel(id, open) {
  var drawer = $(id);
  drawer.classList.toggle("on", open);

  if (open) {
    var other = id === "toc" ? "set" : "toc";
    $(other).classList.remove("on");
  }

  updateDrawerState();
}

function closePanels() {
  $("toc").classList.remove("on");
  $("set").classList.remove("on");
  updateDrawerState();
}

/* Chapter navigation */
function go(index, scrollToTop) {
  if (index < 0 || index >= D.length) return;

  if (speech) speech.cancel();

  cur = index;

  var panes = main.querySelectorAll(".pane");

  panes.forEach(function (pane) {
    pane.hidden = pane.id !== "chapter-" + index;
  });

  var nav = main.querySelector(".pn");

  if (nav) nav.remove();

  nav = el("div", null, "pn");

  if (index > 0) {
    var previous = el("button", "← " + D[index - 1].t, "btn alt", function () {
      go(index - 1);
    });
    previous.type = "button";
    nav.appendChild(previous);
  } else {
    nav.appendChild(el("span", ""));
  }

  if (index < D.length - 1) {
    var next = el("button", D[index + 1].t + " →", "btn", function () {
      go(index + 1);
    });
    next.type = "button";
    nav.appendChild(next);
  } else {
    var allTopics = el("a", "All topics", "btn");
    allTopics.href = "index.html#topics";
    nav.appendChild(allTopics);
  }

  main.appendChild(nav);

  $("bt").textContent = "Ch. " + (index + 1) + " · " + D[index].t;
  $("bt").setAttribute("aria-label", "Chapter " + (index + 1) + ": " + D[index].t + ". Open contents.");

  Array.from($("tabs").children).forEach(function (button, i) {
    var active = i === index;

    button.setAttribute("aria-selected", String(active));
    button.setAttribute("aria-pressed", String(active));
    button.tabIndex = active ? 0 : -1;

    if (active) {
      button.scrollIntoView({
        behavior:"auto",
        block:"nearest",
        inline:"center"
      });
    }
  });

  setItem("punct-ch", String(index));
  buildContents();
  closePanels();

  if (scrollToTop !== false) {
    window.scrollTo({ top:0, behavior:"auto" });
  }
}

/* Header icons */
var icons = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h5v-6h4v6h5V9"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'
};

document.querySelectorAll("[data-i]").forEach(function (button) {
  var name = button.dataset.i;

  if (!icons[name]) return;

  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", "20");
  svg.setAttribute("height", "20");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.8");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = icons[name];

  button.insertBefore(svg, button.firstChild);
});

/* Chapter tabs */
D.forEach(function (chapter, index) {
  var button = el("button", (index + 1) + ". " + chapter.t, null, function () {
    go(index);
  });

  button.type = "button";
  button.id = "tab-" + index;
  button.setAttribute("role", "tab");
  button.setAttribute("aria-controls", "chapter-" + index);
  button.setAttribute("aria-selected", "false");
  button.setAttribute("aria-pressed", "false");
  button.tabIndex = -1;

  $("tabs").appendChild(button);
});

/* Theme and reader controls */
function segmented(options, current, callback) {
  var group = el("div", null, "seg");

  options.forEach(function (option) {
    var button = el("button", option[1], null, function () {
      callback(option[0]);
    });

    button.type = "button";
    button.setAttribute("aria-pressed", String(option[0] === current));
    group.appendChild(button);
  });

  return group;
}

function saveReaderTheme(theme) {
  document.documentElement.dataset.theme = theme;

  var readerSettings = readJSON("ielts-gl-reader", {});

  if (!readerSettings || typeof readerSettings !== "object" ||
      Array.isArray(readerSettings)) {
    readerSettings = {};
  }

  readerSettings.theme = theme;
  setItem("ielts-gl-reader", JSON.stringify(readerSettings));
}

function buildSettings() {
  var settings = $("set");
  settings.textContent = "";

  settings.appendChild(el("h2", "Reading settings"));

  settings.appendChild(el("div", "Theme", "sh"));

  settings.appendChild(segmented([
    ["light", "Light"],
    ["sepia", "Sepia"],
    ["dark", "Night"]
  ], document.documentElement.dataset.theme, function (value) {
    saveReaderTheme(value);
    buildSettings();
  }));

  settings.appendChild(el("div", "Text size", "sh"));

  var range = document.createElement("input");
  range.type = "range";
  range.min = "13";
  range.max = "26";
  range.step = "1";
  range.value = String(C.fs);
  range.setAttribute("aria-label", "Reading text size");

  var sizeLabel = el("p", C.fs + " px", "why");

  range.addEventListener("input", function () {
    C.fs = Number(range.value);
    document.documentElement.style.setProperty("--fs", C.fs + "px");
    sizeLabel.textContent = C.fs + " px";
    setItem("punct-cfg", JSON.stringify(C));
  });

  settings.appendChild(range);
  settings.appendChild(sizeLabel);

  settings.appendChild(el("div", "Voice accent", "sh"));

  settings.appendChild(segmented([
    ["en-GB", "British"],
    ["en-US", "American"]
  ], C.acc, function (value) {
    C.acc = value;
    saveConfig();
    buildSettings();
  }));

  settings.appendChild(el("p",
    "Use the speaker buttons beside examples to hear them aloud.",
    "why"
  ));

  var close = el("button", "Close settings", "btn alt", function () {
    panel("set", false);
  });

  close.type = "button";
  settings.appendChild(close);
}

/* Drawer controls */
$("bT").addEventListener("click", function () {
  panel("toc", !$("toc").classList.contains("on"));
});

$("bS").addEventListener("click", function () {
  buildSettings();
  panel("set", !$("set").classList.contains("on"));
});

$("bt").addEventListener("click", function () {
  panel("toc", !$("toc").classList.contains("on"));
});

$("bg").addEventListener("click", closePanels);

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") {
    closePanels();
  }

  if (event.altKey && event.key === "ArrowLeft") {
    event.preventDefault();
    go(Math.max(0, cur - 1));
  }

  if (event.altKey && event.key === "ArrowRight") {
    event.preventDefault();
    go(Math.min(D.length - 1, cur + 1));
  }
});

/* Keep the page content below the responsive fixed toolbar. */
function updateTopSpacing() {
  document.documentElement.style.setProperty(
    "--top",
    $("bar").offsetHeight + "px"
  );
}

updateTopSpacing();
window.addEventListener("resize", updateTopSpacing);

if ("ResizeObserver" in window) {
  var toolbarObserver = new ResizeObserver(updateTopSpacing);
  toolbarObserver.observe($("bar"));
}

/* Render all chapters and restore the last saved position. */
D.forEach(function (chapter, index) {
  buildChapter(chapter, index);
});

var savedChapter = parseInt(getItem("punct-ch") || "0", 10);

if (!Number.isInteger(savedChapter) ||
    savedChapter < 0 ||
    savedChapter >= D.length) {
  savedChapter = 0;
}

go(savedChapter, false);

})();
</script>
</body>
</html>
